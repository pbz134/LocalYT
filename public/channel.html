<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Videos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .channel-banner {
            width: 1400px;
            max-width: 100%;
            height: 230px;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .channel-header-right {
            display: flex;
            align-items: center;
            margin-left: auto;
            padding-right: 50px;
        }
        .subscribe-button {
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            color: #fff;
            background-color: red;
            border: none;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        .subscribe-button:hover {
            background-color: #c40000;
        }
        .subscribe-button.subscribed {
            background-color: darkgray;
        }
        .subscribe-button.subscribed:hover {
            background-color: #999;
        }
        .tabs {
            display: flex;
            margin-left: 230px;
            border-bottom: 1px solid #3f3f3f;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #aaa;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }
        .tab:hover {
            color: #fff;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .sort-toggle {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 0 0 230px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .sort-toggle:hover {
            background-color: #555;
        }
        .sort-icon {
            font-size: 16px;
        }
        .videos-wrapper {
            position: relative;
            min-height: 400px;
        }
        .channel-videos, .playlists-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 10px 20px;
        }
        .video-item {
            margin: 10px;
            background: var(--main-bg-color);
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .playlist-item {
            margin: 10px;
            background: var(--main-bg-color);
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-item:hover {
            transform: scale(1.05);
        }
        .video-thumbnail {
            width: 100%;
            height: 168px;
            display: block;
            background-color: #2a2a2a;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-thumbnail {
            width: 100%;
            height: 168px;
            background-size: cover;
            background-position: center;
            position: relative;
            /* Default grey background while loading */
            background-color: #333; 
        }
        .playlist-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .video-title {
            padding: 10px;
            margin-left: -10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
            text-decoration: none;
            transition: text-decoration 0.2s ease;
            font-size: 16px;
        }
        .playlist-title {
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            color: #d2cfcf;
            font-size: 16px;
        }
        .video-description, .playlist-description {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            margin-left: -10px;
            color: #888;
            min-height: 1.5em; /* Prevent layout shift */
        }
        .playlist-video-count {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            display: none;
        }
        .loading-spinner.visible {
            display: block;
        }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #888;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .load-more-trigger {
            height: 20px;
            width: 100%;
            visibility: hidden;
            position: relative;
            bottom: 50px;
        }
        .no-more-videos {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            font-style: italic;
        }

        /* About Tab Styles */
        .about-container {
            display: flex;
            gap: 40px;
            margin-left: 230px;
            max-width: 1200px;
        }
        .about-description {
            flex: 2;
            min-width: 0;
        }
        .about-description h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .about-description .description-text {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .about-stats {
            flex: 1;
            min-width: 200px;
        }
        .about-stats h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .stats-item {
            color: #ccc;
            font-size: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #3f3f3f;
        }
        .stats-item:first-of-type {
            border-top: 1px solid #3f3f3f;
        }
        .stats-item.total-views {
            font-weight: normal;
        }
        .share-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: #ccc;
            border: none;
            padding: 8px 0;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .share-button:hover {
            filter: brightness(1.4);
        }
        .share-button img {
            width: 16px;
            height: 16px;
            filter: invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)
        }
        .tab-loading-placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 15px;
        }
        .tab-loading-placeholder::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 10px;
            border: 2px solid #666;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; /* Hidden by default when input is empty */
        }

        /* Show suggestions only when the search container (input) is focused/active */
        .search-container:focus-within .search-suggestions {
            display: block;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div id="channelBanner" class="channel-banner"></div>
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
        <div class="channel-header-right">
            <button id="subscribeButton" class="subscribe-button">Subscribe</button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="videos">VIDEOS</div>
        <div class="tab" data-tab="playlists">PLAYLISTS</div>
        <div class="tab" data-tab="about">ABOUT</div>
    </div>

    <!-- Videos Tab -->
    <div id="videosTab" class="tab-content active">
        <button id="sortToggle" class="sort-toggle">
            <span class="sort-icon">↓</span> Newest First
        </button>
        <div class="container videos-wrapper">
            <div class="channel-videos" id="channelVideosContainer"></div>
            <div id="loadingSpinner" class="loading-spinner">Loading more videos</div>
            <div id="noMoreVideos" class="no-more-videos" style="display: none;">No more videos to load</div>
            <div id="loadMoreTrigger" class="load-more-trigger"></div>
        </div>
    </div>

    <!-- Playlists Tab -->
    <div id="playlistsTab" class="tab-content">
        <div class="playlists-container" id="playlistsContainer">
            <div class="tab-loading-placeholder" id="playlistsLoadingText">Loading playlists</div>
        </div>
    </div>

    <!-- About Tab -->
    <div id="aboutTab" class="tab-content">
        <div class="about-container">
            <div class="about-description">
                <h3 id="aboutDescriptionHeader">Description</h3>
                <div id="channelDescription" class="description-text">
                    <div class="tab-loading-placeholder">Loading</div>
                </div>
            </div>
            <div class="about-stats">
                <h3 id="aboutStatsHeader">Stats</h3>
                <div class="stats-list">
                    <div class="stats-item" id="statsJoined">Joined --</div>
                    <div class="stats-item total-views" id="statsViews">-- views</div>
                    <button class="share-button" id="shareChannelBtn">
                        <img src="LocalYT-Rev-Files/share.svg" alt="Share">
                        <span id="shareBtnText">Share</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
// Configuration
const VIDEOS_PER_PAGE = 20;

// --- Language Helper ---
function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Parse the channel and tab from the URL
function parseChannelUrl() {
    const raw = new URLSearchParams(window.location.search).get('channel') || '';
    const decoded = decodeURIComponent(raw);

    const validTabs = ['videos', 'playlists', 'about'];
    const tabNames = validTabs.find(t => decoded.endsWith('/' + t));

    if (tabNames) {
        return {
            channel: decoded.slice(0, -(tabNames.length + 1)),
            tab: tabNames
        };
    }
    return { channel: decoded, tab: 'videos' };
}

// Build the URL for a given channel + tab
function buildChannelUrl(channel, tab) {
    if (tab === 'videos') {
        return `channel.html?channel=${encodeURIComponent(channel)}`;
    }
    return `channel.html?channel=${encodeURIComponent(channel)}/${tab}`;
}

const { channel, tab: initialTab } = parseChannelUrl();

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');

    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });

        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });

        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });

        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const videosContainer = document.getElementById('channelVideosContainer');
    const playlistsContainer = document.getElementById('playlistsContainer');
    const channelPic = document.getElementById('channelPic');
    const channelName = document.getElementById('channelName');
    const channelBanner = document.getElementById('channelBanner');
    const sortToggle = document.getElementById('sortToggle');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    const noMoreVideos = document.getElementById('noMoreVideos');
    const subscribeButton = document.getElementById('subscribeButton');

    let currentVideos = [];
    let sortNewestFirst = true;
    let renderedVideoCount = 0;
    let isLoadingMore = false;
    let hasMoreVideos = true;
    let intersectionObserver = null;
    let isSubscribed = false;

    // Track which tabs have already been loaded
    const loadedTabs = new Set();

    channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
    channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
    channelName.textContent = channel;
    document.title = `${channel} - LocalYT`;

    // --- Subscribe Button Logic ---
    function updateSubscribeButton() {
        if (isSubscribed) {
            subscribeButton.textContent = getLang('Subscribed', 'Abonniert');
            subscribeButton.classList.add('subscribed');
        } else {
            subscribeButton.textContent = getLang('Subscribe', 'Abonnieren');
            subscribeButton.classList.remove('subscribed');
        }
    }

    subscribeButton.addEventListener('click', () => {
        isSubscribed = !isSubscribed;
        updateSubscribeButton();

        fetch('/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ channel: channel, isSubscribed })
        });
    });

    // Fetch initial subscription status
    fetch(`/user-subscriptions/${encodeURIComponent(channel)}`)
        .then(response => response.ok ? response.json() : {})
        .then(userSubscriptions => {
            isSubscribed = userSubscriptions[channel] || false;
            updateSubscribeButton();
        })
        .catch(error => {
            console.error('Error fetching user subscriptions:', error);
            updateSubscribeButton();
        });

    // --- UI Translation ---
    function updateUITranslations() {
        document.querySelector('.tab[data-tab="playlists"]').textContent = getLang('PLAYLISTS', 'PLAYLISTEN');
        document.querySelector('.tab[data-tab="about"]').textContent = getLang('ABOUT', 'ÜBER');
        
        if (sortNewestFirst) {
            sortToggle.innerHTML = '<span class="sort-icon">↓</span> ' + getLang('Newest First', 'Neueste zuerst');
        } else {
            sortToggle.innerHTML = '<span class="sort-icon">↑</span> ' + getLang('Oldest First', 'Älteste zuerst');
        }

        document.getElementById('aboutDescriptionHeader').textContent = getLang('Description', 'Beschreibung');
        document.getElementById('aboutStatsHeader').textContent = getLang('Stats', 'Statistiken');
        document.getElementById('shareBtnText').textContent = getLang('Share', 'Teilen');
        document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');
        updateSubscribeButton();
    }
    updateUITranslations();

    document.getElementById('playlistsLoadingText').textContent = getLang('Loading playlists', 'Lade Playlisten...');
        // --- Tab switching (pushes to address bar) ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
            const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
            const targetContent = document.getElementById(`${tabName}Tab`);
    
            if (targetTab) targetTab.classList.add('active');
            if (targetContent) targetContent.classList.add('active');
    
            const newUrl = buildChannelUrl(channel, tabName);
            history.pushState({ tab: tabName }, '', newUrl);
    
            if (!loadedTabs.has(tabName)) {
                loadTabContent(tabName);
            }
        }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });

    // Handle browser back/forward
    window.addEventListener('popstate', (event) => {
        const tabName = event.state?.tab || 'videos';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        if (!loadedTabs.has(tabName)) {
            loadTabContent(tabName);
        }
    });

    // --- Lazy-load content for a specific tab ---
    function loadTabContent(tabName) {
        switch (tabName) {
            case 'playlists':
                loadPlaylists();
                break;
            case 'about':
                loadAbout();
                break;
        }
        loadedTabs.add(tabName);
    }

    function parseEuropeanDate(dateString) {
        if (!dateString || dateString === 'Unknown date') return new Date(0);
        const parts = dateString.split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }
        return new Date(dateString);
    }

    function stripExtension(filename) {
        return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
    }

    function sortVideosArray() {
        currentVideos.sort((a, b) => {
            try {
                const dateA = parseEuropeanDate(a.fileDate).getTime();
                const dateB = parseEuropeanDate(b.fileDate).getTime();
                return sortNewestFirst ? dateB - dateA : dateA - dateB;
            } catch (e) {
                return 0;
            }
        });
    }

    function resetAndRender() {
        if (sortNewestFirst) {
            sortToggle.innerHTML = '<span class="sort-icon">↓</span> ' + getLang('Newest First', 'Neueste zuerst');
        } else {
            sortToggle.innerHTML = '<span class="sort-icon">↑</span> ' + getLang('Oldest First', 'Älteste zuerst');
        }

        renderedVideoCount = 0;
        videosContainer.innerHTML = '';
        hasMoreVideos = currentVideos.length > 0;

        loadingSpinner.classList.remove('visible');
        noMoreVideos.style.display = 'none';

        loadMoreVideos();
    }

    function createVideoElement(video) {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

        // 1. Create HTML structure immediately. 
        // Note: video.fileDate is already loaded (needed for sorting), so we can show it instantly.
        // View count is not loaded yet, so we leave description empty or with loading text.
        let formattedDate = video.fileDate;
        
        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-title" onclick="openVideo('${encodeURIComponent(video.path)}')">${videoTitle}</div>
            <div class="video-description">${getLang('Loading views...', 'Aufrufe werden geladen...')}</div>
        `;

        const descriptionDiv = videoElement.querySelector('.video-description');

        // 2. Lazy Load "View Count" and "Video Length" asynchronously
        // We use Promise.all to wait for both, but we don't block the UI creation.
        Promise.all([
            fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(response => response.ok ? response.text() : '0'),
            fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoPathWithoutExt.split('/').pop())}.txt`).then(response => response.ok ? response.text() : '')
        ])
        .then(([viewCount, videoLength]) => {
            let formattedViewCount = viewCount;
            if (!isNaN(viewCount) && viewCount !== '0') {
                formattedViewCount = parseInt(viewCount).toLocaleString();
            }

            // Language formatting
            const lang = localStorage.getItem('language');
            let viewsText = getLang('views', 'Aufrufe');
            let uploadedText = getLang('Uploaded on', 'Hochgeladen am');

            // Swap comma to dot for German
            if (lang === 'de') {
                formattedViewCount = formattedViewCount.replace(/,/g, '.');
            }

            // Update description
            descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${uploadedText} ${video.fileDate}`;
            
            // Update length
            if (videoLength) {
                videoElement.querySelector('.video-length').textContent = videoLength;
            }
        })
        .catch(() => {
            descriptionDiv.textContent = `${video.fileDate}`;
        });

        // Click handlers
        const videoLink = videoElement.querySelector('.video-title');
        const videoThumb = videoElement.querySelector('.video-thumbnail');

        videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
        
        videoThumb.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });
        videoLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        const openInNewTabHandler = (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };

        videoThumb.addEventListener('mouseup', openInNewTabHandler);
        videoLink.addEventListener('mouseup', openInNewTabHandler);
        videoThumb.addEventListener('auxclick', openInNewTabHandler);
        videoLink.addEventListener('auxclick', openInNewTabHandler);

        return videoElement;
    }

    function loadMoreVideos() {
        if (isLoadingMore || !hasMoreVideos) return;

        const startIndex = renderedVideoCount;
        const endIndex = Math.min(startIndex + VIDEOS_PER_PAGE, currentVideos.length);

        if (startIndex >= currentVideos.length) {
            hasMoreVideos = false;
            loadingSpinner.classList.remove('visible');
            noMoreVideos.style.display = 'block';
            return;
        }

        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        // Use requestAnimationFrame to ensure smooth rendering
        requestAnimationFrame(() => {
            const fragment = document.createDocumentFragment();

            for (let i = startIndex; i < endIndex; i++) {
                const video = currentVideos[i];
                const videoElement = createVideoElement(video);
                fragment.appendChild(videoElement);
            }

            videosContainer.appendChild(fragment);
            renderedVideoCount = endIndex;
            isLoadingMore = false;

            if (renderedVideoCount >= currentVideos.length) {
                hasMoreVideos = false;
                loadingSpinner.classList.remove('visible');
                noMoreVideos.style.display = 'block';
            } else {
                loadingSpinner.classList.remove('visible');
            }
        });
    }

    function checkAndLoadMore() {
        if (!hasMoreVideos || isLoadingMore) return;
        const trigger = loadMoreTrigger;
        if (!trigger) return;
        const rect = trigger.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        if (rect.top <= windowHeight + 300) {
            loadMoreVideos();
        }
    }

    function setupIntersectionObserver() {
        if (window.IntersectionObserver) {
            intersectionObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && hasMoreVideos && !isLoadingMore) {
                            loadMoreVideos();
                        }
                    });
                },
                { root: null, rootMargin: '300px', threshold: 0 }
            );
            if (loadMoreTrigger) {
                intersectionObserver.observe(loadMoreTrigger);
            }
        }
    }

    function loadPlaylists() {
        playlistsContainer.innerHTML = '<div class="tab-loading-placeholder">' + getLang('Loading playlists', 'Lade Playlisten...') + '</div>';

        fetch(`/channel-playlists/${encodeURIComponent(channel)}`)
            .then(response => response.json())
            .then(playlists => {
                renderPlaylistsFast(playlists);
            })
            .catch(error => {
                console.error('Error fetching playlists:', error);
                playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">Failed to load playlists</p>';
            });
    }

    function renderPlaylistsFast(playlists) {
        playlistsContainer.innerHTML = '';

        if (playlists.length === 0) {
            playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">No playlists found</p>';
            return;
        }

        const videosText = getLang('videos', 'Videos');

        playlists.forEach(playlist => {
            const playlistElement = document.createElement('div');
            playlistElement.className = 'playlist-item';

            playlistElement.innerHTML = `
                <div class="playlist-thumbnail" style="background-color: #333;">
                    <div class="playlist-overlay">${playlist.videoCount || 0} ${videosText}</div>
                </div>
                <div class="playlist-title">${playlist.name}</div>
                <div class="playlist-video-count">${playlist.videoCount || 0} ${videosText}</div>
            `;

            playlistElement.addEventListener('click', () => {
                window.location.href = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(playlist.path)}`;
            });

            playlistsContainer.appendChild(playlistElement);

            if (playlist.videoCount > 0) {
                const thumbDiv = playlistElement.querySelector('.playlist-thumbnail');
                
                fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist.path)}`)
                    .then(response => response.json())
                    .then(videos => {
                        if (videos && videos.length > 0) {
                            pickPreviewVideo(videos).then(previewVideo => {
                                if (previewVideo) {
                                    const videoPathWithoutExt = stripExtension(previewVideo.path);
                                    const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
                                    thumbDiv.style.backgroundImage = `url('${thumbnailSrc}')`;
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.warn("Could not load preview for playlist:", playlist.name);
                    });
            }
        });
    }

    function pickPreviewVideo(videos) {
        if (!videos || videos.length === 0) return null;

        // Optimization: Check only first 10 videos
        const datePromises = videos.slice(0, 10).map(video => {
            const videoPathWithoutExt = stripExtension(video.path);
            return fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`)
                .then(response => response.ok ? response.text() : 'Unknown date')
                .then(dateString => ({
                    video: video,
                    date: dateString.trim() || 'Unknown date',
                    dateObj: parseEuropeanDate(dateString.trim())
                }))
                .catch(() => ({
                    video: video,
                    date: 'Unknown date',
                    dateObj: new Date(0)
                }));
        });

        return Promise.all(datePromises).then(videosWithDates => {
            videosWithDates.sort((a, b) => b.dateObj.getTime() - a.dateObj.getTime());
            return videosWithDates[0].video;
        });
    }

    function loadAbout() {
        fetch(`/channel-description/${encodeURIComponent(channel)}`)
            .then(response => response.text())
            .then(description => {
                document.getElementById('channelDescription').textContent = description || 'No description available.';
            })
            .catch(() => {
                document.getElementById('channelDescription').textContent = 'No description available.';
            });

        fetch(`/channelstats/${encodeURIComponent(channel)}.json`)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('No stats file');
            })
            .then(data => {
                if (data.channel_creation_date) {
                    const date = parseEuropeanDate(data.channel_creation_date);
                    if (date.getTime() > 0) {
                        document.getElementById('statsJoined').textContent = getLang('Joined', 'Beigetreten') + ' ' + formatJoinDate(date);
                    }
                }
                if (data.total_views_raw) {
                    let views = parseInt(data.total_views_raw).toLocaleString('en-US');
                    if (localStorage.getItem('language') === 'de') views = views.replace(/,/g, '.');
                    document.getElementById('statsViews').textContent = `${views} ${getLang('views', 'Aufrufe')}`;
                } else if (data.total_views) {
                    document.getElementById('statsViews').textContent = `${data.total_views} ${getLang('views', 'Aufrufe')}`;
                }
            })
            .catch(() => {
                document.getElementById('statsJoined').textContent = getLang('Joined', 'Beigetreten') + ' --';
                document.getElementById('statsViews').textContent = `0 ${getLang('views', 'Aufrufe')}`;
            });
    }

    sortToggle.addEventListener('click', () => {
        sortNewestFirst = !sortNewestFirst;
        sortVideosArray();
        resetAndRender();
    });

    function formatJoinDate(date) {
        const monthsEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthsDe = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
        
        const lang = localStorage.getItem('language');
        const months = lang === 'de' ? monthsDe : monthsEn;

        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        return `${month} ${day}, ${year}`;
    }

    document.getElementById('shareChannelBtn').addEventListener('click', () => {
        const channelUrl = `${window.location.origin}/channel.html?channel=${encodeURIComponent(channel)}`;

        if (navigator.clipboard) {
            navigator.clipboard.writeText(channelUrl).then(() => {
                const btn = document.getElementById('shareChannelBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<img src="LocalYT-Rev-Files/share.svg" alt="Share"> ' + getLang('Copied!', 'Kopiert!');
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }).catch(() => {
                alert(`Channel URL: ${channelUrl}`);
            });
        } else {
            alert(`Channel URL: ${channelUrl}`);
        }
    });

    // ==========================================
    // OPTIMIZED INITIALIZATION LOGIC
    // ==========================================

    function loadHeaderStats() {
        fetch(`/subcount/${encodeURIComponent(channel)}`)
            .then(response => response.ok ? response.text() : '0')
            .then(subCount => {
                updateHeaderStats(subCount, null); 
            })
            .catch(() => {
                updateHeaderStats('?', null);
            });

        fetch('/search-index')
            .then(response => response.json())
            .then(data => {
                const videos = data.videos || [];
                const channelVideos = videos.filter(video => video.path.startsWith(`${channel}/`));
                const videoCount = channelVideos.length;
                
                // Update stats
                fetch(`/subcount/${encodeURIComponent(channel)}`)
                    .then(response => response.ok ? response.text() : '0')
                    .then(subCount => {
                         updateHeaderStats(subCount, videoCount);
                    })
                    .catch(() => {
                         updateHeaderStats('?', videoCount);
                    });

                // Initialize video list with optimized sorting
                initializeVideoList(channelVideos);
            })
            .catch(error => {
                console.error("Error loading search index for counts:", error);
                updateHeaderStats('?', '?');
            });
    }

    function updateHeaderStats(subs, vids) {
        let text = channel;
        let parts = [];
        
        if (subs !== null) parts.push(`${subs} ${getLang('subscribers', 'Abonnenten')}`);
        if (vids !== null) parts.push(`${vids} ${getLang('videos', 'Videos')}`);

        if (parts.length > 0) {
            text += `<span class="video-count">${parts.join(' • ')}</span>`;
        }
        
        channelName.innerHTML = text;
    }

    function initializeVideoList(channelVideos) {
        loadedTabs.add('videos'); 
        videosContainer.innerHTML = '<div class="loading-spinner visible">' + getLang('Loading videos...', 'Lade Videos...') + '</div>';

        // OPTIMIZATION:
        // We only fetch DATES first. Dates are small text files.
        // We need dates to SORT the videos correctly.
        // We do NOT need view counts to sort.
        const videoPromises = channelVideos.map(video => {
            const videoPathWithoutExt = stripExtension(video.path);
            return fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`)
                .then(response => response.ok ? response.text() : 'Unknown date')
                .then(fileDate => ({ 
                    ...video, 
                    fileDate: fileDate.trim() || 'Unknown date',
                    viewCount: '0' // Default, will load later
                }))
                .catch(() => ({ 
                    ...video, 
                    fileDate: 'Unknown date', 
                    viewCount: '0' 
                }));
        });

        Promise.all(videoPromises).then(videosWithDates => {
            currentVideos = videosWithDates;
            sortVideosArray(); // Sort is now complete
            
            hasMoreVideos = currentVideos.length > 0;
            videosContainer.innerHTML = ''; // Clear loading text
            
            // Load first batch immediately
            loadMoreVideos();
            setupIntersectionObserver();

            window.addEventListener('scroll', () => { if (!intersectionObserver) checkAndLoadMore(); });
            window.addEventListener('resize', () => { if (!intersectionObserver) checkAndLoadMore(); });
        });
    }

    loadHeaderStats();

    // --- Activate the initial tab from the URL ---
    if (initialTab !== 'videos') {
        document.querySelector('.tab[data-tab="videos"]').classList.remove('active');
        document.getElementById('videosTab').classList.remove('active');
        const targetTab = document.querySelector(`.tab[data-tab="${initialTab}"]`);
        const targetContent = document.getElementById(`${initialTab}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');
        loadTabContent(initialTab);
    }

    history.replaceState({ tab: initialTab }, '', buildChannelUrl(channel, initialTab));

    // --- Search Navigation Logic ---
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('keydown', (e) => { 
        if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`; 
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`; else searchInput.focus();
    });
});

function openVideo(videoSrc) {
    window.location.href = `video.html?src=${videoSrc}`;
}
    </script>
