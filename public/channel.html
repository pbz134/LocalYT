<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Videos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .channel-banner {
            width: 1400px;
            max-width: 100%;
            height: 230px;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            margin-left: 230px;
            border-bottom: 1px solid #3f3f3f;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #aaa;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }
        .tab:hover {
            color: #fff;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .sort-toggle {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 0 0 230px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .sort-toggle:hover {
            background-color: #555;
        }
        .sort-icon {
            font-size: 16px;
        }
        .videos-wrapper {
            position: relative;
            min-height: 400px;
        }
        .channel-videos, .playlists-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 10px 20px;
        }
        .video-item {
            margin: 10px;
            background: #0f0f0f;
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .playlist-item {
            margin: 10px;
            background: #0f0f0f;
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-item:hover {
            transform: scale(1.05);
        }
        .video-thumbnail {
            width: 100%;
            height: 168px;
            display: block;
            background-color: #2a2a2a;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-thumbnail {
            width: 100%;
            height: 168px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .playlist-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .video-title {
            padding: 10px;
            margin-left: -10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
            text-decoration: none;
            transition: text-decoration 0.2s ease;
            font-size: 16px;
        }
        .playlist-title {
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            color: #d2cfcf;
            font-size: 16px;
        }
        .video-description, .playlist-description {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            margin-left: -10px;
            color: #888;
        }
        .playlist-video-count {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            display: none;
        }
        .loading-spinner.visible {
            display: block;
        }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #888;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .load-more-trigger {
            height: 20px;
            width: 100%;
            visibility: hidden;
            position: relative;
            bottom: 50px;
        }
        .no-more-videos {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            font-style: italic;
        }

        /* About Tab Styles */
        .about-container {
            display: flex;
            gap: 40px;
            margin-left: 230px;
            max-width: 1200px;
        }
        .about-description {
            flex: 2;
            min-width: 0;
        }
        .about-description h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .about-description .description-text {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .about-stats {
            flex: 1;
            min-width: 200px;
        }
        .about-stats h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .stats-item {
            color: #ccc;
            font-size: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #3f3f3f;
        }
        .stats-item:first-of-type {
            border-top: 1px solid #3f3f3f;
        }
        .stats-item.total-views {
            font-weight: normal;
        }
        .share-button {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: #ccc;
            border: none;
            padding: 8px 0;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .share-button:hover {
            filter: brightness(1.4);
        }
        .share-button img {
            width: 16px;
            height: 16px;
            filter: invert(1);
        }
        .tab-loading-placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 15px;
        }
        .tab-loading-placeholder::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-left: 10px;
            border: 2px solid #666;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div id="channelBanner" class="channel-banner"></div>
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="videos">VIDEOS</div>
        <div class="tab" data-tab="playlists">PLAYLISTS</div>
        <div class="tab" data-tab="about">ABOUT</div>
    </div>

    <!-- Videos Tab -->
    <div id="videosTab" class="tab-content active">
        <button id="sortToggle" class="sort-toggle">
            <span class="sort-icon">↓</span> Newest First
        </button>
        <div class="container videos-wrapper">
            <div class="channel-videos" id="channelVideosContainer"></div>
            <div id="loadingSpinner" class="loading-spinner">Loading more videos</div>
            <div id="noMoreVideos" class="no-more-videos" style="display: none;">No more videos to load</div>
            <div id="loadMoreTrigger" class="load-more-trigger"></div>
        </div>
    </div>

    <!-- Playlists Tab -->
    <div id="playlistsTab" class="tab-content">
        <div class="playlists-container" id="playlistsContainer">
            <div class="tab-loading-placeholder">Loading playlists</div>
        </div>
    </div>

    <!-- About Tab -->
    <div id="aboutTab" class="tab-content">
        <div class="about-container">
            <div class="about-description">
                <h3>Description</h3>
                <div id="channelDescription" class="description-text">
                    <div class="tab-loading-placeholder">Loading</div>
                </div>
            </div>
            <div class="about-stats">
                <h3>Stats</h3>
                <div class="stats-list">
                    <div class="stats-item" id="statsJoined">Joined --</div>
                    <div class="stats-item total-views" id="statsViews">-- views</div>
                    <button class="share-button" id="shareChannelBtn">
                        <img src="LocalYT-Rev-Files/share.svg" alt="Share">
                        Share
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
// Configuration
const VIDEOS_PER_PAGE = 20;

// Parse the channel and tab from the URL
function parseChannelUrl() {
    const raw = new URLSearchParams(window.location.search).get('channel') || '';
    const decoded = decodeURIComponent(raw);

    const validTabs = ['videos', 'playlists', 'about'];
    const tabNames = validTabs.find(t => decoded.endsWith('/' + t));

    if (tabNames) {
        return {
            channel: decoded.slice(0, -(tabNames.length + 1)),
            tab: tabNames
        };
    }
    return { channel: decoded, tab: 'videos' };
}

// Build the URL for a given channel + tab
function buildChannelUrl(channel, tab) {
    if (tab === 'videos') {
        return `channel.html?channel=${encodeURIComponent(channel)}`;
    }
    return `channel.html?channel=${encodeURIComponent(channel)}/${tab}`;
}

const { channel, tab: initialTab } = parseChannelUrl();

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');

    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });

        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });

        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });

        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const videosContainer = document.getElementById('channelVideosContainer');
    const playlistsContainer = document.getElementById('playlistsContainer');
    const channelPic = document.getElementById('channelPic');
    const channelName = document.getElementById('channelName');
    const channelBanner = document.getElementById('channelBanner');
    const sortToggle = document.getElementById('sortToggle');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    const noMoreVideos = document.getElementById('noMoreVideos');

    let currentVideos = [];
    let sortNewestFirst = true;
    let renderedVideoCount = 0;
    let isLoadingMore = false;
    let hasMoreVideos = true;
    let intersectionObserver = null;

    // Track which tabs have already been loaded
    const loadedTabs = new Set();

    channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
    channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
    channelName.textContent = channel;
    document.title = `${channel} - LocalYT`;

    // --- Tab switching (pushes to address bar) ---
    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);

        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        const newUrl = buildChannelUrl(channel, tabName);
        history.pushState({ tab: tabName }, '', newUrl);

        if (!loadedTabs.has(tabName)) {
            loadTabContent(tabName);
        }
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });

    // Handle browser back/forward
    window.addEventListener('popstate', (event) => {
        const tabName = event.state?.tab || 'videos';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        if (!loadedTabs.has(tabName)) {
            loadTabContent(tabName);
        }
    });

    // --- Lazy-load content for a specific tab ---
    function loadTabContent(tabName) {
        switch (tabName) {
            case 'playlists':
                loadPlaylists();
                break;
            case 'about':
                loadAbout();
                break;
        }
        loadedTabs.add(tabName);
    }

    function parseEuropeanDate(dateString) {
        if (!dateString || dateString === 'Unknown date') return new Date(0);
        const parts = dateString.split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }
        return new Date(dateString);
    }

    function stripExtension(filename) {
        return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
    }

    function sortVideosArray() {
        currentVideos.sort((a, b) => {
            try {
                const dateA = parseEuropeanDate(a.fileDate).getTime();
                const dateB = parseEuropeanDate(b.fileDate).getTime();
                return sortNewestFirst ? dateB - dateA : dateA - dateB;
            } catch (e) {
                return 0;
            }
        });
    }

    function resetAndRender() {
        if (sortNewestFirst) {
            sortToggle.innerHTML = '<span class="sort-icon">↓</span> Newest First';
        } else {
            sortToggle.innerHTML = '<span class="sort-icon">↑</span> Oldest First';
        }

        renderedVideoCount = 0;
        videosContainer.innerHTML = '';
        hasMoreVideos = currentVideos.length > 0;

        loadingSpinner.classList.remove('visible');
        noMoreVideos.style.display = 'none';

        loadMoreVideos();
    }

    function createVideoElement(video) {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-title" onclick="openVideo('${encodeURIComponent(video.path)}')">${videoTitle}</div>
            <div class="video-description"></div>
        `;

        const descriptionDiv = videoElement.querySelector('.video-description');

        Promise.all([
            fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(response => response.ok ? response.text() : '0'),
            fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(response => response.ok ? response.text() : 'Unknown date')
        ])
        .then(([viewCount, fileDate]) => {
            let formattedViewCount = viewCount;
            if (!isNaN(viewCount) && viewCount !== '0') {
                formattedViewCount = parseInt(viewCount).toLocaleString();
            }
            descriptionDiv.textContent = `${formattedViewCount} views • Uploaded on ${fileDate}`;
        })
        .catch(() => {
            descriptionDiv.textContent = 'Views unavailable';
        });

        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.ok ? response.text() : '')
            .then(length => {
                videoElement.querySelector('.video-length').textContent = length;
            })
            .catch(() => {});

        const videoLink = videoElement.querySelector('.video-title');
        const videoThumb = videoElement.querySelector('.video-thumbnail');

        videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
        videoLink.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));

        videoThumb.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });
        videoLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        const openInNewTabHandler = (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };

        videoThumb.addEventListener('mouseup', openInNewTabHandler);
        videoLink.addEventListener('mouseup', openInNewTabHandler);
        videoThumb.addEventListener('auxclick', openInNewTabHandler);
        videoLink.addEventListener('auxclick', openInNewTabHandler);

        return videoElement;
    }

    function loadMoreVideos() {
        if (isLoadingMore || !hasMoreVideos) return;

        const startIndex = renderedVideoCount;
        const endIndex = Math.min(startIndex + VIDEOS_PER_PAGE, currentVideos.length);

        if (startIndex >= currentVideos.length) {
            hasMoreVideos = false;
            loadingSpinner.classList.remove('visible');
            noMoreVideos.style.display = 'block';
            return;
        }

        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        requestAnimationFrame(() => {
            const fragment = document.createDocumentFragment();

            for (let i = startIndex; i < endIndex; i++) {
                const video = currentVideos[i];
                const videoElement = createVideoElement(video);
                fragment.appendChild(videoElement);
            }

            videosContainer.appendChild(fragment);
            renderedVideoCount = endIndex;
            isLoadingMore = false;

            if (renderedVideoCount >= currentVideos.length) {
                hasMoreVideos = false;
                loadingSpinner.classList.remove('visible');
                noMoreVideos.style.display = 'block';
            } else {
                loadingSpinner.classList.remove('visible');
            }
        });
    }

    function checkAndLoadMore() {
        if (!hasMoreVideos || isLoadingMore) return;
        const trigger = loadMoreTrigger;
        if (!trigger) return;
        const rect = trigger.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        if (rect.top <= windowHeight + 300) {
            loadMoreVideos();
        }
    }

    function setupIntersectionObserver() {
        if (window.IntersectionObserver) {
            intersectionObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && hasMoreVideos && !isLoadingMore) {
                            loadMoreVideos();
                        }
                    });
                },
                { root: null, rootMargin: '300px', threshold: 0 }
            );
            if (loadMoreTrigger) {
                intersectionObserver.observe(loadMoreTrigger);
            }
        }
    }

    // --- Playlists (lazy-loaded) ---
    function loadPlaylists() {
        fetch(`/channel-playlists/${encodeURIComponent(channel)}`)
            .then(response => response.json())
            .then(playlists => {
                renderPlaylists(playlists);
            })
            .catch(error => {
                console.error('Error fetching playlists:', error);
                playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">Failed to load playlists</p>';
            });
    }

    function pickPreviewVideo(videos) {
        if (!videos || videos.length === 0) return null;

        // Fetch upload dates for all videos in the playlist
        const datePromises = videos.map(video => {
            const videoPathWithoutExt = stripExtension(video.path);
            return fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`)
                .then(response => response.ok ? response.text() : 'Unknown date')
                .then(dateString => ({
                    video: video,
                    date: dateString.trim() || 'Unknown date',
                    dateObj: parseEuropeanDate(dateString.trim())
                }))
                .catch(() => ({
                    video: video,
                    date: 'Unknown date',
                    dateObj: new Date(0)
                }));
        });

        return Promise.all(datePromises).then(videosWithDates => {
            // Sort by upload date descending (newest first)
            videosWithDates.sort((a, b) => {
                const timeDiff = b.dateObj.getTime() - a.dateObj.getTime();
                if (timeDiff !== 0) return timeDiff;
                // If dates are identical, sort alphabetically by display name (A-Z)
                const nameA = (a.video.displayName || '').toLowerCase();
                const nameB = (b.video.displayName || '').toLowerCase();
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });

            // Return the first video (most recent, or first A-Z if tied)
            return videosWithDates[0].video;
        });
    }

    function renderPlaylists(playlists) {
        playlistsContainer.innerHTML = '';

        if (playlists.length === 0) {
            playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">No playlists found</p>';
            return;
        }

        // Fetch videos for all playlists in parallel
        const playlistPromises = playlists.map(playlist => {
            return fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist.path)}`)
                .then(response => response.json())
                .then(videos => ({ playlist, videos }))
                .catch(() => ({ playlist, videos: [] }));
        });

        Promise.all(playlistPromises).then(results => {
            results.forEach(({ playlist, videos }) => {
                const playlistElement = document.createElement('div');
                playlistElement.className = 'playlist-item';

                if (videos.length > 0) {
                    pickPreviewVideo(videos).then(previewVideo => {
                        const videoPathWithoutExt = stripExtension(previewVideo.path);
                        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

                        playlistElement.innerHTML = `
                            <div class="playlist-thumbnail" style="background-image: url('${thumbnailSrc}')">
                                <div class="playlist-overlay">${videos.length} videos</div>
                            </div>
                            <div class="playlist-title">${playlist.name}</div>
                            <div class="playlist-video-count">${playlist.videoCount} videos</div>
                        `;
                    });
                } else {
                    playlistElement.innerHTML = `
                        <div class="playlist-thumbnail" style="background-color: #333">
                            <div class="playlist-overlay">0 videos</div>
                        </div>
                        <div class="playlist-title">${playlist.name}</div>
                        <div class="playlist-video-count">0 videos</div>
                    `;
                }

                playlistElement.addEventListener('click', () => {
                    window.location.href = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(playlist.path)}`;
                });

                playlistsContainer.appendChild(playlistElement);
            });
        });
    }

    // --- About (lazy-loaded) ---
    function loadAbout() {
        fetch(`/channel-description/${encodeURIComponent(channel)}`)
            .then(response => response.text())
            .then(description => {
                document.getElementById('channelDescription').textContent = description || 'No description available.';
            })
            .catch(() => {
                document.getElementById('channelDescription').textContent = 'No description available.';
            });

        fetch(`/channelstats/${encodeURIComponent(channel)}.json`)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('No stats file');
            })
            .then(data => {
                if (data.channel_creation_date) {
                    const date = parseEuropeanDate(data.channel_creation_date);
                    if (date.getTime() > 0) {
                        document.getElementById('statsJoined').textContent = `Joined ${formatJoinDate(date)}`;
                    }
                }
                if (data.total_views_raw) {
                    document.getElementById('statsViews').textContent = `${parseInt(data.total_views_raw).toLocaleString('en-US')} views`;
                } else if (data.total_views) {
                    document.getElementById('statsViews').textContent = `${data.total_views} views`;
                }
            })
            .catch(() => {
                document.getElementById('statsJoined').textContent = 'Joined --';
                document.getElementById('statsViews').textContent = '0 views';
            });
    }

    sortToggle.addEventListener('click', () => {
        sortNewestFirst = !sortNewestFirst;
        sortVideosArray();
        resetAndRender();
    });

    function formatJoinDate(date) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        return `${month} ${day}, ${year}`;
    }

    // Share button
    document.getElementById('shareChannelBtn').addEventListener('click', () => {
        const channelUrl = `${window.location.origin}/channel.html?channel=${encodeURIComponent(channel)}`;

        if (navigator.clipboard) {
            navigator.clipboard.writeText(channelUrl).then(() => {
                const btn = document.getElementById('shareChannelBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<img src="LocalYT-Rev-Files/share.svg" alt="Share"> Copied!';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }).catch(() => {
                alert(`Channel URL: ${channelUrl}`);
            });
        } else {
            alert(`Channel URL: ${channelUrl}`);
        }
    });

    // --- Load videos (always loaded on page init) ---
    loadedTabs.add('videos');

    fetch('/search-index')
        .then(response => response.json())
        .then(data => {
            const videos = data.videos || [];
            const channelVideos = videos.filter(video => video.path.startsWith(`${channel}/`));

            videosContainer.innerHTML = '<div class="loading-spinner visible">Loading videos...</div>';

            const videoPromises = channelVideos.map(video => {
                const videoPathWithoutExt = stripExtension(video.path);

                return Promise.all([
                    fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(r => r.ok ? r.text() : '0'),
                    fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(r => r.ok ? r.text() : 'Unknown date')
                ])
                .then(([viewCount, fileDate]) => {
                    return {
                        ...video,
                        viewCount: viewCount,
                        fileDate: fileDate.trim() || 'Unknown date'
                    };
                })
                .catch(() => {
                    return { ...video, viewCount: '0', fileDate: 'Unknown date' };
                });
            });

            Promise.all(videoPromises).then(videosWithDetails => {
                currentVideos = videosWithDetails;
                sortVideosArray();

                hasMoreVideos = currentVideos.length > 0;
                videosContainer.innerHTML = '';
                loadMoreVideos();

                const videoCount = currentVideos.length;
                fetch(`/subcount/${encodeURIComponent(channel)}`)
                    .then(response => response.ok ? response.text() : '0')
                    .then(subCount => {
                        channelName.innerHTML = `${channel}<span class="video-count">${subCount} subscribers • ${videoCount} videos</span>`;
                    })
                    .catch(() => {
                        channelName.innerHTML = `${channel}<span class="video-count">${videoCount} videos</span>`;
                    });

                setupIntersectionObserver();

                window.addEventListener('scroll', () => {
                    if (!intersectionObserver) checkAndLoadMore();
                });
                window.addEventListener('resize', () => {
                    if (!intersectionObserver) checkAndLoadMore();
                });
            });
        });

    // --- Activate the initial tab from the URL ---
    if (initialTab !== 'videos') {
        document.querySelector('.tab[data-tab="videos"]').classList.remove('active');
        document.getElementById('videosTab').classList.remove('active');

        const targetTab = document.querySelector(`.tab[data-tab="${initialTab}"]`);
        const targetContent = document.getElementById(`${initialTab}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        loadTabContent(initialTab);
    }

    history.replaceState({ tab: initialTab }, '', buildChannelUrl(channel, initialTab));

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();
        if (query.length < 2) return;

        fetch('/search-index')
            .then(response => response.json())
            .then(data => {
                const videos = data.videos || [];
                const suggestions = videos
                    .filter(video => video.displayName.toLowerCase().includes(query))
                    .slice(0, 5);

                const suggestionsContainer = document.getElementById('searchSuggestions');
                suggestionsContainer.innerHTML = '';
                suggestions.forEach(video => {
                    const suggestionElement = document.createElement('div');
                    suggestionElement.className = 'suggestion-item';
                    suggestionElement.textContent = video.displayName;
                    suggestionElement.onclick = () => {
                        window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
                    };
                    suggestionsContainer.appendChild(suggestionElement);

                    suggestionElement.addEventListener('contextmenu', (event) => {
                        event.preventDefault();
                        window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                    });

                    suggestionElement.addEventListener('mouseup', (event) => {
                        if (event.button === 1) {
                            event.preventDefault();
                            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                        }
                    });
                });
            });
    });

    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
});

function openVideo(videoSrc) {
    window.location.href = `video.html?src=${videoSrc}`;
}
    </script>
    <script src="profile-pic.js"></script>
</body>
