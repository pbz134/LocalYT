<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Videos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .channel-banner {
            width: 70%;
            height: 170px;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .divider {
            border-top: 1px solid #3f3f3f;
            margin: 20px 0;
        }
        .tabs {
            display: flex;
            margin-left: 230px;
            border-bottom: 1px solid #3f3f3f;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #aaa;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }
        .tab:hover {
            color: #fff;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .sort-toggle {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 10px 0;
            margin-left: 230px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .sort-toggle:hover {
            background-color: #555;
        }
        .sort-icon {
            font-size: 16px;
        }
        .videos-wrapper {
            position: relative;
            min-height: 400px;
        }
        .channel-videos, .playlists-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }
        .video-item {
            margin: 10px;
            background: #0f0f0f;
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .playlist-item {
            margin: 10px;
            background: #0f0f0f;
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-item:hover {
            transform: scale(1.05);
        }
        .video-thumbnail {
            width: 100%;
            height: 168px;
            display: block;
            background-color: #2a2a2a;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .playlist-thumbnail {
            width: 100%;
            height: 168px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .playlist-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .video-title {
            padding: 10px;
            margin-left: -10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
            text-decoration: none;
            transition: text-decoration 0.2s ease;
            font-size: 16px;
        }
        .playlist-title {
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            color: #d2cfcf;
            font-size: 16px;
        }
        .video-description, .playlist-description {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            margin-left: -10px;
            color: #888;
        }
        .playlist-video-count {
            text-align: left;
            padding: 0 10px;
            margin-top: -4px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            display: none; /* Hidden by default */
        }
        .loading-spinner.visible {
            display: block;
        }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #888;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .load-more-trigger {
            height: 20px;
            width: 100%;
            visibility: hidden;
            position: relative;
            bottom: 50px; /* Position it above the footer */
        }
        .no-more-videos {
            text-align: center;
            padding: 20px;
            color: #888;
            width: 100%;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div id="channelBanner" class="channel-banner"></div>
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
    </div>
    <div class="divider"></div>
    
    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="videos">VIDEOS</div>
        <div class="tab" data-tab="playlists">PLAYLISTS</div>
    </div>

    <!-- Videos Tab -->
    <div id="videosTab" class="tab-content active">
        <button id="sortToggle" class="sort-toggle">
            <span class="sort-icon">↓</span> Newest First
        </button>
        <div class="container videos-wrapper">
            <div class="channel-videos" id="channelVideosContainer"></div>
            <div id="loadingSpinner" class="loading-spinner">Loading more videos</div>
            <div id="noMoreVideos" class="no-more-videos" style="display: none;">No more videos to load</div>
            <div id="loadMoreTrigger" class="load-more-trigger"></div>
        </div>
    </div>

    <!-- Playlists Tab -->
    <div id="playlistsTab" class="tab-content">
        <div class="playlists-container" id="playlistsContainer"></div>
    </div>

    <script>
// Configuration
const VIDEOS_PER_PAGE = 20; // Number of videos to load initially and per batch

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) { // Left click
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) { // Middle click
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const channel = decodeURIComponent(urlParams.get('channel'));
    const videosContainer = document.getElementById('channelVideosContainer');
    const playlistsContainer = document.getElementById('playlistsContainer');
    const channelPic = document.getElementById('channelPic');
    const channelName = document.getElementById('channelName');
    const channelBanner = document.getElementById('channelBanner');
    const sortToggle = document.getElementById('sortToggle');
    const sortIcon = sortToggle.querySelector('.sort-icon');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loadMoreTrigger = document.getElementById('loadMoreTrigger');
    const noMoreVideos = document.getElementById('noMoreVideos');

    let currentVideos = [];
    let sortNewestFirst = true;
    let renderedVideoCount = 0;
    let isLoadingMore = false;
    let hasMoreVideos = true;
    let intersectionObserver = null;

    channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
    channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
    channelName.textContent = channel;

    document.title = `${channel} - LocalYT`;

    // Tab functionality
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            tab.classList.add('active');
            document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
        });
    });

    function parseEuropeanDate(dateString) {
        if (!dateString || dateString === 'Unknown date') return new Date(0);
        
        const parts = dateString.split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            return new Date(year, month, day);
        }
        return new Date(dateString);
    }

    function stripExtension(filename) {
        return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
    }

    function sortVideosArray() {
        currentVideos.sort((a, b) => {
            try {
                const dateA = parseEuropeanDate(a.fileDate).getTime();
                const dateB = parseEuropeanDate(b.fileDate).getTime();
                return sortNewestFirst ? dateB - dateA : dateA - dateB;
            } catch (e) {
                console.error('Error sorting videos:', e);
                return 0;
            }
        });
    }

    function resetAndRender() {
        if (sortNewestFirst) {
            sortToggle.innerHTML = '<span class="sort-icon">↓</span> Newest First';
        } else {
            sortToggle.innerHTML = '<span class="sort-icon">↑</span> Oldest First';
        }

        // Reset rendered count and re-render
        renderedVideoCount = 0;
        videosContainer.innerHTML = '';
        hasMoreVideos = currentVideos.length > 0;
        
        // Hide any messages
        loadingSpinner.classList.remove('visible');
        noMoreVideos.style.display = 'none';
        
        // Load first batch
        loadMoreVideos();
    }

    function createVideoElement(video) {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        
        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-title" onclick="openVideo('${encodeURIComponent(video.path)}')">${videoTitle}</div>
            <div class="video-description"></div>
        `;

        // Fetch metadata
        const descriptionDiv = videoElement.querySelector('.video-description');
        
        Promise.all([
            fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(response => response.ok ? response.text() : '0'),
            fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(response => response.ok ? response.text() : 'Unknown date')
        ])
        .then(([viewCount, fileDate]) => {
            let formattedViewCount = viewCount;
            if (!isNaN(viewCount) && viewCount !== '0') {
                formattedViewCount = parseInt(viewCount).toLocaleString();
            }
            descriptionDiv.textContent = `${formattedViewCount} views • Uploaded on ${fileDate}`;
        })
        .catch(error => {
            console.error('Error fetching metadata:', error);
            descriptionDiv.textContent = 'Views unavailable';
        });

        // Fetch video length
        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.ok ? response.text() : '')
            .then(length => {
                videoElement.querySelector('.video-length').textContent = length;
            })
            .catch(error => {
                console.error('Error fetching video length:', error);
            });

        // Video click handlers
        const videoLink = videoElement.querySelector('.video-title');
        const videoThumb = videoElement.querySelector('.video-thumbnail');
        
        // Left click
        videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
        videoLink.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
        
        // Right click (open in new tab)
        videoThumb.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });
        videoLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        // Middle click / Mouse wheel click (open in new tab)
        // Using 'mouseup' for broader compatibility and 'auxclick' for modern standard
        const openInNewTabHandler = (event) => {
            if (event.button === 1) { // Button 1 is the middle mouse button
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };

        videoThumb.addEventListener('mouseup', openInNewTabHandler);
        videoLink.addEventListener('mouseup', openInNewTabHandler);
        
        videoThumb.addEventListener('auxclick', openInNewTabHandler);
        videoLink.addEventListener('auxclick', openInNewTabHandler);

        return videoElement;
    }

    function loadMoreVideos() {
        // Don't load if already loading or no more videos
        if (isLoadingMore || !hasMoreVideos) return;
        
        const startIndex = renderedVideoCount;
        const endIndex = Math.min(startIndex + VIDEOS_PER_PAGE, currentVideos.length);
        
        // Check if we've reached the end
        if (startIndex >= currentVideos.length) {
            hasMoreVideos = false;
            loadingSpinner.classList.remove('visible');
            noMoreVideos.style.display = 'block';
            return;
        }

        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        // Use requestAnimationFrame for smoother rendering
        requestAnimationFrame(() => {
            const fragment = document.createDocumentFragment();
            
            for (let i = startIndex; i < endIndex; i++) {
                const video = currentVideos[i];
                const videoElement = createVideoElement(video);
                fragment.appendChild(videoElement);
            }
            
            videosContainer.appendChild(fragment);
            renderedVideoCount = endIndex;
            isLoadingMore = false;
            
            // Check if we've loaded all videos
            if (renderedVideoCount >= currentVideos.length) {
                hasMoreVideos = false;
                loadingSpinner.classList.remove('visible');
                noMoreVideos.style.display = 'block';
            } else {
                loadingSpinner.classList.remove('visible');
            }
        });
    }

    function checkAndLoadMore() {
        if (!hasMoreVideos || isLoadingMore) return;
        
        const trigger = loadMoreTrigger;
        if (!trigger) return;
        
        const rect = trigger.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        
        // Load more when trigger is within 300px of viewport (increased buffer)
        if (rect.top <= windowHeight + 300) {
            loadMoreVideos();
        }
    }

    // Setup intersection observer for more efficient lazy loading
    function setupIntersectionObserver() {
        if (window.IntersectionObserver) {
            intersectionObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && hasMoreVideos && !isLoadingMore) {
                            loadMoreVideos();
                        }
                    });
                },
                {
                    root: null,
                    rootMargin: '300px', // Increased margin for earlier loading
                    threshold: 0
                }
            );

            if (loadMoreTrigger) {
                intersectionObserver.observe(loadMoreTrigger);
            }
        }
    }

    function renderPlaylists(playlists) {
        playlistsContainer.innerHTML = '';
        
        if (playlists.length === 0) {
            playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">No playlists found</p>';
            return;
        }

        playlists.forEach(playlist => {
            const playlistElement = document.createElement('div');
            playlistElement.className = 'playlist-item';
            
            fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist.path)}`)
                .then(response => response.json())
                .then(videos => {
                    if (videos.length > 0) {
                        const firstVideo = videos[0];
                        const videoPathWithoutExt = stripExtension(firstVideo.path);
                        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
                        
                        playlistElement.innerHTML = `
                            <div class="playlist-thumbnail" style="background-image: url('${thumbnailSrc}')">
                                <div class="playlist-overlay">
                                    ${videos.length} videos
                                </div>
                            </div>
                            <div class="playlist-title">${playlist.name}</div>
                            <div class="playlist-video-count">${playlist.videoCount} videos</div>
                        `;
                    } else {
                        playlistElement.innerHTML = `
                            <div class="playlist-thumbnail" style="background-color: #333">
                                <div class="playlist-overlay">
                                    0 videos
                                </div>
                            </div>
                            <div class="playlist-title">${playlist.name}</div>
                            <div class="playlist-video-count">0 videos</div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error fetching playlist videos:', error);
                });

            playlistElement.addEventListener('click', () => {
                window.location.href = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(playlist.path)}`;
            });

            playlistsContainer.appendChild(playlistElement);
        });
    }

    sortToggle.addEventListener('click', () => {
        sortNewestFirst = !sortNewestFirst;
        sortVideosArray();
        resetAndRender();
    });

    // Load videos from search-index
    fetch('/search-index')
        .then(response => response.json())
        .then(data => {
            const videos = data.videos || [];
            // Filter for current channel
            const channelVideos = videos.filter(video => video.path.startsWith(`${channel}/`));
            
            // Show initial loading state
            videosContainer.innerHTML = '<div class="loading-spinner visible">Loading videos...</div>';
            
            const videoPromises = channelVideos.map(video => {
                const videoPathWithoutExt = stripExtension(video.path);
                
                return Promise.all([
                    fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(r => r.ok ? r.text() : '0'),
                    fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(r => r.ok ? r.text() : 'Unknown date')
                ])
                .then(([viewCount, fileDate]) => {
                    return {
                        ...video,
                        viewCount: viewCount,
                        fileDate: fileDate.trim() || 'Unknown date'
                    };
                })
                .catch(() => {
                    return { 
                        ...video, 
                        viewCount: '0',
                        fileDate: 'Unknown date' 
                    };
                });
            });

            Promise.all(videoPromises).then(videosWithDetails => {
                currentVideos = videosWithDetails;
                
                // FIX: Sort videos immediately after fetching them
                sortVideosArray();
                
                hasMoreVideos = currentVideos.length > 0;
                
                // Clear the initial loading spinner
                videosContainer.innerHTML = '';
                
                // FIX: Load first batch of videos (triggers render)
                loadMoreVideos();
                
                const videoCount = currentVideos.length;
                fetch(`/subcount/${encodeURIComponent(channel)}`)
                    .then(response => response.ok ? response.text() : '0')
                    .then(subCount => {
                        channelName.innerHTML = `${channel}<span class="video-count">${subCount} subscribers • ${videoCount} videos</span>`;
                    })
                    .catch(error => {
                        console.error('Error fetching subscriber count:', error);
                        channelName.innerHTML = `${channel}<span class="video-count">${videoCount} videos</span>`;
                    });

                // Setup lazy loading
                setupIntersectionObserver();
                
                // Add scroll listener as fallback for older browsers
                window.addEventListener('scroll', () => {
                    if (!intersectionObserver) {
                        checkAndLoadMore();
                    }
                });
                
                // Also check on resize
                window.addEventListener('resize', () => {
                    if (!intersectionObserver) {
                        checkAndLoadMore();
                    }
                });
            });
        });

    // Load playlists
    fetch(`/channel-playlists/${encodeURIComponent(channel)}`)
        .then(response => response.json())
        .then(playlists => {
            renderPlaylists(playlists);
        })
        .catch(error => {
            console.error('Error fetching playlists:', error);
        });

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();
        if (query.length < 2) return;

        fetch('/search-index')
            .then(response => response.json())
            .then(data => {
                const videos = data.videos || [];
                const suggestions = videos
                    .filter(video => video.displayName.toLowerCase().includes(query))
                    .slice(0, 5);

                const suggestionsContainer = document.getElementById('searchSuggestions');
                suggestionsContainer.innerHTML = '';
                suggestions.forEach(video => {
                    const suggestionElement = document.createElement('div');
                    suggestionElement.className = 'suggestion-item';
                    suggestionElement.textContent = video.displayName;
                    suggestionElement.onclick = () => {
                        window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
                    };
                    suggestionsContainer.appendChild(suggestionElement);

                    suggestionElement.addEventListener('contextmenu', (event) => {
                        event.preventDefault();
                        window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                    });

                    suggestionElement.addEventListener('mouseup', (event) => {
                        if (event.button === 1) {
                            event.preventDefault();
                            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                        }
                    });
                });
            });
    });

    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });
});

function openVideo(videoSrc) {
    window.location.href = `video.html?src=${videoSrc}`;
}
    </script>
</body>
</html>
