    <script>
    // Load Player for the HOME tab miniplayer based on user's preference
    (function() {
        const playerSettings = JSON.parse(localStorage.getItem('videoPlayer') || '{}');
        const selectedPlayer = playerSettings.player || 'lyt';

        const script = document.createElement('script');
        if (selectedPlayer === 'lyt') {
            script.src = 'lyt-player.js';
        } else {
            script.src = 'fluidplayer.min.js';
        }
        document.head.appendChild(script);
    })();

// ==============================
// Apply Rounded Corners Preference
// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .home-player-wrapper {
                border-radius: 12px !important;
                overflow: hidden !important;
            }
            .channel-videos .video-thumbnail,
            .channel-search-results .video-thumbnail,
            .home-row-wrapper .video-thumbnail,
            .home-others-grid .video-thumbnail {
                border-radius: 12px !important;
            }
            .playlist-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();
    </script>

document.addEventListener('mousedown', function(e) {
    if (e.button === 1) { // Middle Mouse Button
        const target = e.target.closest(
            'a, ' + 
            '.video-item, ' + 
            '.playlist-item, ' + 
            '.video-title, ' + 
            '.video-thumbnail, ' + 
            '.playlist-thumbnail, ' + 
            '.home-video-title, ' + 
            '.tab, ' + 
            '.sort-toggle, ' + 
            '.subscribe-button, ' + 
            '.share-button, ' + 
            '.channel-name, ' + 
            '.suggestion-item, ' +
            '#mainLogo, ' +
            '.post-item'
        );
        
        if (target) {
            e.preventDefault();
            
            // If it's a real anchor tag with an href, manually open it
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
            // For custom elements (divs/spans), their existing 'mouseup' or 'auxclick' 
            // listeners will handle opening the new tab.
        }
    }
}, true); // Use Capture phase

const VIDEOS_PER_PAGE = 20;

function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

function parseChannelUrl() {
    const raw = new URLSearchParams(window.location.search).get('channel') || '';
    const decoded = decodeURIComponent(raw);

    const validTabs = ['videos', 'playlists', 'about', 'posts', 'search'];
    const tabNames = validTabs.find(t => decoded.endsWith('/' + t));

    if (tabNames) {
        return {
            channel: decoded.slice(0, -(tabNames.length + 1)),
            tab: tabNames
        };
    }
    return { channel: decoded, tab: 'home' };
}

function buildChannelUrl(channel, tab) {
    if (tab === 'home') {
        return `channel.html?channel=${encodeURIComponent(channel)}`;
    }
    return `channel.html?channel=${encodeURIComponent(channel)}/${tab}`;
}

const { channel, tab: initialTab } = parseChannelUrl();

    const channelPageStylePref = JSON.parse(localStorage.getItem('channelPageStyle') || '{}');
    if (channelPageStylePref.style === 'legacy') {
        document.body.classList.add('legacy-channel');
        document.body.classList.add('classic-channel');
        // Move the profile pic into the banner so absolute positioning works cleanly
        const channelPic = document.getElementById('channelPic');
        const channelBanner = document.getElementById('channelBanner');
        if (channelPic && channelBanner) {
            channelBanner.appendChild(channelPic);
        }
    }
    if (channelPageStylePref.style === 'classic') {
        document.body.classList.add('classic-channel');
    }

    const mainLogo = document.getElementById('mainLogo');

    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });

        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });

        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });

        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

    const viewToggleLabel = document.getElementById('viewToggleLabel');
    let currentViewMode = 'grid';

    // Apply user's default channel view preference
    const channelDefaultViewPref = JSON.parse(localStorage.getItem('channelDefaultView') || '{}');
    if (channelDefaultViewPref.view) {
        currentViewMode = channelDefaultViewPref.view;
    }

    // Update the view toggle label and active state to match the preference
    viewToggleLabel.textContent = getLang(
        currentViewMode === 'grid' ? 'Grid' : 'List',
        currentViewMode === 'grid' ? 'Raster' : 'Liste'
    );

    document.querySelectorAll('.view-dropdown-item').forEach(item => {
        if (item.dataset.view === currentViewMode) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });

    // Apply the view class immediately if the preference is list
    if (currentViewMode === 'list') {
        videosContainer.classList.add('list-view');
    }

    viewToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        viewDropdownMenu.classList.toggle('open');
        viewToggle.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.view-dropdown')) {
            viewDropdownMenu.classList.remove('open');
            viewToggle.classList.remove('open');
        }
    });

    document.querySelectorAll('.view-dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
            const viewValue = item.dataset.view;
            currentViewMode = viewValue;

            // Update active state in dropdown
            document.querySelectorAll('.view-dropdown-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            // Update toggle label
            viewToggleLabel.textContent = getLang(
                viewValue === 'grid' ? 'Grid' : 'List',
                viewValue === 'grid' ? 'Raster' : 'Liste'
            );

            // Close dropdown
            viewDropdownMenu.classList.remove('open');
            viewToggle.classList.remove('open');

            // Toggle view class on container
            if (viewValue === 'list') {
                videosContainer.classList.add('list-view');
            } else {
                videosContainer.classList.remove('list-view');
            }
        });
    });

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);

        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        const newUrl = buildChannelUrl(channel, tabName);
        history.pushState({ tab: tabName }, '', newUrl);

        if (!loadedTabs.has(tabName)) {
            loadTabContent(tabName);
        }

        if (tabName !== 'home') {
            const homeVideo = document.getElementById('homeVideoPlayer');
            if (homeVideo) {
                homeVideo.pause();
            }
        }
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });

    window.addEventListener('popstate', (event) => {
        const tabName = event.state?.tab || 'home';
        const query = event.state?.query || '';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');

        if (!loadedTabs.has(tabName)) {
            loadTabContent(tabName);
        }

        // Restore channel search state if navigating back to the search tab
        if (tabName === 'search') {
            const searchBar = document.querySelector('.tab-search-bar');
            if (!searchBar.classList.contains('active')) {
                searchBar.classList.add('active');
            }
            if (query) {
                channelSearchInput.value = query;
                // Re-trigger search automatically
                executeChannelSearch(query);
            }
        }
    });

    function loadTabContent(tabName) {
        switch (tabName) {
            case 'home':
                loadHomeTab();
                break;
            case 'videos':
                lazyLoadVideosTab();
                break;
            case 'playlists':
                loadPlaylists();
                break;
            case 'about':
                loadAbout();
                break;
            case 'posts':
                loadPosts();
                break;
            default:
                break;
        }
        loadedTabs.add(tabName);
    }

    function loadHomeTab() {
        fetch(`/channel-home-previews/${encodeURIComponent(channel)}.json`)
            .then(response => {
                if (!response.ok) throw new Error('No preview file');
                return response.json();
            })
            .then(previews => {
                if (!previews || previews.length === 0) {
                    document.getElementById('homePlayerPlaceholder').textContent = getLang('No videos found', 'Keine Videos gefunden');
                    document.getElementById('homeOthersGrid').innerHTML = '';
                    return;
                }

                const featuredVideo = previews.find(v => v.type === 'video') || previews[0];
                const featuredPath = featuredVideo.path;

                // Fetch the full search index to find the true 5 most recent videos
                fetch('/search-index')
                    .then(r => r.ok ? r.json() : { videos: [] })
                    .then(data => {
                        const allChannelVideos = (data.videos || []).filter(v => v.path.startsWith(channel + '/'));

                        // Sort by the fileDate from previews, fallback to path order
                        const previewDateMap = {};
                        previews.forEach(p => {
                            if (p.type === 'video') {
                                previewDateMap[p.path] = p.fileDate;
                            }
                        });

                        const sortedAll = [...allChannelVideos].sort((a, b) => {
                            const dateA = (previewDateMap[a.path] || '').replace(/\r?\n$/, '').trim();
                            const dateB = (previewDateMap[b.path] || '').replace(/\r?\n$/, '').trim();
                            const parseDate = (str) => {
                                if (!str) return 0;
                                const p = str.split('.');
                                if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]).getTime();
                                return 0;
                            };
                            return parseDate(dateB) - parseDate(dateA);
                        });

                        // Build the items list: playlists from previews + top 5 videos (excluding featured)
                        const top5Videos = sortedAll.filter(v => v.path !== featuredPath).slice(0, 5).map(v => {
                            const previewMatch = previews.find(p => p.path === v.path);
                            return {
                                type: 'video',
                                path: v.path,
                                displayName: (previewMatch && previewMatch.displayName) || v.displayName || v.path.split('/').pop(),
                                fileDate: previewDateMap[v.path] || ''
                            };
                        });

                        const playlistItems = previews.filter(p => p.type === 'playlist');

                        // Remaining random videos from previews (excluding featured and the top 5)
                        const top5Paths = new Set(top5Videos.map(v => v.path));
                        const remainingRandom = previews.filter(p =>
                            p.type === 'video' &&
                            p.path !== featuredPath &&
                            !top5Paths.has(p.path)
                        );

                        const allItems = [...top5Videos, ...playlistItems, ...remainingRandom];

                        setupHomeMiniplayer(featuredVideo);
                        renderHomeOtherItems(allItems);
                    })
                    .catch(() => {
                        // Fallback if search-index fails: use previews as-is minus featured
                        const otherItems = previews.filter(v => v.path !== featuredPath);
                        setupHomeMiniplayer(featuredVideo);
                        renderHomeOtherItems(otherItems);
                    });
            })
            .catch(error => {
                console.error('Error loading home tab preview:', error);
                document.getElementById('homePlayerPlaceholder').textContent = getLang('No videos found', 'Keine Videos gefunden');
                document.getElementById('homeOthersGrid').innerHTML = '';
            });
    }

function getMimeType(extension) {
    const mimeMap = {
        'mp4': 'video/mp4',
        'webm': 'video/webm',
        'mkv': 'video/x-matroska',
        'avi': 'video/x-msvideo',
        'mov': 'video/quicktime',
        'wmv': 'video/x-ms-wmv',
        'flv': 'video/x-flv',
        'mp3': 'audio/mpeg',
        'm4a': 'audio/mp4',
        'ogg': 'audio/ogg',
        'wav': 'audio/wav'
    };
    return mimeMap[extension.toLowerCase()] || 'video/mp4';
}

    function setupHomeMiniplayer(video) {
        const wrapper = document.getElementById('homePlayerWrapper');
        const placeholder = document.getElementById('homePlayerPlaceholder');
        const titleEl = document.getElementById('homeVideoTitle');
        const metaEl = document.getElementById('homeVideoMeta');
        const descEl = document.getElementById('homeVideoDescription');

        const videoPathWithoutExt = stripExtension(video.path);
        const extension = video.path.split('.').pop().toLowerCase();
        const mimeType = getMimeType(extension);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

        if (homeFluidPlayerInstance) {
            try {
                const oldVideo = document.getElementById('homeVideoPlayer');
                if (oldVideo) {
                    homeFluidPlayerInstance.destroy();
                    oldVideo.remove();
                }
            } catch (e) {}
            homeFluidPlayerInstance = null;
        }

        // Remove old overlay if reinitializing
        const oldOverlay = wrapper.querySelector('.home-logo-overlay');
        if (oldOverlay) oldOverlay.remove();

        // Add the logo overlay
        const logoOverlay = document.createElement('div');
        logoOverlay.className = 'home-logo-overlay';
        wrapper.appendChild(logoOverlay);

        titleEl.textContent = video.displayName;
        titleEl.onclick = () => { openVideo(encodeURIComponent(video.path)); };
        titleEl.oncontextmenu = (e) => {
            e.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        };
        titleEl.onmouseup = (e) => {
            if (e.button === 1) {
                e.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };

        // Load meta cache for instant display without network requests
        fetch(`/channel-home-meta-cache/${encodeURIComponent(channel)}.json`)
            .then(response => response.ok ? response.json() : {})
            .then(metaCache => {
                const meta = metaCache[video.path] || {};
                let formattedViewCount = meta.viewCount || '0';
                if (!isNaN(formattedViewCount) && formattedViewCount !== '0') {
                    formattedViewCount = parseInt(formattedViewCount).toLocaleString();
                }
                if (localStorage.getItem('language') === 'de') {
                    formattedViewCount = formattedViewCount.replace(/,/g, '.');
                }

                const viewsText = getLang('views', 'Aufrufe');
                const uploadedText = getLang('Uploaded on', 'Hochgeladen am');
                metaEl.textContent = `${formattedViewCount} ${viewsText} • ${uploadedText} ${video.fileDate}`;

                if (meta.displayName && meta.displayName.trim()) {
                    titleEl.textContent = meta.displayName.trim();
                }

                if (meta.descriptionHtml) {
                    descEl.innerHTML = meta.descriptionHtml;
                    descEl.classList.remove('no-desc');
                } else {
                    descEl.textContent = getLang('No description available for this video.', 'Diesem Video wurde keine Beschreibung hinzugefügt.');
                    descEl.classList.add('no-desc');
                }
                
                const readMoreBtn = document.getElementById('homeVideoDescriptionReadMore');
                const descBox = document.querySelector('.home-video-description-box');
                const descText = document.getElementById('homeVideoDescription');

                descText.style.webkitLineClamp = 'unset';
                const isOverflowing = descText.scrollHeight > descBox.clientHeight;
                descText.style.webkitLineClamp = '';

                if (isOverflowing) {
                    readMoreBtn.style.display = 'inline-block';
                    readMoreBtn.href = `video.html?src=${encodeURIComponent(video.path)}`;
                } else {
                    readMoreBtn.style.display = 'none';
                }
            })
            .catch(() => {
                metaEl.textContent = video.fileDate;
                descEl.textContent = getLang('No description available.', 'Keine Beschreibung verfügbar.');
                descEl.classList.add('no-desc');
                document.getElementById('homeVideoDescriptionReadMore').style.display = 'none';
            });

        const videoElement = document.createElement('video');
        videoElement.id = 'homeVideoPlayer';
        videoElement.preload = 'metadata';

        const sourceElement = document.createElement('source');
        sourceElement.src = `/videos/${encodeURIComponent(video.path)}`;
        sourceElement.type = mimeType;
        videoElement.appendChild(sourceElement);

        // Hide the overlay permanently once the video starts playing
        videoElement.addEventListener('play', () => {
            logoOverlay.style.opacity = '0';
            // Remove the event listener and the element itself after fading out
            setTimeout(() => {
                logoOverlay.remove();
            }, 150);
        }, { once: true });

        placeholder.remove();
        wrapper.appendChild(videoElement);

        function initPlayer() {
            const playerSettings = JSON.parse(localStorage.getItem('videoPlayer') || '{}');
            const selectedPlayer = playerSettings.player || 'lyt';

            if (selectedPlayer === 'lyt' && typeof LYTPlayer === 'function') {
                homeFluidPlayerInstance = LYTPlayer('homeVideoPlayer', {
                    "layoutControls": {
                        "title": video.displayName,
                        "controlBar": {
                            "autoHideTimeout": 3,
                            "animated": true,
                            "autoHide": true
                        },
                        "htmlOnPauseBlock": { "html": null, "height": null, "width": null },
                        "autoPlay": false,
                        "mute": false,
                        "allowTheatre": false,
                        "playPauseAnimation": true,
                        "playbackRateEnabled": true,
                        "allowDownload": false,
                        "playButtonShowing": false,
                        "fillToContainer": true,
                        "posterImage": thumbnailSrc,
                        "posterImageSize": "cover"
                    },
                    "vastOptions": {
                        "adList": [],
                        "adCTAText": false,
                        "adCTATextPosition": ""
                    }
                });
            } else if (selectedPlayer !== 'lyt' && typeof fluidPlayer === 'function') {
                homeFluidPlayerInstance = fluidPlayer('homeVideoPlayer', {
                    "layoutControls": {
                        "title": video.displayName,
                        "controlBar": {
                            "autoHideTimeout": 3,
                            "animated": true,
                            "autoHide": true
                        },
                        "htmlOnPauseBlock": { "html": null, "height": null, "width": null },
                        "autoPlay": false,
                        "mute": false,
                        "allowTheatre": false,
                        "playPauseAnimation": true,
                        "playbackRateEnabled": true,
                        "allowDownload": false,
                        "playButtonShowing": false,
                        "fillToContainer": true,
                        "posterImage": thumbnailSrc,
                        "posterImageSize": "cover"
                    },
                    "vastOptions": {
                        "adList": [],
                        "adCTAText": false,
                        "adCTATextPosition": ""
                    }
                });
            } else {
                setTimeout(initPlayer, 200);
            }
        }
        initPlayer();

    function renderHomeOtherItems(items) {
        const grid = document.getElementById('homeOthersGrid');
        grid.innerHTML = '';

        if (items.length === 0) {
            grid.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">' + getLang('No other videos', 'Keine weiteren Videos') + '</p>';
            return;
        }

        const fragment = document.createDocumentFragment();
        const isClassic = document.body.classList.contains('classic-channel');

        // 1. Separate videos and playlists
        const videoItems = items.filter(i => i.type === 'video');
        const playlistItems = items.filter(i => i.type === 'playlist');

        // 2. Sort all available videos by date (newest first)
        const sortedVideos = [...videoItems].sort((a, b) => {
            const dateA = a.fileDate.replace(/\r?\n$/, '').trim();
            const dateB = b.fileDate.replace(/\r?\n$/, '').trim();
            const parseDate = (str) => {
                if (!str) return 0;
                const p = str.split('.');
                if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]).getTime();
                return 0;
            };
            return parseDate(dateB) - parseDate(dateA);
        });

        // 3. Take the most recent 5 videos (from the remaining pool after featured removal)
        const recentFive = sortedVideos.slice(0, 5);

        // 4. Gather the remaining videos and shuffle them
        const otherVideos = sortedVideos.slice(5);
        for (let i = otherVideos.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [otherVideos[i], otherVideos[j]] = [otherVideos[j], otherVideos[i]];
        }

        // 5. Construct rows
        const rows = [];
        rows.push(recentFive);

        let plIndex = 0;
        while (plIndex < playlistItems.length) {
            const rowPlaylists = playlistItems.slice(plIndex, plIndex + 2);
            rows.push(rowPlaylists);
            plIndex += 2;
        }

        for (let i = 0; i < otherVideos.length; i += 5) {
            rows.push(otherVideos.slice(i, i + 5));
        }

        // 6. Fetch meta cache once for all items
        fetch(`/channel-home-meta-cache/${encodeURIComponent(channel)}.json`)
            .then(response => response.ok ? response.json() : {})
            .then(metaCache => {
                const uncachedPlaylists = rows.flat().filter(i => i && i.type === 'playlist' && (!metaCache[i.path] || !metaCache[i.path].videoCount || !metaCache[i.path].firstVideoName));

                const playlistFetchPromise = uncachedPlaylists.length > 0
                    ? fetch(`/channel-playlists/${encodeURIComponent(channel)}`).then(r => r.ok ? r.json() : []).catch(() => [])
                    : Promise.resolve([]);

                playlistFetchPromise.then(playlistsApiData => {
                    const apiLookup = {};
                    playlistsApiData.forEach(p => {
                        apiLookup[p.path] = {
                            videoCount: p.videoCount || 0,
                            thumbnail: p.thumbnail || null
                        };
                    });

                    rows.forEach(rowItems => {
                        const rowWrapper = document.createElement('div');
                        rowWrapper.className = 'home-row-wrapper';

                        rowItems.forEach(item => {
                            if (item.type === 'playlist') {
                                const playlistElement = document.createElement('div');
                                playlistElement.className = 'playlist-item';

                                const playlistUrl = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(item.path)}`;

                                const meta = (metaCache[item.path] && metaCache[item.path].videoCount)
                                    ? metaCache[item.path]
                                    : (apiLookup[item.path] || {});

                                const hasValidThumbnail = meta.thumbnail && meta.thumbnail.trim() !== '';
                                const thumbnailStyle = hasValidThumbnail
                                    ? `background-image: url('${meta.thumbnail.replace(/'/g, "\\'")}');`
                                    : 'background-color: #333;';

                                const videosText = getLang('videos', 'Videos');
                                let overlayHtml;
                                if (isClassic) {
                                    overlayHtml = `
                                        <div class="classic-overlay-box">
                                            <span class="classic-overlay-count">${meta.videoCount || 0}</span>
                                            <span class="classic-overlay-label">VIDEOS</span>
                                            <img src="LocalYT-Rev-Files/classic_playlist_icon.svg" class="classic-overlay-icon" alt="">
                                        </div>
                                    `;
                                } else {
                                    overlayHtml = `${meta.videoCount || 0} ${videosText}`;
                                }

                                const firstVideoName = (meta.firstVideoName && meta.firstVideoName.trim()) ? meta.firstVideoName.trim() : '';
                                const secondVideoName = (meta.secondVideoName && meta.secondVideoName.trim()) ? meta.secondVideoName.trim() : '';
                                const extraInfoHtml = firstVideoName
                                    ? `<div class="playlist-first-video-name">${firstVideoName}</div>` +
                                      (secondVideoName ? `<div class="playlist-second-video-name">${secondVideoName}</div>` : '')
                                    : '';

                                playlistElement.innerHTML = `
                                    <div class="playlist-thumbnail" style="${thumbnailStyle}">
                                        <div class="playlist-overlay">${overlayHtml}</div>
                                    </div>
                                    <div class="playlist-info-side">
                                        <div class="playlist-title">${item.displayName}</div>
                                        <div class="playlist-channel-name">${channel}</div>
                                        ${extraInfoHtml}
                                    </div>
                                    <div class="playlist-video-count" style="display: none;"></div>
                                `;

                                playlistElement.addEventListener('click', () => { window.location.href = playlistUrl; });
                                playlistElement.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(playlistUrl, '_blank'); });
                                playlistElement.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });
                                playlistElement.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });

                                rowWrapper.appendChild(playlistElement);
                            } else {
                                const videoElement = document.createElement('div');
                                videoElement.className = 'video-item';
                                const videoPathWithoutExt = stripExtension(item.path);
                                const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

                                const meta = metaCache[item.path] || {};
                                let formattedViewCount = meta.viewCount || '0';
                                if (!isNaN(formattedViewCount) && formattedViewCount !== '0') {
                                    formattedViewCount = parseInt(formattedViewCount).toLocaleString();
                                }
                                if (localStorage.getItem('language') === 'de') {
                                    formattedViewCount = formattedViewCount.replace(/,/g, '.');
                                }
                                const viewsText = getLang('views', 'Aufrufe');
                                const uploadedText = getLang('Uploaded on', 'Hochgeladen am');
                                const descText = `${formattedViewCount} ${viewsText} • ${uploadedText} ${item.fileDate}`;
                                const videoLength = meta.videoLength || '';

                                videoElement.innerHTML = `
                                    <div class="thumbnail-container">
                                        <img src="${thumbnailSrc}" alt="${item.displayName}" class="video-thumbnail" loading="lazy">
                                        <div class="video-length">${videoLength}</div>
                                    </div>
                                    <div class="video-title" onclick="openVideo('${encodeURIComponent(item.path)}')">${item.displayName}</div>
                                    <div class="video-description">${descText}</div>
                                `;

                                const videoThumb = videoElement.querySelector('.video-thumbnail');
                                const videoLink = videoElement.querySelector('.video-title');

                                videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(item.path)));
                                videoThumb.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); });
                                videoLink.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); });

                                const middleHandler = (e) => { if (e.button === 1) { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); } };
                                videoThumb.addEventListener('mouseup', middleHandler);
                                videoThumb.addEventListener('auxclick', middleHandler);
                                videoLink.addEventListener('mouseup', middleHandler);
                                videoLink.addEventListener('auxclick', middleHandler);

                                rowWrapper.appendChild(videoElement);
                            }
                        });

                        fragment.appendChild(rowWrapper);
                    });

                    grid.appendChild(fragment);
                });
            })
            .catch(() => {
                rows.forEach(rowItems => {
                    const rowWrapper = document.createElement('div');
                    rowWrapper.className = 'home-row-wrapper';

                    rowItems.forEach(item => {
                        if (item.type === 'playlist') {
                            const playlistElement = document.createElement('div');
                            playlistElement.className = 'playlist-item';
                            const playlistUrl = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(item.path)}`;
                            const videosText = getLang('videos', 'Videos');
                            let overlayHtml = isClassic
                                ? `<div class="classic-overlay-box"><span class="classic-overlay-count">0</span><span class="classic-overlay-label">VIDEOS</span><img src="LocalYT-Rev-Files/classic_playlist_icon.svg" class="classic-overlay-icon" alt=""></div>`
                                : `0 ${videosText}`;

                            playlistElement.innerHTML = `
                                <div class="playlist-thumbnail" style="background-color: #333;"><div class="playlist-overlay">${overlayHtml}</div></div>
                                <div class="playlist-info-side">
                                    <div class="playlist-title">${item.displayName}</div>
                                    <div class="playlist-channel-name">${channel}</div>
                                </div>
                                <div class="playlist-video-count" style="display: none;"></div>
                            `;
                            playlistElement.addEventListener('click', () => { window.location.href = playlistUrl; });
                            playlistElement.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(playlistUrl, '_blank'); });
                            playlistElement.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });
                            playlistElement.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });
                            rowWrapper.appendChild(playlistElement);
                        } else {
                            const videoElement = document.createElement('div');
                            videoElement.className = 'video-item';
                            const videoPathWithoutExt = stripExtension(item.path);
                            videoElement.innerHTML = `
                                <div class="thumbnail-container"><img src="/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg" alt="${item.displayName}" class="video-thumbnail" loading="lazy"><div class="video-length"></div></div>
                                <div class="video-title" onclick="openVideo('${encodeURIComponent(item.path)}')">${item.displayName}</div>
                                <div class="video-description">${item.fileDate}</div>
                            `;
                            const videoThumb = videoElement.querySelector('.video-thumbnail');
                            const videoLink = videoElement.querySelector('.video-title');
                            videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(item.path)));
                            videoThumb.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); });
                            videoLink.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); });
                            const middleHandler = (e) => { if (e.button === 1) { e.preventDefault(); window.open(`video.html?src=${encodeURIComponent(item.path)}`, '_blank'); } };
                            videoThumb.addEventListener('mouseup', middleHandler);
                            videoThumb.addEventListener('auxclick', middleHandler);
                            videoLink.addEventListener('mouseup', middleHandler);
                            videoLink.addEventListener('auxclick', middleHandler);
                            rowWrapper.appendChild(videoElement);
                        }
                    });

                    fragment.appendChild(rowWrapper);
                });
                grid.appendChild(fragment);
            });
    }

    function parseEuropeanDate(dateString) {
        if (!dateString || dateString === 'Unknown date') return new Date(0);
        const parts = dateString.replace(/\r?\n$/, '').trim().split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                return new Date(year, month, day);
            }
        }
        try {
            const d = new Date(dateString.trim());
            return isNaN(d.getTime()) ? new Date(0) : d;
        } catch(e) {
            return new Date(0);
        }
    }

    function stripExtension(filename) {
        return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
    }

    function sortVideosArray() {
        switch(currentSortMode) {
            case 'newest':
                currentVideos.sort((a, b) => {
                    try {
                        const dateA = parseEuropeanDate(a.fileDate).getTime();
                        const dateB = parseEuropeanDate(b.fileDate).getTime();
                        return dateB - dateA;
                    } catch (e) {
                        return 0;
                    }
                });
                break;
            case 'oldest':
                currentVideos.sort((a, b) => {
                    try {
                        const dateA = parseEuropeanDate(a.fileDate).getTime();
                        const dateB = parseEuropeanDate(b.fileDate).getTime();
                        return dateA - dateB;
                    } catch (e) {
                        return 0;
                    }
                });
                break;
            case 'popular':
                currentVideos.sort((a, b) => {
                    // FIX: Remove commas before parsing to handle numbers like "4,962"
                    const countA = parseInt(String(a.viewCount).replace(/,/g, '')) || 0;
                    const countB = parseInt(String(b.viewCount).replace(/,/g, '')) || 0;
                    return countB - countA;
                });
                break;
            case 'longest':
                currentVideos.sort((a, b) => {
                    const parseDuration = (str) => {
                        if (!str) return 0;
                        const parts = str.split(':').map(Number);
                        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
                        if (parts.length === 2) return parts[0] * 60 + parts[1];
                        return parts[0] || 0;
                    };
                    const lenA = parseDuration(a.videoLength);
                    const lenB = parseDuration(b.videoLength);
                    return lenB - lenA;
                });
                break;
        }
    }

    function resetAndRender() {
        renderedVideoCount = 0;
        videosContainer.innerHTML = '';
        hasMoreVideos = currentVideos.length > 0;

        loadingSpinner.classList.remove('visible');
        noMoreVideos.style.display = 'none';

        loadMoreVideos();
    }

    function createVideoElement(video) {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

        // 1. Build the description text instantly from the cached view count
        let descText = '';
        let formattedViewCount = video.viewCount || '0';
        if (!isNaN(formattedViewCount) && formattedViewCount !== '0') {
            formattedViewCount = parseInt(formattedViewCount).toLocaleString();
        }
        if (localStorage.getItem('language') === 'de') {
            formattedViewCount = formattedViewCount.replace(/,/g, '.');
        }
        
        const viewsText = getLang('views', 'Aufrufe');
        const uploadedText = getLang('Uploaded on', 'Hochgeladen am');
        
        // If we already have a valid date from the cache, use it immediately. Otherwise, show a temporary loading state.
        if (video.fileDate && video.fileDate !== 'Unknown date') {
            descText = `${formattedViewCount} ${viewsText} • ${uploadedText} ${video.fileDate}`;
        } else {
            descText = `${formattedViewCount} ${viewsText} • ${getLang('Loading date...', 'Lade Datum...')}`;
        }

        const videoLength = video.videoLength || '';

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length">${videoLength}</div>
            </div>
            <div class="video-title" onclick="openVideo('${encodeURIComponent(video.path)}')">${videoTitle}</div>
            <div class="video-description">${descText}</div>
        `;

        const videoLink = videoElement.querySelector('.video-title');
        const videoThumb = videoElement.querySelector('.video-thumbnail');
        const descriptionDiv = videoElement.querySelector('.video-description');

        // 2. If the date was unknown, fetch it from the server dynamically (just like the Search tab does)
        if (!video.fileDate || video.fileDate === 'Unknown date') {
            fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`)
                .then(r => r.ok ? r.text() : 'Unknown date')
                .then(fetchedDate => {
                    const trimmedDate = fetchedDate.trim();
                    if (trimmedDate && trimmedDate !== 'Unknown date') {
                        // Update the text with the real date
                        descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${uploadedText} ${trimmedDate}`;
                        // Update the array object so sorting/re-rendering doesn't trigger another fetch
                        video.fileDate = trimmedDate;
                    } else {
                        // If the server also doesn't know the date, hide the date part cleanly
                        descriptionDiv.textContent = `${formattedViewCount} ${viewsText}`;
                    }
                })
                .catch(() => {
                    // On network error, fallback to just showing the view count
                    descriptionDiv.textContent = `${formattedViewCount} ${viewsText}`;
                });
        }

        videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));

        videoThumb.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });
        videoLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        const openInNewTabHandler = (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };

        videoThumb.addEventListener('mouseup', openInNewTabHandler);
        videoLink.addEventListener('mouseup', openInNewTabHandler);
        videoThumb.addEventListener('auxclick', openInNewTabHandler);
        videoLink.addEventListener('auxclick', openInNewTabHandler);

        return videoElement;
    }

    function loadMoreVideos() {
        if (isLoadingMore || !hasMoreVideos) return;

        const startIndex = renderedVideoCount;
        const endIndex = Math.min(startIndex + VIDEOS_PER_PAGE, currentVideos.length);

        if (startIndex >= currentVideos.length) {
            hasMoreVideos = false;
            loadingSpinner.classList.remove('visible');
            noMoreVideos.style.display = 'block';
            return;
        }

        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        requestAnimationFrame(() => {
            const fragment = document.createDocumentFragment();

            for (let i = startIndex; i < endIndex; i++) {
                const video = currentVideos[i];
                const videoElement = createVideoElement(video);
                fragment.appendChild(videoElement);
            }

            videosContainer.appendChild(fragment);
            renderedVideoCount = endIndex;
            isLoadingMore = false;

            if (renderedVideoCount >= currentVideos.length) {
                hasMoreVideos = false;
                loadingSpinner.classList.remove('visible');
                noMoreVideos.style.display = 'block';
            } else {
                loadingSpinner.classList.remove('visible');
            }
        });
    }

    function checkAndLoadMore() {
        if (!hasMoreVideos || isLoadingMore) return;
        const trigger = loadMoreTrigger;
        if (!trigger) return;
        const rect = trigger.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        if (rect.top <= windowHeight + 300) {
            loadMoreVideos();
        }
    }

    function setupIntersectionObserver() {
        if (window.IntersectionObserver) {
            intersectionObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && hasMoreVideos && !isLoadingMore) {
                            loadMoreVideos();
                        }
                    });
                },
                { root: null, rootMargin: '300px', threshold: 0 }
            );
            if (loadMoreTrigger) {
                intersectionObserver.observe(loadMoreTrigger);
            }
        }
    }

    function renderPlaylistsFast(playlists) {
        playlistsContainer.innerHTML = '';

        if (playlists.length === 0) {
            playlistsContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">No playlists found</p>';
            return;
        }

        const videosText = getLang('videos', 'Videos');
        const isClassic = document.body.classList.contains('classic-channel');

        playlists.forEach(playlist => {
            const playlistElement = document.createElement('div');
            playlistElement.className = 'playlist-item';

            const playlistUrl = `playlist.html?channel=${encodeURIComponent(channel)}&playlist=${encodeURIComponent(playlist.path)}`;

            let overlayHtml;
            if (isClassic) {
                overlayHtml = `
                    <div class="classic-overlay-box">
                        <span class="classic-overlay-count">${playlist.videoCount || 0}</span>
                        <span class="classic-overlay-label">VIDEOS</span>
                        <img src="LocalYT-Rev-Files/classic_playlist_icon.svg" class="classic-overlay-icon" alt="">
                    </div>
                `;
            } else {
                overlayHtml = `${playlist.videoCount || 0} ${videosText}`;
            }

            const displayTitle = playlist.displayName || playlist.name || playlist.title || playlist.path;

            // Create the thumbnail div with a default grey background
            playlistElement.innerHTML = `
                <div class="playlist-thumbnail" style="background-color: #333;"><div class="playlist-overlay">${overlayHtml}</div></div>
                <div class="playlist-title">${displayTitle}</div>
                <div class="playlist-video-count">${playlist.videoCount || 0} ${videosText}</div>
            `;

            const thumbnailDiv = playlistElement.querySelector('.playlist-thumbnail');
            const mainThumbnailSrc = (playlist.thumbnail && playlist.thumbnail.trim() !== '') ? playlist.thumbnail : null;

            if (mainThumbnailSrc) {
                // Test main thumbnail to see if it actually exists
                const testImg = new Image();
                testImg.onload = function() {
                    thumbnailDiv.style.backgroundImage = `url('${testImg.src.replace(/'/g, "\\'")}')`;
                };
                testImg.onerror = function() {
                    // Main thumbnail 404'd, fetch real first video from playlist exactly like playlist.html
                    fetchRealFirstVideoThumbnail(channel, playlist.path, thumbnailDiv);
                };
                
                // Using the URL constructor fixes the NS_BINDING_ABORTED errors caused by unencoded spaces
                try {
                    testImg.src = new URL(mainThumbnailSrc, window.location.origin).href;
                } catch(e) {
                    fetchRealFirstVideoThumbnail(channel, playlist.path, thumbnailDiv);
                }
            } else {
                // No main thumbnail provided, fetch real first video directly
                fetchRealFirstVideoThumbnail(channel, playlist.path, thumbnailDiv);
            }

            playlistElement.addEventListener('click', () => { window.location.href = playlistUrl; });
            playlistElement.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(playlistUrl, '_blank'); });
            playlistElement.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });
            playlistElement.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.open(playlistUrl, '_blank'); } });

            playlistsContainer.appendChild(playlistElement);
        });
    }

    function fetchRealFirstVideoThumbnail(channelName, playlistPath, thumbnailDiv) {
        fetch(`/playlist-videos/${encodeURIComponent(channelName)}/${encodeURIComponent(playlistPath)}`)
            .then(response => response.json())
            .then(videos => {
                if (videos && videos.length > 0 && videos[0].path) {
                    const pathWithoutExt = videos[0].path.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
                    const fallbackSrc = `/thumbnails/${encodeURIComponent(pathWithoutExt)}.jpg`;
                    thumbnailDiv.style.backgroundImage = `url('${fallbackSrc}')`;
                } else {
                    thumbnailDiv.style.backgroundColor = '#333';
                }
            })
            .catch(() => {
                thumbnailDiv.style.backgroundColor = '#333';
            });
    }

        // Set text content
        textDiv.textContent = post.content || '';
        const urlRegex = /(https?:\/\/[^\s<]+)/g;
        textDiv.innerHTML = textDiv.innerHTML.replace(urlRegex, function(url) {
            return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' + url + '</a>';
        });

        // Handle images - only create img elements if user hasn't enabled "hide images"
        if (post.images && post.images.length > 0 && !shouldHidePostImages) {
            const imagesWrapper = document.createElement('div');
            imagesWrapper.className = 'post-images-wrapper';
            imagesWrapper.style.display = 'none';

            let validImageCount = 0;
            const validImages = [];

            post.images.forEach((img, index) => {
                const imgEl = document.createElement('img');
                imgEl.className = `post-image${index === 0 ? ' active' : ''}`;
                imgEl.src = `/channelposts/${encodeURIComponent(channel)}/${encodeURIComponent(img.file_name)}`;
                imgEl.alt = `Post image ${index + 1}`;
                
                imgEl.onload = () => {
                    validImageCount++;
                    if (validImageCount === 1) {
                        imagesWrapper.style.display = '';
                    }
                };
                
                imagesWrapper.appendChild(imgEl);
            });

            // Carousel controls if multiple images exist
            if (post.images.length > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-btn carousel-prev';
                prevBtn.innerHTML = '&#10094;';
                
                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-btn carousel-next';
                nextBtn.innerHTML = '&#10095;';

                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'carousel-dots';
                
                post.images.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = `carousel-dot${index === 0 ? ' active' : ''}`;
                    dot.dataset.index = index;
                    dotsContainer.appendChild(dot);
                });

                imagesWrapper.appendChild(prevBtn);
                imagesWrapper.appendChild(nextBtn);
                imagesWrapper.appendChild(dotsContainer);

                let currentIndex = 0;
                const allImages = imagesWrapper.querySelectorAll('.post-image');
                const allDots = dotsContainer.querySelectorAll('.carousel-dot');

                const showSlide = (idx) => {
                    currentIndex = idx;
                    allImages.forEach((img, i) => {
                        img.classList.toggle('active', i === currentIndex);
                    });
                    allDots.forEach((dot, i) => {
                        dot.classList.toggle('active', i === currentIndex);
                    });
                };

                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newIndex = (currentIndex - 1 + post.images.length) % post.images.length;
                    showSlide(newIndex);
                });

                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newIndex = (currentIndex + 1) % post.images.length;
                    showSlide(newIndex);
                });

                dotsContainer.addEventListener('click', (e) => {
                    if (e.target.classList.contains('carousel-dot')) {
                        showSlide(parseInt(e.target.dataset.index));
                    }
                });
            }

            bodyDiv.appendChild(imagesWrapper);
        }

        fragment.appendChild(postElement);
    });

        postsContainer.appendChild(fragment);

    function formatJoinDate(date) {
        const monthsEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthsDe = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

        const lang = localStorage.getItem('language');
        const months = lang === 'de' ? monthsDe : monthsEn;

        const day = date.getDate();
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        return `${month} ${day}, ${year}`;
    }

    function lazyLoadVideosTab() {
        if (loadedTabs.has('videos')) return;
        loadedTabs.add('videos');
        videosContainer.innerHTML = '<div class="loading-spinner visible">' + getLang('Loading videos...', 'Lade Videos...') + '</div>';

        // Fetch the channel's meta cache AND the home previews (which contain the true dates)
        Promise.all([
            fetch(`/channel-home-meta-cache/${encodeURIComponent(channel)}.json`).then(r => r.ok ? r.json() : {}),
            fetch(`/channel-home-previews/${encodeURIComponent(channel)}.json`).then(r => r.ok ? r.json() : [])
        ])
        .then(([metaCache, previews]) => {
            // Build a date map from the previews (which have reliably formatted dates)
            const previewDateMap = {};
            previews.forEach(p => {
                if (p.type === 'video') {
                    previewDateMap[p.path] = p.fileDate ? p.fileDate.replace(/\r?\n$/, '').trim() : '';
                }
            });

            // Build the video list from the caches
            currentVideos = Object.keys(metaCache).map(path => {
                const meta = metaCache[path];
                return {
                    path: path,
                    type: meta.type || 'video',
                    displayName: meta.displayName || path.split('/').pop(),
                    // Use the preview dates first, fallback to meta cache, then 'Unknown date'
                    fileDate: previewDateMap[path] || meta.fileDate || 'Unknown date',
                    viewCount: meta.viewCount || '0',
                    videoLength: meta.videoLength || ''
                };
            }).filter(video => video.type !== 'playlist' && video.videoLength !== '');

            hasMoreVideos = currentVideos.length > 0;
            currentSortMode = 'newest';
            sortVideosArray();
            videosContainer.innerHTML = '';

            // Render initial batch
            loadMoreVideos();
            setupIntersectionObserver();

            window.addEventListener('scroll', () => { if (!intersectionObserver) checkAndLoadMore(); });
            window.addEventListener('resize', () => { if (!intersectionObserver) checkAndLoadMore(); });
        })
        .catch(error => {
            console.error("Error lazy-loading videos via cache:", error);
            videosContainer.innerHTML = '<p style="color: #888; text-align: center; width: 100%;">Failed to load videos.</p>';
        });
    }

    function updateHeaderStats(subs, vids) {
        let text = channel;
        let parts = [];

        if (subs !== null) parts.push(`${localStorage.getItem('language') === 'de' ? subs.replace(/,/g, '.') : subs} ${getLang('subscribers', 'Abonnenten')}`);
        if (vids !== null) parts.push(`${vids} ${getLang('videos', 'Videos')}`);

        if (parts.length > 0) {
            text += `<span class="video-count">${parts.join(' • ')}</span>`;
        }

        channelName.innerHTML = text;

        if (subs !== null) {
            document.getElementById('subscriberCount').textContent = localStorage.getItem('language') === 'de' ? subs.replace(/,/g, '.') : subs;
        }
    }

    loadHeaderStats();

    // --- MUST BE DECLARED BEFORE INITIAL TAB SETUP ---
    const channelSearchInput = document.getElementById('channelSearchInput');
    const channelSearchResults = document.getElementById('channelSearchResults');
    let channelSearchTimeout = null;
    // -------------------------------------------------

    if (initialTab !== 'home') {
        document.querySelector('.tab[data-tab="home"]').classList.remove('active');
        document.getElementById('homeTab').classList.remove('active');
        const targetTab = document.querySelector(`.tab[data-tab="${initialTab}"]`);
        const targetContent = document.getElementById(`${initialTab}Tab`);
        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');
        loadTabContent(initialTab);

        // Restore channel search query if present on initial load
        if (initialTab === 'search') {
            const searchBar = document.querySelector('.tab-search-bar');
            if (!searchBar.classList.contains('active')) {
                searchBar.classList.add('active');
            }
            const initialQuery = new URLSearchParams(window.location.search).get('q') || '';
            if (initialQuery) {
                channelSearchInput.value = initialQuery;
                // Directly execute the search instead of dispatching an event
                executeChannelSearch(initialQuery);
            }
        }
    } else {
        loadedTabs.add('home');
        loadHomeTab();
    }

    history.replaceState({ tab: initialTab, query: initialTab === 'search' ? (new URLSearchParams(window.location.search).get('q') || '') : '' }, '', buildChannelUrl(channel, initialTab) + (initialTab === 'search' && new URLSearchParams(window.location.search).get('q') ? '&q=' + encodeURIComponent(new URLSearchParams(window.location.search).get('q')) : ''));

    function executeChannelSearch(query) {
        if (!query) {
            switchTab('search');
            channelSearchResults.innerHTML = '<div class="channel-search-no-results">' + getLang('Type something to search.', 'Bitte etwas eingeben zum Suchen.') + '</div>';
            return;
        }

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        document.querySelector('.tab[data-tab="search"]').classList.add('active');
        document.getElementById('searchTab').classList.add('active');
        document.querySelector('.tab-search-bar').classList.add('active');
        
        const searchUrl = buildChannelUrl(channel, 'search') + '&q=' + encodeURIComponent(query);
        history.pushState({ tab: 'search', query: query }, '', searchUrl);
        loadedTabs.add('search');

        channelSearchResults.innerHTML = '<div class="tab-loading-placeholder">' + getLang('Searching...', 'Suche...') + '</div>';

        fetch('/search-index')
            .then(response => response.json())
            .then(data => {
                const allVideos = data.videos || [];
                
                const results = allVideos.filter(v => 
                    v.path.startsWith(channel + '/') && 
                    v.displayName.toLowerCase().includes(query)
                );

                channelSearchResults.innerHTML = '';

                if (results.length === 0) {
                    channelSearchResults.innerHTML = '<div class="channel-search-no-results">' + getLang('No videos found.', 'Keine Videos gefunden.') + '</div>';
                    return;
                }

                const fragment = document.createDocumentFragment();
                results.forEach(video => {
                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-item';
                    const videoPathWithoutExt = stripExtension(video.path);
                    const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;

                    videoElement.innerHTML = `
                        <div class="thumbnail-container">
                            <img src="${thumbnailSrc}" alt="${video.displayName}" class="video-thumbnail" loading="lazy">
                            <div class="video-length"></div>
                        </div>
                        <div class="video-title" onclick="openVideo('${encodeURIComponent(video.path)}')">${video.displayName}</div>
                        <div class="video-description">${getLang('Loading views...', 'Aufrufe werden geladen...')}</div>
                    `;

                    const descriptionDiv = videoElement.querySelector('.video-description');

                    Promise.all([
                        fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(r => r.ok ? r.text() : '0'),
                        fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoPathWithoutExt.split('/').pop())}.txt`).then(r => r.ok ? r.text() : ''),
                        fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(r => r.ok ? r.text() : 'Unknown date')
                    ])
                    .then(([viewCount, videoLength, fileDate]) => {
                        let formattedViewCount = viewCount;
                        if (!isNaN(viewCount) && viewCount !== '0') {
                            formattedViewCount = parseInt(viewCount).toLocaleString();
                        }

                        const lang = localStorage.getItem('language');
                        let viewsText = getLang('views', 'Aufrufe');
                        let uploadedText = getLang('Uploaded on', 'Hochgeladen am');

                        if (lang === 'de') {
                            formattedViewCount = formattedViewCount.replace(/,/g, '.');
                        }

                        let finalText = `${formattedViewCount} ${viewsText}`;
                        if (fileDate && fileDate.trim() !== 'Unknown date') {
                            finalText += ` • ${uploadedText} ${fileDate.trim()}`;
                        }
                        descriptionDiv.textContent = finalText;
                        if (videoLength.trim()) {
                            videoElement.querySelector('.video-length').textContent = videoLength.trim();
                        }
                    })
                    .catch(() => {
                        descriptionDiv.textContent = '';
                    });

                    const videoThumb = videoElement.querySelector('.video-thumbnail');
                    const videoLink = videoElement.querySelector('.video-title');

                    videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
                    videoThumb.addEventListener('contextmenu', (ev) => {
                        ev.preventDefault();
                        window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                    });
                    videoLink.addEventListener('contextmenu', (ev) => {
                        ev.preventDefault();
                        window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                    });

                    const middleHandler = (ev) => {
                        if (ev.button === 1) {
                            ev.preventDefault();
                            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
                        }
                    };
                    videoThumb.addEventListener('mouseup', middleHandler);
                    videoThumb.addEventListener('auxclick', middleHandler);
                    videoLink.addEventListener('mouseup', middleHandler);
                    videoLink.addEventListener('auxclick', middleHandler);

                    fragment.appendChild(videoElement);
                });

                channelSearchResults.appendChild(fragment);
            })
            .catch(error => {
                console.error('Search error:', error);
                channelSearchResults.innerHTML = '<div class="channel-search-no-results">Search failed.</div>';
            });
    }

    document.querySelector('.tab[data-tab="search"]').addEventListener('click', (e) => {
        e.stopPropagation();
        const searchBar = document.querySelector('.tab-search-bar');
        
        if (!searchBar.classList.contains('active')) {
            searchBar.classList.add('active');
            channelSearchInput.focus();
        } else {
            switchTab('search');
        }
    });

    document.addEventListener('click', (e) => {
        const searchBar = document.querySelector('.tab-search-bar');
        if (searchBar.classList.contains('active') && 
            !e.target.closest('.tab-search-container')) {
            
            searchBar.classList.remove('active');
            channelSearchInput.value = '';
        }
    });

    channelSearchInput.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    channelSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const query = channelSearchInput.value.trim().toLowerCase();
            executeChannelSearch(query);
        }
    });

    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`; else searchInput.focus();
    });
});

// Globally accessible functions
function openVideo(videoSrc) {
    window.location.href = `video.html?src=${videoSrc}`;
}

// ==============================
// Apply Title Color Scheme Preference
// ==============================
(function applyTitleColorScheme() {
    const setting = JSON.parse(localStorage.getItem('titleColorScheme') || '{}');
    
    function applyBlueText() {
        // Remove old style if exists
        const existingStyle = document.getElementById('title-color-scheme-blue');
        if (existingStyle) existingStyle.remove();
        
        if (setting.scheme === 'blue') {
            const style = document.createElement('style');
            style.id = 'title-color-scheme-blue';
            
            // Use ultra-high specificity to beat Light Mode's !important
            style.textContent = `
                /* High specificity selectors to override Light Mode */
                html body .video-title.blue-text,
                html body .playlist-title.blue-text,
                html body .home-video-title.blue-text,
                html body .post-author-name.blue-text {
                    color: #128ee9 !important;
                }
                
                html body .video-title.blue-text:hover,
                html body .playlist-title.blue-text:hover,
                html body .home-video-title.blue-text:hover,
                html body .post-author-name.blue-text:hover {
                    text-decoration: underline !important;
                    cursor: pointer !important;
                }
            `;
            
            // Append AFTER profile-pic.js styles so this loads later
            document.head.appendChild(style);
            
            // Add class to all existing elements
            document.querySelectorAll('.video-title, .playlist-title, .home-video-title, .post-author-name').forEach(el => {
                el.classList.add('blue-text');
            });
            
            // Watch for new elements added dynamically (infinite scroll, tab switching)
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) { // Element node
                            if (node.matches && (
                                node.matches('.video-title') || 
                                node.matches('.playlist-title') || 
                                node.matches('.home-video-title') || 
                                node.matches('.post-author-name')
                            )) {
                                node.classList.add('blue-text');
                            }
                            
                            // Also check children
                            if (node.querySelectorAll) {
                                node.querySelectorAll('.video-title, .playlist-title, .home-video-title, .post-author-name').forEach(el => {
                                    el.classList.add('blue-text');
                                });
                            }
                        }
                    });
                });
            });
            
            observer.observe(document.body, { childList: true, subtree: true });
        } else {
            // Remove classes if disabled
            document.querySelectorAll('.blue-text').forEach(el => el.classList.remove('blue-text'));
        }
    }

    // Apply immediately
    applyBlueText();
    
    // Re-apply after profile-pic.js loads (which applies Light Mode)
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(applyBlueText, 100));
    } else {
        setTimeout(applyBlueText, 100);
    }
    
    // Re-apply when settings change (for live switching without reload)
    window.addEventListener('storage', (e) => {
        if (e.key === 'titleColorScheme') {
            location.reload(); // Simplest way to ensure consistency
        }
    });
})();
