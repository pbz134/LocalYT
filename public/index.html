<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <link rel="stylesheet" href="skeleton.css">
<script>
// ==============================
// Apply Touch Device Detection
// ==============================
(function detectTouchDevice() {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.documentElement.className += ' touch-device';
    }
})();

// ==============================
// Apply Rounded Corners Preference
// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .video-item .thumbnail-container img.video-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();
</script>
    <style>
        .category-button {
            margin-right: 10px;
            padding: 5px 10px;
            background-color: #0f0f0f;
            border: 1px solid #f1f1f1;
            border-radius: 8px;
            cursor: pointer;
            color: #d2cfcf;
        }

        .category-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            margin-left: 250px;
            margin-top: 7px;
            position: absolute;
            left: 20px;
            top: 10px;
        }

        .container {
            background-color: var(--secondary-bg-color);
            padding-top: 95px;
            padding-bottom: 20px;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        #main {
            transition: margin-left .5s;
            padding: 16px;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: #111;
            color: white;
            border: none;
            margin-top: -2px;
        }

        .openbtn:hover {
            background-color: #444;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none;
        }

        .search-container:focus-within .search-suggestions {
            display: block;
        }

        /* Prevent Middle-Click Autoscroll (Pan Mode) */
        .video-item,
        .video-title,
        .thumbnail-container,
        .channel-name,
        .channel-pic-link,
        .category-button,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            -webkit-user-select: none;
            user-select: none;
        }

        .video-item .video-info,
        .video-item .video-details,
        .video-item .video-description,
        .video-item .video-length {
            cursor: default;
        }

        .video-item .thumbnail-container,
        .video-item .thumbnail-container img,
        .video-item .video-title,
        .video-item .channel-name,
        .video-item .channel-pic-link {
            cursor: pointer !important;
        }
        
        .video-title,
        .thumbnail-container,
        .channel-name,
        .channel-pic-link,
        .category-button,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            cursor: pointer;
        }

        /* --- Mobile Search Overlay --- */
        .mobile-search-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--main-bg-color);
            z-index: 1002;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
        }

        .touch-device .mobile-search-overlay {
            display: none; /* Hidden by default, shown via JS */
        }

        .mobile-search-overlay.active {
            display: flex !important;
        }

        .mobile-search-overlay .mobile-search-input {
            flex: 1;
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #444;
            background-color: var(--input-bg-color);
            color: #fff;
            outline: none;
        }

        .mobile-search-overlay .mobile-search-input:focus {
            border-color: #fff;
        }

        .mobile-search-overlay .mobile-search-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            padding: 0 15px;
            cursor: pointer;
        }
    </style>
</head>
<body class="index-page">
    <header class="top-bar">
        <!-- The ☰ toggle button is now injected automatically by sidebar.js -->
        <img src="LocalYT-Rev-Files/Logo.svg" alt="Logo" class="logo" id="mainLogo">
        <div class="category-container" id="categoryContainer"></div>
        
        <!-- Main Search Container -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    
    <!-- Mobile Search Overlay -->
    <div class="mobile-search-overlay" id="mobileSearchOverlay">
        <input type="text" class="mobile-search-input" id="mobileSearchInput" placeholder="">
        <button class="mobile-search-close" id="mobileSearchClose">&times;</button>
    </div>
    
    <!-- The sidebar div is now injected automatically by sidebar.js -->
    
    <div class="container" id="videoContainer"></div>
    
    <script>
// ======================================================================
// FIX: Prevent Middle-Click Autoscroll (Pan Mode)
// ======================================================================
document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        const target = e.target.closest(
            'a, ' + 
            '.video-item, ' + 
            '.video-title, ' + 
            '.thumbnail-container, ' + 
            '.channel-name, ' + 
            '.channel-pic-link, ' + 
            '.category-button, ' + 
            '.suggestion-item, ' +
            '#mainLogo'
        );
        
        if (target) {
            e.preventDefault();
            
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
        }
    }
}, true);

function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

    document.addEventListener('DOMContentLoaded', () => {
        const mainLogo = document.getElementById('mainLogo');
        
        if (mainLogo) {
            mainLogo.addEventListener('click', (event) => {
                if (event.button === 0) {
                    window.location.href = 'index.html';
                }
            });
            
            mainLogo.addEventListener('mouseup', (event) => {
                if (event.button === 1) {
                    event.preventDefault();
                    window.open('index.html', '_blank');
                }
            });
            
            mainLogo.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                window.open('index.html', '_blank');
            });
            
            mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
            mainLogo.style.cursor = 'pointer';
        }

        document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');

        // --- Mobile Search Logic ---
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const searchIcon = document.getElementById('searchIcon');
        const searchInput = document.getElementById('searchInput');
        const mobileOverlay = document.getElementById('mobileSearchOverlay');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        const mobileSearchClose = document.getElementById('mobileSearchClose');

        if (isTouchDevice && searchIcon && mobileOverlay && mobileSearchInput) {
            // Tapping the search icon opens the full-width overlay
            searchIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                mobileOverlay.classList.add('active');
                mobileSearchInput.placeholder = getLang('Search', 'Suchen');
                mobileSearchInput.focus();
            });

            // Close the overlay
            mobileSearchClose.addEventListener('click', () => {
                mobileOverlay.classList.remove('active');
                mobileSearchInput.value = '';
            });

            // Handle searching from the overlay
            mobileSearchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    const query = mobileSearchInput.value.trim();
                    if (query) {
                        window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                    }
                }
            });
        }
    });

// Read relative dates preference once at startup
let relativeDatesEnabled = JSON.parse(localStorage.getItem('relativeDates') || '{}').enabled !== false;

function getRelativeTime(dateStr, lang) {
    // Expects date string in DD.MM.YYYY format (e.g. "09.01.2025")
    const parts = dateStr.split('.');
    if (parts.length !== 3) return dateStr; // fallback to original if parsing fails

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    const date = new Date(year, month, day);
    const now = new Date();
    now.setHours(0, 0, 0, 0); // compare dates only

    const diffMs = now.getTime() - date.getTime();
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    if (diffDays < 0) return dateStr; // future date
    if (diffDays === 0) return lang === 'de' ? 'heute' : 'today';
    if (diffDays < 7) {
        return lang === 'de' ? `vor ${diffDays} ${diffDays === 1 ? 'Tag' : 'Tagen'}` : `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return lang === 'de' ? `vor ${weeks} ${weeks === 1 ? 'Woche' : 'Wochen'}` : `${weeks} week${weeks === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 365) {
        const months = Math.floor(diffDays / 30);
        return lang === 'de' ? `vor ${months} ${months === 1 ? 'Monat' : 'Monaten'}` : `${months} month${months === 1 ? '' : 's'} ago`;
    }
    const years = Math.floor(diffDays / 365);
    return lang === 'de' ? `vor ${years} ${years === 1 ? 'Jahr' : 'Jahren'}` : `${years} year${years === 1 ? '' : 's'} ago`;
}

function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

function getVideoExtension(path) {
    const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
    return match ? match[1] : 'mp4';
}

let currentPage = 1;
let recommendationsPage = 1;
const limit = 15;
let isLoading = false;
let hasMore = true;
let isUserLoggedIn = false;
let hasLoadedRecommendations = false;

function checkLoginStatus() {
    return fetch('/session-user')
        .then(response => {
            if (response.ok) {
                return response.json();
            }
            throw new Error('Not logged in');
        })
        .then(data => {
            if (data.username) {
                const loginButton = document.getElementById('loginButton');
                if (loginButton) loginButton.textContent = data.username;
                isUserLoggedIn = true;
                return true;
            }
            return false;
        })
        .catch(error => {
            console.log('User not logged in');
            return false;
        });
}

document.addEventListener('DOMContentLoaded', () => {
    checkLoginStatus().then(loggedIn => {
        fetch('/top-categories')
            .then(response => response.json())
            .then(categories => {
                const categoryContainer = document.getElementById('categoryContainer');
                const limitedCategories = categories.slice(0, 3);
                
                limitedCategories.forEach(category => {
                    const button = document.createElement('button');
                    button.className = 'category-button';
                    button.textContent = category;
                    button.onclick = () => {
                        window.location.href = `search.html?q=${encodeURIComponent(category)}`;
                    };
                    categoryContainer.appendChild(button);
                });
            })
            .catch(error => {
                console.log('No categories found');
            });

        if (loggedIn) {
            console.log('User logged in, loading recommendations');
            loadRecommendations();
        } else {
            console.log('Guest user, loading random videos');
            loadMoreVideos();
        }
    });

    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
            if (!isLoading && hasMore) {
                if (isUserLoggedIn && !hasLoadedRecommendations) {
                    loadMoreRecommendations();
                } else {
                    loadMoreVideos();
                }
            }
        }
    });
    
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
});

function loadRecommendations() {
    if (isLoading) return;
    isLoading = true;
    showSkeletons(limit);
    
    fetch('/recommendations?page=1&limit=' + limit)
        .then(response => {
            if (!response.ok) throw new Error('Failed to load recommendations');
            return response.json();
        })
        .then(data => {
            hideSkeletons();
            let videos = [];
            if (Array.isArray(data)) {
                videos = data;
                hasMore = false;
                hasLoadedRecommendations = true;
            } else if (data.videos) {
                videos = data.videos;
                hasMore = data.hasMore || false;
                if (hasMore) recommendationsPage = 2;
                else hasLoadedRecommendations = true;
            }
            
            if (videos.length > 0) {
                renderVideos(videos);
            } else {
                hasLoadedRecommendations = true;
                loadMoreVideos();
            }
            isLoading = false;
        })
        .catch(error => {
            console.error('Error loading recommendations:', error);
            hideSkeletons();
            isLoading = false;
            hasLoadedRecommendations = true;
            loadMoreVideos();
        });
}

function loadMoreRecommendations() {
    if (isLoading || !hasMore) return;
    isLoading = true;
    showSkeletons(limit);
    
    fetch('/recommendations?page=' + recommendationsPage + '&limit=' + limit)
        .then(response => {
            if (!response.ok) throw new Error('Failed to load more recommendations');
            return response.json();
        })
        .then(data => {
            hideSkeletons();
            let newVideos = [];
            if (Array.isArray(data)) {
                newVideos = data;
                hasMore = false;
                hasLoadedRecommendations = true;
            } else if (data.videos) {
                newVideos = data.videos;
                hasMore = data.hasMore;
                if (hasMore) recommendationsPage++;
                else hasLoadedRecommendations = true;
            }
            
            if (newVideos.length > 0) renderVideos(newVideos);
            else hasLoadedRecommendations = true;
            
            isLoading = false;
        })
        .catch(error => {
            console.error('Error loading more recommendations:', error);
            hideSkeletons();
            isLoading = false;
            hasLoadedRecommendations = true;
        });
}

function loadMoreVideos() {
    if (isLoading || !hasMore) return;
    isLoading = true;
    showSkeletons(limit);

    fetch(`/videos?page=${currentPage}&limit=${limit}`)
        .then(response => response.json())
        .then(data => {
            hideSkeletons();
            const videos = data.videos || [];
            if (videos.length > 0) renderVideos(videos);
            isLoading = false;
            
            if (videos.length < limit) hasMore = false;
            else currentPage++;
        })
        .catch(error => {
            console.error('Error fetching videos:', error);
            hideSkeletons();
            isLoading = false;
        });
}

function renderVideos(videos) {
    const container = document.getElementById('videoContainer');
    
    videos.forEach(video => {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        const channel = video.path.split('/')[0];
        const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-info">
                <div class="channel-pic-link" style="cursor: pointer;">
                    <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy">
                </div>
                <div class="video-details">
                    <div class="video-title" onclick="window.location.href='video.html?src=${encodeURIComponent(video.path)}'">${videoTitle}</div>
                    <div class="channel-name" onclick="window.location.href='channel.html?channel=${encodeURIComponent(channel)}'">${channel}</div>
                    <div class="video-description">${localStorage.getItem('language') === 'de' ? video.viewCount.replace(/,/g, '.') : video.viewCount} ${getLang('views', 'Aufrufe')} • ${relativeDatesEnabled ? getRelativeTime(video.fileDate, localStorage.getItem('language')) : video.fileDate}</div>
                </div>
            </div>
        `;
        container.appendChild(videoElement);

        const thumbnailContainer = videoElement.querySelector('.thumbnail-container');
        thumbnailContainer.addEventListener('click', () => {
            window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
        });
        setupVideoLinkEvents(thumbnailContainer, video.path);

        setupVideoLinkEvents(videoElement.querySelector('.video-title'), video.path);
        setupChannelLinkEvents(videoElement.querySelector('.channel-pic-link'), channel);
        setupChannelLinkEvents(videoElement.querySelector('.channel-name'), channel);

        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${channel}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.text())
            .then(length => {
                videoElement.querySelector('.video-length').textContent = length;
            })
            .catch(error => {
                console.error('Error fetching video length:', error);
            });
    });
}

function setupVideoLinkEvents(element, path) {
    element.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
    });

    element.addEventListener('mouseup', (event) => {
        if (event.button === 1) {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
        }
    });
}

function setupChannelLinkEvents(element, channel) {
    element.addEventListener('click', () => {
        window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
    });

    element.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
    });

    element.addEventListener('mouseup', (event) => {
        if (event.button === 1) {
            event.preventDefault();
            window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
        }
    });
}
    </script>
    <script>
// ==============================
// Apply Title Color Scheme Preference
// ==============================
(function applyTitleColorScheme() {
    const setting = JSON.parse(localStorage.getItem('titleColorScheme') || '{}');
    if (setting.scheme === 'blue') {
        const style = document.createElement('style');
        style.id = 'title-color-scheme-blue';
        style.textContent = `
            .video-title {
                color: #128ee9 !important;
            }
            .video-title:hover {
                text-decoration: underline !important;
                cursor: pointer !important;
            }
        `;
        document.head.appendChild(style);
    } else {
        const existingStyle = document.getElementById('title-color-scheme-blue');
        if (existingStyle) existingStyle.remove();
    }
})();
    </script>
    <script src="search-suggestions.js"></script>
    <script src="profile-pic.js"></script>
    <script src="sidebar.js"></script>
    <script src="thumbnail-context-menu.js"></script>
    <script src="skeleton-loader.js"></script>
    <script>
    // ============================================================
    // Hide category buttons when Channel Page Style is "Classic"
    // ============================================================
    (function applyChannelPageStyleToCategories() {
        const setting = JSON.parse(localStorage.getItem('channelPageStyle') || '{}');
        if (setting.style === 'legacy') {
            const container = document.getElementById('categoryContainer');
            if (container) {
                container.style.display = 'none';
            }
        }
    })();
    </script>
</body>
</html>
