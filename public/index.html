<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .category-button {
            margin-right: 10px;
            padding: 5px 10px;
            background-color: #0f0f0f;
            border: 1px solid #f1f1f1;
            border-radius: 10px;
            cursor: pointer;
            color: #d2cfcf;
        }

        .category-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            margin-left: 250px;
            margin-top: 7px;
            position: absolute;
            left: 20px;
            top: 10px;
        }

        /* ============================================================
           Constrained container that matches video grid width
           ============================================================ */
        .container {
            background-color: var(--secondary-bg-color);
            padding-top: 95px;
            padding-bottom: 20px;
            /* Replace fit-content with explicit responsive max-width */
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: var(--main-bg-color);
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f1f1f1;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        .sidebar .sidebar-divider {
            height: 1px;
            background-color: #3f3f3f;
            margin: 12px 24px;
        }

        .sidebar .genre-label {
            padding: 8px 8px 4px 32px;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .sidebar .genre-link {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar .genre-link img {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            filter: invert(60%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(60%) contrast(90%);
        }

        #main {
            transition: margin-left .5s;
            padding: 16px;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: #111;
            color: white;
            border: none;
            margin-top: -2px;
        }

        .openbtn:hover {
            background-color: #444;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none;
        }

        .search-container:focus-within .search-suggestions {
            display: block;
        }

        /* Prevent Middle-Click Autoscroll (Pan Mode) */
        .video-item,
        .video-title,
        .thumbnail-container,
        .channel-name,
        .channel-pic-link,
        .category-button,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            -webkit-user-select: none;
            user-select: none;
        }

        .video-item * {
            cursor: default;
        }
        
        .video-title,
        .thumbnail-container,
        .channel-name,
        .channel-pic-link,
        .category-button,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            cursor: pointer;
        }
    </style>
</head>
<body class="index-page">
    <header class="top-bar">
        <button class="openbtn" onclick="toggleNav()">☰</button>
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="category-container" id="categoryContainer"></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="watch_history.html" id="sidebarWatchHistory">Watch History</a>
        <a href="liked_videos.html" id="sidebarLikedVideos">Liked Videos</a>
        <a href="subscribed_channels.html" id="sidebarSubscriptions">Subscriptions</a>
        <a href="user_playlists.html" id="sidebarPlaylists">Playlists</a>
        <a href="about.html" id="sidebarAbout">About</a>
        <div class="sidebar-divider"></div>
        <div class="genre-label" id="sidebarGenreLabel">Topics</div>
        <a href="genre_channel.html?genre=gaming" class="genre-link" id="sidebarGaming">
            <img src="LocalYT-Rev-Files/genre_gaming.svg" alt="">Gaming
        </a>
        <a href="genre_channel.html?genre=music" class="genre-link" id="sidebarMusic">
            <img src="LocalYT-Rev-Files/genre_music.svg" alt="">Music
        </a>
        <a href="genre_channel.html?genre=sports" class="genre-link" id="sidebarSports">
            <img src="LocalYT-Rev-Files/genre_sports.svg" alt="">Sports
        </a>
        <a href="genre_channel.html?genre=movies" class="genre-link" id="sidebarMovies">
            <img src="LocalYT-Rev-Files/genre_movies.svg" alt="">Movies
        </a>
    </div>
    <div class="container" id="videoContainer"></div>
    
    <script>
// ======================================================================
// FIX: Prevent Middle-Click Autoscroll (Pan Mode)
// ======================================================================
document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        const target = e.target.closest(
            'a, ' + 
            '.video-item, ' + 
            '.video-title, ' + 
            '.thumbnail-container, ' + 
            '.channel-name, ' + 
            '.channel-pic-link, ' + 
            '.category-button, ' + 
            '.suggestion-item, ' +
            '#mainLogo'
        );
        
        if (target) {
            e.preventDefault();
            
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
        }
    }
}, true);

function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }

    document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');
    document.getElementById('sidebarWatchHistory').textContent = getLang('Watch History', 'Wiedergabeverlauf');
    document.getElementById('sidebarLikedVideos').textContent = getLang('Liked Videos', 'Videos, die ich mag');
    document.getElementById('sidebarSubscriptions').textContent = getLang('Subscriptions', 'Abonnements');
    document.getElementById('sidebarPlaylists').textContent = getLang('Playlists', 'Playlisten');
    document.getElementById('sidebarAbout').textContent = getLang('About', 'Über');
    document.getElementById('sidebarGenreLabel').textContent = getLang('Topics', 'Themen');
    
    document.getElementById('sidebarGaming').lastChild.textContent = getLang('Gaming', 'Gaming');
    document.getElementById('sidebarMusic').lastChild.textContent = getLang('Music', 'Musik');
    document.getElementById('sidebarSports').lastChild.textContent = getLang('Sports', 'Sport');
    document.getElementById('sidebarMovies').lastChild.textContent = getLang('Movies', 'Filme');
});

function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

function getVideoExtension(path) {
    const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
    return match ? match[1] : 'mp4';
}

function toggleNav() {
    const sidebar = document.getElementById("mySidebar");
    const main = document.getElementById("main");
    
    if (sidebar.style.width === "250px") {
        sidebar.style.width = "0";
        main.style.marginLeft = "0";
    } else {
        sidebar.style.width = "250px";
        main.style.marginLeft = "250px";
    }
}
        
function closeNav() {
    document.getElementById("mySidebar").style.width = "0";
    document.getElementById("main").style.marginLeft = "0";
}

let currentPage = 1;
let recommendationsPage = 1;
const limit = 20;
let isLoading = false;
let hasMore = true;
let isUserLoggedIn = false;
let hasLoadedRecommendations = false;

function checkLoginStatus() {
    return fetch('/session-user')
        .then(response => {
            if (response.ok) {
                return response.json();
            }
            throw new Error('Not logged in');
        })
        .then(data => {
            if (data.username) {
                const loginButton = document.getElementById('loginButton');
                loginButton.textContent = data.username;
                isUserLoggedIn = true;
                return true;
            }
            return false;
        })
        .catch(error => {
            console.log('User not logged in');
            return false;
        });
}

document.addEventListener('DOMContentLoaded', () => {
    checkLoginStatus().then(loggedIn => {
        fetch('/top-categories')
            .then(response => response.json())
            .then(categories => {
                const categoryContainer = document.getElementById('categoryContainer');
                const limitedCategories = categories.slice(0, 3);
                
                limitedCategories.forEach(category => {
                    const button = document.createElement('button');
                    button.className = 'category-button';
                    button.textContent = category;
                    button.onclick = () => {
                        window.location.href = `search.html?q=${encodeURIComponent(category)}`;
                    };
                    categoryContainer.appendChild(button);
                });
            })
            .catch(error => {
                console.log('No categories found');
            });

        if (loggedIn) {
            console.log('User logged in, loading recommendations');
            loadRecommendations();
        } else {
            console.log('Guest user, loading random videos');
            loadMoreVideos();
        }
    });

    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
            if (!isLoading && hasMore) {
                if (isUserLoggedIn && !hasLoadedRecommendations) {
                    loadMoreRecommendations();
                } else {
                    loadMoreVideos();
                }
            }
        }
    });
    
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
});

function loadRecommendations() {
    if (isLoading) return;
    
    isLoading = true;
    
    fetch('/recommendations?page=1&limit=' + limit)
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load recommendations');
            }
            return response.json();
        })
        .then(data => {
            let videos = [];
            if (Array.isArray(data)) {
                videos = data;
                hasMore = false;
                hasLoadedRecommendations = true;
            } else if (data.videos) {
                videos = data.videos;
                hasMore = data.hasMore || false;
                if (hasMore) {
                    recommendationsPage = 2;
                } else {
                    hasLoadedRecommendations = true;
                }
            }
            
            if (videos.length > 0) {
                renderVideos(videos);
            } else {
                hasLoadedRecommendations = true;
                loadMoreVideos();
            }
            
            isLoading = false;
        })
        .catch(error => {
            console.error('Error loading recommendations:', error);
            isLoading = false;
            hasLoadedRecommendations = true;
            loadMoreVideos();
        });
}

function loadMoreRecommendations() {
    if (isLoading || !hasMore) return;
    
    isLoading = true;
    
    fetch('/recommendations?page=' + recommendationsPage + '&limit=' + limit)
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load more recommendations');
            }
            return response.json();
        })
        .then(data => {
            let newVideos = [];
            if (Array.isArray(data)) {
                newVideos = data;
                hasMore = false;
                hasLoadedRecommendations = true;
            } else if (data.videos) {
                newVideos = data.videos;
                hasMore = data.hasMore;
                if (hasMore) {
                    recommendationsPage++;
                } else {
                    hasLoadedRecommendations = true;
                }
            }
            
            if (newVideos.length > 0) {
                renderVideos(newVideos);
            } else {
                hasLoadedRecommendations = true;
            }
            
            isLoading = false;
        })
        .catch(error => {
            console.error('Error loading more recommendations:', error);
            isLoading = false;
            hasLoadedRecommendations = true;
        });
}

function loadMoreVideos() {
    if (isLoading || !hasMore) return;
    
    isLoading = true;
    
    fetch(`/videos?page=${currentPage}&limit=${limit}`)
        .then(response => response.json())
        .then(data => {
            const videos = data.videos || [];
            
            if (videos.length > 0) {
                renderVideos(videos);
            }

            isLoading = false;
            
            if (videos.length < limit) {
                hasMore = false;
            } else {
                currentPage++;
            }
        })
        .catch(error => {
            console.error('Error fetching videos:', error);
            isLoading = false;
        });
}

function renderVideos(videos) {
    const container = document.getElementById('videoContainer');
    
    videos.forEach(video => {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        const channel = video.path.split('/')[0];
        const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-info">
                <div class="channel-pic-link" style="cursor: pointer;">
                    <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy">
                </div>
                <div class="video-details">
                    <div class="video-title" onclick="window.location.href='video.html?src=${encodeURIComponent(video.path)}'">${videoTitle}</div>
                    <div class="channel-name" onclick="window.location.href='channel.html?channel=${encodeURIComponent(channel)}'">${channel}</div>
                    <div class="video-description">${localStorage.getItem('language') === 'de' ? video.viewCount.replace(/,/g, '.') : video.viewCount} ${getLang('views', 'Aufrufe')} • ${video.fileDate}</div>
                </div>
            </div>
        `;
        container.appendChild(videoElement);

        videoElement.querySelector('.thumbnail-container').addEventListener('click', () => {
            window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
        });

        setupVideoLinkEvents(videoElement.querySelector('.video-title'), video.path);
        setupChannelLinkEvents(videoElement.querySelector('.channel-pic-link'), channel);
        setupChannelLinkEvents(videoElement.querySelector('.channel-name'), channel);

        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${channel}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.text())
            .then(length => {
                videoElement.querySelector('.video-length').textContent = length;
            })
            .catch(error => {
                console.error('Error fetching video length:', error);
            });
    });
}

function setupVideoLinkEvents(element, path) {
    element.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
    });

    element.addEventListener('mouseup', (event) => {
        if (event.button === 1) {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
        }
    });
}

function setupChannelLinkEvents(element, channel) {
    element.addEventListener('click', () => {
        window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
    });

    element.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
    });

    element.addEventListener('mouseup', (event) => {
        if (event.button === 1) {
            event.preventDefault();
            window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
        }
    });
}
    </script>
    <script>
// ==============================
// Apply Title Color Scheme Preference
// ==============================
(function applyTitleColorScheme() {
    const setting = JSON.parse(localStorage.getItem('titleColorScheme') || '{}');
    if (setting.scheme === 'blue') {
        const style = document.createElement('style');
        style.id = 'title-color-scheme-blue';
        style.textContent = `
            .video-title {
                color: #128ee9 !important;
            }
            .video-title:hover {
                text-decoration: underline !important;
                cursor: pointer !important;
            }
        `;
        document.head.appendChild(style);
    } else {
        const existingStyle = document.getElementById('title-color-scheme-blue');
        if (existingStyle) existingStyle.remove();
    }
})();
    </script>
    <script src="search-suggestions.js"></script>
    <script src="profile-pic.js"></script>
    <script>
    // ============================================================
    // Hide category buttons when Channel Page Style is "Classic"
    // ============================================================
    (function applyChannelPageStyleToCategories() {
        const setting = JSON.parse(localStorage.getItem('channelPageStyle') || '{}');
        if (setting.style === 'legacy') {
            const container = document.getElementById('categoryContainer');
            if (container) {
                container.style.display = 'none';
            }
        }
    })();
    </script>
</body>
</html>
