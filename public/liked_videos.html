<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liked Videos - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .no-videos-message {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 16px;
        }
        .error-message {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div class="container" id="videoContainer">
        <div class="loading-indicator" style="text-align: center; padding: 40px; color: #aaa;">Loading liked videos...</div>
    </div>
    <script>
// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

// Helper function to strip file extension for thumbnail and metadata paths
function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('videoContainer');

    // Fetch search index and liked videos simultaneously
    Promise.all([
        fetch('/search-index').then(res => res.json()),
        fetch('/user-likes').then(res => res.json())
    ])
    .then(([indexData, likedVideos]) => {
        const videosArray = indexData.videos || [];
        
        // Create a map for quick video lookup by path
        const videoMap = {};
        videosArray.forEach(video => {
            videoMap[video.path] = video;
        });
        
        // Filter to get only paths where value is true
        const likedPaths = Object.entries(likedVideos)
            .filter(([path, isLiked]) => isLiked === true)
            .map(([path]) => path);
        
        console.log('Liked paths:', likedPaths);
        
        // Clear container
        container.innerHTML = '';
        
        if (likedPaths.length === 0) {
            const noVideosElement = document.createElement('div');
            noVideosElement.className = 'no-videos-message';
            noVideosElement.textContent = 'No liked videos yet. Click the like button on videos to add them here!';
            container.appendChild(noVideosElement);
            return;
        }
        
        // Get video objects for liked paths
        const likedVideosList = [];
        likedPaths.forEach(path => {
            const video = videoMap[path];
            if (video) {
                likedVideosList.push(video);
            } else {
                // If video not in index, create a basic object
                likedVideosList.push({
                    path: path,
                    displayName: path.split('/').pop().replace(/\.(mp4|mp3|mkv)$/i, '')
                });
            }
        });
        
        // Display videos (most recent likes first)
        likedVideosList.reverse().forEach(video => {
            const videoElement = document.createElement('div');
            videoElement.className = 'video-item';
            
            const videoTitle = video.displayName || video.path.split('/').pop().replace(/\.(mp4|mp3|mkv)$/i, '');
            const videoPathWithoutExt = stripExtension(video.path);
            const channel = video.path.split('/')[0];
            
            // Use standard thumbnail and channel pic paths
            const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
            const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;

            videoElement.innerHTML = `
                <div class="thumbnail-container">
                    <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy" onerror="this.src='LocalYT-Rev-Files/default-thumbnail.jpg'">
                    <div class="video-length"></div>
                </div>
                <div class="video-info">
                    <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy" onerror="this.src='LocalYT-Rev-Files/default-channel.jpg'">
                    <div class="video-details">
                        <div class="video-title">${videoTitle}</div>
                        <div class="channel-name">${channel}</div>
                        <div class="video-description"></div>
                    </div>
                </div>
            `;
            container.appendChild(videoElement);

            // --- FETCH METADATA (View Count & Date) ---
            // This logic matches search.html to ensure data is retrieved correctly
            const descriptionDiv = videoElement.querySelector('.video-description');
            
            Promise.all([
                fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(res => 
                    res.ok ? res.text() : '0'
                ).catch(() => '0'),
                fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(res => 
                    res.ok ? res.text() : 'Unknown date'
                ).catch(() => 'Unknown date')
            ])
            .then(([viewCount, fileDate]) => {
                // Format view count with commas
                let formattedViewCount = viewCount;
                if (!isNaN(viewCount) && viewCount !== '0') {
                    formattedViewCount = parseInt(viewCount).toLocaleString();
                }
                
                // Clean the fileDate
                const cleanFileDate = fileDate.replace(/\s+/g, ' ').trim();
                
                descriptionDiv.textContent = `${formattedViewCount} views • Uploaded on ${cleanFileDate}`;
            })
            .catch(error => {
                console.error('Error fetching metadata:', error);
                descriptionDiv.textContent = 'Metadata unavailable';
            });

            // Add click handlers
            const thumbnail = videoElement.querySelector('.thumbnail-container');
            const title = videoElement.querySelector('.video-title');
            const channelName = videoElement.querySelector('.channel-name');
            
            const videoUrl = `video.html?src=${encodeURIComponent(video.path)}`;
            const channelUrl = `channel.html?channel=${encodeURIComponent(channel)}`;

            thumbnail.addEventListener('click', () => {
                window.location.href = videoUrl;
            });
            
            title.addEventListener('click', () => {
                window.location.href = videoUrl;
            });
            
            channelName.addEventListener('click', () => {
                window.location.href = channelUrl;
            });

            // Right-click and middle-click handlers
            const setupContextMenu = (element, url) => {
                element.addEventListener('contextmenu', (event) => {
                    event.preventDefault();
                    window.open(url, '_blank');
                });
                element.addEventListener('mouseup', (event) => {
                    if (event.button === 1) {
                        event.preventDefault();
                        window.open(url, '_blank');
                    }
                });
            };

            setupContextMenu(title, videoUrl);
            setupContextMenu(thumbnail, videoUrl);
            setupContextMenu(channelName, channelUrl);

            // Fetch video length
            const videoFilename = video.path.split('/').pop();
            const videoNameWithoutExt = stripExtension(videoFilename);
            fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
                .then(response => response.text())
                .then(length => {
                    const lengthElement = videoElement.querySelector('.video-length');
                    if (lengthElement) lengthElement.textContent = length;
                })
                .catch(error => {
                    console.error('Error fetching video length:', error);
                });
        });
    })
    .catch(error => {
        console.error('Error loading liked videos:', error);
        container.innerHTML = '<div class="error-message">Error loading liked videos. Please try again.</div>';
    });

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();
        if (query.length < 2) {
            document.getElementById('searchSuggestions').innerHTML = '';
            return;
        }
        
        fetch('/search-index')
            .then(response => response.json())
            .then(data => {
                const videos = data.videos || [];
                const suggestions = videos
                    .filter(video => video.displayName.toLowerCase().includes(query))
                    .slice(0, 5);

                const suggestionsContainer = document.getElementById('searchSuggestions');
                suggestionsContainer.innerHTML = '';
                
                suggestions.forEach(suggestion => {
                    const suggestionElement = document.createElement('div');
                    suggestionElement.className = 'suggestion-item';
                    suggestionElement.textContent = suggestion.displayName;
                    suggestionElement.onclick = () => {
                        window.location.href = `video.html?src=${encodeURIComponent(suggestion.path)}`;
                    };
                    suggestionsContainer.appendChild(suggestionElement);

                    suggestionElement.addEventListener('contextmenu', (event) => {
                        event.preventDefault();
                        window.open(`video.html?src=${encodeURIComponent(suggestion.path)}`, '_blank');
                    });

                    suggestionElement.addEventListener('mouseup', (event) => {
                        if (event.button === 1) {
                            event.preventDefault();
                            window.open(`video.html?src=${encodeURIComponent(suggestion.path)}`, '_blank');
                        }
                    });
                });
            });
    });

    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    // --- Search icon click ---
    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
});
    </script>
</body>
</html>
