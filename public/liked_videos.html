<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liked Videos - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="skeleton.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <script>
// ==============================
// Apply Rounded Corners Preference
// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .video-item .video-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();
    </script>
    <style>
        .no-videos-message {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 16px;
        }
        .error-message {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }
        .login-prompt {
            color: #888;
            text-align: center;
            padding: 80px 20px;
        }
        .login-prompt a {
            color: #3ea6ff;
            text-decoration: none;
            font-weight: 500;
        }
        .login-prompt a:hover {
            text-decoration: underline;
        }
        /* Styles to match channel.html layout alignment */
        .video-info {
            display: flex;
            margin-top: 10px;
        }
        .video-details {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            margin-left: 10px;
            overflow: hidden;
        }
        .channel-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .video-title {
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .channel-name {
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }
        .channel-name:hover {
            color: #fff;
        }
        .video-description {
            color: #888;
            font-size: 14px;
            margin-left: -45px;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; 
        }

        .search-container:focus-within .search-suggestions {
            display: block;
        }

        /* --- FIX: Prevent Middle-Click Autoscroll (Pan Mode) --- */
        
        .video-item,
        .video-title,
        .thumbnail-container,
        .channel-name,
        .suggestion-item,
        #mainLogo {
            -webkit-user-select: none;
            user-select: none;
        }

        .video-item * {
            cursor: default;
        }
        
        .video-title,
        .thumbnail-container,
        .channel-name,
        .suggestion-item,
        #mainLogo {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.svg" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div class="container" id="videoContainer"></div>
    
    <script>
// ======================================================================
// FIX: Prevent Middle-Click Autoscroll (Pan Mode)
// ======================================================================
document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        const target = e.target.closest(
            'a, ' + 
            '.video-item, ' + 
            '.video-title, ' + 
            '.thumbnail-container, ' + 
            '.channel-name, ' + 
            '.suggestion-item, ' +
            '#mainLogo'
        );
        
        if (target) {
            e.preventDefault();
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
        }
    }
}, true);

// --- Language Helper ---
function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Check if relative dates are enabled (reads fresh each time)
function isRelativeDatesEnabled() {
    const setting = JSON.parse(localStorage.getItem('relativeDates') || '{"enabled":true}');
    return setting.enabled !== false;
}

// Helper function to convert DD.MM.YYYY to relative time
function getRelativeTime(dateStr, lang) {
    const parts = dateStr.split('.');
    if (parts.length !== 3) return dateStr; // fallback to original if parsing fails

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    const date = new Date(year, month, day);
    const now = new Date();
    now.setHours(0, 0, 0, 0); // compare dates only

    const diffMs = now.getTime() - date.getTime();
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    if (diffDays < 0) return dateStr; // future date
    if (diffDays === 0) return lang === 'de' ? 'heute' : 'today';
    if (diffDays < 7) {
        return lang === 'de' ? `vor ${diffDays} ${diffDays === 1 ? 'Tag' : 'Tagen'}` : `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return lang === 'de' ? `vor ${weeks} ${weeks === 1 ? 'Woche' : 'Wochen'}` : `${weeks} week${weeks === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 365) {
        const months = Math.floor(diffDays / 30);
        return lang === 'de' ? `vor ${months} ${months === 1 ? 'Monat' : 'Monaten'}` : `${months} month${months === 1 ? '' : 's'} ago`;
    }
    const years = Math.floor(diffDays / 365);
    return lang === 'de' ? `vor ${years} ${years === 1 ? 'Jahr' : 'Jahren'}` : `${years} year${years === 1 ? '' : 's'} ago`;
}

// Helper function to strip file extension for thumbnail and metadata paths
function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

// ==============================
// Lazy Loading Variables
// ==============================
let likedVideosList = [];
let displayedVideosCount = 0;
const BATCH_SIZE = 20;
let isLoadingMoreLiked = false;

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }

    // Set initial translations
    document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');

    // --- Search Navigation Logic ---
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });

    // --- LOAD LIKED VIDEOS WITH LAZY LOADING ---
    const container = document.getElementById('videoContainer');
    
    // Show skeletons while loading initial batch
    showSkeletons(12, 'videoContainer', 'video');

    // Fetch search index and liked videos simultaneously
    Promise.all([
        fetch('/search-index').then(res => res.json()),
        fetch('/user-likes').then(res => res.json())
    ])
    .then(([indexData, likedVideos]) => {
        // Remove skeletons
        hideSkeletons();

        const videosArray = indexData.videos || [];
        
        // Create a map for quick video lookup by path
        const videoMap = {};
        videosArray.forEach(video => {
            videoMap[video.path] = video;
        });
        
        // Filter to get only paths where value is true
        const likedPaths = Object.entries(likedVideos)
            .filter(([path, isLiked]) => isLiked === true)
            .map(([path]) => path);
        
        console.log('Liked paths:', likedPaths);
        
        // Clear container
        container.innerHTML = '';
        
        if (likedPaths.length === 0) {
            const noVideosElement = document.createElement('div');
            noVideosElement.className = 'no-videos-message';
            noVideosElement.textContent = getLang('No liked videos yet. Click the like button on videos to add them here!', 'Noch keine favorisierten Videos. Klicke auf den Like-Button bei Videos, um sie hier hinzuzufügen!');
            container.appendChild(noVideosElement);
            return;
        }
        
        // Get video objects for liked paths
        likedVideosList = [];
        likedPaths.forEach(path => {
            const video = videoMap[path];
            if (video) {
                likedVideosList.push(video);
            } else {
                // If video not in index, create a basic object
                likedVideosList.push({
                    path: path,
                    displayName: path.split('/').pop().replace(/\.(mp4|mp3|mkv)$/i, '')
                });
            }
        });
        
        // Reverse to show most recent likes first
        likedVideosList.reverse();
        displayedVideosCount = 0;
        
        // Load first batch
        loadMoreLikedVideos();
        
        // Setup scroll listener for infinite scroll
        setupInfiniteScroll();
    })
    .catch(error => {
        console.error('Error loading liked videos:', error);
        hideSkeletons();
        container.innerHTML = `
            <div class="login-prompt">
                <p style="font-size:20px; margin-bottom:12px;">${getLang('Please log in to see your liked videos', 'Bitte melde dich an, um deine favorisierten Videos zu sehen')}</p>
                <a href="login.html">${getLang('Go to Login', 'Zum Login')}</a>
            </div>
        `;
    });
});

// ==============================
// Lazy Loading Functions
// ==============================
function loadMoreLikedVideos() {
    if (isLoadingMoreLiked) return;
    
    const container = document.getElementById('videoContainer');
    const remainingVideos = likedVideosList.length - displayedVideosCount;
    
    if (remainingVideos <= 0) {
        // No more videos to load
        return;
    }
    
    isLoadingMoreLiked = true;
    
    // Calculate how many videos to load in this batch
    const videosToLoad = Math.min(BATCH_SIZE, remainingVideos);
    
    // Show skeletons at the bottom for the next batch
    showSkeletons(Math.min(videosToLoad, 12), 'videoContainer', 'video');
    
    // Simulate a small delay to allow skeletons to render
    setTimeout(() => {
        hideSkeletons();
        
        const batchEnd = displayedVideosCount + videosToLoad;
        const batchVideos = likedVideosList.slice(displayedVideosCount, batchEnd);
        
        renderLikedVideos(batchVideos);
        
        displayedVideosCount = batchEnd;
        isLoadingMoreLiked = false;
    }, 300);
}

function setupInfiniteScroll() {
    window.addEventListener('scroll', () => {
        // Check if user is near the bottom of the page
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
            if (!isLoadingMoreLiked && displayedVideosCount < likedVideosList.length) {
                loadMoreLikedVideos();
            }
        }
    });
}

function renderLikedVideos(videos) {
    const container = document.getElementById('videoContainer');
    
    videos.forEach(video => {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        videoElement.style.transition = 'opacity 0.3s';
        
        const videoTitle = video.displayName || video.path.split('/').pop().replace(/\.(mp4|mp3|mkv)$/i, '');
        const videoPathWithoutExt = stripExtension(video.path);
        const channel = video.path.split('/')[0];
        
        // Use standard thumbnail and channel pic paths
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy" onerror="this.src='LocalYT-Rev-Files/default-thumbnail.jpg'">
                <div class="video-length"></div>
            </div>
            <div class="video-info">
                <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy" onerror="this.src='LocalYT-Rev-Files/default-channel.jpg'">
                <div class="video-details">
                    <div class="video-title">${videoTitle}</div>
                    <div class="channel-name">${channel}</div>
                    <div class="video-description">${getLang('Loading views...', 'Aufrufe werden geladen...')}</div>
                </div>
            </div>
        `;
        container.appendChild(videoElement);

        // --- FETCH METADATA (View Count & Date) ---
        const descriptionDiv = videoElement.querySelector('.video-description');
        
        Promise.all([
            fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(res => 
                res.ok ? res.text() : '0'
            ).catch(() => '0'),
            fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(res => 
                res.ok ? res.text() : 'Unknown date'
            ).catch(() => 'Unknown date')
        ])
        .then(([viewCount, fileDate]) => {
            let formattedViewCount = viewCount;
            if (!isNaN(viewCount) && viewCount !== '0') {
                formattedViewCount = parseInt(viewCount).toLocaleString();
            }
            
            const lang = localStorage.getItem('language');
            let viewsText = getLang('views', 'Aufrufe');
            let uploadedText = getLang('Uploaded on', 'Hochgeladen am');

            if (lang === 'de') {
                formattedViewCount = formattedViewCount.replace(/,/g, '.');
            }

            const cleanFileDate = fileDate.replace(/\s+/g, ' ').trim();
            
            const dateToShow = isRelativeDatesEnabled() ? getRelativeTime(cleanFileDate, lang) : cleanFileDate;
            
            if (isRelativeDatesEnabled()) {
                descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${dateToShow}`;
            } else {
                descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${uploadedText} ${dateToShow}`;
            }
        })
        .catch(error => {
            console.error('Error fetching metadata:', error);
            descriptionDiv.textContent = 'Metadata unavailable';
        });

        // Add click handlers
        const thumbnail = videoElement.querySelector('.thumbnail-container');
        const title = videoElement.querySelector('.video-title');
        const channelName = videoElement.querySelector('.channel-name');
        
        const videoUrl = `video.html?src=${encodeURIComponent(video.path)}`;
        const channelUrl = `channel.html?channel=${encodeURIComponent(channel)}`;

        thumbnail.addEventListener('click', () => {
            window.location.href = videoUrl;
        });
        
        title.addEventListener('click', () => {
            window.location.href = videoUrl;
        });
        
        channelName.addEventListener('click', () => {
            window.location.href = channelUrl;
        });

        // Right-click and middle-click handlers
        const setupContextMenu = (element, url) => {
            element.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                window.open(url, '_blank');
            });
            element.addEventListener('mouseup', (event) => {
                if (event.button === 1) {
                    event.preventDefault();
                    window.open(url, '_blank');
                }
            });
        };

        setupContextMenu(title, videoUrl);
        setupContextMenu(thumbnail, videoUrl);
        setupContextMenu(channelName, channelUrl);

        // Fetch video length
        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.text())
            .then(length => {
                const lengthElement = videoElement.querySelector('.video-length');
                if (lengthElement) lengthElement.textContent = length;
            })
            .catch(error => {
                console.error('Error fetching video length:', error);
            });
    });
}
    </script>
    <!-- External Scripts -->
    <script src="search-suggestions.js"></script>
    <script src="profile-pic.js"></script>
    <script src="sidebar.js"></script>
    <script src="thumbnail-context-menu.js"></script>
    <script src="skeleton-loader.js"></script>
</body>
</html>
