<script>
// ==============================
// Apply Touch Device Detection
// ==============================
(function detectTouchDevice() {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.documentElement.className += ' touch-device';
    }
})();
</script>
<script>
// ==============================
// Apply Rounded Corners Preference
// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .video-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();
</script>
    <style>

            display: flex;

           ADVANCED SEARCH FILTERS (YouTube Style)
           Grey theme, no border-radius

        .search-filters-toggle {

.search-results-container .skeleton-item {

    <script>
// ======================================================================
// FIX: Prevent Middle-Click Autoscroll (Pan Mode)
// ======================================================================
document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        const target = e.target.closest(
            'a, ' + 
            '.channel-result, ' +
            '.video-item, ' + 
            '.video-title, ' + 
            '.thumbnail-container, ' + 
            '.clickable-channel-name, ' + 
            '.video-thumbnail, ' + 
            '.load-more, ' + 
            '.suggestion-item, ' +
            '#mainLogo'
        );
        
        if (target) {
            e.preventDefault();
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
        }
    }
}, true);

// --- Language Helper ---
function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Check if relative dates are enabled (reads fresh each time)
function isRelativeDatesEnabled() {
    const setting = JSON.parse(localStorage.getItem('relativeDates') || '{"enabled":true}');
    return setting.enabled !== false;
}

// Helper function to convert DD.MM.YYYY to relative time
function getRelativeTime(dateStr, lang) {
    const parts = dateStr.split('.');
    if (parts.length !== 3) return dateStr; // fallback to original if parsing fails

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    const date = new Date(year, month, day);
    const now = new Date();
    now.setHours(0, 0, 0, 0); // compare dates only

    const diffMs = now.getTime() - date.getTime();
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    if (diffDays < 0) return dateStr; // future date
    if (diffDays === 0) return lang === 'de' ? 'heute' : 'today';
    if (diffDays < 7) {
        return lang === 'de' ? `vor ${diffDays} ${diffDays === 1 ? 'Tag' : 'Tagen'}` : `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return lang === 'de' ? `vor ${weeks} ${weeks === 1 ? 'Woche' : 'Wochen'}` : `${weeks} week${weeks === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 365) {
        const months = Math.floor(diffDays / 30);
        return lang === 'de' ? `vor ${months} ${months === 1 ? 'Monat' : 'Monaten'}` : `${months} month${months === 1 ? '' : 's'} ago`;
    }
    const years = Math.floor(diffDays / 365);
    return lang === 'de' ? `vor ${years} ${years === 1 ? 'Jahr' : 'Jahren'}` : `${years} year${years === 1 ? '' : 's'} ago`;
}

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage";
        mainLogo.style.cursor = 'pointer';
    }
});

// Helper function to strip file extension
function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

// Helper function to get video file extension
function getVideoExtension(path) {
    const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
    return match ? match[1] : 'mp4';
}

// Search state management
const searchState = {
    index: null,
    worker: null,
    lastSearchId: 0,
    debounceTimer: null,
    currentResults: [],
    currentQuery: ''
};

document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    
    // Safe URI Decoding
    let initialQuery = '';
    try {
        initialQuery = decodeURIComponent(urlParams.get('q') || '').trim();
    } catch (error) {
        console.warn("Could not decode URI component, using raw value:", error);
        initialQuery = (urlParams.get('q') || '').trim();
    }
    
    // Save search history to server on page load
    if (initialQuery) {
        fetch('/user-search-history', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: initialQuery })
        }).catch(err => console.error("Could not save search history:", err));
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.value = initialQuery;

    // Set page title
    document.title = initialQuery ? initialQuery + ' - LocalYT' : 'LocalYT';

    // UI Translation
    document.getElementById('searchInput').placeholder = getLang('Search', 'Suche');
    document.getElementById('filterToggleText').textContent = getLang('Filters', 'Filter');

    // Show skeletons immediately while loading
    if (initialQuery) {
        showSkeletons(8, 'searchResultsContainer', 'search');
    } else {
        document.getElementById('searchResultsContainer').innerHTML = 
            `<div style="color: white; padding: 20px;">${getLang('Enter a search term above', 'Gib oben einen Suchbegriff ein')}</div>`;
    }

    // Initialize Web Worker if available
    if (window.Worker) {
        try {
            searchState.worker = new Worker('search-worker.js');
            searchState.worker.onmessage = handleWorkerResponse;
            
            const indexResponse = await fetch('/search-index');
            if (!indexResponse.ok) throw new Error('Failed to fetch search index');
            const indexData = await indexResponse.json();
            
            searchState.worker.postMessage({
                type: 'initialize',
                index: indexData
            });
            
            searchState.index = indexData;
        } catch (error) {
            console.error('Worker initialization failed:', error);
            searchState.worker = null;
        }
    }

    // Load search index directly if worker failed
    if (!searchState.worker) {
        try {
            const indexResponse = await fetch('/search-index');
            if (!indexResponse.ok) throw new Error('Failed to fetch search index');
            searchState.index = await indexResponse.json();
        } catch (error) {
            console.error('Error loading search index:', error);
            hideSkeletons();
            showError(getLang('Error loading search. Please refresh.', 'Fehler beim Laden der Suche. Bitte aktualisiere die Seite.'));
            return;
        }
    }

    // Perform initial search if query exists
    if (initialQuery) {
        performSearch(initialQuery);
    }

    // Search Navigation Logic
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query) {
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
    
    // Initialize lazy loading
    setupLazyLoading();
});

function handleWorkerResponse(e) {
    const { type, results, searchId, query } = e.data;
    
    if (searchId !== searchState.lastSearchId) return;
    
    if (type === 'search') {
        searchState.currentResults = results;
        searchState.currentQuery = query;
        hideSkeletons();
        displaySearchResults(results);
    }
}

function performSearch(query, maxResults = 100) {
    if (!query || !searchState.index) return;
    
    // Show skeletons while searching
    showSkeletons(8, 'searchResultsContainer', 'search');
    
    searchState.currentQuery = query.toLowerCase();
    searchState.lastSearchId++;
    
    if (searchState.worker) {
        searchState.worker.postMessage({
            type: 'search',
            query: searchState.currentQuery,
            searchId: searchState.lastSearchId,
            maxResults
        });
    } else {
        const results = localSearch(searchState.currentQuery, maxResults);
        searchState.currentResults = results;
        hideSkeletons();
        displaySearchResults(results);
    }
}

function localSearch(query, maxResults = 100) {
    if (!searchState.index || !query) return [];
    
    const queryLower = query.toLowerCase();
    const queryTerms = queryLower.split(/\s+/).filter(term => term.length > 0);
    const scoredResults = [];
    
    for (const video of searchState.index.videos) {
        const lowerTitle = video.displayName.toLowerCase();
        const lowerChannel = video.path.split('/')[0].toLowerCase();
        
        let titleMatchCount = 0;
        let channelMatchCount = 0;
        let baseScore = 0;

        if (lowerTitle === queryLower) baseScore += 100;
        if (lowerChannel === queryLower) baseScore += 80;

        queryTerms.forEach(term => {
            const termRegex = new RegExp(`\\b(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b`, 'i');
            
            if (termRegex.test(lowerTitle)) {
                titleMatchCount++;
                baseScore += 10;
            }
            if (termRegex.test(lowerChannel)) {
                channelMatchCount++;
                baseScore += 5;
            }
            if (video.description && termRegex.test(video.description.toLowerCase())) {
                baseScore += 2;
            }
        });

        if (titleMatchCount >= 4) baseScore *= 15;
        else if (titleMatchCount === 3) baseScore *= 8;
        else if (titleMatchCount === 2) baseScore *= 3;
        
        if (channelMatchCount >= 2) baseScore *= 2;

        if (baseScore > 0) {
            scoredResults.push({ ...video, score: baseScore });
        }
    }
    
    scoredResults.sort((a, b) => b.score - a.score);
    return scoredResults.slice(0, maxResults);
}

function displaySearchResults(results) {
    const resultsContainer = document.getElementById('searchResultsContainer');
    
    // Remove skeletons if they exist
    hideSkeletons();
    resultsContainer.innerHTML = '';
    
    if (!results || results.length === 0) {
        resultsContainer.innerHTML = `
            <div style="color: white; padding: 20px;">
                ${getLang('No results found for', 'Keine Ergebnisse für')} "${searchState.currentQuery}"
            </div>
        `;
        return;
    }
    
    // Group by channel for channel results
    const channelCounts = {};
    results.forEach(video => {
        const channel = video.path.split('/')[0];
        channelCounts[channel] = (channelCounts[channel] || 0) + 1;
    });
    
    // Show channels with multiple matches first
    for (const [channel, count] of Object.entries(channelCounts)) {
        if (count >= 5) {
            const channelElement = document.createElement('div');
            channelElement.className = 'channel-result';
            channelElement.innerHTML = `
                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///////yH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                     alt="${channel}" 
                     loading="lazy"
                     data-src="/channelpic/${encodeURIComponent(channel)}.jpg">
                <div class="channel-name">${channel}</div>
            `;
            
            channelElement.addEventListener('click', () => navigateToChannel(channel));
            channelElement.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openInNewTab(`channel.html?channel=${encodeURIComponent(channel)}`);
            });
            channelElement.addEventListener('mouseup', (e) => {
                if (e.button === 1) {
                    e.preventDefault();
                    openInNewTab(`channel.html?channel=${encodeURIComponent(channel)}`);
                }
            });
            
            resultsContainer.appendChild(channelElement);
        }
    }
    
    // Show individual video results
    results.forEach(video => {
        createVideoElement(video, resultsContainer);
    });
    
    // Add "Load more" if there might be more results
    if (results.length >= 100) {
        const loadMore = document.createElement('div');
        loadMore.className = 'load-more';
        loadMore.textContent = getLang('Load more results...', 'Weitere Ergebnisse laden...');
        loadMore.addEventListener('click', () => {
            performSearch(searchState.currentQuery, 500);
        });
        resultsContainer.appendChild(loadMore);
    }

    // Apply advanced filters after rendering
    applyMetadataFilters(results);
}

function createVideoElement(video, container) {
    const videoElement = document.createElement('div');
    videoElement.className = 'video-item search-result-item';
    const videoTitle = video.displayName;
    const videoPath = video.path;
    const channelName = video.path.split('/')[0];
    const videoPathWithoutExt = stripExtension(videoPath);
    
    videoElement.innerHTML = `
        <div class="thumbnail-container">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///////yH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                 alt="${videoTitle}" 
                 class="video-thumbnail" 
                 loading="lazy"
                 data-src="/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg">
            <div class="video-length"></div>
        </div>
        <div class="video-info">
            <div class="video-title">${videoTitle}</div>
            <div class="channel-info">
                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///////yH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                     alt="${channelName}" 
                     class="channel-pic" 
                     loading="lazy"
                     data-src="/channelpic/${encodeURIComponent(channelName)}.jpg">
                <div class="channel-name clickable-channel-name">${channelName}</div>
            </div>
            <div class="video-metadata"></div>
        </div>
    `;
    
    container.appendChild(videoElement);

    // Fetch view count and file date
    const metadataDiv = videoElement.querySelector('.video-metadata');
    
    Promise.all([
        fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(response => response.ok ? response.text() : '0'),
        fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`).then(response => response.ok ? response.text() : 'Unknown date')
    ])
    .then(([viewCount, fileDate]) => {
        let formattedViewCount = viewCount;
        if (!isNaN(viewCount) && viewCount !== '0') {
            formattedViewCount = parseInt(viewCount).toLocaleString();
        }
        
        const lang = localStorage.getItem('language');
        if (lang === 'de') {
            formattedViewCount = formattedViewCount.replace(/,/g, '.');
        }

        const cleanFileDate = fileDate.replace(/\s+/g, ' ').trim();
        const dateToShow = isRelativeDatesEnabled() ? getRelativeTime(cleanFileDate, lang) : cleanFileDate;
        
        metadataDiv.textContent = `${formattedViewCount} ${getLang('views', 'Aufrufe')} • ${dateToShow}`;
    })
    .catch(error => {
        console.error('Error fetching metadata:', error);
        metadataDiv.textContent = getLang('Views unavailable', 'Aufrufe nicht verfügbar');
    });

    // Video click handlers
    const videoUrl = `video.html?src=${encodeURIComponent(videoPath)}`;
    videoElement.querySelector('.video-thumbnail').addEventListener('click', () => navigateToVideo(videoUrl));
    videoElement.querySelector('.video-title').addEventListener('click', () => navigateToVideo(videoUrl));
    
    // Channel click handlers
    const channelUrl = `channel.html?channel=${encodeURIComponent(channelName)}`;
    videoElement.querySelector('.clickable-channel-name').addEventListener('click', (e) => {
        e.stopPropagation();
        navigateToChannel(channelName);
    });

    // Right-click and middle-click support
    setupContextMenu(videoElement.querySelector('.video-thumbnail'), videoUrl);
    setupContextMenu(videoElement.querySelector('.video-title'), videoUrl);
    setupContextMenu(videoElement.querySelector('.clickable-channel-name'), channelUrl);

    // Fetch and display video length
    const videoFilename = video.path.split('/').pop();
    const videoNameWithoutExt = stripExtension(videoFilename);
    fetch(`/videolengths/${encodeURIComponent(channelName)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
        .then(response => response.ok ? response.text() : '')
        .then(length => {
            videoElement.querySelector('.video-length').textContent = length;
        })
        .catch(error => {
            console.error('Error fetching video length:', error);
        });
}

function setupLazyLoading() {
    const lazyImageObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                if (img.dataset.src) {
                    img.src = img.dataset.src;
                    img.removeAttribute('data-src');
                }
                lazyImageObserver.unobserve(img);
            }
        });
    });

    document.querySelectorAll('img[data-src]').forEach(img => {
        lazyImageObserver.observe(img);
    });

    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
                if (node.nodeType === Node.ELEMENT_NODE) {
                    node.querySelectorAll('img[data-src]').forEach(img => {
                        lazyImageObserver.observe(img);
                    });
                }
            });
        });
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
}

function setupContextMenu(element, url) {
    element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openInNewTab(url);
    });
    
    element.addEventListener('mouseup', (e) => {
        if (e.button === 1) {
            e.preventDefault();
            openInNewTab(url);
        }
    });
}

function navigateToVideo(url) {
    window.location.href = url;
}

function navigateToChannel(channel) {
    window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
}

function openInNewTab(url) {
    window.open(url, '_blank');
}

function showError(message) {
    document.getElementById('searchResultsContainer').innerHTML = 
        `<div style="color: white; padding: 20px;">${message}</div>`;
}

// ======================================================================
// ADVANCED SEARCH FILTERS SYSTEM
// ======================================================================

const searchFilters = {
    type: 'video',
    length: '',
    properties: [],
    filetype: '',
    panelOpen: false,
    
    init() {
        this.bindEvents();
        this.loadFromURL();
    },
    
    bindEvents() {
        document.getElementById('filterToggle').addEventListener('click', () => {
            this.togglePanel();
        });
        
        document.getElementById('filterCloseBtn').addEventListener('click', () => {
            this.closePanel();
        });
        
        document.getElementById('filterOverlay').addEventListener('click', () => {
            this.closePanel();
        });
        
        document.getElementById('clearFiltersBtn').addEventListener('click', () => {
            this.clearAll();
        });
        
        document.getElementById('applyFiltersBtn').addEventListener('click', () => {
            this.applyFilters();
        });
        
        // Event delegation for filter options
        document.querySelectorAll('.filter-options-grid').forEach(grid => {
            grid.addEventListener('click', (e) => {
                const option = e.target.closest('.filter-option');
                if (!option) return;
                
                const group = grid.dataset.filterGroup;
                const value = option.dataset.value;
                
                this.handleOptionClick(group, value, option, grid);
            });
        });
        
        // Keyboard shortcut: Escape to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.panelOpen) {
                this.closePanel();
            }
        });
    },
    
    handleOptionClick(group, value, optionElement, grid) {
        if (group === 'properties') {
            optionElement.classList.toggle('active');
            this.updatePropertiesFromUI();
        } else {
            grid.querySelectorAll('.filter-option').forEach(opt => {
                opt.classList.remove('active');
            });
            optionElement.classList.add('active');
            
            if (group === 'type') this.type = value;
            if (group === 'length') this.length = value;
            if (group === 'filetype') this.filetype = value;
        }
        
        this.updateCountBadge();
    },
    
    updatePropertiesFromUI() {
        this.properties = [];
        document.querySelectorAll('[data-filter-group="properties"] .filter-option.active').forEach(el => {
            this.properties.push(el.dataset.value);
        });
    },
    
    togglePanel() {
        if (this.panelOpen) {
            this.closePanel();
        } else {
            this.openPanel();
        }
    },
    
    openPanel() {
        this.panelOpen = true;
        document.getElementById('filterPanel').classList.add('open');
        document.getElementById('filterOverlay').classList.add('visible');
        document.getElementById('filterToggle').classList.add('active');
        document.body.style.overflow = 'hidden';
    },
    
    closePanel() {
        this.panelOpen = false;
        document.getElementById('filterPanel').classList.remove('open');
        document.getElementById('filterOverlay').classList.remove('visible');
        document.getElementById('filterToggle').classList.remove('active');
        document.body.style.overflow = '';
    },
    
    clearAll() {
        this.type = 'video';
        this.length = '';
        this.properties = [];
        this.filetype = '';
        
        document.querySelectorAll('.filter-option').forEach(opt => {
            opt.classList.remove('active');
        });
        
        document.querySelector('[data-filter-group="type"] [data-value="video"]').classList.add('active');
        document.querySelector('[data-filter-group="length"] [data-value=""]').classList.add('active');
        document.querySelector('[data-filter-group="filetype"] [data-value=""]').classList.add('active');
        
        this.updateCountBadge();
    },
    
    applyFilters() {
        this.closePanel();
        
        const url = new URL(window.location);
        
        if (this.type && this.type !== 'video') url.searchParams.set('type', this.type);
        else url.searchParams.delete('type');
        
        if (this.length) url.searchParams.set('length', this.length);
        else url.searchParams.delete('length');
        
        if (this.properties.length > 0) url.searchParams.set('properties', this.properties.join(','));
        else url.searchParams.delete('properties');
        
        if (this.filetype) url.searchParams.set('filetype', this.filetype);
        else url.searchParams.delete('filetype');
        
        window.history.replaceState({}, '', url.toString());
        
        const currentQuery = document.getElementById('searchInput').value.trim();
        if (currentQuery) {
            performSearch(currentQuery);
        } else {
            this.displayFilteredResults();
        }
    },
    
    loadFromURL() {
        const params = new URLSearchParams(window.location.search);
        
        const typeParam = params.get('type');
        if (typeParam) {
            this.type = typeParam;
            const typeEl = document.querySelector(`[data-filter-group="type"] [data-value="${typeParam}"]`);
            if (typeEl) {
                document.querySelectorAll('[data-filter-group="type"] .filter-option').forEach(o => o.classList.remove('active'));
                typeEl.classList.add('active');
            }
        }
        
        const lengthParam = params.get('length');
        if (lengthParam) {
            this.length = lengthParam;
            const lenEl = document.querySelector(`[data-filter-group="length"] [data-value="${lengthParam}"]`);
            if (lenEl) {
                document.querySelectorAll('[data-filter-group="length"] .filter-option').forEach(o => o.classList.remove('active'));
                lenEl.classList.add('active');
            }
        }
        
        const propsParam = params.get('properties');
        if (propsParam) {
            this.properties = propsParam.split(',');
            this.properties.forEach(prop => {
                const propEl = document.querySelector(`[data-filter-group="properties"] [data-value="${prop}"]`);
                if (propEl) propEl.classList.add('active');
            });
        }
        
        const fileParam = params.get('filetype');
        if (fileParam) {
            this.filetype = fileParam;
            const fileEl = document.querySelector(`[data-filter-group="filetype"] [data-value="${fileParam}"]`);
            if (fileEl) {
                document.querySelectorAll('[data-filter-group="filetype"] .filter-option').forEach(o => o.classList.remove('active'));
                fileEl.classList.add('active');
            }
        }
        
        this.updateCountBadge();
    },
    
    updateCountBadge() {
        let count = 0;
        if (this.type && this.type !== 'video') count++;
        if (this.length) count++;
        if (this.properties.length > 0) count++;
        if (this.filetype) count++;
        
        const badge = document.getElementById('filterCount');
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }
    },
    
    filterResults(results) {
        if (!results || results.length === 0) return results;
        
        return results.filter(video => {
            if (this.filetype) {
                const ext = video.path.split('.').pop().toLowerCase();
                const videoExts = ['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'webm'];
                const audioExts = ['wav', 'flac', 'mp3', 'aac', 'ogg'];
                
                if (this.filetype === 'video' && !videoExts.includes(ext)) return false;
                if (this.filetype === 'audio' && !audioExts.includes(ext)) return false;
            }
            
            return true;
        });
    },
    
    displayFilteredResults() {
        console.log('Filters applied:', this.toJSON());
    },
    
    toJSON() {
        return {
            type: this.type,
            length: this.length,
            properties: [...this.properties],
            filetype: this.filetype
        };
    }
};

// Initialize filters when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
    searchFilters.init();
});

/**
 * Apply metadata-based filters asynchronously
 * Now includes RESOLUTION filtering via /videoresolutions/
 */
async function applyMetadataFilters(results) {
    const container = document.getElementById('searchResultsContainer');
    if (!container) return;
    
    const items = container.querySelectorAll('.search-result-item');
    const channelItems = container.querySelectorAll('.channel-result');
    
    const hasLengthFilter = !!searchFilters.length;
    const hasResolutionFilter = searchFilters.properties.some(p => ['4k', '2k', '1080p', '720p'].includes(p));
    const hasSubtitleFilter = searchFilters.properties.includes('subtitles');

    // Filetype filter (synchronous)
    if (searchFilters.filetype) {
        items.forEach((item, index) => {
            if (!results[index]) return;
            const ext = results[index].path.split('.').pop().toLowerCase();
            const videoExts = ['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'webm'];
            const audioExts = ['wav', 'flac', 'mp3', 'aac', 'ogg'];
            let keep = true;
            if (searchFilters.filetype === 'video' && !videoExts.includes(ext)) keep = false;
            if (searchFilters.filetype === 'audio' && !audioExts.includes(ext)) keep = false;
            if (!keep) {
                item.style.display = 'none';
                item.dataset.filteredOut = 'true';
            }
        });
        if (searchFilters.type === 'video') {
            channelItems.forEach(el => el.style.display = 'none');
        }
    }
    
    if (!hasLengthFilter && !hasResolutionFilter && !hasSubtitleFilter) return;
    
    const filterPromises = Array.from(items).map(async (item, index) => {
        if (item.style.display === 'none' || !results[index]) return { index, keep: true };
        const video = results[index];
        const videoPath = video.path;
        const basePath = stripExtension(videoPath);
        const pathParts = basePath.split('/');
        const channelName = pathParts[0];
        const videoName = pathParts[pathParts.length - 1];
        let shouldKeep = true;
        
        try {
            // Length check
            if (hasLengthFilter) {
                const lengthResponse = await fetch(`/videolengths/${encodeURIComponent(basePath)}.txt`);
                const lengthText = lengthResponse.ok ? await lengthResponse.text() : '';
                const seconds = parseDurationToSeconds(lengthText);
                if (searchFilters.length === 'short' && seconds >= 180) shouldKeep = false;
                if (searchFilters.length === 'medium' && (seconds < 180 || seconds > 1200)) shouldKeep = false;
                if (searchFilters.length === 'long' && seconds <= 1200) shouldKeep = false;
            }
            
            // Resolution check – UPDATED to read only the first line
            if (shouldKeep && hasResolutionFilter) {
                const resResponse = await fetch(`/videoresolutions/${encodeURIComponent(basePath)}.txt`);
                const resolutionText = resResponse.ok ? (await resResponse.text()).trim() : '';
                const resolution = resolutionText.split('\n')[0].trim().toLowerCase(); // <-- NEW
                
                const selectedResolutions = searchFilters.properties.filter(p => ['4k', '2k', '1080p', '720p'].includes(p));
                if (selectedResolutions.length > 0 && resolution) {
                    const match = selectedResolutions.some(selRes => {
                        switch(selRes) {
                            case '4k': return ['4k', '2160p', '3840x2160'].includes(resolution);
                            case '2k': return ['2k', '1440p', '2560x1440', 'qhd'].includes(resolution);
                            case '1080p': return ['1080p', 'hd', '1920x1080', 'fullhd', 'fhd'].includes(resolution);
                            case '720p': return ['720p', 'sd', '1280x720', 'hdready'].includes(resolution);
                            default: return false;
                        }
                    });
                    if (!match) shouldKeep = false;
                } else if (selectedResolutions.length > 0 && !resolution) {
                    shouldKeep = false;
                }
            }
        } catch (e) {
            console.warn(`Error filtering ${videoPath}:`, e);
        }
        
        if (!shouldKeep) {
            item.style.display = 'none';
            item.dataset.filteredOut = 'true';
        }
        return { index, keep: shouldKeep };
    });
    
    await Promise.all(filterPromises);
    
    const visibleItems = container.querySelectorAll('.search-result-item:not([style*="display: none"])');
    if (visibleItems.length === 0 && items.length > 0) {
        console.log('All results filtered out by current filter settings');
    }
}

function parseDurationToSeconds(durationStr) {
    if (!durationStr) return 0;
    
    const parts = durationStr.trim().split(':').reverse();
    let seconds = 0;
    
    if (parts[0]) seconds += parseInt(parts[0]) || 0;
    if (parts[1]) seconds += (parseInt(parts[1]) || 0) * 60;
    if (parts[2]) seconds += (parseInt(parts[2]) || 0) * 3600;
    
    return seconds;
}
