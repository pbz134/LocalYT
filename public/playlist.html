<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        /* Channel Header Styles (Added from channel.html) */
        .channel-banner {
            width: 70%;
            height: 170px;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
            cursor: pointer;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .divider {
            border-top: 1px solid #3f3f3f;
            margin: 20px 0;
        }

        /* Playlist Specific Styles */
        .playlist-header {
            padding: 20px;
            margin-left: 200px;
            background: #0f0f0f;
            margin-top: 20px; /* Adjusted margin */
            border-radius: 8px;
        }
        .playlist-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .playlist-info {
            color: #888;
            font-size: 14px;
        }
        .playlist-videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
            margin-left: 180px;
        }
        .video-item {
            margin: 10px;
            background: #0f0f0f;
            border-radius: 8px;
            overflow: hidden;
            width: 300px;
            text-align: center;
        }
        .video-thumbnail {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
        }
        .video-title {
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
        }
        .video-description {
            text-align: left;
            padding: 0 10px 10px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>

    <!-- Added Channel Banner -->
    <div id="channelBanner" class="channel-banner"></div>
    
    <!-- Added Channel Header -->
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
    </div>
    
    <div class="divider"></div>

    <div class="playlist-header">
        <div class="playlist-title" id="playlistTitle"></div>
        <div class="playlist-info" id="playlistInfo"></div>
    </div>

    <div class="playlist-videos" id="playlistVideosContainer"></div>

    <script>
// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        // Left click - navigate to homepage in same tab
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) { // Left click
                window.location.href = 'index.html';
            }
        });
        
        // Middle click (mouse wheel) - open homepage in new tab
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) { // Middle click
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        // Right click - open homepage in new tab (with context menu option)
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        // Add title for accessibility
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        
        // Add cursor styling
        mainLogo.style.cursor = 'pointer';
    }
});

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const channel = decodeURIComponent(urlParams.get('channel'));
            const playlist = decodeURIComponent(urlParams.get('playlist'));
            const playlistTitle = document.getElementById('playlistTitle');
            const playlistInfo = document.getElementById('playlistInfo');
            const videosContainer = document.getElementById('playlistVideosContainer');

            // Elements for Channel Header
            const channelBanner = document.getElementById('channelBanner');
            const channelPic = document.getElementById('channelPic');
            const channelName = document.getElementById('channelName');

            // Set Channel Info
            channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
            channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
            
            // Make channel picture clickable
            channelPic.addEventListener('click', () => {
                window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
            });

            // Fetch Subscriber Count and set Title
            fetch(`/subcount/${encodeURIComponent(channel)}`)
                .then(response => response.ok ? response.text() : '0')
                .then(subCount => {
                    // Fetch video count for the channel (optional, or just reuse the count we have)
                    // For simplicity, we will just show sub count here, or we can fetch the full count.
                    // Let's just show the name and sub count for now to match channel.html style
                    channelName.innerHTML = `${channel}<span class="video-count">${subCount} subscribers</span>`;
                })
                .catch(() => {
                    channelName.textContent = channel;
                });

            playlistTitle.textContent = playlist;
            document.title = `${playlist} - ${channel} - LocalYT`;

            fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist)}`)
                .then(response => response.json())
                .then(videos => {
                    playlistInfo.textContent = `${videos.length} videos`;
                    
                    videos.forEach(video => {
                        const videoElement = document.createElement('div');
                        videoElement.className = 'video-item';
                        const videoTitle = video.displayName;
                        const thumbnailSrc = `/thumbnails/${encodeURIComponent(video.path.replace(/\.mp4$/, ''))}.jpg`;
                        
                        videoElement.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                                <div class="video-length"></div>
                            </div>
                            <div class="video-title">${videoTitle}</div>
                            <div class="video-description">${video.viewCount} views • Uploaded on ${video.fileDate}</div>
                        `;
                        
                        videosContainer.appendChild(videoElement);

                        // --- Click Handlers ---
                        const videoThumb = videoElement.querySelector('.video-thumbnail');
                        const videoLink = videoElement.querySelector('.video-title');
                        const encodedPath = encodeURIComponent(video.path);
                        const videoUrl = `video.html?src=${encodedPath}`;

                        // Left click
                        videoThumb.addEventListener('click', () => openVideo(encodedPath));
                        videoLink.addEventListener('click', () => openVideo(encodedPath));

                        // Middle click (Mouse wheel)
                        const handleMiddleClick = (e) => {
                            if (e.button === 1) {
                                e.preventDefault();
                                window.open(videoUrl, '_blank');
                            }
                        };
                        
                        videoThumb.addEventListener('mouseup', handleMiddleClick);
                        videoThumb.addEventListener('auxclick', handleMiddleClick); // Auxclick is often better for middle click
                        videoLink.addEventListener('mouseup', handleMiddleClick);
                        videoLink.addEventListener('auxclick', handleMiddleClick);

                        // Right click
                        videoThumb.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            window.open(videoUrl, '_blank');
                        });
                        videoLink.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            window.open(videoUrl, '_blank');
                        });

                        // Get video length
                        fetch(`/videolengths/${channel}/${encodeURIComponent(video.path.split('/').pop().replace(/\.mp4$/, ''))}.txt`)
                            .then(response => response.text())
                            .then(length => {
                                videoElement.querySelector('.video-length').textContent = length;
                            })
                            .catch(error => {
                                console.error('Error fetching video length:', error);
                            });
                    });
                })
                .catch(error => {
                    console.error('Error fetching playlist videos:', error);
                    videosContainer.innerHTML = '<p style="color: #888;">Error loading playlist videos</p>';
                });

            // Search functionality
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                fetch('/videos')
                    .then(response => response.json())
                    .then(videos => {
                        const suggestions = videos
                            .filter(video => video.displayName.toLowerCase().includes(query))
                            .map(video => ({
                                title: video.displayName,
                                fullPath: video.path
                            }));

                        const suggestionsContainer = document.getElementById('searchSuggestions');
                        suggestionsContainer.innerHTML = '';
                        suggestions.forEach(suggestion => {
                            const suggestionElement = document.createElement('div');
                            suggestionElement.className = 'suggestion-item';
                            suggestionElement.textContent = suggestion.title;
                            suggestionElement.onclick = () => {
                                window.location.href = `video.html?src=${encodeURIComponent(suggestion.fullPath)}`;
                            };
                            suggestionsContainer.appendChild(suggestionElement);
                        });
                    });
            });

            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
                }
            });
        });

        function openVideo(videoSrc) {
            window.location.href = `video.html?src=${videoSrc}`;
        }
    </script>
</body>
</html>
