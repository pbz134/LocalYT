<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        /* Channel Header Styles */
        .channel-banner {
            width: 1400px;
            height: 100%;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
            cursor: pointer;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .divider {
            border-top: 1px solid #3f3f3f;
            margin: 20px 0;
        }

        /* Playlist Specific Styles */
        .playlist-header {
            padding: 20px;
            margin-left: 200px;
            background: #0f0f0f;
            margin-top: 20px;
        }
        .playlist-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .playlist-info {
            color: #888;
            font-size: 14px;
        }
        .playlist-videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
            margin-left: 180px;
        }
        .video-item {
            margin: 10px;
            background: #0f0f0f;
            overflow: hidden;
            width: 300px;
            text-align: center;
        }
        .video-thumbnail {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }
        .video-title {
            padding: 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
        }
        .video-description {
            text-align: left;
            padding: 0 10px 10px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>

    <!-- Added Channel Banner -->
    <div id="channelBanner" class="channel-banner"></div>
    
    <!-- Added Channel Header -->
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
    </div>
    
    <div class="divider"></div>

    <div class="playlist-header">
        <div class="playlist-title" id="playlistTitle"></div>
        <div class="playlist-info" id="playlistInfo"></div>
    </div>

    <div class="playlist-videos" id="playlistVideosContainer"></div>

    <script>
// Natural sorting function for videos with numbers in titles
function naturalCompare(a, b) {
    // Helper function to extract numbers from video titles
    const extractNumbers = (str) => {
        return (str.match(/\d+/g) || []).map(num => parseInt(num, 10));
    };

    const numsA = extractNumbers(a.displayName);
    const numsB = extractNumbers(b.displayName);

    // Compare number by number
    for (let i = 0; i < Math.max(numsA.length, numsB.length); i++) {
        const numA = i < numsA.length ? numsA[i] : 0;
        const numB = i < numsB.length ? numsB[i] : 0;
        
        if (numA !== numB) {
            return numA - numB;
        }
    }
    
    // If all numbers match, fall back to string comparison
    return a.displayName.localeCompare(b.displayName);
}

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const channel = decodeURIComponent(urlParams.get('channel'));
            const playlist = decodeURIComponent(urlParams.get('playlist'));
            const playlistTitle = document.getElementById('playlistTitle');
            const playlistInfo = document.getElementById('playlistInfo');
            const videosContainer = document.getElementById('playlistVideosContainer');

            // Elements for Channel Header
            const channelBanner = document.getElementById('channelBanner');
            const channelPic = document.getElementById('channelPic');
            const channelName = document.getElementById('channelName');

            // Set Channel Info
            channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
            channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
            
            // Make channel picture clickable
            channelPic.addEventListener('click', () => {
                window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
            });

            // Fetch Subscriber Count
            fetch(`/subcount/${encodeURIComponent(channel)}`)
                .then(response => response.ok ? response.text() : '0')
                .then(subCount => {
                    channelName.innerHTML = `${channel}<span class="video-count">${subCount} subscribers</span>`;
                })
                .catch(() => {
                    channelName.textContent = channel;
                });

            playlistTitle.textContent = playlist;
            document.title = `${playlist} - ${channel} - LocalYT`;

            fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist)}`)
                .then(response => response.json())
                .then(videos => {
                    // Sort videos using natural comparison for proper numeric ordering
                    videos.sort(naturalCompare);
                    
                    playlistInfo.textContent = `${videos.length} videos`;
                    
                    videos.forEach(video => {
                        const videoElement = document.createElement('div');
                        videoElement.className = 'video-item';
                        const videoTitle = video.displayName;
                        const thumbnailSrc = `/thumbnails/${encodeURIComponent(video.path.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, ''))}.jpg`;
                        
                        videoElement.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                                <div class="video-length"></div>
                            </div>
                            <div class="video-title">${videoTitle}</div>
                            <div class="video-description">${video.viewCount} views • Uploaded on ${video.fileDate}</div>
                        `;
                        
                        videosContainer.appendChild(videoElement);

                        // --- Click Handlers ---
                        const videoThumb = videoElement.querySelector('.video-thumbnail');
                        const videoLink = videoElement.querySelector('.video-title');
                        
                        // Construct URL with playlist parameter
                        const encodedPath = encodeURIComponent(video.path);
                        const videoUrl = `video.html?src=${encodedPath}&playlist=${encodeURIComponent(playlist)}`;

                        // Left click
                        const openHandler = () => { window.location.href = videoUrl; };
                        
                        videoThumb.addEventListener('click', openHandler);
                        videoLink.addEventListener('click', openHandler);

                        // Middle click (Mouse wheel)
                        const handleMiddleClick = (e) => {
                            if (e.button === 1) {
                                e.preventDefault();
                                window.open(videoUrl, '_blank');
                            }
                        };
                        
                        videoThumb.addEventListener('mouseup', handleMiddleClick);
                        videoThumb.addEventListener('auxclick', handleMiddleClick);
                        videoLink.addEventListener('mouseup', handleMiddleClick);
                        videoLink.addEventListener('auxclick', handleMiddleClick);

                        // Right click
                        const handleRightClick = (e) => {
                            e.preventDefault();
                            window.open(videoUrl, '_blank');
                        };
                        
                        videoThumb.addEventListener('contextmenu', handleRightClick);
                        videoLink.addEventListener('contextmenu', handleRightClick);

                        // Get video length
                        fetch(`/videolengths/${channel}/${encodeURIComponent(video.path.split('/').pop().replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, ''))}.txt`)
                            .then(response => response.text())
                            .then(length => {
                                videoElement.querySelector('.video-length').textContent = length;
                            })
                            .catch(error => {
                                console.error('Error fetching video length:', error);
                            });
                    });
                })
                .catch(error => {
                    console.error('Error fetching playlist videos:', error);
                    videosContainer.innerHTML = '<p style="color: #888;">Error loading playlist videos</p>';
                });

            // Search functionality
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                fetch('/videos')
                    .then(response => response.json())
                    .then(videos => {
                        const suggestions = videos
                            .filter(video => video.displayName.toLowerCase().includes(query))
                            .map(video => ({
                                title: video.displayName,
                                fullPath: video.path
                            }));

                        const suggestionsContainer = document.getElementById('searchSuggestions');
                        suggestionsContainer.innerHTML = '';
                        suggestions.forEach(suggestion => {
                            const suggestionElement = document.createElement('div');
                            suggestionElement.className = 'suggestion-item';
                            suggestionElement.textContent = suggestion.title;
                            suggestionElement.onclick = () => {
                                window.location.href = `video.html?src=${encodeURIComponent(suggestion.fullPath)}`;
                            };
                            suggestionsContainer.appendChild(suggestionElement);
                        });
                    });
            });

            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
                }
            });

            // --- Search icon click ---
            document.getElementById('searchIcon').addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                } else {
                    searchInput.focus();
                }
            });
        });
    </script>
    <script src="profile-pic.js"></script>
</body>
</html>
