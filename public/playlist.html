<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        /* Channel Header Styles */
        .channel-banner {
            width: 1400px;
            height: 100%;
            background-size: cover;
            background-position: center;
            margin: 80px auto;
            margin-bottom: 20px;
        }
        .channel-header {
            display: flex;
            align-items: center;
            margin: 20px 0;
            margin-left: 230px;
        }
        .channel-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-right: 30px;
            cursor: pointer;
        }
        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .video-count {
            color: #888;
            font-size: 18px;
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }
        .divider {
            border-top: 1px solid #3f3f3f;
            margin: 20px 0;
        }

        /* Playlist Specific Styles */
        .playlist-header {
            padding: 20px;
            margin-left: 200px;
            background: var(--main-bg-color);
            margin-top: 20px;
        }
        .playlist-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .playlist-info {
            color: #888;
            font-size: 14px;
        }
        /* New style for the duration element */
        .playlist-duration {
            color: #888;
            font-size: 14px;
            margin-top: 4px; /* Slight spacing from info above */
        }
        .playlist-videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
            margin-left: 180px;
        }
        .video-item {
            margin: 10px;
            background: var(--main-bg-color);
            overflow: hidden;
            width: 300px;
            text-align: center;
        }
        .video-thumbnail {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }
        .video-title {
            padding: 10px 10px 2px 10px;
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
            margin-bottom: -5px;
        }
        .video-description {
            text-align: left;
            padding: 0 10px 10px;
            color: #888;
            font-size: 14px;
        }
        .thumbnail-container {
            position: relative;
        }
        .video-length {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; /* Hidden by default when input is empty */
        }

        /* Show suggestions only when the search container (input) is focused/active */
        .search-container:focus-within .search-suggestions {
            display: block;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>

    <!-- Added Channel Banner -->
    <div id="channelBanner" class="channel-banner"></div>
    
    <!-- Added Channel Header -->
    <div class="channel-header">
        <img id="channelPic" class="channel-pic" alt="Channel Picture" loading="lazy">
        <div id="channelName" class="channel-name"></div>
    </div>
    
    <div class="divider"></div>

    <div class="playlist-header">
        <div class="playlist-title" id="playlistTitle"></div>
        <div class="playlist-info" id="playlistInfo"></div>
        <!-- Added element for Total Duration -->
        <div class="playlist-duration" id="playlistDuration"></div>
    </div>

    <div class="playlist-videos" id="playlistVideosContainer"></div>

    <script>
// --- Language Helper ---
function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Natural sorting function for videos with numbers in titles
function naturalCompare(a, b) {
    const extractNumbers = (str) => {
        return (str.match(/\d+/g) || []).map(num => parseInt(num, 10));
    };

    const numsA = extractNumbers(a.displayName);
    const numsB = extractNumbers(b.displayName);

    for (let i = 0; i < Math.max(numsA.length, numsB.length); i++) {
        const numA = i < numsA.length ? numsA[i] : 0;
        const numB = i < numsB.length ? numsB[i] : 0;
        
        if (numA !== numB) {
            return numA - numB;
        }
    }
    
    return a.displayName.localeCompare(b.displayName);
}

// Helper to parse "HH:MM:SS" or "MM:SS" string into total seconds
function parseDurationString(durationStr) {
    if (!durationStr) return 0;
    const parts = durationStr.split(':').map(Number);
    let seconds = 0;
    // Handle HH:MM:SS
    if (parts.length === 3) {
        seconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
    } 
    // Handle MM:SS
    else if (parts.length === 2) {
        seconds = parts[0] * 60 + parts[1];
    }
    return seconds;
}

// Helper to format total seconds back into "HH:MM:SS"
function formatTotalDuration(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    // Pad with zeros
    const h = hours.toString().padStart(2, '0');
    const m = minutes.toString().padStart(2, '0');
    const s = seconds.toString().padStart(2, '0');

    return `${h}:${m}:${s}`;
}

// Handle logo clicks and initial translations
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
                window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }

    // --- Search Navigation Logic ---
    const searchInput = document.getElementById('searchInput');
    searchInput.placeholder = getLang('Search', 'Suchen');

    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });
});

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const channel = decodeURIComponent(urlParams.get('channel'));
    const playlist = decodeURIComponent(urlParams.get('playlist'));
    const playlistTitle = document.getElementById('playlistTitle');
    const playlistInfo = document.getElementById('playlistInfo');
    const playlistDurationEl = document.getElementById('playlistDuration'); // Get new element
    const videosContainer = document.getElementById('playlistVideosContainer');

    // Elements for Channel Header
    const channelBanner = document.getElementById('channelBanner');
    const channelPic = document.getElementById('channelPic');
    const channelName = document.getElementById('channelName');

    // Set Channel Info
    channelBanner.style.backgroundImage = `url('/channelbanner/${encodeURIComponent(channel)}.jpg')`;
    channelPic.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
    
    // Make channel picture clickable
    channelPic.addEventListener('click', () => {
        window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
    });

    // Fetch Subscriber Count
    fetch(`/subcount/${encodeURIComponent(channel)}`)
        .then(response => response.ok ? response.text() : '0')
        .then(subCount => {
            // FIX: Remove commas before parsing to integer
            let cleanCount = parseInt(subCount.replace(/,/g, ''));
            let formattedSubCount = cleanCount.toLocaleString();
            
            if (localStorage.getItem('language') === 'de') {
                formattedSubCount = formattedSubCount.replace(/,/g, '.');
            }
            channelName.innerHTML = `${channel}<span class="video-count">${formattedSubCount} ${getLang('subscribers', 'Abonnenten')}</span>`;
        })
        .catch(() => {
            channelName.textContent = channel;
        });

    playlistTitle.textContent = playlist;
    document.title = `${playlist} - ${channel} - LocalYT`;

    fetch(`/playlist-videos/${encodeURIComponent(channel)}/${encodeURIComponent(playlist)}`)
        .then(response => response.json())
        .then(videos => {
            videos.sort(naturalCompare);
            
            playlistInfo.textContent = `${videos.length} ${getLang('videos', 'Videos')}`;

            // Variable to accumulate total time in seconds
            let totalPlaylistSeconds = 0;
            
            videos.forEach(video => {
                const videoElement = document.createElement('div');
                videoElement.className = 'video-item';
                const videoTitle = video.displayName;
                const thumbnailSrc = `/thumbnails/${encodeURIComponent(video.path.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, ''))}.jpg`;

                // Format view count for current language
                let rawViews = (video.viewCount || "0").replace(/,/g, '');
                let formattedViewCount = parseInt(rawViews).toLocaleString('en-US');
                
                if (localStorage.getItem('language') === 'de') {
                    formattedViewCount = formattedViewCount.replace(/,/g, '.');
                }

                videoElement.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                        <div class="video-length"></div>
                    </div>
                    <div class="video-title">${videoTitle}</div>
                    <div class="video-description">${formattedViewCount} ${getLang('views', 'Aufrufe')} • ${getLang('Uploaded on', 'Hochgeladen am')} ${video.fileDate}</div>
                `;
                
                videosContainer.appendChild(videoElement);

                // --- Click Handlers ---
                const videoThumb = videoElement.querySelector('.video-thumbnail');
                const videoLink = videoElement.querySelector('.video-title');
                
                const encodedPath = encodeURIComponent(video.path);
                const videoUrl = `video.html?src=${encodedPath}&playlist=${encodeURIComponent(playlist)}`;

                const openHandler = () => { window.location.href = videoUrl; };
                
                videoThumb.addEventListener('click', openHandler);
                videoLink.addEventListener('click', openHandler);

                const handleMiddleClick = (e) => {
                    if (e.button === 1) {
                        e.preventDefault();
                        window.open(videoUrl, '_blank');
                    }
                };
                
                videoThumb.addEventListener('mouseup', handleMiddleClick);
                videoThumb.addEventListener('auxclick', handleMiddleClick);
                videoLink.addEventListener('mouseup', handleMiddleClick);
                videoLink.addEventListener('auxclick', handleMiddleClick);

                const handleRightClick = (e) => {
                    e.preventDefault();
                    window.open(videoUrl, '_blank');
                };
                
                videoThumb.addEventListener('contextmenu', handleRightClick);
                videoLink.addEventListener('contextmenu', handleRightClick);

                // Get video length and add to total
                fetch(`/videolengths/${channel}/${encodeURIComponent(video.path.split('/').pop().replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, ''))}.txt`)
                    .then(response => response.text())
                    .then(length => {
                        videoElement.querySelector('.video-length').textContent = length;
                        
                        // Add logic for total duration calculation
                        const secs = parseDurationString(length.trim());
                        totalPlaylistSeconds += secs;

                        // Update the DOM element with the running total
                        // We do this inside the fetch so it updates as lengths load
                        const formattedTotal = formatTotalDuration(totalPlaylistSeconds);
                        playlistDurationEl.textContent = `${getLang('Total duration', 'Gesamtdauer')}: ${formattedTotal}`;
                    })
                    .catch(error => {
                        console.error('Error fetching video length:', error);
                    });
            });
        })
        .catch(error => {
            console.error('Error fetching playlist videos:', error);
            videosContainer.innerHTML = `<p style="color: #888;">${getLang('Error loading playlist videos', 'Fehler beim Laden der Playlist-Videos')}</p>`;
        });
});
    </script>
    <!-- External Search Suggestion Script (Handles dropdown logic) -->
    <script src="search-suggestions.js"></script>
    <script src="profile-pic.js"></script>
</body>
</html>
