<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch History - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="skeleton.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">

    <style>
        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; /* Hidden by default */
        }

        /* Show when container has focus AND has content */
        .search-container:focus-within .search-suggestions:not(:empty) {
            display: block;
        }

        /* --- Prevent Middle-Click Autoscroll (Pan Mode) --- */
        
        /* Prevent selection on interactive items to stop scroll behavior */
        .video-item,
        .video-title,
        .thumbnail-container,
        .channel-name,
        .suggestion-item,
        #mainLogo {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Ensure cursor looks normal, not like a scroll tool */
        .video-item * {
            cursor: default;
        }
        
        .video-title,
        .thumbnail-container,
        .channel-name,
        .suggestion-item,
        #mainLogo {
            cursor: pointer;
        }

        .video-item .video-description {
            margin-left: -48px;
        }

        /* --- Remove Button Styles & Fix 3-Dot Overlap --- */
        /* Move 3-dot menu to the left to make room for the remove button on the right */
        .video-item .thumbnail-menu-btn {
            right: auto !important;
            left: 4px !important;
        }

        .video-item .remove-video-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            z-index: 12; /* Higher than the 3-dot menu */
            padding: 0;
        }
        .video-item:hover .remove-video-btn { opacity: 1; }
        .video-item .remove-video-btn:hover { background: #ff4444; }

        .login-prompt {
            color: #888;
            text-align: center;
            padding: 80px 20px;
        }
        .login-prompt a {
            color: #3ea6ff;
            text-decoration: none;
            font-weight: 500;
        }
        .login-prompt a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.svg" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div class="container" id="videoContainer"></div>
    
    <script>
// ======================================================================
// FIX: Prevent Middle-Click Autoscroll (Pan Mode)
// ======================================================================
document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        const target = e.target.closest(
            'a, ' + 
            '.video-item, ' + 
            '.video-title, ' + 
            '.thumbnail-container', 
            '.channel-name', 
            '.suggestion-item, ' +
            '#mainLogo'
        );
        
        if (target) {
            e.preventDefault();
            if (target.tagName === 'A' && target.href) {
                window.open(target.href, '_blank');
            }
        }
    }
}, true);

function stripExtension(filename) {
    return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
}

function getVideoExtension(path) {
    const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
    return match ? match[1] : 'mp4';
}

function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Check if relative dates are enabled (reads fresh each time)
function isRelativeDatesEnabled() {
    const setting = JSON.parse(localStorage.getItem('relativeDates') || '{"enabled":true}');
    return setting.enabled !== false;
}

// Helper function to convert DD.MM.YYYY to relative time
function getRelativeTime(dateStr, lang) {
    const parts = dateStr.split('.');
    if (parts.length !== 3) return dateStr; // fallback to original if parsing fails

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1;
    const year = parseInt(parts[2], 10);
    const date = new Date(year, month, day);
    const now = new Date();
    now.setHours(0, 0, 0, 0); // compare dates only

    const diffMs = now.getTime() - date.getTime();
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    if (diffDays < 0) return dateStr; // future date
    if (diffDays === 0) return lang === 'de' ? 'heute' : 'today';
    if (diffDays < 7) {
        return lang === 'de' ? `vor ${diffDays} ${diffDays === 1 ? 'Tag' : 'Tagen'}` : `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return lang === 'de' ? `vor ${weeks} ${weeks === 1 ? 'Woche' : 'Wochen'}` : `${weeks} week${weeks === 1 ? '' : 's'} ago`;
    }
    if (diffDays < 365) {
        const months = Math.floor(diffDays / 30);
        return lang === 'de' ? `vor ${months} ${months === 1 ? 'Monat' : 'Monaten'}` : `${months} month${months === 1 ? '' : 's'} ago`;
    }
    const years = Math.floor(diffDays / 365);
    return lang === 'de' ? `vor ${years} ${years === 1 ? 'Jahr' : 'Jahren'}` : `${years} year${years === 1 ? '' : 's'} ago`;
}

// ==============================
// Lazy Loading Variables
// ==============================
let watchHistoryVideos = [];
let displayedVideosCount = 0;
const BATCH_SIZE = 20;
let isLoadingMoreHistory = false;

document.addEventListener('DOMContentLoaded', () => {
    
    // --- 1. LOGO SETUP ---
    const mainLogo = document.getElementById('mainLogo');
    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) { // Left click
                window.location.href = 'index.html';
            }
        });
        
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) { // Middle click
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }

    // --- 2. SEARCH NAVIGATION LOGIC ---
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
        }
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        } else {
            searchInput.focus();
        }
    });

    // --- 3. LOAD HISTORY WITH LAZY LOADING ---
    const container = document.getElementById('videoContainer');
    
    // Show skeletons while loading initial batch
    showSkeletons(12, 'videoContainer', 'video');

    fetch('/user-history')
        .then(response => response.json())
        .then(videos => {
            // Remove skeletons
            hideSkeletons();
            
            // If no videos, show a message
            if (!videos || videos.length === 0) {
                container.innerHTML = `<div style="color: white; padding: 20px; text-align: center;">${getLang('Your watch history is empty.', 'Dein Wiedergabeverlauf ist leer.')}</div>`;
                return;
            }
            
            // Store all videos in memory
            watchHistoryVideos = videos;
            displayedVideosCount = 0;
            
            // Load first batch
            loadMoreHistoryVideos();
            
            // Setup scroll listener for infinite scroll
            setupInfiniteScroll();
        })
        .catch(error => {
            console.error('Error loading watch history:', error);
            hideSkeletons();
            container.innerHTML = `
                <div class="login-prompt">
                    <p style="font-size:20px; margin-bottom:12px;">${getLang('Please log in to see your watch history', 'Bitte melde dich an, um deinen Wiedergabeverlauf zu sehen')}</p>
                    <a href="login.html">${getLang('Go to Login', 'Zum Login')}</a>
                </div>
            `;
        });
});

// ==============================
// Lazy Loading Functions
// ==============================
function loadMoreHistoryVideos() {
    if (isLoadingMoreHistory) return;
    
    const container = document.getElementById('videoContainer');
    const remainingVideos = watchHistoryVideos.length - displayedVideosCount;
    
    if (remainingVideos <= 0) {
        // No more videos to load
        return;
    }
    
    isLoadingMoreHistory = true;
    
    // Calculate how many videos to load in this batch
    const videosToLoad = Math.min(BATCH_SIZE, remainingVideos);
    
    // Show skeletons at the bottom for the next batch
    showSkeletons(Math.min(videosToLoad, 12), 'videoContainer', 'video');
    
    // Simulate a small delay to allow skeletons to render
    setTimeout(() => {
        hideSkeletons();
        
        const batchEnd = displayedVideosCount + videosToLoad;
        const batchVideos = watchHistoryVideos.slice(displayedVideosCount, batchEnd);
        
        renderHistoryVideos(batchVideos);
        
        displayedVideosCount = batchEnd;
        isLoadingMoreHistory = false;
    }, 300);
}

function setupInfiniteScroll() {
    window.addEventListener('scroll', () => {
        // Check if user is near the bottom of the page
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
            if (!isLoadingMoreHistory && displayedVideosCount < watchHistoryVideos.length) {
                loadMoreHistoryVideos();
            }
        }
    });
}

function renderHistoryVideos(videos) {
    const container = document.getElementById('videoContainer');
    
    videos.forEach(video => {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        videoElement.style.transition = 'opacity 0.3s';
        
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        const channel = video.path.split('/')[0];
        const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;
        const lang = localStorage.getItem('language');
        const dateToShow = isRelativeDatesEnabled() ? getRelativeTime(video.fileDate, lang) : video.fileDate;

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <button class="remove-video-btn" title="${getLang('Remove', 'Entfernen')}">&times;</button>
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length"></div>
            </div>
            <div class="video-info">
                <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy">
                <div class="video-details">
                    <div class="video-title">${videoTitle}</div>
                    <div class="channel-name">${channel}</div>
                    <div class="video-description">${lang === 'de' ? video.viewCount.replace(/,/g, '.') : video.viewCount} ${lang === 'de' ? 'Aufrufe' : 'views'} • ${dateToShow}</div>
                </div>
            </div>
        `;
        container.appendChild(videoElement);

        // Remove Button Logic
        const removeBtn = videoElement.querySelector('.remove-video-btn');
        removeBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                const res = await fetch('/remove-from-history', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ video: video.path })
                });
                if (res.ok) {
                    videoElement.style.opacity = '0';
                    setTimeout(() => videoElement.remove(), 300);
                    
                    // Remove from the array
                    const videoIndex = watchHistoryVideos.indexOf(video);
                    if (videoIndex > -1) {
                        watchHistoryVideos.splice(videoIndex, 1);
                        displayedVideosCount--;
                    }
                } else {
                    console.error('Failed to remove from history');
                }
            } catch (err) {
                console.error('Error removing from history:', err);
            }
        });

        // Thumbnail Click Handlers
        const thumbContainer = videoElement.querySelector('.thumbnail-container');
        thumbContainer.addEventListener('click', () => {
            window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
        });

        // Video Title Click Handlers
        const videoLink = videoElement.querySelector('.video-title');
        
        // Left click
        videoLink.addEventListener('click', () => {
            window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
        });

        videoLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        videoLink.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        });

        // Channel Name Click Handlers
        const channelLink = videoElement.querySelector('.channel-name');
        
        // Left click
        channelLink.addEventListener('click', () => {
            window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
        });

        channelLink.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
        });

        channelLink.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
            }
        });

        // Fetch video length
        const videoFilename = video.path.split('/').pop();
        const videoNameWithoutExt = stripExtension(videoFilename);
        fetch(`/videolengths/${channel}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
            .then(response => response.text())
            .then(length => {
                videoElement.querySelector('.video-length').textContent = length;
            })
            .catch(error => {
                console.error('Error fetching video length:', error);
            });
    });
}

// ==============================
// Apply Rounded Corners Preference
// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .video-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();
    </script>
    
    <!-- External Scripts -->
    <script src="search-suggestions.js"></script>
    <script src="profile-pic.js"></script>
    <script src="sidebar.js"></script>
    <script src="thumbnail-context-menu.js"></script>
    <script src="skeleton-loader.js"></script>
</body>
</html>
