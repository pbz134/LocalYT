<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: var(--main-bg-color);
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f1f1f1;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        #main {
            padding: 16px;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: #111;
            color: white;
            border: none;
            margin-top: -5px;
        }

        .openbtn:hover {
            background-color: #444;
        }

        .page-title {
            color: #f1f1f1;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .channels-row-wrapper {
            background: var(--main-bg-color);
            border-bottom: 1px solid #333;
            padding: 32px 0 16px 0;
            margin: -16px -16px 24px -16px;
            padding-left: 16px;
            padding-right: 16px;
            overflow-x: auto;
        }

        .channels-row {
            display: flex;
            gap: 24px;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #555 #111;
        }

        .channels-row::-webkit-scrollbar {
            height: 6px;
        }

        .channels-row::-webkit-scrollbar-track {
            background: #111;
        }

        .channels-row::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .channel-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            width: 80px;
            transition: opacity 0.2s;
        }

        .channel-item:hover {
            opacity: 0.8;
        }

        .channel-item.selected .channel-avatar {
            outline: 3px solid #f1f1f1;
            outline-offset: 2px;
            border-radius: 50%;
        }

        .channel-item.selected .channel-label {
            color: #f1f1f1;
        }

        .channel-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }

        .channel-label {
            margin-top: 8px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .video-item {
            cursor: pointer;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-length {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .video-info {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .channel-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: #222;
        }

        .video-details {
            min-width: 0;
        }

        .video-title {
            color: #f1f1f1;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
        }

        .video-title:hover {
            color: #fff;
        }

        .channel-name {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
            cursor: pointer;
        }

        .channel-name:hover {
            color: #f1f1f1;
        }

        .video-description {
            color: #aaa;
            font-size: 13px;
            margin-top: 2px;
        }

        .empty-state {
            color: #888;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .login-prompt {
            color: #888;
            text-align: center;
            padding: 80px 20px;
        }

        .login-prompt a {
            color: #3ea6ff;
            text-decoration: none;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        .section-label {
            color: #aaa;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #f1f1f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; 
        }

        .search-container:focus-within .search-suggestions {
            display: block;
        }

        /* --- FIX: Prevent Middle-Click Autoscroll (Pan Mode) --- */
        
        .channel-item,
        .video-item,
        .video-title,
        .thumbnail-container,
        .channel-name,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            -webkit-user-select: none;
            user-select: none;
        }

        .video-item * {
            cursor: default;
        }
        
        .video-title,
        .thumbnail-container,
        .channel-name,
        .channel-item,
        .suggestion-item,
        #mainLogo,
        .openbtn {
            cursor: pointer;
        }
    </style>
</head>
<body class="index-page">
    <header class="top-bar">
        <button class="openbtn" onclick="toggleNav()">☰</button>
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>

    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="watch_history.html" id="sidebarWatchHistory">Watch History</a>
        <a href="liked_videos.html" id="sidebarLikedVideos">Liked Videos</a>
        <a href="subscribed_channels.html" id="sidebarSubscriptions">Subscriptions</a>
        <a href="user_playlists.html" id="sidebarPlaylists">Playlists</a>
        <a href="about.html" id="sidebarAbout">About</a>
    </div>

    <div id="main">
        <div class="page-title">Subscriptions</div>

        <div id="channelsRowWrapper" class="channels-row-wrapper" style="display:none;">
            <div id="channelsRow" class="channels-row"></div>
        </div>

        <div id="contentArea">
            <div class="loading-spinner" id="loadingState">Loading subscriptions</div>
        </div>
    </div>

    <script>
        let selectedChannel = null;

        // ======================================================================
        // FIX: Prevent Middle-Click Autoscroll (Pan Mode)
        // ======================================================================
        document.addEventListener('mousedown', function(e) {
            if (e.button === 1) {
                const target = e.target.closest(
                    'a, ' + 
                    '.channel-item, ' +
                    '.video-item, ' + 
                    '.video-title, ' + 
                    '.thumbnail-container, ' + 
                    '.channel-name, ' + 
                    '.suggestion-item, ' +
                    '#mainLogo'
                );
                
                if (target) {
                    e.preventDefault();
                    if (target.tagName === 'A' && target.href) {
                        window.open(target.href, '_blank');
                    }
                }
            }
        }, true);

        function getLang(en, de) {
            return localStorage.getItem('language') === 'de' ? de : en;
        }

        function toggleNav() {
            const sidebar = document.getElementById("mySidebar");
            if (sidebar.style.width === "250px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "250px";
            }
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        function stripExtension(filename) {
            return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
        }

        function setupVideoLinkEvents(element, path) {
            element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
            });
            element.addEventListener('mouseup', (e) => {
                if (e.button === 1) {
                    e.preventDefault();
                    window.open(`video.html?src=${encodeURIComponent(path)}`, '_blank');
                }
            });
        }

        function setupChannelLinkEvents(element, channel) {
            element.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
            });
            element.addEventListener('mouseup', (e) => {
                if (e.button === 1) {
                    e.preventDefault();
                    window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
                }
            });
            element.style.cursor = 'pointer';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mainLogo = document.getElementById('mainLogo');
            if (mainLogo) {
                mainLogo.addEventListener('click', (e) => {
                    if (e.button === 0) window.location.href = 'index.html';
                });
                mainLogo.addEventListener('mouseup', (e) => {
                    if (e.button === 1) { e.preventDefault(); window.open('index.html', '_blank'); }
                });
                mainLogo.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); window.open('index.html', '_blank');
                });
                mainLogo.title = "Go to homepage";
                mainLogo.style.cursor = 'pointer';
            }

            document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');
            document.getElementById('sidebarWatchHistory').textContent = getLang('Watch History', 'Wiedergabeverlauf');
            document.getElementById('sidebarLikedVideos').textContent = getLang('Liked Videos', 'Videos, die ich mag');
            document.getElementById('sidebarSubscriptions').textContent = getLang('Subscriptions', 'Abonnements');
            document.getElementById('sidebarPlaylists').textContent = getLang('Playlists', 'Playlisten');
            document.getElementById('sidebarAbout').textContent = getLang('About', 'Über');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                if (query.length < 2) {
                    document.getElementById('searchSuggestions').innerHTML = '';
                    return;
                }
                fetch('/search-index')
                    .then(r => r.json())
                    .then(data => {
                        const suggestions = data.videos
                            .filter(v => v.displayName.toLowerCase().includes(query))
                            .slice(0, 5);
                        const container = document.getElementById('searchSuggestions');
                        container.innerHTML = '';
                        suggestions.forEach(s => {
                            const el = document.createElement('div');
                            el.className = 'suggestion-item';
                            el.textContent = s.displayName;
                            el.onclick = () => window.location.href = `video.html?src=${encodeURIComponent(s.path)}`;
                            
                            // Add wheel click support for search suggestions too
                            el.addEventListener('mouseup', (e) => {
                                if (e.button === 1) {
                                    e.preventDefault();
                                    window.open(`video.html?src=${encodeURIComponent(s.path)}`, '_blank');
                                }
                            });
                            
                            container.appendChild(el);
                        });
                    });
            });
            
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
            });

            document.getElementById('searchIcon').addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                } else {
                    searchInput.focus();
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus().then(loggedIn => {
                if (!loggedIn) {
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('contentArea').innerHTML = `
                        <div class="login-prompt">
                            <p style="font-size:20px; margin-bottom:12px;">Please log in to see your subscriptions</p>
                            <a href="login.html">Go to Login</a>
                        </div>
                    `;
                    return;
                }
                loadSubscriptions();
            });
        });

        function checkLoginStatus() {
            return fetch('/session-user')
                .then(r => {
                    if (r.ok) return r.json();
                    throw new Error('Not logged in');
                })
                .then(data => {
                    if (data.username) return true;
                    return false;
                })
                .catch(() => false);
        }

        function loadSubscriptions() {
            fetch('/user-subscriptions')
                .then(r => {
                    if (!r.ok) throw new Error('Not authenticated');
                    return r.json();
                })
                .then(channels => {
                    const loadingState = document.getElementById('loadingState');
                    loadingState.style.display = 'none';

                    if (!channels || channels.length === 0) {
                        document.getElementById('contentArea').innerHTML = `
                            <div class="empty-state">
                                <span class="icon">📺</span>
                                <p>You haven't subscribed to any channels yet.</p>
                                <p style="margin-top:8px;">Go to a channel page and click Subscribe to get started.</p>
                            </div>
                        `;
                        return;
                    }

                    renderChannelRow(channels);
                    selectChannel(channels[0]);
                })
                .catch(err => {
                    console.error('Error loading subscriptions:', err);
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('contentArea').innerHTML = `
                        <div class="login-prompt">
                            <a href="login.html">Please log in to see your subscriptions</a>
                        </div>
                    `;
                });
        }

        function renderChannelRow(channels) {
            const wrapper = document.getElementById('channelsRowWrapper');
            const row = document.getElementById('channelsRow');
            row.innerHTML = '';
            wrapper.style.display = 'block';

            channels.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.dataset.channel = channel;

                const avatar = document.createElement('img');
                avatar.className = 'channel-avatar';
                avatar.src = `/channelpic/${encodeURIComponent(channel)}.jpg`;
                avatar.alt = channel;
                avatar.loading = 'lazy';

                const label = document.createElement('span');
                label.className = 'channel-label';
                label.textContent = channel;
                label.title = channel;

                item.appendChild(avatar);
                item.appendChild(label);

                item.addEventListener('click', () => selectChannel(channel));

                row.appendChild(item);
            });
        }

        function selectChannel(channel) {
            selectedChannel = channel;

            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.channel === channel);
            });

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="section-label">${channel}</div>
                <div class="loading-spinner">Loading videos</div>
            `;

            fetch(`/channel-random-videos/${encodeURIComponent(channel)}?limit=30`)
                .then(r => r.json())
                .then(videos => {
                    if (!videos || videos.length === 0) {
                        contentArea.innerHTML = `
                            <div class="section-label">${channel}</div>
                            <div class="empty-state">No videos found for this channel.</div>
                        `;
                        return;
                    }

                    contentArea.innerHTML = `<div class="section-label">${channel}</div><div class="videos-grid" id="videosGrid"></div>`;
                    renderVideos(videos);
                })
                .catch(err => {
                    console.error('Error loading channel videos:', err);
                    contentArea.innerHTML = `
                        <div class="section-label">${channel}</div>
                        <div class="empty-state">Failed to load videos.</div>
                    `;
                });
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');
            if (!grid) return;

            videos.forEach(video => {
                const el = document.createElement('div');
                el.className = 'video-item';

                const videoTitle = video.displayName;
                const videoPathWithoutExt = stripExtension(video.path);
                const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
                const channel = video.path.split('/')[0];
                const channelPicSrc = `/channelpic/${encodeURIComponent(channel)}.jpg`;

                el.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${thumbnailSrc}" alt="${videoTitle}" loading="lazy">
                        <div class="video-length"></div>
                    </div>
                    <div class="video-info">
                        <img src="${channelPicSrc}" alt="${channel}" class="channel-pic" loading="lazy">
                        <div class="video-details">
                            <div class="video-title">${videoTitle}</div>
                            <div class="channel-name">${channel}</div>
                            <div class="video-description">${video.viewCount} ${getLang('views', 'Aufrufe')} &bull; ${video.fileDate}</div>
                        </div>
                    </div>
                `;

                const thumbContainer = el.querySelector('.thumbnail-container');
                thumbContainer.addEventListener('click', () => {
                    window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
                });
                thumbContainer.style.cursor = 'pointer';

                const titleEl = el.querySelector('.video-title');
                titleEl.addEventListener('click', () => {
                    window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
                });
                setupVideoLinkEvents(titleEl, video.path);

                const channelEl = el.querySelector('.channel-name');
                channelEl.addEventListener('click', () => {
                    window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
                });
                setupChannelLinkEvents(channelEl, channel);

                grid.appendChild(el);

                const videoFilename = video.path.split('/').pop();
                const videoNameWithoutExt = stripExtension(videoFilename);
                fetch(`/videolengths/${channel}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
                    .then(r => r.text())
                    .then(length => {
                        const lengthEl = el.querySelector('.video-length');
                        if (lengthEl) lengthEl.textContent = length;
                    })
                    .catch(() => {});
            });
        }
    </script>
    <script src="profile-pic.js"></script>
</body>
</html>
