<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .profile-page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 100px 20px 40px;
        }

        .profile-pic-display {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #444;
            margin-bottom: 30px;
        }

        .profile-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .profile-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 5px;
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .profile-btn.upload {
            background-color: #ff0000;
            color: #fff;
        }

        .profile-btn.upload:hover {
            background-color: #cc0000;
        }

        .profile-btn.remove {
            background-color: #333;
            color: #ccc;
        }

        .profile-btn.remove:hover {
            background-color: #555;
        }

        .profile-status {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }

        .login-prompt {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 16px;
        }

        .login-prompt a {
            color: #ff4444;
            text-decoration: none;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        #fileInput {
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 5px;
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
        }

        .toast.error {
            background-color: #cc0000;
            color: #fff;
        }

        .toast.success {
            background-color: #2d7d32;
            color: #fff;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
        <div class="user-actions" id="userActions"></div>
    </header>

    <div class="profile-page-container">
        <div id="loginPrompt" class="login-prompt hidden">
            You need to be logged in to change your profile picture.<br><br>
            <a href="login.html">Log in</a>
        </div>

        <div id="profileSection" class="hidden">
            <img id="profilePicDisplay" class="profile-pic-display" src="LocalYT-Rev-Files/user-profile-placeholder.jpg" alt="Profile Picture">
            <div class="profile-actions">
                <button class="profile-btn upload" id="uploadBtn">Upload Picture</button>
                <button class="profile-btn remove hidden" id="removeBtn">Remove Picture</button>
            </div>
            <div class="profile-status" id="profileStatus">Using default profile picture</div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

    <div class="toast error" id="errorToast"></div>
    <div class="toast success" id="successToast"></div>

    <script src="profile-pic.js"></script>
    <script>
        const PLACEHOLDER_SRC = '/LocalYT-Rev-Files/user-profile-placeholder.jpg';
        const profilePicDisplay = document.getElementById('profilePicDisplay');
        const uploadBtn = document.getElementById('uploadBtn');
        const removeBtn = document.getElementById('removeBtn');
        const fileInput = document.getElementById('fileInput');
        const loginPrompt = document.getElementById('loginPrompt');
        const profileSection = document.getElementById('profileSection');
        const profileStatus = document.getElementById('profileStatus');
        const errorToast = document.getElementById('errorToast');
        const successToast = document.getElementById('successToast');

        function showToast(el, msg) {
            el.textContent = msg;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 3000);
        }

        function loadProfilePic() {
            profilePicDisplay.src = PLACEHOLDER_SRC;
            removeBtn.classList.add('hidden');
            profileStatus.textContent = 'Using default profile picture';

            fetch('/user-profile-pic')
                .then(res => res.json())
                .then(data => {
                    if (data.hasCustomPic && data.picUrl) {
                        profilePicDisplay.src = data.picUrl + '?t=' + Date.now();
                        removeBtn.classList.remove('hidden');
                        profileStatus.textContent = 'Custom profile picture set';
                    }
                })
                .catch(() => {});
        }

        function refreshHeaderPic() {
            fetch('/user-profile-pic')
                .then(res => res.json())
                .then(data => {
                    const headerPic = document.getElementById('headerProfilePic');
                    if (!headerPic) return;
                    if (data.hasCustomPic && data.picUrl) {
                        headerPic.src = data.picUrl + '?t=' + Date.now();
                    } else {
                        headerPic.src = PLACEHOLDER_SRC;
                    }
                })
                .catch(() => {});
        }

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;

            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                showToast(errorToast, 'Only JPEG, PNG, and WebP images are allowed');
                fileInput.value = '';
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showToast(errorToast, 'Image must be under 5MB');
                fileInput.value = '';
                return;
            }

            const formData = new FormData();
            formData.append('profilePic', file);

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            // Log the file being sent for debugging
            console.log('Uploading file:', file.name, file.type, file.size);

            fetch('/user-profile-pic', {
                method: 'POST',
                body: formData
                // Do NOT set Content-Type header - let the browser set it with boundary
            })
            .then(async res => {
                const responseText = await res.text();
                console.log('Response status:', res.status);
                console.log('Response body:', responseText);
                
                if (!res.ok) {
                    throw new Error(responseText || 'Upload failed');
                }
                showToast(successToast, 'Profile picture updated!');
                loadProfilePic();
                refreshHeaderPic();
            })
            .catch(err => {
                console.error('Upload error:', err);
                showToast(errorToast, err.message || 'Error uploading');
            })
            .finally(() => {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Picture';
                fileInput.value = '';
            });
        });

        removeBtn.addEventListener('click', () => {
            fetch('/user-profile-pic', { method: 'DELETE' })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to remove');
                    showToast(successToast, 'Profile picture removed');
                    profilePicDisplay.src = PLACEHOLDER_SRC;
                    removeBtn.classList.add('hidden');
                    profileStatus.textContent = 'Using default profile picture';
                    refreshHeaderPic();
                })
                .catch(err => showToast(errorToast, err.message));
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/session-user')
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error('Not logged in');
                })
                .then(() => {
                    loginPrompt.classList.add('hidden');
                    profileSection.classList.remove('hidden');
                    loadProfilePic();
                })
                .catch(() => {
                    loginPrompt.classList.remove('hidden');
                    profileSection.classList.add('hidden');
                });

            const mainLogo = document.getElementById('mainLogo');
            if (mainLogo) {
                mainLogo.addEventListener('click', (e) => {
                    if (e.button === 0) window.location.href = 'index.html';
                });
                mainLogo.addEventListener('mouseup', (e) => {
                    if (e.button === 1) { e.preventDefault(); window.open('index.html', '_blank'); }
                });
                mainLogo.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); window.open('index.html', '_blank');
                });
                mainLogo.title = 'Go to homepage';
                mainLogo.style.cursor = 'pointer';
            }

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                if (query.length < 2) { document.getElementById('searchSuggestions').innerHTML = ''; return; }
                fetch('/search-index').then(res => res.json()).then(data => {
                    const suggestions = (data.videos || []).filter(v => v.displayName.toLowerCase().includes(query)).slice(0, 5);
                    const container = document.getElementById('searchSuggestions');
                    container.innerHTML = '';
                    suggestions.forEach(s => {
                        const el = document.createElement('div');
                        el.className = 'suggestion-item';
                        el.textContent = s.displayName;
                        el.onclick = () => { window.location.href = `video.html?src=${encodeURIComponent(s.path)}`; };
                        container.appendChild(el);
                    });
                });
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
            });
            document.getElementById('searchIcon').addEventListener('click', () => {
                const q = searchInput.value.trim();
                if (q) window.location.href = `search.html?q=${encodeURIComponent(q)}`;
                else searchInput.focus();
            });
        });
    </script>
</body>
</html>
