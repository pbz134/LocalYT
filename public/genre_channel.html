// ==============================
(function applyRoundedCorners() {
    const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
    const enabled = setting.enabled || false;
    
    if (enabled) {
        const style = document.createElement('style');
        style.id = 'rounded-corners-style';
        style.textContent = `
            .channel-videos .video-thumbnail {
                border-radius: 12px !important;
            }
        `;
        document.head.appendChild(style);
    }
})();

        .channel-banner-container {

            max-width: 1200px;

            padding: 0 20px;
            box-sizing: border-box;
            display: none;
        }
        .channel-banner-container.visible {

            height: 200px;

        }

        }

        .channel-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        }

            display: flex;
            margin-left: 230px;
            border-bottom: 1px solid #3f3f3f;
        }

            padding: 10px 20px;

            color: #aaa;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
        }
        .tab:hover {
            color: #fff;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .sort-toggle {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 0 0 230px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-bottom: -50px;
        }
        .sort-toggle:hover {
            background-color: #555;
        }
        .sort-icon {
            font-size: 16px;
        }

            position: relative;
            min-height: 400px;
        }

        }

            background: var(--main-bg-color);
            overflow: hidden;
            width: 300px;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .video-thumbnail {
            width: 100%;
            height: 168px;
            display: block;
            background-color: #2a2a2a;
            transition: transform 0.2s ease;

        }

        }

            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
        }
        .video-details {
            min-width: 0;
            flex: 1;
        }
        .video-title {
            text-align: left;
            font-weight: bold;
            font-family: 'RobotoRegular', sans-serif;
            cursor: pointer;
            color: #d2cfcf;
            text-decoration: none;
            transition: text-decoration 0.2s ease;

            line-height: 1.3;
            margin-bottom: 4px;

            -webkit-box-orient: vertical;

            color: #888;
            cursor: pointer;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        }

            color: #888;
            font-size: 12px;

        }

        }

            right: 8px;

            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;

            padding: 20px;
            color: #888;
            width: 100%;
            display: none;
        }
        .loading-spinner.visible {
            display: block;
        }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 2px solid #888;
            border-top-color: transparent;
            border-radius: 50%;

            position: relative;

document.addEventListener('mousedown', function(e) {
    if (e.button === 1) {

            'a, .video-item, .video-title, .video-thumbnail, .channel-name-link, .channel-pic, .sort-toggle, .tab, .share-button, .suggestion-item, #mainLogo'

        if (target) {

            if (target.tagName === 'A' && target.href) {

function getLang(en, de) {

function parseDurationToSeconds(durationStr) {
    if (!durationStr || typeof durationStr !== 'string') return 0;
    const trimmed = durationStr.trim();
    if (!trimmed) return 0;
    const parts = trimmed.split(':');
    if (parts.length === 3) {
        return (parseInt(parts[0], 10) || 0) * 3600 + (parseInt(parts[1], 10) || 0) * 60 + (parseInt(parts[2], 10) || 0);
    } else if (parts.length === 2) {
        return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }
    return parseInt(parts[0], 10) || 0;
}

const urlParams = new URLSearchParams(window.location.search);
const genre = urlParams.get('genre') || '';
const topicId = urlParams.get('topic') || '';

// Determine mode: topic mode or genre mode
const isTopicMode = !!topicId;
const genreConfig = !isTopicMode ? GENRE_CONFIG[genre] : null;

if (!isTopicMode && !genreConfig) {
    window.location.href = 'index.html';
}

document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');

    if (mainLogo) {
        mainLogo.addEventListener('click', (event) => {
            if (event.button === 0) {
                window.location.href = 'index.html';
            }
        });
        mainLogo.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open('index.html', '_blank');
            }
        });
        mainLogo.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open('index.html', '_blank');
        });
        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        mainLogo.style.cursor = 'pointer';
    }
});

        fetch('/user-topics')
            .then(r => {
                if (!r.ok) throw new Error('Not authenticated');
                return r.json();
            })
            .then(topics => {
                topicConfig = topics.find(t => t.id === topicId);
                if (!topicConfig) {
                    videosContainer.innerHTML = `<p style="color: #888; text-align: center; width: 100%; padding: 60px 20px;">${getLang('Topic not found.', 'Thema nicht gefunden.')}</p>`;
                    return;
                }
                applyTopicConfig();
                initializeVideoList();
            })
            .catch(err => {
                console.error('Error loading topic:', err);
                videosContainer.innerHTML = `<p style="color: #888; text-align: center; width: 100%; padding: 60px 20px;">${getLang('Failed to load topic.', 'Thema konnte nicht geladen werden.')}</p>`;
            });
    } else {
        // Genre mode — use hardcoded config
        const genreDisplayName = getLang(genreConfig.name, genreConfig.nameDe);
        channelPic.src = `LocalYT-Rev-Files/${genreConfig.svg}`;
        channelName.textContent = genreDisplayName;
        document.title = `${genreDisplayName} - LocalYT`;
        document.getElementById('channelDescription').textContent = getLang(
            genreConfig.about, genreConfig.aboutDe || genreConfig.about
        );
        initializeVideoList();
    }

    function applyTopicConfig() {
        if (!topicConfig) return;

        const name = topicConfig.name || getLang('Custom Topic', 'Benutzerdefiniertes Thema');
        channelName.textContent = name;
        document.title = `${name} - LocalYT`;

        // Profile pic
        if (topicConfig.profilePic) {
            channelPic.src = topicConfig.profilePic;
        } else {
            channelPic.src = 'LocalYT-Rev-Files/genre_gaming.svg'; // default fallback
        }

        // Banner
        if (topicConfig.banner) {
            channelBanner.src = topicConfig.banner;
            bannerContainer.classList.add('visible');
            channelHeader.classList.add('has-banner');
        }

        // Description
        document.getElementById('channelDescription').textContent = topicConfig.description || '';
    }

    function updateUITranslations() {
        document.querySelector('.tab[data-tab="videos"]').textContent = getLang('VIDEOS', 'VIDEOS');
        document.querySelector('.tab[data-tab="about"]').textContent = getLang('ABOUT', 'ÜBER');

        if (sortNewestFirst) {
            sortToggle.innerHTML = '<span class="sort-icon">↓</span> ' + getLang('Newest First', 'Neueste zuerst');
        } else {
            sortToggle.innerHTML = '<span class="sort-icon">↑</span> ' + getLang('Oldest First', 'Älteste zuerst');
        }

        document.getElementById('aboutDescriptionHeader').textContent = getLang('Description', 'Beschreibung');
        document.getElementById('aboutStatsHeader').textContent = getLang('Stats', 'Statistiken');
        document.getElementById('shareBtnText').textContent = getLang('Share', 'Teilen');
        document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');
        document.getElementById('loadingSpinner').textContent = getLang('Loading more videos', 'Weitere Videos werden geladen');
        document.getElementById('noMoreVideos').textContent = getLang('No more videos to load', 'Keine weiteren Videos vorhanden');
    }
    updateUITranslations();

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        const targetContent = document.getElementById(`${tabName}Tab`);

        if (targetTab) targetTab.classList.add('active');
        if (targetContent) targetContent.classList.add('active');
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTab(tab.dataset.tab);
        });
    });

    function stripExtension(filename) {
        return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
    }

    function createVideoElement(video, includeLength) {
        const videoElement = document.createElement('div');
        videoElement.className = 'video-item';
        const videoTitle = video.displayName;
        const videoPathWithoutExt = stripExtension(video.path);
        const thumbnailSrc = `/thumbnails/${encodeURIComponent(videoPathWithoutExt)}.jpg`;
        const channel = video.path.split('/')[0];

        videoElement.innerHTML = `
            <div class="thumbnail-container">
                <img src="${thumbnailSrc}" alt="${videoTitle}" class="video-thumbnail" loading="lazy">
                <div class="video-length">${video.videoLength || ''}</div>
            </div>
            <div class="video-info">
                <img src="/channelpic/${encodeURIComponent(channel)}.jpg" alt="${channel}" class="channel-pic" loading="lazy">
                <div class="video-details">
                    <div class="video-title">${videoTitle}</div>
                    <div class="channel-name-link" onclick="window.location.href='channel.html?channel=${encodeURIComponent(channel)}'">${channel}</div>
                    <div class="video-description">${getLang('Loading views...', 'Aufrufe werden geladen...')}</div>
                </div>
            </div>
        `;

        const descriptionDiv = videoElement.querySelector('.video-description');
        const videoTitleDiv = videoElement.querySelector('.video-title');
        const videoThumb = videoElement.querySelector('.video-thumbnail');
        const channelPicEl = videoElement.querySelector('.channel-pic');

        videoTitleDiv.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));
        videoThumb.addEventListener('click', () => openVideo(encodeURIComponent(video.path)));

        videoTitleDiv.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });
        videoThumb.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
        });

        const middleClickHandler = (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`video.html?src=${encodeURIComponent(video.path)}`, '_blank');
            }
        };
        videoTitleDiv.addEventListener('mouseup', middleClickHandler);
        videoThumb.addEventListener('mouseup', middleClickHandler);
        videoTitleDiv.addEventListener('auxclick', middleClickHandler);
        videoThumb.addEventListener('auxclick', middleClickHandler);

        channelPicEl.addEventListener('click', () => {
            window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
        });
        channelPicEl.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
        });
        channelPicEl.addEventListener('mouseup', (event) => {
            if (event.button === 1) {
                event.preventDefault();
                window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
            }
        });

        // If viewCount is already provided (topic mode), use it directly
        if (video.viewCount !== undefined && video.viewCount !== null && video.viewCount !== '') {
            let formattedViewCount = video.viewCount;
            if (!isNaN(video.viewCount) && video.viewCount !== '0') {
                formattedViewCount = parseInt(video.viewCount).toLocaleString();
            }

            const lang = localStorage.getItem('language');
            let viewsText = getLang('views', 'Aufrufe');
            if (lang === 'de') formattedViewCount = formattedViewCount.replace(/,/g, '.');

            descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${video.fileDate || getLang('Unknown date', 'Unbekanntes Datum')}`;

            // Fetch video length only if not provided
            if (!video.videoLength) {
                const videoBaseName = videoPathWithoutExt.split('/').pop();
                fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoBaseName)}.txt`)
                    .then(r => r.ok ? r.text() : '')
                    .then(lengthStr => {
                        if (lengthStr) {
                            videoElement.querySelector('.video-length').textContent = lengthStr;
                        }
                    }).catch(() => {});
            }
        } else {
            // Genre mode — fetch viewCount and videoLength separately
            Promise.all([
                fetch(`/viewcounts/${encodeURIComponent(videoPathWithoutExt)}`).then(response => response.ok ? response.text() : '0'),
                fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoPathWithoutExt.split('/').pop())}.txt`).then(response => response.ok ? response.text() : '')
            ])
            .then(([viewCount, videoLength]) => {
                let formattedViewCount = viewCount;
                if (!isNaN(viewCount) && viewCount !== '0') {
                    formattedViewCount = parseInt(viewCount).toLocaleString();
                }

                const lang = localStorage.getItem('language');
                let viewsText = getLang('views', 'Aufrufe');
                if (lang === 'de') formattedViewCount = formattedViewCount.replace(/,/g, '.');

                descriptionDiv.textContent = `${formattedViewCount} ${viewsText} • ${video.fileDate || getLang('Unknown date', 'Unbekanntes Datum')}`;

                if (videoLength) {
                    videoElement.querySelector('.video-length').textContent = videoLength;
                }
            })
            .catch(() => {
                descriptionDiv.textContent = video.fileDate || getLang('Unknown date', 'Unbekanntes Datum');
            });
        }

        return videoElement;
    }

    // =====================================================
    // Topic Mode: Server-side pagination
    // =====================================================

    function loadMoreTopicVideos() {
        if (isLoadingMore || !hasMoreVideos) return;
        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        const sortParam = sortNewestFirst ? 'newest' : 'oldest';

        fetch(`/topic-videos/${encodeURIComponent(topicId)}?page=${topicCurrentPage}&limit=${VIDEOS_PER_PAGE}&sort=${sortParam}`)
            .then(r => {
                if (!r.ok) throw new Error('Failed to fetch topic videos');
                return r.json();
            })
            .then(data => {
                const videos = data.videos || [];
                topicTotalCount = data.total || 0;
                hasMoreVideos = data.hasMore !== false;
                topicCurrentPage++;

                const fragment = document.createDocumentFragment();
                for (const video of videos) {
                    fragment.appendChild(createVideoElement(video, true));
                }
                videosContainer.appendChild(fragment);

                totalVideoCount += videos.length;

                if (!isFirstLoadComplete) {
                    isFirstLoadComplete = true;
                    const initialSpinner = videosContainer.querySelector('.loading-spinner');
                    if (initialSpinner) initialSpinner.remove();
                }

                updateVideoCount();

                if (videos.length === 0 && totalVideoCount === 0) {
                    noMoreVideos.style.display = 'block';
                    noMoreVideos.textContent = getLang('No videos found for this topic.', 'Keine Videos für dieses Thema gefunden.');
                    noMoreVideos.style.fontStyle = 'normal';
                } else if (!hasMoreVideos) {
                    noMoreVideos.style.display = 'block';
                }

                isLoadingMore = false;
                loadingSpinner.classList.remove('visible');
            })
            .catch(error => {
                console.error('[Topic] Error loading topic videos:', error);
                isLoadingMore = false;
                loadingSpinner.classList.remove('visible');
                if (totalVideoCount === 0) {
                    videosContainer.innerHTML = `<p style="color: #888; text-align: center; width: 100%; padding: 60px 20px;">${getLang('Failed to load videos.', 'Videos konnten nicht geladen werden.')}</p>`;
                }
            });
    }

    function updateVideoCount() {
        let count = topicTotalCount > 0 ? topicTotalCount : totalVideoCount;
        let statsVideoCount = count.toLocaleString();
        if (localStorage.getItem('language') === 'de') {
            statsVideoCount = statsVideoCount.replace(/,/g, '.');
        }
        document.getElementById('statsVideos').textContent = `${statsVideoCount} ${getLang('videos', 'Videos')}`;
        document.getElementById('channelVideoCount').textContent = `${statsVideoCount} ${getLang('videos', 'Videos')}`;
    }

    // =====================================================
    // Genre Mode: Client-side filtering (existing logic)
    // =====================================================

    async function fetchAndRenderBatch() {
        const videosToRender = pendingFilteredVideos.splice(0, VIDEOS_PER_PAGE);

        const videosWithDates = await Promise.all(videosToRender.map(video => {
            const videoPathWithoutExt = stripExtension(video.path);
            return fetch(`/filedates/${encodeURIComponent(videoPathWithoutExt)}.txt`)
                .then(response => response.ok ? response.text() : 'Unknown date')
                .then(fileDate => ({ ...video, fileDate: fileDate.trim() || 'Unknown date' }))
                .catch(() => ({ ...video, fileDate: 'Unknown date' }));
        }));

        const fragment = document.createDocumentFragment();
        for (const video of videosWithDates) {
            fragment.appendChild(createVideoElement(video, false));
        }
        videosContainer.appendChild(fragment);
        totalVideoCount += videosWithDates.length;

        if (!isFirstLoadComplete) {
            isFirstLoadComplete = true;
            const initialSpinner = videosContainer.querySelector('.loading-spinner');
            if (initialSpinner) initialSpinner.remove();
        }

        updateVideoCount();
    }

    function loadMoreGenreVideos() {
        if (isLoadingMore || !hasMoreVideos) return;

        if (pendingFilteredVideos.length > 0) {
            isLoadingMore = true;
            fetchAndRenderBatch().then(() => { isLoadingMore = false; });
            return;
        }

        isLoadingMore = true;
        loadingSpinner.classList.add('visible');
        noMoreVideos.style.display = 'none';

        fetch(`/search-index?offset=${currentFetchOffset}&limit=${FETCH_BATCH_SIZE}`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch search index');
                return response.json();
            })
            .then(data => {
                const rawBatch = data.videos || [];

                if (rawBatch.length < FETCH_BATCH_SIZE) {
                    hasMoreVideos = false;
                }
                currentFetchOffset += rawBatch.length;

                if (rawBatch.length === 0) {
                    hasMoreVideos = false;
                    isLoadingMore = false;
                    loadingSpinner.classList.remove('visible');

                    if (totalVideoCount === 0) {
                        noMoreVideos.style.display = 'block';
                        noMoreVideos.textContent = getLang('No videos found for this genre.', 'Keine Videos für dieses Thema gefunden.');
                        noMoreVideos.style.fontStyle = 'normal';
                    } else {
                        noMoreVideos.style.display = 'block';
                    }
                    return;
                }

                const genreTags = genreConfig.tags;
                const genreTagSet = new Set(genreTags.map(t => t.toLowerCase()));
                const negativeTagSet = new Set((genreConfig.negativeTags || []).map(t => t.toLowerCase()));

                let tagMatches = rawBatch.filter(video => {
                    return filterByTags(video, genreTagSet, negativeTagSet, genreConfig, genreTags);
                });

                const minDuration = genreConfig.minDurationSeconds || 0;

                if (minDuration > 0 && tagMatches.length > 0) {
                    return filterByDuration(tagMatches, minDuration).then(durationMatches => {
                        pendingFilteredVideos = durationMatches;
                        processFetchedBatch();
                    });
                }

                pendingFilteredVideos = tagMatches;
                processFetchedBatch();
            })
            .catch(error => {
                console.error('[Genre] Error loading genre videos:', error);
                isLoadingMore = false;
                loadingSpinner.classList.remove('visible');
                if (totalVideoCount === 0) {
                    videosContainer.innerHTML = `<p style="color: #888; text-align: center; width: 100%; padding: 60px 20px;">${getLang('Failed to load videos.', 'Videos konnten nicht geladen werden.')}</p>`;
                }
            });

        function processFetchedBatch() {
            isLoadingMore = false;
            loadingSpinner.classList.remove('visible');

            if (pendingFilteredVideos.length === 0 && !hasMoreVideos) {
                if (totalVideoCount === 0) {
                    noMoreVideos.style.display = 'block';
                    noMoreVideos.textContent = getLang('No videos found for this genre.', 'Keine Videos für dieses Thema gefunden.');
                    noMoreVideos.style.fontStyle = 'normal';
                } else {
                    noMoreVideos.style.display = 'block';
                }
                return;
            }

            fetchAndRenderBatch();
        }
    }

    function filterByDuration(videos, minSeconds) {
        const promises = videos.map(video => {
            const videoPathWithoutExt = stripExtension(video.path);
            const channel = video.path.split('/')[0];
            const lengthUrl = `/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoPathWithoutExt.split('/').pop())}.txt`;
            return fetch(lengthUrl)
                .then(r => r.ok ? r.text() : '')
                .then(lengthStr => parseDurationToSeconds(lengthStr))
                .catch(() => 0);
        });

        return Promise.all(promises).then(durations => {
            return videos.filter((video, i) => durations[i] >= minSeconds);
        });
    }

    function filterByTags(video, genreTagSet, negativeTagSet, genreConfig, genreTags) {
        function extractVideoTags(video) {
            if (Array.isArray(video.tags)) return video.tags;
            if (typeof video.tags === 'string' && video.tags.length > 0) return video.tags.split(',').map(t => t.trim());
            if (Array.isArray(video.tagList)) return video.tagList;
            if (typeof video.tagList === 'string' && video.tagList.length > 0) return video.tagList.split(',').map(t => t.trim());
            return null;
        }

        if (negativeTagSet.size > 0) {
            let hasNegativeTag = false;
            const videoTags = extractVideoTags(video);

            if (videoTags && videoTags.length > 0) {
                hasNegativeTag = videoTags.some(tag => {
                    if (typeof tag !== 'string') return false;
                    return negativeTagSet.has(tag.toLowerCase().trim());
                });
            } else {
                const filename = video.path ? video.path.split('/').pop().replace(/\.[^.]+$/, '') : '';
                const displayName = (video.displayName || '').toLowerCase();
                const filenameLower = filename.toLowerCase();

                hasNegativeTag = genreConfig.negativeTags.some(negTag => {
                    const tagLower = negTag.toLowerCase();
                    if (tagLower.length <= 2) return false;
                    return filenameLower.includes(tagLower) || displayName.includes(tagLower);
                });
            }

            if (hasNegativeTag) return false;
        }

        const videoTags = extractVideoTags(video);

        if (videoTags && videoTags.length > 0) {
            return videoTags.some(tag => {
                if (typeof tag !== 'string') return false;
                return genreTagSet.has(tag.toLowerCase().trim());
            });
        }

        const filename = video.path ? video.path.split('/').pop().replace(/\.[^.]+$/, '') : '';
        const displayName = (video.displayName || '').toLowerCase();
        const filenameLower = filename.toLowerCase();

        return genreTags.some(genreTag => {
            const tagLower = genreTag.toLowerCase();
            if (tagLower.length <= 2) return false;
            return filenameLower.includes(tagLower) || displayName.includes(tagLower);
        });
    }

    // =====================================================
    // Unified load more
    // =====================================================

    function loadMoreVideos() {
        if (isTopicMode) {
            loadMoreTopicVideos();
        } else {
            loadMoreGenreVideos();
        }
    }

    function setupIntersectionObserver() {
        if (window.IntersectionObserver) {
            intersectionObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !isLoadingMore) {
                            loadMoreVideos();
                        }
                    });
                },
                { root: null, rootMargin: '300px', threshold: 0 }
            );
            if (loadMoreTrigger) {
                intersectionObserver.observe(loadMoreTrigger);
            }
        }
    }

    sortToggle.addEventListener('click', () => {
        sortNewestFirst = !sortNewestFirst;
        updateUITranslations();

        // Reset state
        totalVideoCount = 0;
        hasMoreVideos = true;
        isFirstLoadComplete = false;
        videosContainer.innerHTML = '';
        loadingSpinner.classList.remove('visible');
        noMoreVideos.style.display = 'none';

        if (isTopicMode) {
            topicCurrentPage = 1;
            topicTotalCount = 0;
        } else {
            currentFetchOffset = 0;
            pendingFilteredVideos = [];
        }

        document.getElementById('statsVideos').textContent = `0 ${getLang('videos', 'Videos')}`;
        document.getElementById('channelVideoCount').textContent = '';

        loadMoreVideos();
    });

    document.getElementById('shareChannelBtn').addEventListener('click', () => {
        let shareUrl;
        if (isTopicMode) {
            shareUrl = `${window.location.origin}/genre_channel.html?topic=${encodeURIComponent(topicId)}`;
        } else {
            shareUrl = `${window.location.origin}/genre_channel.html?genre=${genre}`;
        }

        if (navigator.clipboard) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                const btn = document.getElementById('shareChannelBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<img src="LocalYT-Rev-Files/share.svg" alt="Share"> ' + getLang('Copied!', 'Kopiert!');
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }).catch(() => { alert(`URL: ${shareUrl}`); });
        } else {
            alert(`URL: ${shareUrl}`);
        }
    });

    function initializeVideoList() {
        loadedTabs.add('videos');
        videosContainer.innerHTML = '<div class="loading-spinner visible">' + getLang('Scanning library...', 'Durchsuche Bibliothek...') + '</div>';
        setupIntersectionObserver();
        loadMoreVideos();
    }

    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
    });

    document.getElementById('searchIcon').addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`; else searchInput.focus();
    });
});

function openVideo(videoSrc) {
    window.location.href = `video.html?src=${videoSrc}`;
}
