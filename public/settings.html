<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'RobotoRegular', Arial, sans-serif;
            padding-top: 80px;
        }
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .settings-section {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .settings-section h2 {
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: #fff;
        }
        /* Compact, Scrollable Preferences List */
        .pref-list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            background-color: #0f0f0f;
            margin-bottom: 15px;
        }
        .pref-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #222;
        }
        .pref-item:last-child {
            border-bottom: none;
        }
        .pref-tag {
            font-size: 14px;
            color: #ccc;
            flex-grow: 1;
            margin-right: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pref-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pref-value {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 4px;
            width: 60px;
            text-align: center;
            font-size: 13px;
            border-radius: 2px;
        }
        .btn-remove {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 0 5px;
        }
        .btn-remove:hover {
            color: #ff4444;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #444;
        }
        .btn-danger {
            background-color: #aa0000;
        }
        .btn-danger:hover {
            background-color: #cc0000;
        }
        .btn-save {
            background-color: #2196F3;
        }
        .btn-save:hover {
            background-color: #1e88e5;
        }
        
        input[type="text"], input[type="password"] {
            background-color: #0f0f0f;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            margin-right: 10px;
            border-radius: 4px;
        }
        .inline-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            min-height: 20px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }

        /* Scrollbar styling */
        .pref-list-container::-webkit-scrollbar {
            width: 8px;
        }
        .pref-list-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .pref-list-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <a href="index.html" style="display: flex; align-items: center;">
            <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo">
        </a>
        <div class="user-actions">
            <a href="login.html" class="login-button" id="loginButton">Account</a>
        </div>
    </header>

    <div class="settings-container">
        <h1>Settings</h1>

        <!-- Algorithm Section -->
        <div class="settings-section">
            <h2>Algorithm Preferences</h2>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Adjust scores to influence your recommendations. Higher = matching videos are more likely to appear.</p>
            
            <div id="preferencesContainer" class="pref-list-container">
                <!-- Preferences loaded dynamically -->
            </div>
            
            <div class="inline-form">
                <button class="btn btn-save" onclick="savePreferences()">Save Preferences</button>
                <button class="btn btn-danger" onclick="resetPreferences()">Reset All</button>
            </div>
            <div id="prefStatus" class="status-msg"></div>
        </div>

        <!-- Account Management -->
        <div class="settings-section">
            <h2>Account Management</h2>
            
            <div style="margin-bottom: 20px;">
                <h3 style="margin-bottom: 5px; font-size: 16px;">Rename Account</h3>
                <div class="inline-form">
                    <input type="text" id="newUsername" placeholder="New Username">
                    <button class="btn" onclick="renameAccount()">Rename</button>
                </div>
                <div id="renameStatus" class="status-msg"></div>
            </div>

            <div>
                <h3 style="margin-bottom: 5px; font-size: 16px;">Change Password</h3>
                <div class="inline-form" style="flex-wrap: wrap;">
                    <input type="password" id="currentPassword" placeholder="Current Password">
                    <input type="password" id="newPassword" placeholder="New Password">
                    <button class="btn" onclick="changePassword()">Update</button>
                </div>
                <div id="passStatus" class="status-msg"></div>
            </div>
        </div>

        <!-- Danger Zone (Simplified) -->
        <div class="settings-section">
            <h2>Delete Account</h2>
            <p style="font-size: 13px; color: #aaa;">WARNING: Once deleted, you won't be able to recover it.</p>
            <div class="inline-form" style="justify-content: flex-start;">
                <button class="btn btn-danger" onclick="deleteAccount()">Delete Account</button>
            </div>
            <div id="deleteStatus" class="status-msg"></div>
        </div>
    </div>

    <script>
        // Check login status
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/session-user')
                .then(res => res.json())
                .then(data => {
                    if (!data.username) {
                        window.location.href = 'login.html';
                    } else {
                        document.getElementById('loginButton').textContent = data.username;
                        loadPreferences();
                    }
                })
                .catch(() => window.location.href = 'login.html');
        });

        function loadPreferences() {
            fetch('/get-preferences')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('preferencesContainer');
                    container.innerHTML = '';
                    
                    if (Object.keys(data).length === 0) {
                        container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No preferences found. Watch videos to build your algorithm!</div>';
                        return;
                    }

                    // Sort by value desc
                    const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);

                    sorted.forEach(([tag, value]) => {
                        const div = document.createElement('div');
                        div.className = 'pref-item';
                        div.dataset.tag = tag; // Store tag name for easy retrieval
                        div.innerHTML = `
                            <span class="pref-tag" title="${tag}">${tag}</span>
                            <div class="pref-controls">
                                <input type="number" class="pref-value" data-tag="${tag}" value="${value}">
                                <button class="btn-remove" title="Remove Tag">&times;</button>
                            </div>
                        `;
                        
                        // Add event listener for the remove button
                        div.querySelector('.btn-remove').addEventListener('click', () => {
                            div.remove();
                        });
                        
                        container.appendChild(div);
                    });
                });
        }

        function savePreferences() {
            const container = document.getElementById('preferencesContainer');
            const items = container.querySelectorAll('.pref-item');
            const promises = [];

            // We need to determine which tags were deleted.
            // Since we don't have the original list easily accessible without a re-fetch,
            // we will send the current state of the list.
            // Note: This simple implementation updates every tag individually.
            
            items.forEach(item => {
                const tag = item.dataset.tag;
                const input = item.querySelector('.pref-value');
                const value = parseInt(input.value) || 0;

                // Post update
                const p = fetch('/update-preference-tag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag, value })
                });
                promises.push(p);
            });

            // Ideally, we should also handle deleted tags (set to 0 or remove key).
            // For simplicity, we just update what is visible.
            // If you want to implement deletion properly, you need an endpoint 
            // that can delete a key or accept a full object to overwrite.
            // Currently, backend only updates or creates keys.
            
            Promise.all(promises)
                .then(() => {
                    showStatus('prefStatus', 'Preferences saved successfully!', true);
                    // Reload to refresh order
                    loadPreferences();
                })
                .catch(() => showStatus('prefStatus', 'Error saving preferences.', false));
        }

        function resetPreferences() {
            if (confirm('Are you sure you want to clear all your viewing preferences?')) {
                fetch('/reset-preferences', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            showStatus('prefStatus', 'All preferences have been reset.', true);
                            loadPreferences();
                        }
                    });
            }
        }

        function renameAccount() {
            const newUsername = document.getElementById('newUsername').value;
            if (!newUsername) return;
            
            fetch('/rename-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newUsername })
            })
            .then(res => res.text())
            .then(msg => {
                if (msg === 'OK') {
                    showStatus('renameStatus', 'Account renamed! Refreshing...', true);
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showStatus('renameStatus', msg, false);
                }
            });
        }

        function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            if (!currentPassword || !newPassword) return;

            fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            })
            .then(res => res.text())
            .then(msg => {
                if (msg === 'OK') {
                    showStatus('passStatus', 'Password changed successfully.', true);
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                } else {
                    showStatus('passStatus', msg, false);
                }
            });
        }

        function deleteAccount() {
            const confirmation = prompt("This will permanently delete your account. Type 'DELETE' to confirm.");
            if (confirmation === 'DELETE') {
                fetch('/delete-account', { method: 'POST' })
                    .then(res => {
                        if (res.ok) {
                            alert("Account deleted.");
                            window.location.href = 'index.html';
                        }
                    });
            }
        }

        function showStatus(elementId, message, success) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'status-msg ' + (success ? 'success' : 'error');
            setTimeout(() => el.textContent = '', 3000);
        }
    </script>
</body>
</html>
