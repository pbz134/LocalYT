<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <style>
        .playlists-page {
            padding: 20px 30px;
            margin-top: 60px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .playlists-header {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 24px;
            font-family: 'Kaleko205Round', Arial, sans-serif;
        }
        .no-playlists {
            color: #888;
            font-size: 16px;
            margin-top: 40px;
            text-align: center;
        }
        .playlist-section {
            margin-bottom: 35px;
            border-bottom: 1px solid #3f3f3f;
            padding-bottom: 20px;
        }
        .playlist-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .playlist-title-group {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap; /* Allow wrapping if text is long */
        }
        .playlist-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .playlist-video-count {
            font-size: 13px;
            color: #888;
        }

        .playlist-total-duration {
            font-size: 13px;
            color: #888;

        }
        .playlist-delete-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'RobotoRegular', Arial, sans-serif;
            transition: border-color 0.2s, color 0.2s;
        }
        .playlist-delete-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        .playlist-scroll-wrapper {
            position: relative;
        }
        .playlist-videos-grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 0;
        }
        .playlist-videos-grid::-webkit-scrollbar {
            display: none;
        }
        .playlist-video-item {
            flex: 0 0 280px;
            position: relative;
        }
        .playlist-video-item .video-thumbnail {
            width: 100%;
            height: auto;
        }
        .playlist-video-item .video-description {
            padding-left: 0;
        }
        .scroll-arrow {
            position: absolute;
            top: 30%;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s, border-color 0.2s, opacity 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .scroll-arrow.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .scroll-arrow:hover {
            background: rgba(30, 30, 30, 0.95);
            border-color: #777;
        }
        .scroll-arrow-left {
            left: 0;
            border-radius: 0 6px 6px 0;
            border-left: none;
        }
        .scroll-arrow-right {
            right: 0;
            border-radius: 6px 0 0 6px;
            border-right: none;
        }
        .scroll-arrow svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            pointer-events: none;
        }
        .playlist-video-item .remove-video-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .playlist-video-item:hover .remove-video-btn {
            opacity: 1;
        }
        .remove-video-btn:hover {
            background: #ff4444;
        }

        /* Delete confirmation modal */
        .delete-confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .delete-confirm-content {
            background-color: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            position: relative;
        }
        .delete-confirm-content h2 {
            color: #fff;
            font-family: 'Kaleko205Round', Arial, sans-serif;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .delete-confirm-content p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .delete-confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .delete-confirm-buttons button {
            padding: 8px 22px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'RobotoRegular', Arial, sans-serif;
        }
        .btn-cancel-delete {
            background: #3f3f3f;
            color: #fff;
        }
        .btn-cancel-delete:hover {
            background: #555;
        }
        .btn-confirm-delete {
            background: #ff4444;
            color: #fff;
        }
        .btn-confirm-delete:hover {
            background: #cc0000;
        }

        @media (max-width: 1024px) {
            .playlists-page {
                padding: 15px 20px;
            }
            .playlist-video-item {
                flex: 0 0 240px;
            }
        }

        @media (max-width: 768px) {
            .playlists-page {
                padding: 15px 15px;
                margin-top: 55px;
            }
            .playlists-header {
                font-size: 20px;
                margin-bottom: 18px;
            }
            .playlist-section {
                margin-bottom: 25px;
                padding-bottom: 15px;
            }
            .playlist-title {
                font-size: 16px;
            }
            .playlist-video-item {
                flex: 0 0 220px;
            }
            .playlist-video-item .video-thumbnail {
                height: 130px;
            }
            .playlist-delete-btn {
                padding: 4px 10px;
                font-size: 12px;
            }
            .scroll-arrow {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .playlists-page {
                padding: 12px 10px;
            }
            .playlists-header {
                font-size: 18px;
                margin-bottom: 14px;
            }
            .playlist-title {
                font-size: 15px;
            }
            .playlist-video-count {
                font-size: 12px;
            }
            .playlist-total-duration {
                font-size: 12px;
                width: 100%; /* Stack on very small screens */
                margin-left: 0;
                margin-top: 2px;
            }
            .playlist-video-item {
                flex: 0 0 175px;
            }
            .playlist-video-item .video-thumbnail {
                height: 100px;
            }
            .playlist-video-item .channel-pic {
                width: 24px;
                height: 24px;
            }
            .playlist-video-item .video-title {
                font-size: 12px;
            }
            .playlist-video-item .channel-name,
            .playlist-video-item .video-description {
                font-size: 11px;
            }
            .playlist-video-item .video-info {
                padding: 8px;
            }
            .playlist-video-item .video-details {
                margin-left: 8px;
            }
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none; /* Hidden by default when input is empty */
        }

        /* Show suggestions only when the search container (input) is focused/active */
        .search-container:focus-within .search-suggestions {
            display: block;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <img src="LocalYT-Rev-Files/Logo.png" alt="Logo" class="logo" id="mainLogo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="">
            <img src="LocalYT-Rev-Files/search_icon.svg" id="searchIcon" class="search-icon" alt="Search" draggable="false">
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>
    <div class="playlists-page" id="playlistsPage">
        <h1 class="playlists-header" id="playlistsHeader">Playlists</h1>
        <div id="playlistsContainer"></div>
    </div>
    <div id="deleteModal" class="delete-confirm-modal">
        <div class="delete-confirm-content">
            <h2 id="deleteModalTitle">Delete Playlist</h2>
            <p id="deleteModalText">Are you sure you want to delete this playlist? This cannot be undone.</p>
            <div class="delete-confirm-buttons">
                <button class="btn-cancel-delete" id="cancelDeleteBtn">Cancel</button>
                <button class="btn-confirm-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
    <script>
// --- Language Helper ---
function getLang(en, de) {
    return localStorage.getItem('language') === 'de' ? de : en;
}

// Helper to parse "HH:MM:SS" or "MM:SS" string into total seconds
function parseDurationString(durationStr) {
    if (!durationStr) return 0;
    const parts = durationStr.split(':').map(Number);
    let seconds = 0;
    // Handle HH:MM:SS
    if (parts.length === 3) {
        seconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
    } 
    // Handle MM:SS
    else if (parts.length === 2) {
        seconds = parts[0] * 60 + parts[1];
    }
    return seconds;
}

// Helper to format total seconds back into "HH:MM:SS"
function formatTotalDuration(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const h = hours.toString().padStart(2, '0');
    const m = minutes.toString().padStart(2, '0');
    const s = seconds.toString().padStart(2, '0');

    return `${h}:${m}:${s}`;
}

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    if (mainLogo) {
        mainLogo.addEventListener('click', (e) => {
            if (e.button === 0) window.location.href = 'index.html';
        });
        mainLogo.addEventListener('mouseup', (e) => {
            if (e.button === 1) { e.preventDefault(); window.open('index.html', '_blank'); }
        });
        mainLogo.addEventListener('contextmenu', (e) => {
            e.preventDefault(); window.open('index.html', '_blank');
        });
        mainLogotitle = "Go to homepage";
        mainLogo.style.cursor = 'pointer';
    }

    // --- UI Translation ---
    document.getElementById('searchInput').placeholder = getLang('Search', 'Suchen');
    document.getElementById('playlistsHeader').textContent = getLang('Playlists', 'Playlisten');
    document.getElementById('deleteModalTitle').textContent = getLang('Delete Playlist', 'Playlist löschen');
    document.getElementById('confirmDeleteBtn').textContent = getLang('Delete', 'Löschen');
    document.getElementById('cancelDeleteBtn').textContent = getLang('Cancel', 'Abbrechen');
});

        function stripExtension(filename) {
            return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        let playlistToDelete = null;

        const deleteModal = document.getElementById('deleteModal');
        const deleteModalText = document.getElementById('deleteModalText');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.style.display = 'none';
            playlistToDelete = null;
        });

        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) {
                deleteModal.style.display = 'none';
                playlistToDelete = null;
            }
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!playlistToDelete) return;
            try {
                const response = await fetch('/delete-playlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: playlistToDelete })
                });
                if (response.ok) {
                    deleteModal.style.display = 'none';
                    playlistToDelete = null;
                    loadPlaylists();
                } else {
                    alert(getLang('Error deleting playlist.', 'Fehler beim Löschen der Playlist.'));
                }
            } catch (e) {
                console.error('Error deleting playlist:', e);
            }
            deleteModal.style.display = 'none';
            playlistToDelete = null;
        });

        function updateArrowVisibility(wrapper) {
            const grid = wrapper.querySelector('.playlist-videos-grid');
            const arrowLeft = wrapper.querySelector('.scroll-arrow-left');
            const arrowRight = wrapper.querySelector('.scroll-arrow-right');

            if (!grid || !arrowLeft || !arrowRight) return;

            const scrollLeft = grid.scrollLeft;
            const maxScroll = grid.scrollWidth - grid.clientWidth;

            if (maxScroll <= 0) {
                arrowLeft.classList.remove('visible');
                arrowRight.classList.remove('visible');
                return;
            }

            if (scrollLeft <= 2) {
                arrowLeft.classList.remove('visible');
            } else {
                arrowLeft.classList.add('visible');
            }

            if (scrollLeft >= maxScroll - 2) {
                arrowRight.classList.remove('visible');
            } else {
                arrowRight.classList.add('visible');
            }
        }

        function setupScrollArrows(wrapper) {
            const grid = wrapper.querySelector('.playlist-videos-grid');
            const arrowLeft = wrapper.querySelector('.scroll-arrow-left');
            const arrowRight = wrapper.querySelector('.scroll-arrow-right');

            if (!grid || !arrowLeft || !arrowRight) return;

            const firstItem = grid.querySelector('.playlist-video-item');
            const itemWidth = firstItem ? firstItem.offsetWidth + 15 : 295;
            arrowLeft.addEventListener('click', () => {
                grid.scrollBy({ left: -(itemWidth * 3), behavior: 'smooth' });
            });
            arrowRight.addEventListener('click', () => {
                grid.scrollBy({ left: itemWidth * 3, behavior: 'smooth' });
            });

            grid.addEventListener('scroll', () => updateArrowVisibility(wrapper));

            // Also show arrows on hover when content overflows
            wrapper.addEventListener('mouseenter', () => updateArrowVisibility(wrapper));

            // Initial check after layout
            requestAnimationFrame(() => updateArrowVisibility(wrapper));

            // Re-check on resize
            const ro = new ResizeObserver(() => updateArrowVisibility(wrapper));
            ro.observe(grid);
        }

        async function loadPlaylists() {
            const container = document.getElementById('playlistsContainer');
            container.innerHTML = '';

            try {
                const response = await fetch('/user-playlist-details');
                if (response.status === 401) {
                    container.innerHTML = '<div class="no-playlists">' + getLang('Please log in to view your playlists.', 'Bitte melden Sie sich an, um Ihre Playlisten anzuzeigen.') + '</div>';
                    return;
                }
                if (!response.ok) {
                    container.innerHTML = '<div class="no-playlists">' + getLang('Error loading playlists.', 'Fehler beim Laden der Playlisten.') + '</div>';
                    return;
                }

                const playlists = await response.json();
                const playlistNames = Object.keys(playlists);

                if (playlistNames.length === 0) {
                    container.innerHTML = '<div class="no-playlists">' + getLang('No playlists yet. Save videos from any video page to create your first playlist.', 'Noch keine Playlisten. Speichern Sie Videos von einer beliebigen Videoseite, um Ihre erste Playlist zu erstellen.') + '</div>';
                    return;
                }

                playlistNames.forEach(name => {
                    const videos = playlists[name];
                    const section = document.createElement('div');
                    section.className = 'playlist-section';

                    const headerRow = document.createElement('div');
                    headerRow.className = 'playlist-header-row';

                    const titleGroup = document.createElement('div');
                    titleGroup.className = 'playlist-title-group';
                    
                    const videoCountText = videos.length === 1 
                        ? ('1 ' + getLang('video', 'Video')) 
                        : (videos.length + ' ' + getLang('videos', 'Videos'));
                        
                    titleGroup.innerHTML = '<span class="playlist-title">' + escapeHtml(name) + '</span><span class="playlist-video-count">' + videoCountText + '</span>';
                    
                    // Create element for Total Duration
                    const durationSpan = document.createElement('span');
                    durationSpan.className = 'playlist-total-duration';
                    titleGroup.appendChild(durationSpan);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'playlist-delete-btn';
                    deleteBtn.textContent = getLang('Delete', 'Löschen');
                    deleteBtn.addEventListener('click', () => {
                        playlistToDelete = name;
                        deleteModalText.textContent = getLang('Are you sure you want to delete "', 'Bist du sicher, dass du "') + escapeHtml(name) + getLang('"? This cannot be undone.', '" löschen möchtest? Dies kann nicht rückgängig gemacht werden.');
                        deleteModal.style.display = 'flex';
                    });

                    headerRow.appendChild(titleGroup);
                    headerRow.appendChild(deleteBtn);
                    section.appendChild(headerRow);

                    if (videos.length > 0) {
                        const scrollWrapper = document.createElement('div');
                        scrollWrapper.className = 'playlist-scroll-wrapper';

                        const arrowLeft = document.createElement('button');
                        arrowLeft.className = 'scroll-arrow scroll-arrow-left';
                        arrowLeft.setAttribute('aria-label', 'Scroll left');
                        arrowLeft.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>';

                        const arrowRight = document.createElement('button');
                        arrowRight.className = 'scroll-arrow scroll-arrow-right';
                        arrowRight.setAttribute('aria-label', 'Scroll right');
                        arrowRight.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>';

                        const grid = document.createElement('div');
                        grid.className = 'playlist-videos-grid';

                        // Variable to track total duration for this specific playlist
                        let currentPlaylistTotalSeconds = 0;

                        videos.forEach(video => {
                            const item = document.createElement('div');
                            item.className = 'playlist-video-item';

                            const videoTitle = video.displayName || video.path;
                            const videoPathWithoutExt = stripExtension(video.path);
                            const thumbnailSrc = '/thumbnails/' + encodeURIComponent(videoPathWithoutExt) + '.jpg';
                            const channel = video.path.split('/')[0];
                            const channelPicSrc = '/channelpic/' + encodeURIComponent(channel) + '.jpg';

                            item.innerHTML = '<button class="remove-video-btn" title="' + getLang('Remove from playlist', 'Von Playlist entfernen') + '">&times;</button>' +
                                '<div class="thumbnail-container">' +
                                    '<img src="' + thumbnailSrc + '" alt="' + escapeHtml(videoTitle) + '" class="video-thumbnail" loading="lazy">' +
                                    '<div class="video-length"></div>' +
                                '</div>' +
                                '<div class="video-info">' +
                                    '<div class="channel-pic-link" style="cursor: pointer;">' +
                                        '<img src="' + channelPicSrc + '" alt="' + escapeHtml(channel) + '" class="channel-pic" loading="lazy">' +
                                    '</div>' +
                                    '<div class="video-details">' +
                                        '<div class="video-title">' + escapeHtml(videoTitle) + '</div>' +
                                        '<div class="channel-name">' + escapeHtml(channel) + '</div>' +
                                        '<div class="video-description">' + video.viewCount + ' ' + getLang('views', 'Aufrufe') + (video.fileDate ? ' &bull; ' + video.fileDate : '') + '</div>' +
                                    '</div>' +
                                '</div>';

                            grid.appendChild(item);

                            // Click handlers for video navigation
                            const thumbContainer = item.querySelector('.thumbnail-container');
                            const titleEl = item.querySelector('.video-title');
                            const videoUrl = 'video.html?src=' + encodeURIComponent(video.path);

                            thumbContainer.addEventListener('click', () => { window.location.href = videoUrl; });
                            titleEl.addEventListener('click', () => { window.location.href = videoUrl; });
                            titleEl.style.cursor = 'pointer';

                            thumbContainer.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(videoUrl, '_blank'); });
                            titleEl.addEventListener('contextmenu', (e) => { e.preventDefault(); window.open(videoUrl, '_blank'); });
                            thumbContainer.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); window.open(videoUrl, '_blank'); } });
                            titleEl.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); window.open(videoUrl, '_blank'); } });

                            // --- MODIFICATION: Setup events for channel pic links ---
                            setupChannelLinkEvents(item.querySelector('.channel-pic-link'), channel);
                            setupChannelLinkEvents(item.querySelector('.channel-name'), channel);

                            // Remove button
                            const removeBtn = item.querySelector('.remove-video-btn');
                            removeBtn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                try {
                                    const res = await fetch('/remove-from-playlist', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ playlist: name, video: video.path })
                                    });
                                    if (res.ok) {
                                        item.style.transition = 'opacity 0.3s';
                                        item.style.opacity = '0';
                                        setTimeout(() => {
                                            loadPlaylists();
                                        }, 300);
                                    }
                                } catch (err) {
                                    console.error('Error removing video:', err);
                                }
                            });

                            // Fetch video length
                            const videoFilename = video.path.split('/').pop();
                            const videoNameWithoutExt = stripExtension(videoFilename);
                            fetch('/videolengths/' + encodeURIComponent(channel) + '/' + encodeURIComponent(videoNameWithoutExt) + '.txt')
                                .then(r => r.text())
                                .then(length => {
                                    const lengthEl = item.querySelector('.video-length');
                                    if (lengthEl) lengthEl.textContent = length;

                                    // Calculate and Update Total Duration
                                    const secs = parseDurationString(length.trim());
                                    currentPlaylistTotalSeconds += secs;
                                    
                                    const formattedTotal = formatTotalDuration(currentPlaylistTotalSeconds);
                                    durationSpan.textContent = `• ${getLang('Total duration', 'Gesamtdauer')}: ${formattedTotal}`;
                                })
                                .catch(() => {});
                        });

                        scrollWrapper.appendChild(arrowLeft);
                        scrollWrapper.appendChild(grid);
                        scrollWrapper.appendChild(arrowRight);
                        section.appendChild(scrollWrapper);

                        // Setup arrow visibility after DOM insertion
                        requestAnimationFrame(() => setupScrollArrows(scrollWrapper));
                    }

                    container.appendChild(section);
                });
            } catch (e) {
                console.error('Error loading playlists:', e);
                container.innerHTML = '<div class="no-playlists">' + getLang('Error loading playlists.', 'Fehler beim Laden der Playlisten.') + '</div>';
            }
        }

        // --- NEW FUNCTION: Setup events for channel links (matches index.html behavior) ---
        function setupChannelLinkEvents(element, channel) {
            // Handle left click
            element.addEventListener('click', () => {
                window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
            });

            // Handle right-click
            element.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
            });

            // Handle middle-click
            element.addEventListener('mouseup', (event) => {
                if (event.button === 1) {
                    event.preventDefault();
                    window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
                }
            });
        }

        // Search functionality
        document.addEventListener('DOMContentLoaded', () => {
            loadPlaylists();

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                if (query.length < 2) {
                    document.getElementById('searchSuggestions').innerHTML = '';
                    return;
                }
                fetch('/search-index')
                    .then(response => response.json())
                    .then(data => {
                        const suggestions = (data.videos || [])
                            .filter(video => video.displayName.toLowerCase().includes(query))
                            .slice(0, 5);
                        const suggestionsContainer = document.getElementById('searchSuggestions');
                        suggestionsContainer.innerHTML = '';
                        suggestions.forEach(suggestion => {
                            const el = document.createElement('div');
                            el.className = 'suggestion-item';
                            el.textContent = suggestion.displayName;
                            el.onclick = () => { window.location.href = 'video.html?src=' + encodeURIComponent(suggestion.path); };
                            suggestionsContainer.appendChild(el);
                        });
                    });
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') window.location.href = 'search.html?q=' + encodeURIComponent(searchInput.value);
            });

            document.getElementById('searchIcon').addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) window.location.href = 'search.html?q=' + encodeURIComponent(query);
                else searchInput.focus();
            });
        });
    </script>
    <script src="profile-pic.js"></script>
</body>
</html>
