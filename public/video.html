<script>
    /**
     * Safely decode a URI component.
     * If the string contains malformed sequences like bare '%', 
     * returns the original string instead of crashing.
     */
    function safeDecodeURIComponent(str) {
        if (!str) return '';
        try {
            return decodeURIComponent(str);
        } catch (e) {
            console.warn('[safeDecode] Malformed URI sequence, returning raw:', str);
            return str;
        }
    }

    // Determine which Player script to load based on settings and video file extension
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        let videoSrc = '';
        try {
            videoSrc = safeDecodeURIComponent(urlParams.get('src') || '');
        } catch (e) {
            console.warn("Could not decode video src in head, using raw value:", e);
            videoSrc = urlParams.get('src') || '';
        }
        
        const extension = videoSrc.split('.').pop().toLowerCase();
        const playerSettings = JSON.parse(localStorage.getItem('videoPlayer') || '{}');
        const selectedPlayer = playerSettings.player || 'lyt';
        
        const scriptsToLoad = [];

        if (selectedPlayer === 'lyt') {
            scriptsToLoad.push('lyt-player.js');
        } else {
            // Fluid Player
            if (extension === 'mp3') {
                scriptsToLoad.push('fluidplayer.minMP3MOD.js');
            } else {
                scriptsToLoad.push('fluidplayer.min.js');
            }
        }
        
        scriptsToLoad.forEach(scriptFile => {
            const script = document.createElement('script');
            script.src = scriptFile;
            script.onload = function() {
                console.log(`Loaded ${scriptFile} for ${extension} files (Player: ${selectedPlayer})`);
            };
            document.head.appendChild(script);
        });
    })();
</script>

    <script>
// Natural sorting function for videos with numbers in titles
function naturalCompare(a, b) {
    // Helper function to extract numbers from video titles
    const extractNumbers = (str) => {
        return (str.match(/\d+/g) || []).map(num => parseInt(num, 10));
    };

    const numsA = extractNumbers(a.displayName);
    const numsB = extractNumbers(b.displayName);

    // Compare number by number
    for (let i = 0; i < Math.max(numsA.length, numsB.length); i++) {
        const numA = i < numsA.length ? numsA[i] : 0;
        const numB = i < numsB.length ? numsB[i] : 0;
        
        if (numA !== numB) {
            return numA - numB;
        }
    }
    
    // If all numbers match, fall back to string comparison
    return a.displayName.localeCompare(b.displayName);
}

    // --- Language Helper ---
    function getLang(en, de) {
        return localStorage.getItem('language') === 'de' ? de : en;
    }

// Handle logo clicks
document.addEventListener('DOMContentLoaded', () => {
    const mainLogo = document.getElementById('mainLogo');
    
    if (mainLogo) {

        mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";
        
        mainLogo.style.cursor = 'pointer';
    }
});

        // Helper function to strip file extension for thumbnail and metadata paths
        function stripExtension(filename) {
            return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
        }

        // Helper function to get video file extension
        function getVideoExtension(path) {
            const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
            return match ? match[1] : 'mp4';
        }

        // Helper function to get MIME type based on extension
        function getMimeType(extension) {
            const mimeTypes = {
                'mp4': 'video/mp4',
                'mkv': 'video/x-matroska',
                'avi': 'video/x-msvideo',
                'mov': 'video/quicktime',
                'wmv': 'video/x-ms-wmv',
                'flv': 'video/x-flv',
                'webm': 'video/webm',
                'mp3': 'audio/mp3'
            };
            return mimeTypes[extension.toLowerCase()] || 'video/mp4';
        }

// ===== COMMENT HELPERS =====
function getAvatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = ((hash % 360) + 360) % 360;
    return `hsl(${hue}, 45%, 38%)`;
}

function formatRelativeTime(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return '';
    const now = new Date();
    const diffMs = now - date;
    const sec = Math.floor(diffMs / 1000);
    const min = Math.floor(sec / 60);
    const hr  = Math.floor(min / 60);
    const day = Math.floor(hr / 24);
    const wk  = Math.floor(day / 7);
    const mo  = Math.floor(day / 30);
    const yr  = Math.floor(day / 365);

    // Check language
    const lang = localStorage.getItem('language');
    const isDe = lang === 'de';

    if (sec < 60) return isDe ? 'gerade eben' : 'just now';
    if (min < 60) {
        if (isDe) return `vor ${min} ${min === 1 ? 'Minute' : 'Minuten'}`;
        return min + (min === 1 ? ' minute ago' : ' minutes ago');
    }
    if (hr < 24) {
        if (isDe) return `vor ${hr} ${hr === 1 ? 'Stunde' : 'Stunden'}`;
        return hr + (hr === 1 ? ' hour ago' : ' hours ago');
    }
    if (day < 7) {
        if (isDe) return `vor ${day} ${day === 1 ? 'Tag' : 'Tagen'}`;
        return day + (day === 1 ? ' day ago' : ' days ago');
    }
    if (wk < 5) {
        if (isDe) return `vor ${wk} ${wk === 1 ? 'Woche' : 'Wochen'}`;
        return wk + (wk === 1 ? ' week ago' : ' weeks ago');
    }
    if (mo < 12) {
        if (isDe) return `vor ${mo} ${mo === 1 ? 'Monat' : 'Monaten'}`;
        return mo + (mo === 1 ? ' month ago' : ' months ago');
    }
    if (isDe) return `vor ${yr} ${yr === 1 ? 'Jahr' : 'Jahren'}`;
    return yr + (yr === 1 ? ' year ago' : ' years ago');
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

const LIKE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H1v10h6l11.77-10zM7 20H2v-8h5v8zm8.63-15.34c.15-.51-.25-.66-.56-.66-.31 0-.6.15-.84.41L7.62 11h6.01l1.52-4.94L21 11h-2l-7 10h2l7-10z"/></svg>';
const CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';

function processCommentText(text) {
    let escaped = escapeHtml(text);

    const urlRegex = /(https?:\/\/[^\s<]+)/g;
    escaped = escaped.replace(urlRegex, function(url) {
        return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' + url + '</a>';
    });

    const timestampRegex = /(\b\d{1,2}:\d{2}(?::\d{2})?\b)/g;
    escaped = escaped.replace(timestampRegex, function(timestamp) {
        return '<a href="#" onclick="seekToTimestamp(\'' + timestamp + '\'); return false;" style="color: #3ea6ff; text-decoration: none;">' + timestamp + '</a>';
    });

    return escaped;
}

function renderSingleComment(comment, isReply, channelPicUrl, isCommentLiked = false) {
    const initial = comment.author.replace('@', '').charAt(0).toUpperCase();
    const bg = getAvatarColor(comment.author);
    const isLong = comment.text && comment.text.length > 180;
    const replyCls = isReply ? ' reply' : '';
    
    // Generate unique ID for each comment
    const commentId = `${comment.author}-${comment.published_at}-${comment.text.substring(0, 20)}`;

    // Check user preference for commenter avatar style
    const commenterSettings = JSON.parse(localStorage.getItem('commenterProfileStyle') || '{}');
    const commenterStyle = commenterSettings.style || 'modern';

    let avatarHtml;
    if (comment.is_uploader && channelPicUrl) {
        avatarHtml = `<img class="comment-avatar" src="${channelPicUrl}" alt="" style="object-fit: cover;">`;
    } else if (commenterStyle === 'classic') {
        avatarHtml = `<img class="comment-avatar" src="/LocalYT-Rev-Files/commenter-profile-placeholder.png" alt="" style="object-fit: cover;">`;
    } else {
        avatarHtml = `<div class="comment-avatar" style="background:${bg}">${initial}</div>`;
    }

    let badges = '';
    if (comment.is_pinned) badges += '<span class="comment-pinned-label">📌 Pinned</span>';
    if (comment.is_uploader) badges += '<span class="comment-badge uploader-badge">Uploader</span>';
    if (comment.is_verified) badges += '<span class="comment-badge verified-badge">✓</span>';

    // Determine styles
    const likedClass = isCommentLiked ? ' liked' : '';
    
    const imgFilter = isCommentLiked 
        ? 'invert(49%) sepia(94%) saturate(1748%) hue-rotate(194deg) brightness(97%) contrast(101%)' 
        : 'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';

    return `<div class="comment-item${replyCls}" data-comment-id="${encodeURIComponent(commentId)}">
        ${avatarHtml}
        <div class="comment-body">
            <div class="comment-meta">
                <span class="comment-author">${escapeHtml(comment.author.replace('@', ''))}</span>${badges}
                <span class="comment-timestamp">${formatRelativeTime(comment.published_at)}</span>
            </div>
            <div class="comment-text${isLong ? ' collapsed' : ''}">${processCommentText(comment.text)}</div>
            ${isLong ? `<div class="comment-toggle-text" data-action="expand">${getLang('Show more', 'Mehr anzeigen')}</div>` : ''}
            <div class="comment-actions">
                <div class="comment-like-btn${likedClass}" onclick="handleCommentLike(this, '${encodeURIComponent(commentId)}')">
                    <!-- USING IMG TAG (Matches Reference Code) -->
                    <img src="LocalYT-Rev-Files/like.svg" alt="" style="width:14px;height:14px;filter:${imgFilter};flex-shrink:0;cursor:pointer;">
                    <span>${comment.likes || 0}</span>
                </div>
            </div>
        </div>
    </div>`;
}

// Handle comment like button clicks
async function handleCommentLike(buttonElement, commentId) {
    try {
        const response = await fetch('/like-comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ commentId: safeDecodeURIComponent(commentId) })
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                alert('Please log in to like comments.');
                return;
            }
            throw new Error('Failed to update like');
        }
        
        const data = await response.json();
        
        // Get the IMG element (not SVG)
        const img = buttonElement.querySelector('img');
        
        // Update UI immediately
        if (data.isLiked) {
            buttonElement.classList.add('liked');
            // Apply Blue Filter
            img.style.filter = 'invert(49%) sepia(94%) saturate(1748%) hue-rotate(194deg) brightness(97%) contrast(101%)';
            
            const span = buttonElement.querySelector('span');
            span.textContent = parseInt(span.textContent || 0) + 1;
        } else {
            buttonElement.classList.remove('liked');
            // Apply Grey Filter (Default)
            img.style.filter = 'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';
            
            const span = buttonElement.querySelector('span');
            span.textContent = Math.max(0, parseInt(span.textContent || 0) - 1);
        }
    } catch (error) {
        console.error('Error liking comment:', error);
    }
}

// ===== COMMENT LAZY-LOADING STATE =====
let _lazyCommentsState = {
    allTopLevel: [],
    allReplies: [],
    channelPicUrl: '',
    renderedCount: 0,
    batchSize: 30,
    observer: null,
    loading: false
};

function renderCommentsBatch() {
    const state = _lazyCommentsState;
    const container = document.getElementById('commentsContainer');
    const countEl = document.getElementById('commentsCount');

    const totalCount = state.allTopLevel.length + state.allReplies.length;
    countEl.textContent = getLang('Comments', 'Kommentare');
    countEl.style.marginRight = '4px';
    
    let countSpan = document.getElementById('commentsTotalAmount');
    if (!countSpan) {
        countSpan = document.createElement('span');
        countSpan.id = 'commentsTotalAmount';
        countEl.parentNode.insertBefore(countSpan, countEl.nextSibling);
    }
    countSpan.textContent = ' \u2022 ' + totalCount.toLocaleString();

    const start = state.renderedCount;
    const end = Math.min(start + state.batchSize, state.allTopLevel.length);

    let html = '';
    for (let i = start; i < end; i++) {
        const comment = state.allTopLevel[i];
        const commentId = `${comment.author}-${comment.published_at}-${comment.text.substring(0, 20)}`;
        const isLiked = state.userCommentLikes[commentId] === true;
        html += renderSingleComment(comment, false, state.channelPicUrl, isLiked);
    }

    const sentinel = document.getElementById('commentsSentinel');
    if (sentinel) sentinel.remove();
    container.insertAdjacentHTML('beforeend', html);

    state.renderedCount = end;

    bindCommentTextToggles(container);

    if (state.renderedCount >= state.allTopLevel.length) {
        showRepliesSection();
        return;
    }

    ensureSentinel(container);
    ensureObserver();
}

function ensureSentinel(container) {
    const sentinel = document.createElement('div');
    sentinel.id = 'commentsSentinel';
    sentinel.style.height = '1px';
    container.appendChild(sentinel);
}

function ensureObserver() {
    const state = _lazyCommentsState;
    if (state.observer) state.observer.disconnect();

    state.observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !state.loading && state.renderedCount < state.allTopLevel.length) {
            state.loading = true;
            requestAnimationFrame(() => {
                renderCommentsBatch();
                state.loading = false;
            });
        }
    }, { rootMargin: '200px' });

    const sentinel = document.getElementById('commentsSentinel');
    if (sentinel) state.observer.observe(sentinel);
}

function showRepliesSection() {
    const state = _lazyCommentsState;
    const container = document.getElementById('commentsContainer');

    if (state.allReplies.length > 0) {
        const repliesSection = document.createElement('div');
        repliesSection.id = 'repliesSection';

        let html = `<button class="replies-toggle" id="repliesToggle">${CHEVRON_SVG} View ${state.allReplies.length} ${state.allReplies.length === 1 ? 'reply' : 'replies'}</button>`;
        html += `<div class="replies-container collapsed" id="repliesContainer">`;
        state.allReplies.forEach(r => {
            const replyId = `${r.author}-${r.published_at}-${r.text.substring(0, 20)}`;
            const isLiked = state.userCommentLikes[replyId] === true;
            html += renderSingleComment(r, true, state.channelPicUrl, isLiked);
        });
        html += '</div>';

        repliesSection.innerHTML = html;
        container.appendChild(repliesSection);

        const toggle = document.getElementById('repliesToggle');
        const repliesBox = document.getElementById('repliesContainer');
        if (toggle && repliesBox) {
            toggle.addEventListener('click', function () {
                const open = this.classList.toggle('open');
                if (open) {
                    repliesBox.classList.remove('collapsed');
                    repliesBox.style.maxHeight = repliesBox.scrollHeight + 'px';
                    this.innerHTML = CHEVRON_SVG + ' Hide replies';
                } else {
                    repliesBox.style.maxHeight = repliesBox.scrollHeight + 'px';
                    requestAnimationFrame(() => { repliesBox.classList.add('collapsed'); });
                    this.innerHTML = CHEVRON_SVG + ` View ${state.allReplies.length} ${state.allReplies.length === 1 ? 'reply' : 'replies'}`;
                }
            });
        }
    }

    if (state.observer) {
        state.observer.disconnect();
        state.observer = null;
    }
}

function bindCommentTextToggles(container) {
    container.querySelectorAll('[data-action="expand"]').forEach(btn => {
        if (btn._bound) return;
        btn._bound = true;
        btn.addEventListener('click', function () {
            const textEl = this.previousElementSibling;
            if (textEl.classList.contains('collapsed')) {
                textEl.classList.remove('collapsed');
                this.textContent = getLang('Show less', 'Weniger anzeigen');
            } else {
                textEl.classList.add('collapsed');
                this.textContent = getLang('Show more', 'Mehr anzeigen');
            }
        });
    });
}

function renderComments(comments, channelPicUrl, userCommentLikes = {}) {
    const container = document.getElementById('commentsContainer');
    const countEl = document.getElementById('commentsCount');

    if (_lazyCommentsState.observer) {
        _lazyCommentsState.observer.disconnect();
        _lazyCommentsState.observer = null;
    }

    container.innerHTML = '';

    if (!comments || comments.length === 0) {
        const lang = localStorage.getItem('language');
        if (lang === 'de') {
            countEl.textContent = 'Kommentare';
            countEl.style.marginRight = '4px';
            let countSpanDe = document.getElementById('commentsTotalAmount');
            if (!countSpanDe) {
                countSpanDe = document.createElement('span');
                countSpanDe.id = 'commentsTotalAmount';
                countEl.parentNode.insertBefore(countSpanDe, countEl.nextSibling);
            }
            countSpanDe.textContent = ' \u2022 0';
            container.innerHTML = '<div class="no-comments">Keine Kommentare für dieses Video vorhanden.</div>';
        } else {
            countEl.textContent = 'Comments';
            countEl.style.marginRight = '4px';
            let countSpanEn = document.getElementById('commentsTotalAmount');
            if (!countSpanEn) {
                countSpanEn = document.createElement('span');
                countSpanEn.id = 'commentsTotalAmount';
                countEl.parentNode.insertBefore(countSpanEn, countEl.nextSibling);
            }
            countSpanEn.textContent = ' \u2022 0';
            container.innerHTML = '<div class="no-comments">No comments available for this video.</div>';
        }
        return;
    }

    const topLevel = comments.filter(c => !c.is_reply);
    const replies = comments.filter(c => c.is_reply);

    topLevel.sort((a, b) => {
        if (a.is_pinned && !b.is_pinned) return -1;
        if (!a.is_pinned && b.is_pinned) return 1;
        return (b.likes || 0) - (a.likes || 0);
    });
    replies.sort((a, b) => (b.likes || 0) - (a.likes || 0));

    // Store likes in state so batch renderer can access them
    _lazyCommentsState.userCommentLikes = userCommentLikes;
    _lazyCommentsState.allTopLevel = topLevel;
    _lazyCommentsState.allReplies = replies;
    _lazyCommentsState.channelPicUrl = channelPicUrl;
    _lazyCommentsState.renderedCount = 0;
    _lazyCommentsState.loading = false;

    renderCommentsBatch();
}

async function loadComments(videoSrc, channelPicUrl) {
    try {
        // Fetch comments and user's liked comments in parallel
        const [commentsRes, likesRes] = await Promise.all([
            fetch('/api/comments?video=' + encodeURIComponent(videoSrc)),
            fetch('/user-comment-likes')
        ]);
        
        if (!commentsRes.ok) return renderComments([], channelPicUrl);
        const comments = await commentsRes.json();
        
        // Parse user likes (returns {} if not logged in or error)
        let userCommentLikes = {};
        if (likesRes.ok) {
            userCommentLikes = await likesRes.json();
        }
        
        renderComments(comments, channelPicUrl, userCommentLikes);
    } catch (e) {
        console.error('Error loading comments:', e);
        renderComments([], channelPicUrl);
    }
}

            // ===== AUTOPLAY / SKIP LOGIC =====
            // Define the handler function OUTSIDE the event listener to avoid nesting errors
            async function handleAutoPlayOrSkip(isManualSkip = false) {
                try {
                    const autoplaySettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');
                    
                    // Ensure defaults if they are missing
                    if (autoplaySettings.enabled && !autoplaySettings.nonPlaylistMode && !playlistName) {

                    }
            
                    console.log('[Autoplay/Skip] Settings:', autoplaySettings);
                    console.log('[Autoplay/Skip] In playlist?', !!playlistName, playlistName);
                    console.log('[Autoplay/Skip] Is manual skip?', isManualSkip);
                    
                    // If autoplay is disabled AND this is not a manual skip, do nothing
                    if (!autoplaySettings.enabled && !isManualSkip) {
                        console.log('[Autoplay/Skip] Autoplay disabled and not a manual skip. Staying put.');
                        return;
                    }
            
                    if (autoplaySettings.enabled || isManualSkip) {
                        if (playlistName && (autoplaySettings.playlistNext !== false || isManualSkip)) {
                            console.log('[Autoplay/Skip] → Next in playlist');
                            await autoplayNextInPlaylist();
                        } 
                        else if (!playlistName) {
                            console.log('[Autoplay/Skip] → Non-playlist mode:', autoplaySettings.nonPlaylistMode || 'first-recommended');
                            switch (autoplaySettings.nonPlaylistMode || 'first-recommended') {
                                case 'first-recommended':
                                    await autoplayFirstRecommended();
                                    break;
                                case 'random-recommended':
                                    await autoplayRandomRecommended();
                                    break;
                                case 'random-database':
                                    await autoplayRandomDatabase();
                                    break;
                                default:
                                    console.warn('[Autoplay/Skip] Unknown/Default mode, falling back to first recommended');
                                    await autoplayFirstRecommended();
                            }
                        } else {
                            console.log('[Autoplay/Skip] In playlist but playlistNext is disabled');
                        }
                    }
                } catch (e) {

                }

            document.addEventListener('keydown', (event) => {
                const activeElement = document.activeElement;
                
                // 1. Ignore if typing
                const isTyping = activeElement && (
                    activeElement.id === 'searchInput' || 
                    activeElement.tagName === 'INPUT' || 
                    activeElement.tagName === 'TEXTAREA' ||
                    activeElement.isContentEditable
                );
                
                if (isTyping) return;
                if (event.ctrlKey || event.metaKey) return;

                const key = event.key.toLowerCase();

                switch (key) {
                    case ' ': // Spacebar
                    case 'k':
                        // 2. UNIVERSAL FIX: 
                        // If myFP exists (it could be LYT or Fluid), assume the player 
                        // is handling the keypress. We just prevent scrolling and stop.
                        if (myFP) {
                            event.preventDefault(); // Prevent page scroll
                            return; // Exit - Let the player script do the work!
                        }

                        // 3. FALLBACK: Only run this if NO player loaded (Native HTML5)
                        event.preventDefault();
                        if (videoPlayer) {
                            videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                        }
                        break;
                    
                    case 'arrowleft':
                    case 'arrowright':
                        event.preventDefault(); // Prevent page scroll either way
                        if (myFP) {
                            return; // LYT Player handles seeking — don't double-seek!
                        }
                        // Fallback: Only run this if NO player loaded (Native HTML5)
                        if(videoPlayer) {
                            videoPlayer.currentTime += (key === 'arrowleft') ? -5 : 5;
                        }
                        break;
                    case 'arrowup':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                        break;
                    case 'arrowdown':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                        break;
                    case 'f':
                        event.preventDefault();
                        // Note: We allow video.html to handle Fullscreen because 
                        // sometimes player fullscreen implementations differ or we want custom behavior.
                        if (myFP && typeof myFP.toggleFullScreen === 'function') {
                            myFP.toggleFullScreen();
                        } else if (videoPlayer) {
                            document.fullscreenElement ? document.exitFullscreen() : videoPlayer.requestFullscreen();
                        }
                        break;
                    case ',':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.currentTime -= 1 / 30;
                        break;
                    case '.':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.currentTime += 1 / 30;
                        break;
                    case ';':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.playbackRate = Math.max(0.25, videoPlayer.playbackRate - 0.25);
                        break;
                    case ':':
                        event.preventDefault();
                        if(videoPlayer) videoPlayer.playbackRate = Math.min(4, videoPlayer.playbackRate + 0.25);
                        break;
                }
            });

async function detectAndStyleLinks(text) {
    const urlRegex = /(https?:\/\/[^\s<]+)/g;
    const timestampRegex = /(\b\d{1,2}:\d{2}(?::\d{2})?\b)/g;
    const mentionRegex = /@(\w+)/g;

    // 1. Handle URLs
    let processedText = text.replace(urlRegex, function(url) {
        return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' + url + '</a>';
    });

    // 2. Handle Timestamps
    processedText = processedText.replace(timestampRegex, function(timestamp) {
        const seconds = convertTimestampToSeconds(timestamp);
        return '<a href="#" onclick="seekToTimestamp(\'' + timestamp + '\'); return false;" style="color: #3ea6ff; text-decoration: none;">' + timestamp + '</a>';
    });

    // 3. Handle @Mentions (Check if Channel Image Exists)
    const mentions = [];
    let match;
    while ((match = mentionRegex.exec(processedText)) !== null) {
        if (!mentions.includes(match[1])) {
            mentions.push(match[1]);
        }
    }

            return fetch(`/channelpic/${encodeURIComponent(channelName)}.jpg`, { method: 'HEAD' })
                .then(res => ({ name: channelName, exists: res.ok }))
                .catch(() => ({ name: channelName, exists: false }));
        });

        try {
            const results = await Promise.all(checkPromises);
            const existingChannels = results.filter(r => r.exists).map(r => r.name);
            
            let idCounter = 0;
            
            processedText = processedText.replace(mentionRegex, function(fullMatch, channelName) {
                if (existingChannels.includes(channelName)) {
                    const uniqueId = `mention-${idCounter++}`;
                    const encodedChannel = encodeURIComponent(channelName);
                    
                    // Return span with ID so we can attach event listeners immediately after
                    return `<span id="${uniqueId}" class="mention-link" data-channel="${encodedChannel}">${fullMatch}</span>`;
                }
                return fullMatch;
            });
            
            // Attach event listeners to the newly created spans after they are in the DOM
            // We use a small timeout to ensure the DOM has been updated if this is used immediately
            setTimeout(() => {
                existingChannels.forEach((channelName, index) => {
                    const el = document.getElementById(`mention-${index}`);
                    if (el) {
                        const url = `channel.html?channel=${el.dataset.channel}`;
                        
                        // Left click (default behavior handled by CSS/onclick logic if needed, 
                        // but here we specifically handle wheel and right click as requested)
                        
                        el.addEventListener('mouseup', (e) => {
                            if (e.button === 1) { // Middle Click
                                e.preventDefault();
                                window.open(url, '_blank');
                            }
                        });
                        
                        el.addEventListener('auxclick', (e) => {
                            if (e.button === 1) { // Middle Click Fallback
                                e.preventDefault();
                                window.open(url, '_blank');
                            }
                        });

                        el.addEventListener('contextmenu', (e) => { // Right Click
                            e.preventDefault();
                            window.open(url, '_blank');
                        });
                        
                        // Ensure left click also works to navigate
                        el.addEventListener('click', () => {
                             window.location.href = url;
                        });
                    }
                });
            }, 0);

        } catch (e) {
            console.log('Could not verify mentions:', e);
        }
    }

    return processedText;
}

            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

    // Set initial checkbox state
    checkbox.checked = currentSettings.enabled;
    
    // Handle toggle changes - ONLY switches enabled on/off, preserves mode!
    checkbox.addEventListener('change', () => {
        // Re-read to ensure we have absolute latest (in case settings page was open in another tab)
        currentSettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');
        
        // Re-apply defaults if somehow missing
        if (currentSettings.nonPlaylistMode === undefined) currentSettings.nonPlaylistMode = 'first-recommended';
        if (currentSettings.playlistNext === undefined) currentSettings.playlistNext = true;
        
        // Simply flip the enabled flag - DO NOT touch nonPlaylistMode or playlistNext!
        currentSettings.enabled = checkbox.checked;
        
        // Save immediately
        localStorage.setItem('autoplaySettings', JSON.stringify(currentSettings));
        
        console.log('[Sidebar Toggle] Autoplay ' + (checkbox.checked ? 'ENABLED' : 'DISABLED') + 
                    '. Mode preserved: ' + currentSettings.nonPlaylistMode);
    });
    
    // Allow clicking the text label to toggle as well
    label.addEventListener('click', () => {
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
    });
}

// ===== LIVE CHAT INTEGRATION LOGIC =====

let liveChatData = []; // Stores parsed chat messages
let processedIndices = new Set(); // Tracks displayed messages
let chatTimer = null;

async function initLiveChat(videoSrc, playlistName) {
    if (!videoSrc) return;

    try {
        const parts = videoSrc.split('/');
        const channel = parts[0];
        
        const rawVideoName = parts[parts.length - 1]; 
        let videoName = stripExtension(rawVideoName);

        let encodedName = encodeURIComponent(videoName);
        
        // 2. Double-check specific problematic chars often missed or mishandled
        // (This creates a "safe" string that definitely looks like a URI component)
        encodedName = encodedName.replace(/'/g, "%27")
                                 .replace(/\(/g, "%28")
                                 .replace(/\)/g, "%29")
                                 .replace(/!/g, "%21")
                                 .replace(/,/g, "%2C");
        
        const chatUrl = `/livechats/${encodeURIComponent(channel)}/${encodedName}.json`;
        
        console.log(`[LiveChat] Attempting to fetch: ${chatUrl}`);

        const response = await fetch(chatUrl);
        
        if (!response.ok) return; 
        
        liveChatData = await response.json();
        
        if (liveChatData && liveChatData.length > 0) {
            console.log(`[LiveChat] Loaded ${liveChatData.length} messages.`);
            
            document.getElementById('chatToggleContainer').style.display = 'block';
            setupChatSync();
        }
    } catch (err) {
        console.log("[LiveChat] No chat file available.", err);
    }
}

function setupChatSync() {
    const videoPlayer = document.getElementById('videoPlayer');
    
    // Clear chat on seek to allow re-displaying context around new time
    videoPlayer.addEventListener('seeking', () => {
        clearChatMessages();
        // Small delay to ensure currentTime is updated
        setTimeout(syncChat, 100);
    });

    videoPlayer.addEventListener('timeupdate', () => {
        syncChat();
    });
    
    videoPlayer.addEventListener('pause', () => {
        if(chatTimer) cancelAnimationFrame(chatTimer);
    });
}

let isChatSyncing = false; // Prevent overlapping syncs
let lastSyncedIndex = -1; // Track the last processed message index to avoid duplicates
let isSeeking = false; // Flag to detect when user has jumped in timeline

function syncChat() {
    // Prevent flicker: if already syncing, skip this frame
    if (isChatSyncing) return;
    
    // Check if chat container is visible before syncing
    const chatContainer = document.getElementById('liveChatContainer');
    if (!chatContainer.style.display || chatContainer.style.display === 'none') return;

    const videoPlayer = document.getElementById('videoPlayer');
    const currentMs = videoPlayer.currentTime * 1000;
    const container = document.getElementById('liveChatMessages');
    
    let addedCount = 0;
    const maxPerFrame = 50; // Allow bulk load for seeking, but limit total display
    
    // DETECT SEEK: If current time is before the timestamp of the last displayed message,
    // user has jumped backwards. If gap is > 2sec forward, likely a jump too.
    if (lastSyncedIndex >= 0 && lastSyncedIndex < liveChatData.length) {
        const lastMsgTime = liveChatData[lastSyncedIndex].offsetMs;
        const timeDiff = currentMs - lastMsgTime;
        
        // If we went back more than 2 seconds, or jumped ahead more than 5 seconds, treat as seek
        if (currentMs < lastMsgTime - 2000) {
            console.log(`[Chat] Seek detected! Clearing and reloading from ${formatTime(currentMs)}`);
            clearChatMessages();
            isSeeking = true;
        }
    }
    
    // Determine starting index
    let startIndex;
    if (isSeeking || lastSyncedIndex === -1) {
        // For seeks: Binary search or linear scan to find starting point
        // Find the first message that falls within our 50-message window before current time
        startIndex = findStartIndexForTime(currentMs);
        isSeeking = false; // Reset flag after handling seek
    } else {
        // Normal playback: continue from where we left off
        startIndex = Math.max(0, lastSyncedIndex + 1);
    }
    
    for (let i = startIndex; i < liveChatData.length; i++) {
        const msg = liveChatData[i];

        // If message offset is in the future, stop
        if (msg.offsetMs > currentMs) break;

        // Add this message
        addChatMessageToDOM(msg.author, msg.message);
        processedIndices.add(i);
        lastSyncedIndex = i; // Update our position
        addedCount++;
        
        if (addedCount >= maxPerFrame) break;
    }
    
    // Enforce 50-message limit by removing oldest (only needed during initial bulk load)
    while (container.children.length > 50) {
        container.removeChild(container.firstChild);
        // Remove oldest tracked index to keep in sync
        if (processedIndices.size > 0) {
            const oldestIndex = Math.min(...processedIndices);
            processedIndices.delete(oldestIndex);
            // Update lastSyncedIndex if we removed something after it (shouldn't happen but safety)
            if (oldestIndex <= lastSyncedIndex && processedIndices.size > 0) {
                // Keep lastSyncedIndex pointing to newest
            }
        }
    }
    
    // Auto-scroll to bottom
    if (addedCount > 0 || (container.scrollHeight - container.scrollTop - container.clientHeight < 100)) {
        container.scrollTop = container.scrollHeight;
    }
}

// Helper: Find the best starting index to show ~50 messages leading up to currentTime
function findStartIndexForTime(currentMs) {
    // First, find how many messages exist up to this point
    let countUpToNow = 0;
    for (let i = 0; i < liveChatData.length; i++) {
        if (liveChatData[i].offsetMs <= currentMs) {
            countUpToNow++;
        } else {
            break;
        }
    }
    
    // We want the latest 50 messages (or fewer if not enough history)
    // So start from (countUpToNow - 50), minimum 0
    return Math.max(0, countUpToNow - 50);
}

function formatTime(ms) {
    const seconds = Math.floor(ms / 1000);
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function clearChatMessages() {
    const container = document.getElementById('liveChatMessages');
    container.innerHTML = '';
    processedIndices.clear();
    lastSyncedIndex = -1; // Reset position when clearing (seeking)
}

// Override the video player's seeking event to ensure we catch all seeks
document.addEventListener('DOMContentLoaded', () => {
    const videoPlayer = document.getElementById('videoPlayer');
    if (videoPlayer) {
        videoPlayer.addEventListener('seeking', () => {
            // Mark as seeking so next syncChat() will handle it
            isSeeking = true;
            // Small delay to ensure currentTime is updated before we process
            setTimeout(() => {
                if (isChatSyncing) return; // Don't interrupt ongoing sync
                syncChat();
            }, 50);
        });
    }
});

function appendChatMessage(author, message) {
    // This function is called externally for real-time simulation
    const container = document.getElementById('liveChatMessages');
    
    // Limit to latest 50 messages (remove oldest)
    while (container.children.length >= 50) {
        container.removeChild(container.firstChild);
        if (processedIndices.size > 0) {
            const oldestIndex = Math.min(...processedIndices);
            processedIndices.delete(oldestIndex);
        }
    }
    
    addChatMessageToDOM(author, message);
    container.scrollTop = container.scrollHeight;
}

function addChatMessageToDOM(author, message) {
    const container = document.getElementById('liveChatMessages');
    const div = document.createElement('div');
    div.className = 'chat-message';
    
    const safeAuthor = author.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const safeMessage = message.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    div.innerHTML = `
        <div class="chat-message-meta">
            <span class="chat-author">${safeAuthor}</span>
        </div>
        <div class="chat-text">${safeMessage}</div>
    `;
    container.appendChild(div);
}

function toggleLiveChat() {
    const chatContainer = document.getElementById('liveChatContainer');
    const suggestionsContainer = document.getElementById('videoSuggestions');
    const btn = document.getElementById('chatToggleBtn');

    if (chatContainer.style.display === 'flex') {
        // Switch back to Playlist/Suggestions
        chatContainer.style.display = 'none';
        suggestionsContainer.style.display = 'block';
        btn.classList.remove('active');
        btn.innerHTML = 'Show Live Chat';
    } else {
        // Switch to Chat
        chatContainer.style.display = 'flex';
        suggestionsContainer.style.display = 'none';
        btn.classList.add('active');
        btn.innerHTML = 'Show Sidebar';
        
        // Force a sync immediately to fill visible messages
        clearChatMessages();
        syncChat();
    }
}

        // 1. Get the bar elements
        const likeBar = document.getElementById('likeBar'); // The inner blue bar
        const barContainer = likeBar ? likeBar.parentElement : null; // The grey background container (.like-dislike-bar-container)
        const channelRight = document.querySelector('.channel-right');
        const likeDislikeContainer = document.getElementById('likeDislikeContainer');

        // 2. Check if we haven't moved it yet (avoid duplicates on re-runs)
        if (likeBar && barContainer && channelRight && !document.getElementById('likeBarClassicWrapper')) {
            
            // Create a new wrapper for styling purposes
            const classicBarWrapper = document.createElement('div');
            classicBarWrapper.id = 'likeBarClassicWrapper';
            classicBarWrapper.className = 'like-bar-classic-wrapper';

            // Move the INNER bar into our new wrapper
            // We move the inner bar because that's where the dynamic width (%) is applied by your JS
            classicBarWrapper.appendChild(likeBar);

            // Insert this new wrapper into .channel-right
            // We want it specifically AFTER the view count but BEFORE the like/dislike container
            if (vcEl && vcEl.nextSibling) {
                // If view count exists and has a next sibling, insert before that sibling
                channelRight.insertBefore(classicBarWrapper, vcEl.nextSibling);
            } else if (likeDislikeContainer) {
                // Fallback: Insert before the button container
                channelRight.insertBefore(classicBarWrapper, likeDislikeContainer);
            } else {
                // Last resort: just append
                channelRight.appendChild(classicBarWrapper);
            }
        }

    } else {
        // Modern mode: Clean up
        classicStyleEl.textContent = '';
        if (channelInfo) channelInfo.classList.remove('classic-layout');
        document.body.classList.remove('classic-layout-active');
        document.body.removeAttribute('data-video-layout');

        // Restore Icons
        const likeBtn = document.getElementById('likeButton');
        const dislikeBtn = document.getElementById('dislikeButton');
        if (likeBtn && likeBtn.src.includes('like_classic.svg')) likeBtn.src = 'LocalYT-Rev-Files/like.svg';
        if (dislikeBtn && dislikeBtn.src.includes('dislike_classic.svg')) dislikeBtn.src = 'LocalYT-Rev-Files/dislike.svg';
        updateSaveIconSrc();

        cleanupWrapper(); 
        
        // --- RESTORE SUBSCRIBE BUTTON AND SUB COUNT TO ORIGINAL POSITIONS ---
        const wrapper = document.getElementById('subscribeCountWrapper');
        const subscribeBtn = document.getElementById('subscribeButton');
        const subCount = document.getElementById('subCount');
        const channelTextGroup = document.querySelector('.channel-text-group');
        const channelLeftRestore = document.querySelector('.channel-left');
        
        if (wrapper) {
            // Restore full "subscribers" text
            if (subCount && subCount.dataset.fullText) {
                subCount.textContent = subCount.dataset.fullText;
                delete subCount.dataset.fullText;
            }
            // Move subCount back to channel-text-group
            if (subCount && channelTextGroup) {
                channelTextGroup.appendChild(subCount);
            }
            // Move subscribeBtn back to channel-left
            if (subscribeBtn && channelLeftRestore) {
                channelLeftRestore.appendChild(subscribeBtn);
            }
            // Remove the temporary wrapper
            wrapper.remove();
        }

        // --- RESTORE LIKE BAR TO ORIGINAL POSITION ---
        const classicWrapper = document.getElementById('likeBarClassicWrapper');
        if (classicWrapper) {
            const likeBar = classicWrapper.querySelector('#likeBar'); // Get the inner bar back
            const originalContainer = document.querySelector('.like-dislike-bar-container');
            
            if (likeBar && originalContainer) {
                // Put the bar back inside its original grey container
                originalContainer.appendChild(likeBar);
            }
            // Remove our temporary wrapper
            classicWrapper.remove();
        }
        // ---------------------------------------------

        // Remove View Count element
        const vc = document.getElementById('viewCountClassic');
        if (vc) vc.remove();
    }
})();

// ==============================
// Apply Title Color Scheme Preference (Blue Text)
// ==============================
(function applyTitleColorScheme() {
    const setting = JSON.parse(localStorage.getItem('titleColorScheme') || '{}');
    
    function applyBlueText() {
        const existingStyle = document.getElementById('title-color-scheme-blue');
        if (existingStyle) existingStyle.remove();
        
        if (setting.scheme === 'blue') {
            const style = document.createElement('style');
            style.id = 'title-color-scheme-blue';
            
            style.textContent = `
                html body .comment-author.blue-text {
                    color: #128ee9 !important;
                }
                
                html body .comment-author.blue-text:hover {
                    text-decoration: underline !important;
                    cursor: pointer !important;
                }
                
                html body .suggestion-title.blue-text:hover {
                    color: #3ea6ff !important;
                }
                
                html body .channel-name.blue-text:hover {
                    text-decoration: underline !important;
                }
            `;
            
            document.head.appendChild(style);
            
            // Add class to existing elements
            document.querySelectorAll('.comment-author, .suggestion-title, .channel-name').forEach(el => {
                el.classList.add('blue-text');
            });
            
            // Watch for dynamically loaded comments and sidebar items
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) {
                            if (node.matches && (
                                node.matches('.comment-author') || 
                                node.matches('.suggestion-title') || 
                                node.matches('.channel-name')
                            )) {
                                node.classList.add('blue-text');
                            }
                            
                            if (node.querySelectorAll) {
                                node.querySelectorAll('.comment-author, .suggestion-title, .channel-name').forEach(el => {
                                    el.classList.add('blue-text');
                                });
                            }
                        }
                    });
                });
            });
            
            observer.observe(document.body, { childList: true, subtree: true });
        } else {
            document.querySelectorAll('.comment-author.blue-text, .suggestion-title.blue-text, .channel-name.blue-text').forEach(el => el.classList.remove('blue-text'));
        }
    }

    // Apply immediately
    applyBlueText();
    
    // Re-apply after profile-pic.js Light Mode runs
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(applyBlueText, 100));
    } else {
        setTimeout(applyBlueText, 100);
    }
})();
    </script>

    <script src="fluidplayer-custom-stats.js"></script>
    <script src="sidebar.js"></script>
