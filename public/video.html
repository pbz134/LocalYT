    <script>
    // Determine which Fluid Player script to load based on video file extension
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = decodeURIComponent(urlParams.get('src') || '');
        const extension = videoSrc.split('.').pop().toLowerCase();
        
        // Choose script based on file type
        const scriptMap = {
            'mp3': 'fluidplayer.minMP3MOD.js',
            'default': 'fluidplayer.min.js'
        };
        
        // Use MP3-modified script for audio files, default for video files
        const scriptFile = (extension === 'mp3') ? scriptMap.mp3 : scriptMap.default;
        
        // Create and load the script
        const script = document.createElement('script');
        script.src = scriptFile;
        script.onload = function() {
            console.log(`Loaded Fluid Player for ${extension} files`);
        };
        document.head.appendChild(script);
    })();
</script>

    <script>
// Natural sorting function for videos with numbers in titles
function naturalCompare(a, b) {
    // Helper function to extract numbers from video titles
    const extractNumbers = (str) => {
        return (str.match(/\d+/g) || []).map(num => parseInt(num, 10));
    };

    const numsA = extractNumbers(a.displayName);
    const numsB = extractNumbers(b.displayName);

    // Compare number by number
    for (let i = 0; i < Math.max(numsA.length, numsB.length); i++) {
        const numA = i < numsA.length ? numsA[i] : 0;
        const numB = i < numsB.length ? numsB[i] : 0;
        
        if (numA !== numB) {
            return numA - numB;
        }
    }
    
    // If all numbers match, fall back to string comparison
    return a.displayName.localeCompare(b.displayName);
}

function getAvatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = ((hash % 360) + 360) % 360;
    return `hsl(${hue}, 45%, 38%)`;
}

function formatRelativeTime(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return '';
    const now = new Date();
    const diffMs = now - date;
    const sec = Math.floor(diffMs / 1000);
    const min = Math.floor(sec / 60);
    const hr  = Math.floor(min / 60);
    const day = Math.floor(hr / 24);
    const wk  = Math.floor(day / 7);
    const mo  = Math.floor(day / 30);
    const yr  = Math.floor(day / 365);

    // Check language
    const lang = localStorage.getItem('language');
    const isDe = lang === 'de';

    if (sec < 60) return isDe ? 'gerade eben' : 'just now';
    if (min < 60) {
        if (isDe) return `vor ${min} ${min === 1 ? 'Minute' : 'Minuten'}`;
        return min + (min === 1 ? ' minute ago' : ' minutes ago');
    }
    if (hr < 24) {
        if (isDe) return `vor ${hr} ${hr === 1 ? 'Stunde' : 'Stunden'}`;
        return hr + (hr === 1 ? ' hour ago' : ' hours ago');
    }
    if (day < 7) {
        if (isDe) return `vor ${day} ${day === 1 ? 'Tag' : 'Tagen'}`;
        return day + (day === 1 ? ' day ago' : ' days ago');
    }
    if (wk < 5) {
        if (isDe) return `vor ${wk} ${wk === 1 ? 'Woche' : 'Wochen'}`;
        return wk + (wk === 1 ? ' week ago' : ' weeks ago');
    }
    if (mo < 12) {
        if (isDe) return `vor ${mo} ${mo === 1 ? 'Monat' : 'Monaten'}`;
        return mo + (mo === 1 ? ' month ago' : ' months ago');
    }
    if (isDe) return `vor ${yr} ${yr === 1 ? 'Jahr' : 'Jahren'}`;
    return yr + (yr === 1 ? ' year ago' : ' years ago');
}

// ===== COMMENT LAZY-LOADING STATE =====
let _lazyCommentsState = {
    allTopLevel: [],
    allReplies: [],
    channelPicUrl: '',
    renderedCount: 0,
    batchSize: 30,
    observer: null,
    loading: false
};

function renderCommentsBatch() {
    const state = _lazyCommentsState;
    const container = document.getElementById('commentsContainer');
    const countEl = document.getElementById('commentsCount');

    countEl.textContent = (state.allTopLevel.length === 1 ? '1 Comment' : state.allTopLevel.length + ' Comments');

    const start = state.renderedCount;
    const end = Math.min(start + state.batchSize, state.allTopLevel.length);

    let html = '';
    for (let i = start; i < end; i++) {
        html += renderSingleComment(state.allTopLevel[i], false, state.channelPicUrl);
    }

    const sentinel = document.getElementById('commentsSentinel');
    if (sentinel) sentinel.remove();
    container.insertAdjacentHTML('beforeend', html);

    state.renderedCount = end;

    bindCommentTextToggles(container);

    if (state.renderedCount >= state.allTopLevel.length) {
        showRepliesSection();
        return;
    }

    ensureSentinel(container);
    ensureObserver();
}

function ensureSentinel(container) {
    const sentinel = document.createElement('div');
    sentinel.id = 'commentsSentinel';
    sentinel.style.height = '1px';
    container.appendChild(sentinel);
}

function ensureObserver() {
    const state = _lazyCommentsState;
    if (state.observer) state.observer.disconnect();

    state.observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !state.loading && state.renderedCount < state.allTopLevel.length) {
            state.loading = true;
            requestAnimationFrame(() => {
                renderCommentsBatch();
                state.loading = false;
            });
        }
    }, { rootMargin: '200px' });

    const sentinel = document.getElementById('commentsSentinel');
    if (sentinel) state.observer.observe(sentinel);
}

function showRepliesSection() {
    const state = _lazyCommentsState;
    const container = document.getElementById('commentsContainer');

    if (state.allReplies.length > 0) {
        const repliesSection = document.createElement('div');
        repliesSection.id = 'repliesSection';

        let html = `<button class="replies-toggle" id="repliesToggle">${CHEVRON_SVG} View ${state.allReplies.length} ${state.allReplies.length === 1 ? 'reply' : 'replies'}</button>`;
        html += `<div class="replies-container collapsed" id="repliesContainer">`;
        state.allReplies.forEach(r => { html += renderSingleComment(r, true, state.channelPicUrl); });
        html += '</div>';

        repliesSection.innerHTML = html;
        container.appendChild(repliesSection);

        const toggle = document.getElementById('repliesToggle');
        const repliesBox = document.getElementById('repliesContainer');
        if (toggle && repliesBox) {
            toggle.addEventListener('click', function () {
                const open = this.classList.toggle('open');
                if (open) {
                    repliesBox.classList.remove('collapsed');
                    repliesBox.style.maxHeight = repliesBox.scrollHeight + 'px';
                    this.innerHTML = CHEVRON_SVG + ' Hide replies';
                } else {
                    repliesBox.style.maxHeight = repliesBox.scrollHeight + 'px';
                    requestAnimationFrame(() => { repliesBox.classList.add('collapsed'); });
                    this.innerHTML = CHEVRON_SVG + ` View ${state.allReplies.length} ${state.allReplies.length === 1 ? 'reply' : 'replies'}`;
                }
            });
        }
    }

    if (state.observer) {
        state.observer.disconnect();
        state.observer = null;
    }
}

function bindCommentTextToggles(container) {
    container.querySelectorAll('[data-action="expand"]').forEach(btn => {
        if (btn._bound) return;
        btn._bound = true;
        btn.addEventListener('click', function () {
            const textEl = this.previousElementSibling;
            if (textEl.classList.contains('collapsed')) {
                textEl.classList.remove('collapsed');
                this.textContent = getLang('Show less', 'Weniger anzeigen');
            } else {
                textEl.classList.add('collapsed');
                this.textContent = getLang('Show more', 'Mehr anzeigen');
            }
        });
    });
}

function renderComments(comments, channelPicUrl) {
    const container = document.getElementById('commentsContainer');
    const countEl = document.getElementById('commentsCount');

    if (_lazyCommentsState.observer) {
        _lazyCommentsState.observer.disconnect();
        _lazyCommentsState.observer = null;
    }

    container.innerHTML = '';

    if (!comments || comments.length === 0) {
        const lang = localStorage.getItem('language');
        if (lang === 'de') {
            countEl.textContent = 'Kommentare';
            container.innerHTML = '<div class="no-comments">Keine Kommentare für dieses Video vorhanden.</div>';
        } else {
            countEl.textContent = 'Comments';
            container.innerHTML = '<div class="no-comments">No comments available for this video.</div>';
        }
        return;
    }

    const topLevel = comments.filter(c => !c.is_reply);
    const replies = comments.filter(c => c.is_reply);

    topLevel.sort((a, b) => {
        if (a.is_pinned && !b.is_pinned) return -1;
        if (!a.is_pinned && b.is_pinned) return 1;
        return (b.likes || 0) - (a.likes || 0);
    });
    replies.sort((a, b) => (b.likes || 0) - (a.likes || 0));

    _lazyCommentsState.allTopLevel = topLevel;
    _lazyCommentsState.allReplies = replies;
    _lazyCommentsState.channelPicUrl = channelPicUrl;
    _lazyCommentsState.renderedCount = 0;
    _lazyCommentsState.loading = false;

    renderCommentsBatch();
}

        console.error('Error loading comments:', e);
        renderComments([], channelPicUrl);
    }
}

            createSidebarAutoplayToggle(suggestionsContainer, playlistName);
            
            // 1. Load Playlist Videos if playlist parameter exists
            let playlistVideoCount = 0;
            if (playlistName && currentChannel) {
                const playlistSection = document.createElement('div');
                playlistSection.className = 'playlist-section';
                
                const playlistHeader = document.createElement('div');
                playlistHeader.className = 'playlist-section-header';
                playlistHeader.innerHTML = `${decodeURIComponent(playlistName)} <a href="playlist.html?channel=${encodeURIComponent(currentChannel)}&playlist=${playlistName}">${getLang('View Full Playlist', 'Playlist ansehen')}</a>`
                playlistSection.appendChild(playlistHeader);

                // Container for the videos (will be scrollable if > 8 videos)
                const playlistContainer = document.createElement('div');
                
                suggestionsContainer.appendChild(playlistSection);

                await fetch(`/playlist-videos/${encodeURIComponent(currentChannel)}/${playlistName}`)
                    .then(response => response.json())
                    .then(videos => {
                        // ADD THIS LINE RIGHT HERE to sort the videos:
                        videos.sort(naturalCompare);
                        
                        // If more than 8 videos, make the container scrollable
                        if (videos.length > 8) {
                            playlistContainer.className = 'playlist-scroll-container';
                        }
                        
                        playlistSection.appendChild(playlistContainer);
                
                        videos.forEach(video => {
                            // Highlight current video
                            const isCurrent = decodeURIComponent(videoSrc) === video.path;
                            renderSuggestionItem(video, playlistContainer, playlistName, isCurrent);
                            playlistVideoCount++;

                            // Auto-focus on the currently playing video in the sidebar (runs once on load)
                            if (isCurrent) {
                                requestAnimationFrame(() => {
                                    const currentItem = playlistContainer.querySelector('.current-video-item');

                                        currentItem.scrollIntoView({ 
                                            behavior: 'smooth', 
                                            block: 'center'

                                });
                            }

                    .catch(err => console.error("Error loading playlist sidebar", err));

            // 2. Load Standard Recommendations (70% Similar, 30% User Prefs)
            // We request a full page (20), but if we have a playlist, we might want fewer.
            // For now, let's keep the logic simple: append recommendations after playlist.
            
            // Calculate how many recommendations to fetch to fill the sidebar reasonably
            // If playlist is huge (scrollable), we might not need many, but let's fetch a standard amount
            // to populate below the fold.
            const recLimit = 20; 
            
            // Use the new specific endpoint for sidebar
            fetch(`/sidebar-recommendations?video=${encodeURIComponent(videoSrc)}&limit=${recLimit}`)
                .then(response => {
                    if (!response.ok) throw new Error("Sidebar recommendations failed");
                    return response.json();
                })
                .then(videos => {
                    
                    // Add a header if we also have a playlist
                    if (playlistName && videos.length > 0) {
                        const recHeader = document.createElement('div');
                        recHeader.className = 'playlist-section-header';
                        recHeader.style.borderTop = '1px solid #3f3f3f';
                        recHeader.style.paddingTop = '10px';
                        recHeader.style.marginTop = '10px';
                        recHeader.textContent = getLang('Recommended', 'Empfohlen');
                        suggestionsContainer.appendChild(recHeader);
                    }

                    videos.forEach(video => {
                        renderSuggestionItem(video, suggestionsContainer, null, false);
                    });
                })
                .catch(error => {
                    console.error('Error loading sidebar recommendations:', error);
                    // Fallback to random videos if the new endpoint fails
                    fetch('/videos?page=1&limit=10')
                        .then(response => response.json())
                        .then(data => {
                            const videos = data.videos || [];
                            videos.forEach(video => {
                                renderSuggestionItem(video, suggestionsContainer, null, false);
                            });
                        });
                });

            // Helper to render sidebar items
            function renderSuggestionItem(video, container, playlistParam, isCurrent, isRecommended = false) {
                const suggestionElement = document.createElement('div');
                suggestionElement.className = 'suggestion-item' + (isCurrent ? ' current-video-item' : '');
                
                const suggestionTitle = video.displayName;
                const channel = video.path.split('/')[0];
                const videoPathWithoutExt = stripExtension(video.path);
                
                // Build thumbnail path
                const suggestionPathParts = video.path.split('/');
                const suggestionChannel = suggestionPathParts[0];
                let suggestionThumbnailPath;

                if (suggestionPathParts.length > 2) {
                    const suggestionPlaylist = suggestionPathParts[1];
                    const suggestionVideoName = stripExtension(suggestionPathParts[suggestionPathParts.length - 1]);
                    suggestionThumbnailPath = `${encodeURIComponent(suggestionChannel)}/${encodeURIComponent(suggestionPlaylist)}/${encodeURIComponent(suggestionVideoName)}.jpg`;
                } else {
                    const suggestionVideoName = stripExtension(suggestionPathParts[suggestionPathParts.length - 1]);
                    suggestionThumbnailPath = `${encodeURIComponent(suggestionChannel)}/${encodeURIComponent(suggestionVideoName)}.jpg`;
                }

                // Construct URL, preserving playlist parameter if provided
                let videoUrl = `video.html?src=${encodeURIComponent(video.path)}`;
                if (playlistParam) {
                    videoUrl += `&playlist=${encodeURIComponent(playlistParam)}`;
                }

                suggestionElement.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="/thumbnails/${suggestionThumbnailPath}" alt="${suggestionTitle}" class="video-thumbnail">
                        <div class="video-length"></div>
                    </div>
                    <div class="suggestion-info">
                        <div class="suggestion-title">${suggestionTitle}</div>
                        <div class="suggestion-channel">${channel}</div>
                        <div class="view-count">${video.viewCount} ${getLang('views', 'Aufrufe')}</div>
                    </div>
                `;

                suggestionElement.dataset.videoPath = video.path;
                container.appendChild(suggestionElement);

                const thumbLink = suggestionElement.querySelector('.thumbnail-container');
                const titleLink = suggestionElement.querySelector('.suggestion-title');

                // Left click
                thumbLink.addEventListener('click', () => { window.location.href = videoUrl; });
                titleLink.addEventListener('click', () => { window.location.href = videoUrl; });

                // Right click
                const contextHandler = (e) => {
                    e.preventDefault();
                    window.open(videoUrl, '_blank');
                };
                thumbLink.addEventListener('contextmenu', contextHandler);
                titleLink.addEventListener('contextmenu', contextHandler);

                // Middle click
                const middleHandler = (e) => {
                    if (e.button === 1) {
                        e.preventDefault();
                        window.open(videoUrl, '_blank');
                    }
                };
                thumbLink.addEventListener('mouseup', middleHandler);
                thumbLink.addEventListener('auxclick', middleHandler);
                titleLink.addEventListener('mouseup', middleHandler);
                titleLink.addEventListener('auxclick', middleHandler);

                // Fetch video length
                const videoFilename = video.path.split('/').pop();
                const videoNameWithoutExt = stripExtension(videoFilename);
                fetch(`/videolengths/${encodeURIComponent(channel)}/${encodeURIComponent(videoNameWithoutExt)}.txt`)
                    .then(response => response.text())
                    .then(length => {
                        suggestionElement.querySelector('.video-length').textContent = length;
                    })
                    .catch(error => {});
            }

            // --- End Sidebar Logic ---

            const suggestedVideos = await generateSuggestedVideos(videoSrc);
            
            const suggestedVideosJson = JSON.stringify(suggestedVideos);
            const suggestedVideosBlob = new Blob([suggestedVideosJson], { type: 'application/json' });
            const suggestedVideosUrl = URL.createObjectURL(suggestedVideosBlob);

            // Get the video title for Fluid Player
            const videoTitle = currentVideoTitle ? currentVideoTitle.textContent : '';

            var myFP = fluidPlayer(
                'videoPlayer', {
                    "layoutControls": {
                        "title": videoTitle, // Dynamic video title
                        "controlBar": {
                            "autoHideTimeout": 3,
                            "animated": true,
                            "autoHide": true
                        },
                        "htmlOnPauseBlock": { "html": null, "height": null, "width": null },
                        "autoPlay": false,
                        "mute": false,
                        "allowTheatre": true,
                        "playPauseAnimation": true,
                        "playbackRateEnabled": true,
                        "allowDownload": false,
                        "playButtonShowing": false,
                        "fillToContainer": true,
                        "posterImage": posterImageUrl,
                        "posterImageSize": "cover"
                    },
                    "vastOptions": {
                        "adList": [],
                        "adCTAText": false,
                        "adCTATextPosition": ""
                    }
                }
            );

            videoPlayer.addEventListener('ended', async () => {
                // ===== AUTOPLAY LOGIC =====
                try {
                    const autoplaySettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');
                    
                    // Ensure defaults if they are missing
                    if (autoplaySettings.enabled && !autoplaySettings.nonPlaylistMode && !playlistName) {
                         autoplaySettings.nonPlaylistMode = 'first-recommended';
                    }

                    console.log('[Autoplay] Settings:', autoplaySettings);
                    console.log('[Autoplay] In playlist?', !!playlistName, playlistName);
                    
                    if (autoplaySettings.enabled) {
                        if (playlistName && autoplaySettings.playlistNext !== false) {
                            console.log('[Autoplay] → Next in playlist');
                            await autoplayNextInPlaylist();
                        } 
                        else if (!playlistName) {
                            console.log('[Autoplay] → Non-playlist mode:', autoplaySettings.nonPlaylistMode);
                            switch (autoplaySettings.nonPlaylistMode) {
                                case 'first-recommended':
                                    await autoplayFirstRecommended();
                                    break;
                                case 'random-recommended':
                                    await autoplayRandomRecommended();
                                    break;
                                case 'random-database':
                                    await autoplayRandomDatabase();
                                    break;
                                default:
                                    // FIX: Default to first recommended instead of doing nothing/random
                                    console.warn('[Autoplay] Unknown/Default mode, falling back to first recommended');
                                    await autoplayFirstRecommended();
                            }
                        } else {
                            console.log('[Autoplay] In playlist but playlistNext is disabled');
                        }
                    } else {
                        console.log('[Autoplay] Disabled');
                    }
                } catch (e) {
                    console.error('Autoplay error:', e);
                }
            });

            document.addEventListener('keydown', (event) => {
                const activeElement = document.activeElement;
                const isSearchInput = activeElement && (
                    activeElement.id === 'searchInput' || 
                    activeElement.tagName === 'INPUT' || 
                    activeElement.tagName === 'TEXTAREA' ||
                    activeElement.isContentEditable
                );
                
                if (isSearchInput) return;
                
                const key = event.key.toLowerCase();
                const controlKeys = [' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'k', 'f', ',', '.', ';', ':'];
                
                if (controlKeys.includes(key) || key === ' ') {
                    event.preventDefault();
                }
                
                switch (key) {
                    case 'k':
                    case ' ':
                        videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                        break;
                    case 'arrowleft':
                        videoPlayer.currentTime -= 5;
                        break;
                    case 'arrowright':
                        videoPlayer.currentTime += 5;
                        break;
                    case 'arrowup':
                        videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                        break;
                    case 'arrowdown':
                        videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                        break;
                    case 'f':
                        // Use Fluid Player's fullscreen toggle instead of native browser fullscreen
                        if (myFP && typeof myFP.toggleFullScreen === 'function') {
                            myFP.toggleFullScreen();
                        } else {
                            // Fallback to browser fullscreen if Fluid Player method isn't available
                            document.fullscreenElement ? document.exitFullscreen() : videoPlayer.requestFullscreen();
                        }
                        break;
                    case ',':
                        videoPlayer.currentTime -= 1 / 30;
                        break;
                    case '.':
                        videoPlayer.currentTime += 1 / 30;
                        break;
                    case ';':
                        videoPlayer.playbackRate = Math.max(0.25, videoPlayer.playbackRate - 0.25);
                        break;
                    case ':':
                        videoPlayer.playbackRate = Math.min(4, videoPlayer.playbackRate + 0.25);
                        break;
                }
            });

            // ===== AUTOPLAY HELPER FUNCTIONS =====
            
            async function autoplayNextInPlaylist() {
                try {
                    const response = await fetch(`/playlist-videos/${encodeURIComponent(currentChannel)}/${playlistName}`);
                    if (!response.ok) return;
                    
                    const videos = await response.json();
                    videos.sort(naturalCompare);
                    
                    // Find current video index
                    const currentIndex = videos.findIndex(v => decodeURIComponent(v.path) === decodeURIComponent(videoSrc));
                    
                    if (currentIndex !== -1 && currentIndex < videos.length - 1) {
                        // Go to next video in playlist
                        const nextVideo = videos[currentIndex + 1];
                        const nextUrl = `video.html?src=${encodeURIComponent(nextVideo.path)}&playlist=${encodeURIComponent(playlistName)}`;
                        
                        // Small delay so user sees the end screen briefly
                        setTimeout(() => {
                            window.location.href = nextUrl;
                        }, 1500);
                    }
                } catch (e) {
                    console.error('Error getting next playlist video:', e);
                }
            }

            async function autoplayFirstRecommended() {
                try {
                    console.log('[Autoplay] Trying first recommended from sidebar...');
                    
                    const suggestionItems = document.querySelectorAll('#videoSuggestions .suggestion-item[data-video-path]');
                    console.log('[Autoplay] Found items with data:', suggestionItems.length);
                    
                    // Filter out current video if it has current-video-item class
                    const availableItems = Array.from(suggestionItems).filter(
                        item => !item.classList.contains('current-video-item')
                    );
                    const pool = availableItems.length > 0 ? availableItems : Array.from(suggestionItems);
                    
                    if (pool.length > 0) {
                        const firstVideo = pool[0].dataset.videoPath;
                        const nextUrl = `video.html?src=${encodeURIComponent(firstVideo)}`;
                        console.log('[Autoplay] Navigating to first recommended:', nextUrl);
                        setTimeout(() => { window.location.href = nextUrl; }, 1500);
                    } else {
                        console.warn('[Autoplay] No sidebar items found');
                    }
                } catch (e) {
                    console.error('[Autoplay] Error in first recommended:', e);
                }
            }

            async function autoplayRandomRecommended() {
                try {
                    console.log('[Autoplay] Trying random recommended from sidebar...');
                    
                    const suggestionItems = document.querySelectorAll('#videoSuggestions .suggestion-item[data-video-path]');
                    console.log('[Autoplay] Found items with data:', suggestionItems.length);
                    
                    // Filter out current video
                    const availableItems = Array.from(suggestionItems).filter(
                        item => !item.classList.contains('current-video-item')
                    );
                    const pool = availableItems.length > 0 ? availableItems : Array.from(suggestionItems);
                    
                    if (pool.length > 0) {
                        const randomIndex = Math.floor(Math.random() * pool.length);
                        const randomVideo = pool[randomIndex].dataset.videoPath;
                        const nextUrl = `video.html?src=${encodeURIComponent(randomVideo)}`;
                        console.log('[Autoplay] Navigating to random recommended:', nextUrl);
                        setTimeout(() => { window.location.href = nextUrl; }, 1500);
                    } else {
                        console.warn('[Autoplay] No sidebar items found');
                    }
                } catch (e) {
                    console.error('[Autoplay] Error in random recommended:', e);
                }
            }

            // ===== END AUTOPLAY HELPERS =====

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.toLowerCase();
                if (query.length < 2) {
                    document.getElementById('searchSuggestions').innerHTML = '';
                    return;
                }
                
                fetch('/search-index')
                    .then(response => response.json())
                    .then(data => {
                        const videos = data.videos || [];
                        const suggestions = videos
                            .filter(video => video.displayName.toLowerCase().includes(query))
                            .slice(0, 5);

                        const suggestionsContainer = document.getElementById('searchSuggestions');
                        suggestionsContainer.innerHTML = '';
                        suggestions.forEach(video => {
                            const suggestionElement = document.createElement('div');
                            suggestionElement.className = 'suggestion-item';
                            suggestionElement.textContent = video.displayName;
                            suggestionElement.onclick = () => {
                                window.location.href = `video.html?src=${encodeURIComponent(video.path)}`;
                            };
                            suggestionsContainer.appendChild(suggestionElement);
                        });
                    });
            });

            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    window.location.href = `search.html?q=${encodeURIComponent(searchInput.value)}`;
                }
            });

            // --- Search icon click ---
            document.getElementById('searchIcon').addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                } else {
                    searchInput.focus();
                }
            });

            videoPlayer.addEventListener('play', () => {
                logoOverlay.style.display = 'none';
                videoWrapper.classList.remove('paused');
            });

            videoPlayer.addEventListener('pause', () => {
                videoWrapper.classList.add('paused');
            });

            logoOverlay.addEventListener('click', () => {
                videoPlayer.play();
                logoOverlay.style.display = 'none';
                videoWrapper.classList.remove('paused');
            });

            shareContainer.addEventListener('click', () => {
                shareModal.style.display = 'flex';
            });

            // Helper to build the Short Link API URL
            function getShortLinkApiUrl() {
                let apiUrl = `/api/shortlink?video=${encodeURIComponent(videoSrc)}`;
                
                if (playlistName) { 
                    apiUrl += `&playlist=${encodeURIComponent(playlistName)}`;
                }
                return apiUrl;
            }

            copyWithTimestamp.addEventListener('click', async () => {
                const currentTime = Math.floor(videoPlayer.currentTime);
                try {
                    const response = await fetch(getShortLinkApiUrl()); 
                    if (response.ok) {
                        const data = await response.json();
                        // FIX: Use '&' if shortPath already has '?'
                        const separator = data.shortPath.includes('?') ? '&' : '?';
                        const finalUrl = new URL(window.location.origin + data.shortPath);
                        finalUrl.searchParams.set('t', currentTime);
                        copyToClipboard(finalUrl.toString());
                    } else {
                        copyToClipboard(`${window.location.origin}/video.html?src=${encodeURIComponent(videoSrc)}&t=${currentTime}`);
                    }
                } catch (e) {
                    copyToClipboard(`${window.location.origin}/video.html?src=${encodeURIComponent(videoSrc)}&t=${currentTime}`);
                }
                shareModal.style.display = 'none';
            });

            copyWithoutTimestamp.addEventListener('click', async () => {
                try {
                    const response = await fetch(getShortLinkApiUrl());
                    if (response.ok) {
                        const data = await response.json();
                        copyToClipboard(`${window.location.origin}${data.shortPath}`);
                    } else {
                        copyToClipboard(`${window.location.origin}/video.html?src=${encodeURIComponent(videoSrc)}`);
                    }
                } catch (e) {
                    copyToClipboard(`${window.location.origin}/video.html?src=${encodeURIComponent(videoSrc)}`);
                }
                shareModal.style.display = 'none';
            });

            subscribeButton.addEventListener('click', () => {
                isSubscribed = !isSubscribed;
                updateSubscribeButton();

                fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel: currentChannel, isSubscribed })
                });
            });

            function updateLikeDislikeUI() {
                likeCount.textContent = likes;
                dislikeCount.textContent = dislikes;
                
                const totalReactions = likes + dislikes;
                let likePercentage = 0;
                if (totalReactions > 0) {
                    likePercentage = (likes / totalReactions) * 100;
                }
                likeBar.style.width = `${likePercentage}%`;

                if (isLiked) {
                    likeButton.style.filter = 'invert(21%) sepia(93%) saturate(7454%) hue-rotate(203deg) brightness(100%) contrast(109%)';
                } else {
                    likeButton.style.filter = 'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';
                }

                if (isDisliked) {
                    dislikeButton.style.filter = 'invert(21%) sepia(93%) saturate(7454%) hue-rotate(203deg) brightness(100%) contrast(109%)';
                } else {
                    dislikeButton.style.filter = 'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';
                }
            }

            likeButton.addEventListener('click', () => {
                isLiked = !isLiked;
                if (isLiked) {
                    likes += 1;
                    if (isDisliked) {
                        dislikes -= 1;
                        isDisliked = false;
                    }
                } else {
                    likes -= 1;
                }
                updateLikeDislikeUI();

                fetch('/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video: videoSrc, isLiked })
                });
            });

            dislikeButton.addEventListener('click', () => {
                isDisliked = !isDisliked;
                if (isDisliked) {
                    dislikes += 1;
                    if (isLiked) {
                        likes -= 1;
                        isLiked = false;
                    }
                } else {
                    dislikes -= 1;
                }
                updateLikeDislikeUI();

                fetch('/dislike', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video: videoSrc, isDisliked })
                });
            });

            function updateSubscribeButton() {
                if (isSubscribed) {
                    subscribeButton.textContent = getLang('Subscribed', 'Abonniert');
                    subscribeButton.classList.add('subscribed');
                } else {
                    subscribeButton.textContent = getLang('Subscribe', 'Abonnieren');
                    subscribeButton.classList.remove('subscribed');
                }
            }

            function copyToClipboard(text) {
                const tempInput = document.createElement('input');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);

            function showCopyMessage() {
                copyMessage.style.display = 'block';
                setTimeout(() => {
                    copyMessage.style.display = 'none';

            // ===== SAVE TO PLAYLIST =====
            const saveContainer = document.getElementById('saveContainer');
            const saveModal = document.getElementById('saveModal');
            const saveModalClose = document.getElementById('saveModalClose');
            const savePlaylistList = document.getElementById('savePlaylistList');
            const noPlaylistsMessage = document.getElementById('noPlaylistsMessage');
            const newPlaylistNameInput = document.getElementById('newPlaylistName');
            const createPlaylistBtn = document.getElementById('createPlaylistBtn');

            saveContainer.addEventListener('click', async () => {
                try {
                    const response = await fetch('/user-playlists');
                    if (!response.ok) {
                        alert('Please log in to save videos to playlists.');
                        return;
                    }
                    const playlists = await response.json();
                    renderSaveModal(playlists);
                    newPlaylistNameInput.value = '';
                    saveModal.style.display = 'flex';
                } catch (e) {
                    console.error('Error loading playlists:', e);
                }
            });

            function renderSaveModal(playlists) {
                savePlaylistList.innerHTML = '';
                const playlistNames = Object.keys(playlists);

                if (playlistNames.length === 0) {
                    noPlaylistsMessage.style.display = 'block';
                } else {
                    noPlaylistsMessage.style.display = 'none';
                    playlistNames.forEach(name => {
                        const item = document.createElement('div');
                        item.className = 'save-playlist-item';
                        const videoCount = playlists[name].length;
                        const isAlreadySaved = playlists[name].includes(videoSrc);

                        if (isAlreadySaved) {
                            item.classList.add('already-saved');
                            item.innerHTML = '<span>' + escapeHtml(name) + '<span class="playlist-video-count">' + videoCount + ' videos</span></span><span class="check-icon">✓</span>';
                        } else {
                            item.innerHTML = '<span>' + escapeHtml(name) + '<span class="playlist-video-count">' + videoCount + ' videos</span></span>';
                            item.addEventListener('click', () => saveToPlaylist(name));
                        }
                        savePlaylistList.appendChild(item);
                    });
                }
            }

            async function saveToPlaylist(playlistName) {
                try {
                    const response = await fetch('/save-to-playlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ playlist: playlistName, video: videoSrc })
                    });
                    if (response.status === 409) return;
                    if (!response.ok) {
                        alert('Error saving to playlist.');
                        return;
                    }
                    const playlistsResponse = await fetch('/user-playlists');
                    const playlists = await playlistsResponse.json();
                    renderSaveModal(playlists);
                } catch (e) {
                    console.error('Error saving to playlist:', e);
                }
            }

            async function createAndSavePlaylist() {
                const name = newPlaylistNameInput.value.trim();
                if (!name) return;
                try {
                    const createResponse = await fetch('/create-playlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    if (createResponse.status === 409) {
                        alert('A playlist with this name already exists.');
                        return;
                    }
                    if (!createResponse.ok) {
                        alert('Error creating playlist.');
                        return;
                    }
                    newPlaylistNameInput.value = '';
                    const playlistsResponse = await fetch('/user-playlists');
                    const playlists = await playlistsResponse.json();
                    renderSaveModal(playlists);
                    await saveToPlaylist(name);
                } catch (e) {
                    console.error('Error creating playlist:', e);
                }
            }

            createPlaylistBtn.addEventListener('click', createAndSavePlaylist);
            newPlaylistNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') createAndSavePlaylist();
            });

            saveModalClose.addEventListener('click', () => {
                saveModal.style.display = 'none';
            });
            saveModal.addEventListener('click', (e) => {
                if (e.target === saveModal) saveModal.style.display = 'none';
            });

            // ===== END OF SAVE TO PLAYLIST BLOCK =====

        // Update save icon based on whether video is in a playlist
        fetch('/user-playlists')
            .then(r => r.ok ? r.json() : {})
            .then(playlists => {
                const inPlaylist = Object.values(playlists).some(videos => videos.includes(videoSrc));
                document.getElementById('saveIcon').src = inPlaylist ? 'LocalYT-Rev-Files/saved.svg' : 'LocalYT-Rev-Files/save.svg';
                // Use language-aware text
                document.getElementById('saveContainer').querySelector('span').textContent = inPlaylist ? getLang('Saved', 'Gespeichert') : getLang('Save', 'Speichern');
            })
            .catch(() => {});

            if (timestamp) {
                videoPlayer.currentTime = parseInt(timestamp, 10);
            }
        });

        function openVideo(videoSrc) {
            window.location.href = `video.html?src=${videoSrc}`;
        }

        function openChannelPage() {
            const channel = document.getElementById('channelName').textContent;
            window.location.href = `channel.html?channel=${encodeURIComponent(channel)}`;
        }

        function detectAndStyleLinks(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const timestampRegex = /(\b\d{1,2}:\d{2}(?::\d{2})?\b)/g;
            
            let processedText = text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' + url + '</a>';
            });
            
            processedText = processedText.replace(timestampRegex, function(timestamp) {
                const seconds = convertTimestampToSeconds(timestamp);
                return '<a href="#" onclick="seekToTimestamp(\'' + timestamp + '\'); return false;" style="color: #3ea6ff; text-decoration: none;">' + timestamp + '</a>';
            });
            
            return processedText;
        }

        function convertTimestampToSeconds(timestamp) {
            const parts = timestamp.split(':').map(part => parseInt(part, 10));
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        function seekToTimestamp(timestamp) {
            const videoPlayer = document.getElementById('videoPlayer');
            const seconds = convertTimestampToSeconds(timestamp);
            videoPlayer.currentTime = seconds;
            videoPlayer.play();
            
            const clickedElement = event.target;
            clickedElement.style.color = '#ff0000';
            setTimeout(() => {
                clickedElement.style.color = '#3ea6ff';
            }, 1000);
        }

        // --- Language Check on Load ---
        // This ensures translations apply AFTER video.html has created all the buttons
        document.addEventListener('DOMContentLoaded', () => {
            // Small timeout ensures dynamic content (like sidebar) is rendered
            setTimeout(() => {
                if (typeof applyLanguage === 'function') {
                    applyLanguage();
                }
            }, 100);
        });

function createSidebarAutoplayToggle(container, playlistName) {
    const toggleDiv = document.createElement('div');
    toggleDiv.className = 'sidebar-autoplay-toggle';
    
    const label = document.createElement('label');
    label.className = 'sidebar-autoplay-label';
    label.textContent = getLang('Autoplay', 'Automatische Wiedergabe');
    
    const switchLabel = document.createElement('label');
    switchLabel.className = 'toggle-switch';
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = 'sidebarAutoplayCheckbox';
    
    const slider = document.createElement('span');
    slider.className = 'toggle-slider';
    
    switchLabel.appendChild(checkbox);
    switchLabel.appendChild(slider);
    
    toggleDiv.appendChild(label);
    toggleDiv.appendChild(switchLabel);
    
    // Insert at the top of the suggestions container
    container.insertBefore(toggleDiv, container.firstChild);
    
    // Load current state from localStorage
    let currentSettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');
    
    // Apply defaults ONLY if properties don't exist yet (first time ever)
    if (currentSettings.enabled === undefined) currentSettings.enabled = false;
    if (currentSettings.playlistNext === undefined) currentSettings.playlistNext = true;
    if (currentSettings.nonPlaylistMode === undefined) currentSettings.nonPlaylistMode = 'first-recommended';
    
    // Set initial checkbox state
    checkbox.checked = currentSettings.enabled;
    
    // Handle toggle changes - ONLY switches enabled on/off, preserves mode!
    checkbox.addEventListener('change', () => {
        // Re-read to ensure we have absolute latest (in case settings page was open in another tab)
        currentSettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');
        
        // Re-apply defaults if somehow missing
        if (currentSettings.nonPlaylistMode === undefined) currentSettings.nonPlaylistMode = 'first-recommended';
        if (currentSettings.playlistNext === undefined) currentSettings.playlistNext = true;
        
        // Simply flip the enabled flag - DO NOT touch nonPlaylistMode or playlistNext!
        currentSettings.enabled = checkbox.checked;
        
        // Save immediately
        localStorage.setItem('autoplaySettings', JSON.stringify(currentSettings));
        
        console.log('[Sidebar Toggle] Autoplay ' + (checkbox.checked ? 'ENABLED' : 'DISABLED') + 
                    '. Mode preserved: ' + currentSettings.nonPlaylistMode);
    });
    
    // Allow clicking the text label to toggle as well
    label.addEventListener('click', () => {
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
    });
}
