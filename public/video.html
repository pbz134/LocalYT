            videoPlayer.addEventListener('lyt-skip', () => handleAutoPlayOrSkip(true));

            document.addEventListener('keydown', (event) => {
                const activeElement = document.activeElement;

                // 1. Ignore if typing
                const isTyping = activeElement && (
                    activeElement.id === 'searchInput' ||
                    activeElement.tagName === 'INPUT' ||
                    activeElement.tagName === 'TEXTAREA' ||
                    activeElement.isContentEditable
                );

                if (isTyping) return;
                // Only ignore CTRL/META for keys the player doesn't handle with modifiers
                if (event.ctrlKey || event.metaKey) {
                    const key = event.key.toLowerCase();
                    if (key !== 'arrowleft' && key !== 'arrowright') return;
                }

                const key = event.key.toLowerCase();

                switch (key) {
                    case ' ': // Spacebar
                    case 'k':
                        // 2. UNIVERSAL FIX: 
                        // If myFP exists (it could be LYT or Fluid), assume the player 
                        // is handling the keypress. We just prevent scrolling and stop.
                        if (myFP) {
                            event.preventDefault(); // Prevent page scroll
                            return; // Exit - Let the player script do the work!
                        }

                        // 3. FALLBACK: Only run this if NO player loaded (Native HTML5)
                        event.preventDefault();
                        if (videoPlayer) {
                            videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                        }
                        break;

                    case 'arrowleft':
                    case 'arrowright':
                        event.preventDefault(); // Prevent page scroll either way
                        if (myFP) {
                            return; // LYT Player handles seeking — don't double-seek!
                        }
                        // Fallback: Only run this if NO player loaded (Native HTML5)
                        if (videoPlayer) {
                            videoPlayer.currentTime += (key === 'arrowleft') ? -5 : 5;
                        }
                        break;
                    case 'arrowup':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                        break;
                    case 'arrowdown':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                        break;
                    case 'f':
                        event.preventDefault();
                        // Note: We allow video.html to handle Fullscreen because 
                        // sometimes player fullscreen implementations differ or we want custom behavior.
                        if (myFP && typeof myFP.toggleFullScreen === 'function') {
                            myFP.toggleFullScreen();
                        } else if (videoPlayer) {
                            document.fullscreenElement ? document.exitFullscreen() : videoPlayer.requestFullscreen();
                        }
                        break;
                    case ',':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.currentTime -= 1 / 30;
                        break;
                    case '.':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.currentTime += 1 / 30;
                        break;
                    case ';':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.playbackRate = Math.max(0.25, videoPlayer.playbackRate - 0.25);
                        break;
                    case ':':
                        event.preventDefault();
                        if (videoPlayer) videoPlayer.playbackRate = Math.min(4, videoPlayer.playbackRate + 0.25);
                        break;
                }
            });

            // ===== AUTOPLAY HELPER FUNCTIONS (return {url, title, thumbnail} or null) =====

            async function getNextInPlaylist() {
                try {
                    const response = await fetch(
                        `/playlist-videos/${encodeURIComponent(currentChannel)}/${playlistName}`);
                    if (!response.ok) return null;

                    const videos = await response.json();
                    videos.sort(naturalCompare);

                    const currentIndex = videos.findIndex(v => safeDecodeURIComponent(v.path) === safeDecodeURIComponent(
                        videoSrc));

                    if (currentIndex !== -1 && currentIndex < videos.length - 1) {
                        const nextVideo = videos[currentIndex + 1];
                        return {
                            url: `video.html?src=${encodeURIComponent(nextVideo.path)}&playlist=${encodeURIComponent(playlistName)}`,
                            title: nextVideo.displayName,
                            thumbnail: buildThumbnailUrl(nextVideo.path),
                            path: nextVideo.path
                        };
                    }
                } catch (e) {
                    console.error('Error getting next playlist video:', e);
                }
                return null;
            }

            async function getNextFirstRecommended() {

                    if (pool.length > 0) {

                        return {

            async function getNextRandomRecommended() {

                    if (!response.ok) return null;

            // Helper: Build thumbnail URL from video path
            function buildThumbnailUrl(videoPath) {
                const pathParts = videoPath.split('/');
                const channel = pathParts[0];
                let thumbnailPath;

                if (pathParts.length > 2) {
                    const playlist = pathParts[1];
                    const videoName = stripExtension(pathParts[pathParts.length - 1]);
                    thumbnailPath =
                        `${encodeURIComponent(channel)}/${encodeURIComponent(playlist)}/${encodeURIComponent(videoName)}.jpg`;
                } else {
                    const videoName = stripExtension(pathParts[pathParts.length - 1]);
                    thumbnailPath = `${encodeURIComponent(channel)}/${encodeURIComponent(videoName)}.jpg`;
                }

                return `/thumbnails/${thumbnailPath}`;
            }

        async function detectAndStyleLinks(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/g;
            const timestampRegex = /(\b\d{1,2}:\d{2}(?::\d{2})?\b)/g;
            const mentionRegex = /@(\w+)/g;

            // 1. Handle URLs
            let processedText = text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' +
                    url + '</a>';
            });

            // 2. Handle Timestamps
            processedText = processedText.replace(timestampRegex, function(timestamp) {
                const seconds = convertTimestampToSeconds(timestamp);
                return '<a href="#" onclick="seekToTimestamp(\'' + timestamp +
                    '\'); return false;" style="color: #3ea6ff; text-decoration: none;">' + timestamp +
                    '</a>';
            });

            // 3. Handle @Mentions (Check if Channel Image Exists)
            const mentions = [];
            let match;
            while ((match = mentionRegex.exec(processedText)) !== null) {
                if (!mentions.includes(match[1])) {
                    mentions.push(match[1]);
                }
            }

            if (mentions.length > 0) {
                const checkPromises = mentions.map(channelName => {
                    return fetch(`/channelpic/${encodeURIComponent(channelName)}.jpg`, { method: 'HEAD' })
                        .then(res => ({ name: channelName, exists: res.ok }))
                        .catch(() => ({ name: channelName, exists: false }));
                });

                try {
                    const results = await Promise.all(checkPromises);
                    const existingChannels = results.filter(r => r.exists).map(r => r.name);

                    let idCounter = 0;

                    processedText = processedText.replace(mentionRegex, function(fullMatch, channelName) {
                        if (existingChannels.includes(channelName)) {
                            const uniqueId = `mention-${idCounter++}`;
                            const encodedChannel = encodeURIComponent(channelName);

                            // Return span with ID so we can attach event listeners immediately after
                            return `<span id="${uniqueId}" class="mention-link" data-channel="${encodedChannel}">${fullMatch}</span>`;
                        }
                        return fullMatch;
                    });

                    // Attach event listeners to the newly created spans after they are in the DOM
                    // We use a small timeout to ensure the DOM has been updated if this is used immediately
                    setTimeout(() => {
                        existingChannels.forEach((channelName, index) => {
                            const el = document.getElementById(`mention-${index}`);
                            if (el) {
                                const url = `channel.html?channel=${el.dataset.channel}`;

                                // Left click (default behavior handled by CSS/onclick logic if needed, 
                                // but here we specifically handle wheel and right click as requested)

                                el.addEventListener('mouseup', (e) => {
                                    if (e.button === 1) { // Middle Click
                                        e.preventDefault();
                                        window.open(url, '_blank');
                                    }
                                });

                                el.addEventListener('auxclick', (e) => {
                                    if (e.button === 1) { // Middle Click Fallback
                                        e.preventDefault();
                                        window.open(url, '_blank');
                                    }
                                });

                                el.addEventListener('contextmenu', (e) => { // Right Click
                                    e.preventDefault();
                                    window.open(url, '_blank');
                                });

                                // Ensure left click also works to navigate
                                el.addEventListener('click', () => {
                                    window.location.href = url;
                                });
                            }
                        });
                    }, 0);

                } catch (e) {
                    console.log('Could not verify mentions:', e);
                }
            }

            return processedText;
        }

        function convertTimestampToSeconds(timestamp) {
            const parts = timestamp.split(':').map(part => parseInt(part, 10));
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        // ===== LIVE CHAT INTEGRATION LOGIC =====

        let liveChatData = []; // Stores parsed chat messages
        let processedIndices = new Set(); // Tracks displayed messages
        let chatTimer = null;

        async function initLiveChat(videoSrc, playlistName) {
            if (!videoSrc) return;

            try {
                const parts = videoSrc.split('/');
                const channel = parts[0];

                const rawVideoName = parts[parts.length - 1];
                let videoName = stripExtension(rawVideoName);

                let encodedName = encodeURIComponent(videoName);

                // 2. Double-check specific problematic chars often missed or mishandled
                // (This creates a "safe" string that definitely looks like a URI component)
                encodedName = encodedName.replace(/'/g, "%27")
                    .replace(/\(/g, "%28")
                    .replace(/\)/g, "%29")
                    .replace(/!/g, "%21")
                    .replace(/,/g, "%2C");

                const chatUrl = `/livechats/${encodeURIComponent(channel)}/${encodedName}.json`;

                console.log(`[LiveChat] Attempting to fetch: ${chatUrl}`);

                const response = await fetch(chatUrl);

                if (!response.ok) return;

                liveChatData = await response.json();

                if (liveChatData && liveChatData.length > 0) {
                    console.log(`[LiveChat] Loaded ${liveChatData.length} messages.`);

                    document.getElementById('chatToggleContainer').style.display = 'block';
                    setupChatSync();
                }
            } catch (err) {
                console.log("[LiveChat] No chat file available.", err);
            }
        }

        function setupChatSync() {
            const videoPlayer = document.getElementById('videoPlayer');

            // Clear chat on seek to allow re-displaying context around new time
            videoPlayer.addEventListener('seeking', () => {
                clearChatMessages();
                // Small delay to ensure currentTime is updated
                setTimeout(syncChat, 100);
            });

            videoPlayer.addEventListener('timeupdate', () => {
                syncChat();
            });

            videoPlayer.addEventListener('pause', () => {
                if (chatTimer) cancelAnimationFrame(chatTimer);
            });
        }

        let isChatSyncing = false; // Prevent overlapping syncs
        let lastSyncedIndex = -1; // Track the last processed message index to avoid duplicates
        let isSeeking = false; // Flag to detect when user has jumped in timeline

        function syncChat() {
            // Prevent flicker: if already syncing, skip this frame
            if (isChatSyncing) return;

            // Check if chat container is visible before syncing
            const chatContainer = document.getElementById('liveChatContainer');
            if (!chatContainer.style.display || chatContainer.style.display === 'none') return;

            const videoPlayer = document.getElementById('videoPlayer');
            const currentMs = videoPlayer.currentTime * 1000;
            const container = document.getElementById('liveChatMessages');

            let addedCount = 0;
            const maxPerFrame = 50; // Allow bulk load for seeking, but limit total display

            // DETECT SEEK: If current time is before the timestamp of the last displayed message,
            // user has jumped backwards. If gap is > 2sec forward, likely a jump too.
            if (lastSyncedIndex >= 0 && lastSyncedIndex < liveChatData.length) {
                const lastMsgTime = liveChatData[lastSyncedIndex].offsetMs;
                const timeDiff = currentMs - lastMsgTime;

                // If we went back more than 2 seconds, or jumped ahead more than 5 seconds, treat as seek
                if (currentMs < lastMsgTime - 2000) {
                    console.log(`[Chat] Seek detected! Clearing and reloading from ${formatTime(currentMs)}`);
                    clearChatMessages();
                    isSeeking = true;
                }
            }

            // Determine starting index
            let startIndex;
            if (isSeeking || lastSyncedIndex === -1) {
                // For seeks: Binary search or linear scan to find starting point
                // Find the first message that falls within our 50-message window before current time
                startIndex = findStartIndexForTime(currentMs);
                isSeeking = false; // Reset flag after handling seek
            } else {
                // Normal playback: continue from where we left off
                startIndex = Math.max(0, lastSyncedIndex + 1);
            }

            for (let i = startIndex; i < liveChatData.length; i++) {
                const msg = liveChatData[i];

                // If message offset is in the future, stop
                if (msg.offsetMs > currentMs) break;

                addChatMessageToDOM(msg.author, msg.message);
                processedIndices.add(i);
                lastSyncedIndex = i; // Update our position
                addedCount++;

                if (addedCount >= maxPerFrame) break;
            }

            // Enforce 50-message limit by removing oldest (only needed during initial bulk load)
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
                // Remove oldest tracked index to keep in sync
                if (processedIndices.size > 0) {
                    const oldestIndex = Math.min(...processedIndices);
                    processedIndices.delete(oldestIndex);
                    // Update lastSyncedIndex if we removed something after it (shouldn't happen but safety)
                    if (oldestIndex <= lastSyncedIndex && processedIndices.size > 0) {
                        // Keep lastSyncedIndex pointing to newest
                    }
                }
            }

            // Auto-scroll to bottom
            if (addedCount > 0 || (container.scrollHeight - container.scrollTop - container.clientHeight < 100)) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // Helper: Find the best starting index to show ~50 messages leading up to currentTime
        function findStartIndexForTime(currentMs) {
            // First, find how many messages exist up to this point
            let countUpToNow = 0;
            for (let i = 0; i < liveChatData.length; i++) {
                if (liveChatData[i].offsetMs <= currentMs) {
                    countUpToNow++;
                } else {
                    break;
                }
            }

            // We want the latest 50 messages (or fewer if not enough history)
            // So start from (countUpToNow - 50), minimum 0
            return Math.max(0, countUpToNow - 50);
        }

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function clearChatMessages() {
            const container = document.getElementById('liveChatMessages');
            container.innerHTML = '';
            processedIndices.clear();
            lastSyncedIndex = -1; // Reset position when clearing (seeking)
        }

        // Override the video player's seeking event to ensure we catch all seeks
        document.addEventListener('DOMContentLoaded', () => {
            const videoPlayer = document.getElementById('videoPlayer');
            if (videoPlayer) {
                videoPlayer.addEventListener('seeking', () => {
                    // Mark as seeking so next syncChat() will handle it
                    isSeeking = true;
                    // Small delay to ensure currentTime is updated before we process
                    setTimeout(() => {
                        if (isChatSyncing) return; // Don't interrupt ongoing sync
                        syncChat();
                    }, 50);
                });
            }
        });

        function appendChatMessage(author, message) {
            // This function is called externally for real-time simulation
            const container = document.getElementById('liveChatMessages');

            // Limit to latest 50 messages (remove oldest)
            while (container.children.length >= 50) {
                container.removeChild(container.firstChild);
                if (processedIndices.size > 0) {
                    const oldestIndex = Math.min(...processedIndices);
                    processedIndices.delete(oldestIndex);
                }
            }

            addChatMessageToDOM(author, message);
            container.scrollTop = container.scrollHeight;
        }

        function addChatMessageToDOM(author, message) {

            div.innerHTML = `

                    `;

                            #classicInfoBoxWrapper #classicActionsWrapper {
                                border-top: 1px solid #3f3f3f;
                                padding-top: 12px;
                                margin-top: 10px !important;
                                position: relative;
                            }

                            .channel-info.classic-layout .subscribe-count-wrapper {
                                height: 26px;
                                overflow: visible;
                            }

                            /* Channel Info Rearrangement */
                            .channel-info.classic-layout {
                                flex-wrap: wrap;
                            }

                            .channel-info.classic-layout .channel-left {
                                flex-wrap: wrap; 
                                align-items: center;
                                width: auto; 
                            }

                            #classicActionsWrapper {
                                flex: 1 1 100% !important; 
                                display: flex !important; 
                                gap: 20px !important; 
                                margin-left: 0 !important;
                                margin-right: 0 !important; 
                                padding-left: 0 !important; 
                                padding-right: 0 !important; 
                                box-sizing: border-box !important; 
                                align-items: center !important;
                                order: 99 !important;
                            }

                            .channel-info.classic-layout .channel-right {
                                flex-direction: column;
                                align-items: flex-end;
                                gap: 6px;
                                padding-right: 20px;
                            }

                            /* Hide the original bar container inside the like container since we moved it */
                            .channel-info.classic-layout #likeDislikeContainer .like-dislike-bar-container {
                                display: none !important;
                            }

                            /* --- VIEW COUNT STYLING --- */
                            .view-count-classic {
                                display: inline-block !important;
                                font-size: 22px !important;
                                color: #aaa !important;
                                font-family: 'RobotoRegular', Arial, sans-serif !important;
                                
                                order: 0;
                                width: auto !important;
                                text-align: right !important;
                                margin-bottom: 0px !important;
                                padding: 0 !important;
                                opacity: 1 !important;
                                visibility: visible !important;
                                margin-right: 0px !important;
                                margin-top: 20px !important;
                            }

                            /* --- LIKE BAR STYLING (On the divider) --- */
                            .like-bar-classic-wrapper {
                                display: block !important;
                                position: absolute;
                                top: -2px;
                                right: 20px;
                                width: 180px !important;
                                height: 3px !important;
                                background-color: #235cad !important;
                                border-radius: 2px !important;
                                overflow: hidden;
                                z-index: 2;
                                margin: 0 !important;
                            }
                            
                            .like-bar-classic-wrapper > div {
                                height: 100% !important;
                                background-color: #397ddb !important;
                                border-radius: 2px !important;
                            }

                            /* --- LIKE/DISLIKE ICONS (Below the divider, aligned right under bar) --- */
                            .channel-info.classic-layout #likeDislikeContainer {
                                flex-direction: row;
                                align-items: center;
                                margin-left: auto !important;
                                margin-right: 20px !important;
                                margin-top: 4px !important;
                                order: initial;
                            }

                            /* --- SHARE & SAVE CONTAINERS (Left side of divider) --- */
                            .channel-info.classic-layout #shareContainer,
                            .channel-info.classic-layout #saveContainer {
                                margin-left: 0 !important;
                                margin-right: 0 !important;
                                order: -1 !important;
                            }

                            .channel-info.classic-layout .channel-name:hover {
                                text-decoration: underline !important;
                            }

                            /* --- Subscribe and Sub-Count Wrapper for Classic Mode --- */
                            .subscribe-count-wrapper {
                                display: flex;
                                align-items: stretch;
                                margin-top: 4px;
                                height: 22px;
                                border-radius: 0;
                                overflow: hidden;
                            }

                            .channel-info.classic-layout .subscribe-button {
                                margin: 0 !important;
                                padding: 0 10px;
                                height: 100%;
                                border-radius: 0;
                                border-right: 1px solid rgba(0,0,0,0.3);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 12px;
                                cursor: pointer;
                                background-color: #e62117;
                            }

                            .channel-info.classic-layout .sub-count {
                                display: flex !important;
                                align-items: center;
                                background-color: #fafafa !important;
                                padding: 0px 12px;
                                height: 24px;
                                align-self: center;
                                background-color: var(--secondary-bg-color, #333) !important;
                                border: 1px solid #666;
                                border-left: none;
                                color: #fff;
                                font-size: 12px;
                                font-family: 'RobotoRegular', Arial, sans-serif;
                                white-space: nowrap;
                                margin: 0 !important;
                            }

                            .channel-info.classic-layout .subscribe-button.subscribed + .sub-count {
                                border-color: darkgray;
                                color: #888;
                            }

                            /* --- Description Toggle Styling for Classic Layout --- */
                            .classic-layout-active .video-description,
                            body[data-video-layout="classic"] .video-description {
                                margin-bottom: 0;
                            }

                            .classic-layout-active .description-toggle,
                            body[data-video-layout="classic"] .description-toggle {
                                text-align: center;
                                text-transform: uppercase;
                                background-color: #282828;
                                margin-top: 0;
                                padding: 10px 15px;
                                border-top: 1px solid #555;
                            }
                        `;

                document.body.classList.add('classic-layout-active');
                document.body.setAttribute('data-video-layout', 'classic');

                // --- SWAP ICONS ---
                const likeBtn = document.getElementById('likeButton');
                const dislikeBtn = document.getElementById('dislikeButton');

                if (likeBtn && likeBtn.src.includes('like.svg')) likeBtn.src =
                'LocalYT-Rev-Files/like_classic.svg';
                if (dislikeBtn && dislikeBtn.src.includes('dislike.svg')) dislikeBtn.src =
                    'LocalYT-Rev-Files/dislike_classic.svg';
                updateSaveIconSrc();

                // --- MOVE SHARE & SAVE TO LEFT SIDE ---
                cleanupWrapper();
                const actionsWrapper = document.createElement('div');
                actionsWrapper.id = 'classicActionsWrapper';
                const shareContainer = document.getElementById('shareContainer');
                const saveContainer = document.getElementById('saveContainer');

                // Add Share/Save first so they appear on the left in the flex container
                if (saveContainer) actionsWrapper.appendChild(saveContainer);
                if (shareContainer) actionsWrapper.appendChild(shareContainer);

                // Append to channelInfo instead of channelLeft to allow full-width divider
                if (channelInfo) channelInfo.appendChild(actionsWrapper);

                // --- OBSERVE SAVE ICON CHANGES ---
                const saveIconTarget = document.getElementById('saveIcon');
                if (saveIconTarget) {
                    const saveObserver = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'src') {
                                const newSrc = saveIconTarget.src;
                                if (newSrc.includes('saved.svg') || newSrc.includes('save.svg')) {
                                    saveIconTarget.src = newSrc.includes('saved') ?
                                        'LocalYT-Rev-Files/saved_classic.svg' :
                                        'LocalYT-Rev-Files/save_classic.svg';
                                }
                            }
                        });
                    });
                    saveObserver.observe(saveIconTarget, { attributes: true });
                }

                // =============================================
                // VIEW COUNT LOGIC
                // =============================================
                let vcEl = document.getElementById('viewCountClassic');
                if (!vcEl) {
                    vcEl = document.createElement('div');
                    vcEl.id = 'viewCountClassic';
                    vcEl.className = 'view-count-classic';
                    vcEl.style.cssText =
                        `display:inline-block!important;font-size:20px;color:#aaa;text-align:right;margin-bottom:8px;opacity:1!important;visibility:visible!important;margin-right:-10px;`;

                    const channelRight = document.querySelector('.channel-right');
                    if (channelRight) channelRight.insertBefore(vcEl, channelRight.firstChild);
                    else {
                        const ldc = document.getElementById('likeDislikeContainer');
                        if (ldc) ldc.parentNode.insertBefore(vcEl, ldc);
                    }
                }

                const processViewCount = () => {
                    const desc = document.getElementById('currentVideoDescription');
                    if (!desc || !vcEl) return;
                    const text = desc.textContent;
                    const match = text.match(/^([\d.,]+)\s*(views|Aufrufe)\s*-\s*/);
                    if (match) {
                        vcEl.textContent = match[0].replace(/\s*-\s*$/, '').trim();
                        desc.textContent = text.replace(match[0], '');
                        if (typeof checkDescriptionCollapse === 'function') checkDescriptionCollapse();
                    }
                };
                setTimeout(processViewCount, 50);
                const descObserver = new MutationObserver(processViewCount);
                const descEl = document.getElementById('currentVideoDescription');
                if (descEl) descObserver.observe(descEl, { childList: true, characterData: true, subtree: true });

                // =============================================
                // MOVE LIKE BAR TO DIVIDER & ICONS BELOW IT
                // =============================================

                // 1. Get the bar elements
                const likeBar = document.getElementById('likeBar'); // The inner blue bar
                const barContainer = likeBar ? likeBar.parentElement : null; // The grey background container (.like-dislike-bar-container)
                const likeDislikeContainer = document.getElementById('likeDislikeContainer');
                const classicActionsWrapper = document.getElementById('classicActionsWrapper'); // The divider container

                // 2. Check if we haven't moved it yet (avoid duplicates on re-runs)
                if (likeBar && barContainer && classicActionsWrapper && !document.getElementById(
                        'likeBarClassicWrapper')) {

                    // Create a new wrapper for styling purposes
                    const classicBarWrapper = document.createElement('div');
                    classicBarWrapper.id = 'likeBarClassicWrapper';
                    classicBarWrapper.className = 'like-bar-classic-wrapper';

                    // Move the INNER bar into our new wrapper
                    classicBarWrapper.appendChild(likeBar);

                    // Insert this new wrapper INTO the actions wrapper at the beginning
                    // This places it absolutely positioned on the border-top of the actions wrapper
                    classicActionsWrapper.prepend(classicBarWrapper);
                }

                // 3. Move the Like/Dislike Icons BELOW the divider (into the actions wrapper, after share/save)
                if (likeDislikeContainer && classicActionsWrapper && !likeDislikeContainer.dataset.movedToActions) {
                    likeDislikeContainer.dataset.movedToActions = "true";
                    // Append after share/save containers (which are at the start due to prepend/order:-1 logic)
                    classicActionsWrapper.appendChild(likeDislikeContainer);
                }

            } else {
                // Modern mode: Clean up
                classicStyleEl.textContent = '';
                if (channelInfo) channelInfo.classList.remove('classic-layout');
                document.body.classList.remove('classic-layout-active');
                document.body.removeAttribute('data-video-layout');

                // --- REMOVE CLASSIC INFO BOX WRAPPER ---
                const infoBoxWrapper = document.getElementById('classicInfoBoxWrapper');
                if (infoBoxWrapper) {
                    const videoTitle = document.getElementById('currentVideoTitle');
                    const parent = infoBoxWrapper.parentNode;

                    // Move elements back out before removing the wrapper
                    if (videoTitle) parent.insertBefore(videoTitle, infoBoxWrapper);
                    parent.insertBefore(channelInfo, infoBoxWrapper);

                    infoBoxWrapper.remove();
                }

                // Restore Icons
                const likeBtn = document.getElementById('likeButton');
                const dislikeBtn = document.getElementById('dislikeButton');
                if (likeBtn && likeBtn.src.includes('like_classic.svg')) likeBtn.src =
                'LocalYT-Rev-Files/like.svg';
                if (dislikeBtn && dislikeBtn.src.includes('dislike_classic.svg')) dislikeBtn.src =
                    'LocalYT-Rev-Files/dislike.svg';
                updateSaveIconSrc();

                cleanupWrapper();

                // --- RESTORE SUBSCRIBE BUTTON AND SUB COUNT TO ORIGINAL POSITIONS ---
                const wrapper = document.getElementById('subscribeCountWrapper');
                const subscribeBtn = document.getElementById('subscribeButton');
                const subCount = document.getElementById('subCount');
                const channelTextGroup = document.querySelector('.channel-text-group');
                const channelLeftRestore = document.querySelector('.channel-left');

                if (wrapper) {
                    // Restore full "subscribers" text
                    if (subCount && subCount.dataset.fullText) {
                        subCount.textContent = subCount.dataset.fullText;
                        delete subCount.dataset.fullText;
                    }
                    // Move subCount back to channel-text-group
                    if (subCount && channelTextGroup) {
                        channelTextGroup.appendChild(subCount);
                    }
                    // Move subscribeBtn back to channel-left
                    if (subscribeBtn && channelLeftRestore) {
                        channelLeftRestore.appendChild(subscribeBtn);
                    }
                    // Remove the temporary wrapper
                    wrapper.remove();
                }

                // --- RESTORE LIKE BAR TO ORIGINAL POSITION ---
                const classicWrapper = document.getElementById('likeBarClassicWrapper');
                if (classicWrapper) {
                    const likeBar = classicWrapper.querySelector('#likeBar'); // Get the inner bar back
                    const originalContainer = document.querySelector('.like-dislike-bar-container');

                    if (likeBar && originalContainer) {
                        // Put the bar back inside its original grey container
                        originalContainer.appendChild(likeBar);
                    }
                    // Remove our temporary wrapper
                    classicWrapper.remove();
                }
                // ---------------------------------------------

                // Restore Like/Dislike Container to channelRight if moved
                const ldc = document.getElementById('likeDislikeContainer');
                if (ldc && ldc.dataset.movedToActions) {
                    delete ldc.dataset.movedToActions;
                    const channelRight = document.querySelector('.channel-right');
                    if (channelRight) channelRight.appendChild(ldc);
                }

                // Remove View Count element
                const vc = document.getElementById('viewCountClassic');
                if (vc) vc.remove();
            }
        })();

        // ==============================
        // Apply Title Color Scheme Preference (Blue Text)
        // ==============================
        (function applyTitleColorScheme() {
            const setting = JSON.parse(localStorage.getItem('titleColorScheme') || '{}');

            function applyBlueText() {
                const existingStyle = document.getElementById('title-color-scheme-blue');
                if (existingStyle) existingStyle.remove();

                if (setting.scheme === 'blue') {
                    const style = document.createElement('style');
                    style.id = 'title-color-scheme-blue';

                    style.textContent = `
                                html body .comment-author.blue-text {
                                    color: #128ee9 !important;
                                }
                                
                                html body .comment-author.blue-text:hover {
                                    text-decoration: underline !important;
                                    cursor: pointer !important;
                                }
                                
                                html body .suggestion-title.blue-text:hover {
                                    color: #3ea6ff !important;
                                }
                                
                                html body .channel-name.blue-text:hover {
                                    text-decoration: underline !important;
                                }
                            `;

                    document.head.appendChild(style);

                    // Add class to existing elements
                    document.querySelectorAll('.comment-author, .suggestion-title, .channel-name').forEach(el => {
                        el.classList.add('blue-text');
                    });

                    // Watch for dynamically loaded comments and sidebar items
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            mutation.addedNodes.forEach((node) => {
                                if (node.nodeType === 1) {
                                    if (node.matches && (
                                            node.matches('.comment-author') ||
                                            node.matches('.suggestion-title') ||
                                            node.matches('.channel-name')
                                        )) {
                                        node.classList.add('blue-text');
                                    }

                                    if (node.querySelectorAll) {
                                        node.querySelectorAll(
                                                '.comment-author, .suggestion-title, .channel-name'
                                                )
                                            .forEach(el => {
                                                el.classList.add('blue-text');
                                            });
                                    }
                                }
                            });
                        });
                    });

                    observer.observe(document.body, { childList: true, subtree: true });
                } else {
                    document.querySelectorAll(
                        '.comment-author.blue-text, .suggestion-title.blue-text, .channel-name.blue-text'
                        ).forEach(el => el.classList.remove('blue-text'));
                }
            }

            // Apply immediately
            applyBlueText();

            // Re-apply after profile-pic.js Light Mode runs
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => setTimeout(applyBlueText, 100));
            } else {
                setTimeout(applyBlueText, 100);
            }
        })();
    </script>
    <script>
        // --- Mobile Search Logic for Touch Devices ---
        const isTouchDeviceSearch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        if (isTouchDeviceSearch) {
            const searchIcon = document.getElementById('searchIcon');
            const mobileOverlay = document.getElementById('mobileSearchOverlay');
            const mobileSearchInput = document.getElementById('mobileSearchInput');
            const mobileSearchClose = document.getElementById('mobileSearchClose');

            if (searchIcon && mobileOverlay && mobileSearchInput) {
                // Tapping the search icon opens the full-width overlay
                searchIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    mobileOverlay.classList.add('active');
                    mobileSearchInput.placeholder = 'Search';
                    mobileSearchInput.focus();
                });

                // Close the overlay
                mobileSearchClose.addEventListener('click', () => {
                    mobileOverlay.classList.remove('active');
                    mobileSearchInput.value = '';
                });

                // Handle searching from the overlay
                mobileSearchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        const query = mobileSearchInput.value.trim();
                        if (query) {
                            window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                        }
                    }
                });
            }
        }
    </script>
