<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalYT</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="LocalYT-Rev-Files/favicon.png">
    <script>
        // ==============================
        // Apply Touch Device Detection
        // ==============================
        (function detectTouchDevice() {
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.documentElement.className += ' touch-device';
            }
        })();
    </script>
    <script>
        /**
         * Safely decode a URI component.
         * If the string contains malformed sequences like bare '%',
         * returns the original string instead of crashing.
         */
        function safeDecodeURIComponent(str) {
            if (!str) return '';
            try {
                return decodeURIComponent(str);
            } catch (e) {
                console.warn('[safeDecode] Malformed URI sequence, returning raw:', str);
                return str;
            }
        }

        // ==============================
        // Apply Rounded Corners Preference
        // ==============================
        (function applyRoundedCorners() {
            const setting = JSON.parse(localStorage.getItem('roundedCorners') || '{}');
            const enabled = setting.enabled || false;

            if (enabled) {
                const style = document.createElement('style');
                style.id = 'rounded-corners-style';
                style.textContent = `
                            .video-stage {
                                border-radius: 12px !important;
                                overflow: hidden !important;
                            }
                            .video-suggestions .thumbnail-container img.video-thumbnail {
                                border-radius: 6px !important;
                            }
                            .video-description {
                                border-radius: 6px !important;
                            }
                        `;
                document.head.appendChild(style);
            }
        })();
    </script>
    <script src="lyt-player.js">
    </script>
    <style>
        .channel-info {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .channel-left {
            display: flex;
            align-items: center;
        }
        .channel-right {
            display: flex;
            align-items: center;
            flex-shrink: 1;
            margin-left: auto;
            padding-right: 50px;
        }
        .channel-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .channel-name {
            font-size: 13px;
            font-weight: regular;
            cursor: pointer;
            color: #ffffff;
            margin-top: 0;
            margin-right: 10px;
        }
        .channel-name {
            font-size: 13px;
            font-weight: regular;
            cursor: pointer;
            color: #ffffff;
            margin-top: 0;
            margin-left: 0;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .channel-text-group {
            display: flex;
            flex-direction: column;
            margin-right: 10px;
        }

        .suggestion-item {
            display: flex;
            align-items: flex-start;
            margin-left: 10px;
            margin-bottom: -5px;
        }
        .suggestion-item img {
            width: 80px;
            height: 45px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .suggestion-info {
            display: flex;
            flex-direction: column;
            width: 200px;
            margin-top: 0;
        }

        .suggestion-title {
            font-size: 12px;
            cursor: pointer;
            color: #d2cfcf;
            margin-bottom: 3px;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .suggestion-channel {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .view-count {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .video-suggestions .video-thumbnail {
            cursor: pointer;
        }

        /* ===== LIVE CHAT STYLES ===== */
        .live-chat-container {
            display: none;
            flex-direction: column;
            height: 460px;
            max-height: 460px;
            margin-left: 30px;
            background-color: #181818;
            ;
            overflow: hidden;
            width: 90%;
            box-sizing: border-box;
        }

        .live-chat-header {
            padding: 10px 15px;
            background-color: #272727;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .chat-toggle-btn {
            background-color: transparent;
            color: #ccc;
            border: 1px solid transparent;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 10px;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .live-chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #555 #181818;
            width: 100%;
            box-sizing: border-box;
        }
        .live-chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .live-chat-messages::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            box-sizing: border-box;
        }

        .chat-message-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }
        .chat-author {
            font-size: 13px;
            font-weight: bold;
            color: #3ea6ff;
            cursor: default;
        }
        .chat-timestamp {
            font-size: 11px;
            color: #aaa;
        }
        .chat-text {
            font-size: 14px;
            color: #eee;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
            width: 100%;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                transform: translateY(5px);
            }
        }

        /* Playlist Sidebar Styles */
        .playlist-section {
            margin-bottom: 0px;
            border-bottom: 1px solid #3f3f3f;
            padding-bottom: 0px;
        }
        .playlist-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 5px 20px;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        .playlist-section-header a {
            font-size: 12px;
            color: #aaa;
            font-weight: normal;
            text-decoration: none;
            cursor: pointer;
        }

        /* Scrollable container for large playlists */
        .playlist-scroll-container {
            max-height: 460px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
        }

        /* ===== CHAPTER MANAGER STYLES ===== */
        .chapter-section {
            margin-bottom: 0;
            border-bottom: 1px solid #3f3f3f;
            padding-bottom: 0;
            display: none;
            /* hidden by default */;
        }
        .chapter-section.lyt_chapter_visible {
            display: block;
        }
        .chapter-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 5px 20px;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            cursor: default;
        }
        .chapter-section-header .chapter-close-btn {
            font-size: 18px;
            color: #888;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color 0.2s;
            background: none;
            border: none;
            font-weight: 300;
        }
        .chapter-section-header .chapter-close-btn:hover {
            color: #fff;
        }
        .chapter-scroll-container {
            max-height: 460px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
        }
        .chapter-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .chapter-scroll-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
        .chapter-item {
            display: flex;
            align-items: center;
            padding: 6px 12px 6px 20px;
            cursor: pointer;
            color: #d2cfcf;
            font-size: 13px;
            transition: background-color 0.12s ease;
            gap: 12px;
            border-left: 3px solid transparent;
            font-family: 'RobotoRegular', Arial, sans-serif;
        }
        .chapter-item:hover {
            background-color: #3f3f3f;
        }
        .chapter-item.current {
            background-color: #3f3f3f;
            border-left-color: #cc0000;
        }
        .chapter-item.current .chapter-title {
            color: #fff;
        }
        .chapter-time {
            color: #888;
            font-size: 12px;
            min-width: 44px;
            font-family: 'RobotoRegular', monospace, Arial, sans-serif;
            flex-shrink: 0;
        }
        .chapter-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d2cfcf;
        }
        .chapter-item .chapter-play-icon {
            opacity: 0;
            font-size: 14px;
            color: #cc0000;
            transition: opacity 0.15s;
            flex-shrink: 0;
            width: 18px;
            text-align: center;
        }
        .chapter-item.current .chapter-play-icon {
            opacity: 1;
        }
        .chapter-item:hover .chapter-play-icon {
            opacity: 0.6;
        }
        .chapter-item.current:hover .chapter-play-icon {
            opacity: 1;
        }

        /* ===== END CHAPTER MANAGER STYLES ===== */

        /* Autoplay Toggle in Sidebar */
        .sidebar-autoplay-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background-color: var(--main-bg-color);
        }
        .sidebar-autoplay-label {
            font-size: 13px;
            color: #ccc;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            padding-left: 8px;
        }
        .sidebar-autoplay-toggle .toggle-switch {
            flex-shrink: 0;
        }

        .current-video-item {
            background-color: #3f3f3f;
        }

        .content-wrapper {
            margin-left: 70px;
        }
        .video-wrapper {
            flex: 0 0 70%;
            width: 100%;
            max-width: 1800px;
            min-width: 0;
            overflow: hidden;
            padding-right: 0px;
            position: relative;
        }
        .video-stage {
            position: relative;
            width: 100%;
        }
        .logo-overlay {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 150px;
            background-image: url('LocalYT-Rev-Files/Play-Dark.png');
            background-size: contain;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }
        .video-wrapper:hover .logo-overlay {
            background-image: url('LocalYT-Rev-Files/Play-Light.png');
        }
        .video-wrapper.paused {
            cursor: pointer;
        }
        .like-dislike-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 0;
        }
        .like-dislike-icons {
            display: flex;
            align-items: center;
        }
        .like-dislike-icons img {
            width: 25px;
            height: 25px;
            margin-right: 8px;
            filter: invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%);
            cursor: pointer;
        }
        .like-dislike-icons span {
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            color: #aaa;
            margin-right: 15px;
        }
        .like-dislike-bar-container {
            width: 140px;
            height: 3px;
            background-color: #235cad;
            border-radius: 2px;
            margin-top: 6px;
            margin-left: -15px;
        }
        .like-bar {
            height: 100%;
            background-color: #397ddb;
            border-radius: 2px;
        }
        .share-container {
            display: flex;
            align-items: center;
            margin-left: 25px;
        }
        .share-container img {
            width: 25px;
            height: 25px;
            margin-right: 8px;
            filter: invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%);
        }
        .share-container span {
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            color: #aaa;
            margin-right: 25px;
        }
        .save-container {
            display: flex;
            align-items: center;
            margin-left: 30px;
            cursor: pointer;
        }
        .save-container img {
            width: 25px;
            height: 25px;
            margin-right: 8px;
            filter: invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%);
        }
        .save-container span {
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            color: #aaa;
        }

        /* Save to Playlist Modal */
        .save-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        .save-modal-content {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .save-modal-content h2 {
            font-family: 'Kaleko205Round', Arial, sans-serif;
            color: #fff;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .save-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .save-modal-close:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .no-playlists-message {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .save-playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: #d2cfcf;
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .save-playlist-item:hover {
            background-color: #3f3f3f;
        }
        .save-playlist-item.already-saved {
            color: #888;
            cursor: default;
        }
        .save-playlist-item.already-saved:hover {
            background-color: transparent;
        }
        .save-playlist-item .playlist-video-count {
            color: #666;
            font-size: 12px;
            margin-left: 6px;
        }
        .save-playlist-item .check-icon {
            color: #fff;
            font-size: 18px;
        }
        .create-playlist-row {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #3f3f3f;
        }
        .create-playlist-row input {
            flex: 1;
            background: var(--main-bg-color);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 8px 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'RobotoRegular', Arial, sans-serif;
        }
        .create-playlist-row input:focus {
            border-color: #3ea6ff;
        }
        .create-playlist-row button {
            background-color: #cc0000;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: 'RobotoRegular', Arial, sans-serif;
            white-space: nowrap;
        }
        .create-playlist-row button:hover {
            background-color: #c40000;
        }
        .sub-count {
            font-size: 12px;
            color: #888;
            margin-left: 0;
            white-space: nowrap;
            margin-top: 0;
        }
        .subscribe-button {
            margin-left: 15px;
            margin-right: 15px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 12px;
            color: #fff;
            background-color: red;
            border: none;
        }
        .subscribe-button.subscribed {
            background-color: darkgray;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .modal-content h2 {
            font-family: 'Kaleko205Round', Arial, sans-serif;
            color: #fff;
            margin-bottom: 20px;
        }
        .modal-content button {
            background-color: red;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .modal-content button:hover {
            background-color: #c40000;
        }
        .modal-close {
            position: absolute;
            top: -10px;
            right: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 10px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .modal-close:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .copy-message {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1a1a1a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
        }
        .video-description {
            background-color: #282828;
            padding: 15px;
            margin-top: 10px;
            font-family: 'RobotoRegular', Arial, sans-serif;
            font-size: 14px;
            color: #fff;
            white-space: pre-line;
            text-align: left;
        }

        .video-description a {
            color: #3ea6ff;
            text-decoration: none;
        }

        .video-description a:hover {
            text-decoration: underline;
        }
        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            display: block;
            border: none;
        }

        .video-stage {
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .fluid_video_wrapper {
            aspect-ratio: 16 / 9 !important;
            background-color: #000;
            position: relative;
            width: 100%;
        }

        .fluid_video_wrapper video {
            width: 100% !important;
            height: 100% !important;
            max-height: none !important;
            object-fit: contain !important;
        }

        .fluid_video_wrapper:fullscreen,
        .fluid_video_wrapper.pseudo_fullscreen {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fluid_video_wrapper:fullscreen video,
        .fluid_video_wrapper.pseudo_fullscreen video {
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .video-description .mention-link {
            color: #3ea6ff;
            cursor: pointer;
        }

        .video-description .no-description {
            color: #999;
            font-style: italic;
            display: block;
            margin-top: 10px;
        }
        .video-description.collapsed {
            max-height: 160px;
            overflow: hidden;
            position: relative;
        }
        .video-description.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45px;
            background: linear-gradient(rgba(40, 40, 40, 0), #282828);
            pointer-events: none;
        }
        .description-toggle {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 10px;
            user-select: none;
        }


        /* ===== COMMENTS SECTION ===== */
        .comments-section {
            margin-top: 15px;
            max-width: 100%;
        }
        .comments-header {
            display: flex;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 5px;
        }
        .comments-count {
            font-size: 17px;
            font-weight: regular;
            color: #fff;
            margin-right: 4px;
        }
        #commentsTotalAmount {
            font-size: 17px;
            font-weight: regular;
            color: #fff;
            margin-right: 24px;
        }

        .comment-item {
            display: flex;
            margin-bottom: 8px;
            padding: 4px 0;
        }
        .comment-item.reply {
            padding: 3px 0 3px 16px;
            border-left: 1px solid #3f3f3f;
        }
        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            user-select: none;
            object-fit: cover;
        }
        .comment-item.reply .comment-avatar {
            width: 24px;
            height: 24px;
            font-size: 11px;
            margin-right: 12px;
        }
        .comment-body {
            flex: 1;
            min-width: 0;
        }
        .comment-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .comment-author {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
        }
        .comment-badge {
            font-size: 11px;
            padding: 0 6px;
            border-radius: 3px;
            line-height: 18px;
        }
        .comment-badge.uploader-badge {
            background-color: #3f3f3f;
            color: #aaa;
        }
        .comment-badge.verified-badge {
            color: #fff;
            font-size: 13px;
            padding: 0 2px;
        }
        .comment-pinned-label {
            font-size: 12px;
            color: #aaa;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 6px;
        }
        .comment-timestamp {
            font-size: 12px;
            color: #aaa;
        }
        .comment-text {
            font-size: 14px;
            color: #e1e1e1;
            line-height: 1.45;
            white-space: pre-line;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin-bottom: 6px;
        }
        .comment-text.collapsed {
            max-height: calc(1.45em * 3);
            line-height: 1.45;
            overflow: hidden;
            position: relative;
        }
        .comment-text.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: linear-gradient(rgba(15, 15, 15, 0), rgba(15, 15, 15, 1));
            pointer-events: none;
        }
        .comment-toggle-text {
            color: #3ea6ff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 6px;
            user-select: none;
        }

        .comment-actions {
            display: flex;
            align-items: center;
            height: 24px;
        }
        .comment-like-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #aaa;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            user-select: none;
            transition: background-color 0.15s;
            margin-left: -8px;
        }

        .comment-like-btn.liked img {
            filter: invert(49%) sepia(94%) saturate(1748%) hue-rotate(194deg) brightness(97%) contrast(101%);
        }

        .comment-like-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Remove the gradient fade on collapsed comment text */
        .comment-text.collapsed::after {
            display: none !important;
            height: calc(1.45em * 3);
        }
        .no-comments {
            color: #888;
            font-size: 14px;
            padding: 15px 0;
        }
        /* Replies toggle */
        .replies-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3ea6ff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 0;
            margin-bottom: 6px;
            user-select: none;
            background: none;
            border: none;
            font-family: inherit;
        }
        .replies-toggle:hover {
            text-decoration: underline;
        }
        .replies-toggle svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
        }
        .replies-toggle.open svg {
            transform: rotate(180deg);
        }
        .replies-container {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .replies-container.collapsed {
            max-height: 0 !important;
        }
        @media (max-width: 1200px) {
            .comment-item.reply {
                margin-left: 36px;
            }
        }

        /* ===== CLASSIC LAYOUT STYLES ===== */
        .channel-info.classic-layout {
            flex-wrap: wrap;
        }

        .channel-info.classic-layout .channel-right {
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            padding-right: 20px;
        }

        .channel-info.classic-layout #likeDislikeContainer {
            flex-direction: row;
            align-items: center;
            margin-left: 0;
            order: 1;
        }

        .channel-info.classic-layout #likeDislikeContainer .like-dislike-bar-container {
            margin-left: 10px;
            margin-top: 0;
            width: 100px;
        }

        .channel-info.classic-layout #shareContainer,
        .channel-info.classic-layout #saveContainer {
            margin-left: 0;
            order: 3;
        }

        /* View count container for classic mode */
        .view-count-classic {
            display: none;
            font-size: 14px;
            color: #aaa;
            font-family: 'RobotoRegular', Arial, sans-serif;
            order: 0;
            margin-bottom: 4px;
        }

        .channel-info.classic-layout .view-count-classic {
            display: block;
        }

        /* In modern mode, ensure standard spacing */
        .channel-info:not(.classic-layout) .channel-right {
            align-items: center;
        }

        /* --- Search Suggestions Visibility --- */
        .search-suggestions {
            display: none;
        }

        /* Show suggestions only when the search container (input) is focused/active */
        .search-container:focus-within .search-suggestions {
            display: block;
        }

        /* Prevent autoscroll cursor on all interactive elements */
        a,
        .suggestion-item,
        .suggestion-title,
        .thumbnail-container,
        .channel-name,
        .logo-overlay,
        .mention-link,
        [class*="click"],
        [onclick] {
            -webkit-user-select: none;
            user-select: none;
        }

        /* 1. Set default cursor only for text/info elements (not thumbnails) */
        .video-suggestions .suggestion-info,
        .video-suggestions .suggestion-channel,
        .video-suggestions .view-count {
            cursor: default;
        }

        /* 2. Set pointer cursor for clickable elements (thumbnails & titles) */
        .video-suggestions .thumbnail-container,
        .video-suggestions .thumbnail-container img,
        .video-suggestions .suggestion-title {
            cursor: pointer !important;
        }
    </style>

    <script>
        // Natural sorting function for videos with numbers in titles
        function naturalCompare(a, b) {
            // Helper function to extract numbers from video titles
            const extractNumbers = (str) => {
                return (str.match(/\d+/g) || []).map(num => parseInt(num, 10));
            };

            const numsA = extractNumbers(a.displayName);
            const numsB = extractNumbers(b.displayName);

            // Compare number by number
            for (let i = 0; i < Math.max(numsA.length, numsB.length); i++) {
                const numA = i < numsA.length ? numsA[i] : 0;
                const numB = i < numsB.length ? numsB[i] : 0;

                if (numA !== numB) {
                    return numA - numB;
                }
            }

            // If all numbers match, fall back to string comparison
            return a.displayName.localeCompare(b.displayName);
        }

        // --- Language Helper ---
        function getLang(en, de) {
            return localStorage.getItem('language') === 'de' ? de : en;
        }

        // Handle logo clicks
        document.addEventListener('DOMContentLoaded', () => {
            const mainLogo = document.getElementById('mainLogo');

            if (mainLogo) {
                mainLogo.addEventListener('click', (event) => {
                    if (event.button === 0) { // Left click
                        window.location.href = 'index.html';
                    }
                });

                mainLogo.addEventListener('mouseup', (event) => {
                    if (event.button === 1) { // Middle click
                        event.preventDefault();
                        window.open('index.html', '_blank');
                    }
                });

                mainLogo.addEventListener('contextmenu', (event) => {
                    event.preventDefault();
                    window.open('index.html', '_blank');
                });

                mainLogo.title = "Go to homepage (Left click: same tab, Middle/Right click: new tab)";

                mainLogo.style.cursor = 'pointer';
            }
        });

        // Helper function to strip file extension for thumbnail and metadata paths
        function stripExtension(filename) {
            return filename.replace(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i, '');
        }

        // Helper function to get video file extension
        function getVideoExtension(path) {
            const match = path.match(/\.(mp4|mp3|mkv|avi|mov|wmv|flv|webm)$/i);
            return match ? match[1] : 'mp4';
        }

        // Helper function to get MIME type based on extension
        function getMimeType(extension) {
            const mimeTypes = {
                'mp4': 'video/mp4',
                'mkv': 'video/x-matroska',
                'avi': 'video/x-msvideo',
                'mov': 'video/quicktime',
                'wmv': 'video/x-ms-wmv',
                'flv': 'video/x-flv',
                'webm': 'video/webm',
                'mp3': 'audio/mp3'
            };
            return mimeTypes[extension.toLowerCase()] || 'video/mp4';
        }

        // ===== COMMENT HELPERS =====
        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = ((hash % 360) + 360) % 360;
            return `hsl(${hue}, 45%, 38%)`;
        }

        function formatRelativeTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '';
            const now = new Date();
            const diffMs = now - date;
            const sec = Math.floor(diffMs / 1000);
            const min = Math.floor(sec / 60);
            const hr = Math.floor(min / 60);
            const day = Math.floor(hr / 24);
            const wk = Math.floor(day / 7);
            const mo = Math.floor(day / 30);
            const yr = Math.floor(day / 365);

            // Check language
            const lang = localStorage.getItem('language');
            const isDe = lang === 'de';

            if (sec < 60) return isDe ? 'gerade eben' : 'just now';
            if (min < 60) {
                if (isDe) return `vor ${min} ${min === 1 ? 'Minute' : 'Minuten'}`;
                return min + (min === 1 ? ' minute ago' : ' minutes ago');
            }
            if (hr < 24) {
                if (isDe) return `vor ${hr} ${hr === 1 ? 'Stunde' : 'Stunden'}`;
                return hr + (hr === 1 ? ' hour ago' : ' hours ago');
            }
            if (day < 7) {
                if (isDe) return `vor ${day} ${day === 1 ? 'Tag' : 'Tagen'}`;
                return day + (day === 1 ? ' day ago' : ' days ago');
            }
            if (wk < 5) {
                if (isDe) return `vor ${wk} ${wk === 1 ? 'Woche' : 'Wochen'}`;
                return wk + (wk === 1 ? ' week ago' : ' weeks ago');
            }
            if (mo < 12) {
                if (isDe) return `vor ${mo} ${mo === 1 ? 'Monat' : 'Monaten'}`;
                return mo + (mo === 1 ? ' month ago' : ' months ago');
            }
            if (isDe) return `vor ${yr} ${yr === 1 ? 'Jahr' : 'Jahren'}`;
            return yr + (yr === 1 ? ' year ago' : ' years ago');
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        const LIKE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H1v10h6l11.77-10zM7 20H2v-8h5v8zm8.63-15.34c.15-.51-.25-.66-.56-.66-.31 0-.6.15-.84.41L7.62 11h6.01l1.52-4.94L21 11h-2l-7 10h2l7-10z"/></svg>';
        const CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';

        function processCommentText(text) {
            let escaped = escapeHtml(text);

            const urlRegex = /(https?:\/\/[^\s<]+)/g;
            escaped = escaped.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" style="color: #3ea6ff; text-decoration: none;">' + url + '</a>';
            });

            const timestampRegex = /(\b\d{1,2}:\d{2}(?::\d{2})?\b)/g;
            escaped = escaped.replace(timestampRegex, function(timestamp) {
                return '<a href="#" onclick="seekToTimestamp(\'' + timestamp + '\'); return false;" style="color: #3ea6ff; text-decoration: none;">' + timestamp + '</a>';
            });

            return escaped;
        }

        function renderSingleComment(comment, isReply, channelPicUrl, isCommentLiked = false) {
            const initial = comment.author.replace('@', '').charAt(0).toUpperCase();
            const bg = getAvatarColor(comment.author);
            const isLong = comment.text && comment.text.length > 180;
            const replyCls = isReply ? ' reply' : '';

            // Generate unique ID for each comment
            const commentId = comment._internalId || `${comment.author}-${comment.published_at}-${comment.text.substring(0, 20)}`;

            // Check user preference for commenter avatar style
            const commenterSettings = JSON.parse(localStorage.getItem('commenterProfileStyle') || '{}');
            const commenterStyle = commenterSettings.style || 'modern';

            let avatarHtml;
            if (comment.is_uploader && channelPicUrl) {
                avatarHtml =
                    `<img class="comment-avatar" src="${channelPicUrl}" alt="" style="object-fit: cover;">`;
            } else if (commenterStyle === 'classic') {
                avatarHtml =
                    `<img class="comment-avatar" src="/LocalYT-Rev-Files/commenter-profile-placeholder.png" alt="" style="object-fit: cover;">`;
            } else {
                avatarHtml = `<div class="comment-avatar" style="background:${bg}">${initial}</div>`;
            }

            let badges = '';
            if (comment.is_pinned) badges += '<span class="comment-pinned-label">📌 Pinned</span>';
            if (comment.is_uploader) badges += '<span class="comment-badge uploader-badge">Uploader</span>';
            if (comment.is_verified) badges += '<span class="comment-badge verified-badge">✓</span>';

            // Determine styles
            const likedClass = isCommentLiked ? ' liked' : '';

            const imgFilter = isCommentLiked ?
                'invert(49%) sepia(94%) saturate(1748%) hue-rotate(194deg) brightness(97%) contrast(101%)' :
                'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';

            return `<div class="comment-item${replyCls}" data-comment-id="${encodeURIComponent(commentId)}">
                    ${avatarHtml}
                    <div class="comment-body">
                        <div class="comment-meta">
                            <span class="comment-author">${escapeHtml(comment.author.replace('@', ''))}</span>${badges}
                            <span class="comment-timestamp">${formatRelativeTime(comment.published_at)}</span>
                        </div>
                        <div class="comment-text${isLong ? ' collapsed' : ''}">${processCommentText(comment.text)}</div>
                        ${isLong ? `<div class="comment-toggle-text" data-action="expand">${getLang('Show more', 'Mehr anzeigen')}</div>` : ''}
                        <div class="comment-actions">
                            <div class="comment-like-btn${likedClass}" onclick="handleCommentLike(this, '${encodeURIComponent(commentId)}')">
                                <!-- USING IMG TAG (Matches Reference Code) -->
                                <img src="LocalYT-Rev-Files/like.svg" alt="" style="width:14px;height:14px;filter:${imgFilter};flex-shrink:0;cursor:pointer;">
                                <span>${comment.likes || 0}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // Handle comment like button clicks
        async function handleCommentLike(buttonElement, commentId) {
            try {
                const response = await fetch('/like-comment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ commentId: safeDecodeURIComponent(commentId) })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        alert('Please log in to like comments.');
                        return;
                    }
                    throw new Error('Failed to update like');
                }

                const data = await response.json();

                // Get the IMG element (not SVG)
                const img = buttonElement.querySelector('img');

                // Update UI immediately
                if (data.isLiked) {
                    buttonElement.classList.add('liked');
                    // Apply Blue Filter
                    img.style.filter =
                        'invert(49%) sepia(94%) saturate(1748%) hue-rotate(194deg) brightness(97%) contrast(101%)';

                    const span = buttonElement.querySelector('span');
                    span.textContent = parseInt(span.textContent || 0) + 1;
                } else {
                    buttonElement.classList.remove('liked');
                    // Apply Grey Filter (Default)
                    img.style.filter =
                        'invert(57%) sepia(4%) saturate(2%) hue-rotate(176deg) brightness(90%) contrast(88%)';

                    const span = buttonElement.querySelector('span');
                    span.textContent = Math.max(0, parseInt(span.textContent || 0) - 1);
                }
            } catch (error) {
                console.error('Error liking comment:', error);
            }
        }

        function applyCommentSort() {
            const state = _lazyCommentsState;
            if (!state.allTopLevel || state.allTopLevel.length === 0) return;

            const sortMode = state.sortMode || 'top';

            const pinned = state.allTopLevel.filter(c => c.is_pinned);
            const unpinned = state.allTopLevel.filter(c => !c.is_pinned);

            if (sortMode === 'top') {
                unpinned.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            } else if (sortMode === 'newest') {
                unpinned.sort((a, b) => {
                    const dateA = a.published_at ? new Date(a.published_at) : new Date(0);
                    const dateB = b.published_at ? new Date(b.published_at) : new Date(0);
                    return dateB - dateA;
                });
            } else if (sortMode === 'oldest') {
                unpinned.sort((a, b) => {
                    const dateA = a.published_at ? new Date(a.published_at) : new Date(0);
                    const dateB = b.published_at ? new Date(b.published_at) : new Date(0);
                    return dateA - dateB;
                });
            }

            state.allTopLevel = [...pinned, ...unpinned];

            // Re-render from scratch
            const container = document.getElementById('commentsContainer');
            if (container) container.innerHTML = '';
            state.renderedCount = 0;
            state.loading = false;
            if (state.observer) {
                state.observer.disconnect();
                state.observer = null;
            }
            const sentinel = document.getElementById('commentsSentinel');
            if (sentinel) sentinel.remove();

            renderCommentsBatch();
        }

        // ===== COMMENT LAZY-LOADING STATE =====
        let _lazyCommentsState = {
            allTopLevel: [],
            allReplies: [],
            channelPicUrl: '',
            renderedCount: 0,
            batchSize: 30,
            observer: null,
            loading: false
        };

        function renderCommentsBatch() {
            const state = _lazyCommentsState;
            const container = document.getElementById('commentsContainer');
            const countEl = document.getElementById('commentsCount');

            const totalCount = state.allTopLevel.length;
            countEl.textContent = getLang('Comments', 'Kommentare');
            countEl.style.marginRight = '4px';

            let countSpan = document.getElementById('commentsTotalAmount');
            if (!countSpan) {
                countSpan = document.createElement('span');
                countSpan.id = 'commentsTotalAmount';
                countEl.parentNode.insertBefore(countSpan, countEl.nextSibling);
            }
            countSpan.textContent = ' \u2022 ' + totalCount.toLocaleString();

            const start = state.renderedCount;
            const end = Math.min(start + state.batchSize, state.allTopLevel.length);

            let html = '';
            for (let i = start; i < end; i++) {
                const comment = state.allTopLevel[i];
                const commentId = comment._internalId;
                const isLiked = state.userCommentLikes[commentId] === true;
                html += renderSingleComment(comment, false, state.channelPicUrl, isLiked);
            }

            const sentinel = document.getElementById('commentsSentinel');
            if (sentinel) sentinel.remove();
            container.insertAdjacentHTML('beforeend', html);

            state.renderedCount = end;

            bindCommentTextToggles(container);

            attachRepliesToRenderedComments();

            if (state.renderedCount >= state.allTopLevel.length) {
                // All comments loaded, disconnect observer
                if (state.observer) {
                    state.observer.disconnect();
                    state.observer = null;
                }
                return;
            }

            ensureSentinel(container);
            ensureObserver();
        }

        function ensureSentinel(container) {
            const sentinel = document.createElement('div');
            sentinel.id = 'commentsSentinel';
            sentinel.style.height = '1px';
            container.appendChild(sentinel);
        }

        function ensureObserver() {
            const state = _lazyCommentsState;
            if (state.observer) state.observer.disconnect();

            state.observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !state.loading && state.renderedCount < state.allTopLevel.length) {
                    state.loading = true;
                    requestAnimationFrame(() => {
                        renderCommentsBatch();
                        state.loading = false;
                    });
                }
            }, { rootMargin: '200px' });

            const sentinel = document.getElementById('commentsSentinel');
            if (sentinel) state.observer.observe(sentinel);
        }

        function attachRepliesToRenderedComments() {
            const state = _lazyCommentsState;
            const container = document.getElementById('commentsContainer');

            // Find all top-level comments currently rendered
            const renderedComments = container.querySelectorAll('.comment-item:not(.reply)');

            renderedComments.forEach((commentEl) => {
                // Skip if we already attached replies to this comment
                if (commentEl.nextElementSibling && commentEl.nextElementSibling.classList.contains('replies-section'))
                    return;

                const commentId = safeDecodeURIComponent(commentEl.dataset.commentId);
                const commentData = state.allTopLevel.find(c => c._internalId === commentId);

                if (commentData && commentData.replies && commentData.replies.length > 0) {
                    const replies = commentData.replies;

                    const repliesSection = document.createElement('div');
                    repliesSection.className = 'replies-section';
                    repliesSection.style.marginLeft = '48px';

                    let html =
                        `<button class="replies-toggle">${CHEVRON_SVG} ${getLang(`View ${replies.length} ${replies.length === 1 ? 'reply' : 'replies'}`, `${replies.length} ${replies.length === 1 ? 'Antwort' : 'Antworten'} anzeigen`)}</button>`;
                    html += `<div class="replies-container collapsed" style="transition: none;">`;

                    replies.forEach(r => {
                        const isLiked = state.userCommentLikes[r._internalId] === true;
                        html += renderSingleComment(r, true, state.channelPicUrl, isLiked);
                    });

                    html += '</div>';
                    repliesSection.innerHTML = html;

                    commentEl.insertAdjacentElement('afterend', repliesSection);

                    const toggle = repliesSection.querySelector('.replies-toggle');
                    const repliesBox = repliesSection.querySelector('.replies-container');

                    if (toggle && repliesBox) {
                        toggle.addEventListener('click', function() {
                            const open = this.classList.toggle('open');
                            if (open) {
                                repliesBox.classList.remove('collapsed');
                                this.innerHTML = CHEVRON_SVG + getLang('Hide replies', 'Antworten ausblenden');
                            } else {
                                repliesBox.classList.add('collapsed');
                                this.innerHTML = CHEVRON_SVG + getLang(
                                    `View ${replies.length} ${replies.length === 1 ? 'reply' : 'replies'}`,
                                    `${replies.length} ${replies.length === 1 ? 'Antwort' : 'Antworten'} anzeigen`
                                    );
                            }
                        });
                    }
                }
            });

            // =======================================================
            // THIS IS THE CRITICAL ADDITION:
            // Bind toggle listeners for the newly injected reply items!
            // =======================================================
            bindCommentTextToggles(container);

            if (state.observer) {
                state.observer.disconnect();
                state.observer = null;
            }
        }

        function bindCommentTextToggles(container) {
            container.querySelectorAll('[data-action="expand"]').forEach(btn => {
                if (btn._bound) return;
                btn._bound = true;
                btn.addEventListener('click', function() {
                    // Find the text element within the same .comment-body container
                    const textEl = this.closest('.comment-body') ? this.closest('.comment-body').querySelector(
                        '.comment-text') : null;

                    if (textEl && textEl.classList.contains('collapsed')) {
                        textEl.classList.remove('collapsed');
                        this.textContent = getLang('Show less', 'Weniger anzeigen');
                    } else if (textEl) {
                        textEl.classList.add('collapsed');
                        this.textContent = getLang('Show more', 'Mehr anzeigen');
                    }
                });
            });
        }

        function renderComments(comments, channelPicUrl, userCommentLikes = {}) {
            const container = document.getElementById('commentsContainer');
            const countEl = document.getElementById('commentsCount');

            if (_lazyCommentsState.observer) {
                _lazyCommentsState.observer.disconnect();
                _lazyCommentsState.observer = null;
            }

            container.innerHTML = '';

            if (!_lazyCommentsState.sortMode) _lazyCommentsState.sortMode = 'top';

            if (!comments || comments.length === 0) {
                const lang = localStorage.getItem('language');
                if (lang === 'de') {
                    countEl.textContent = 'Kommentare';
                    countEl.style.marginRight = '4px';
                    let countSpanDe = document.getElementById('commentsTotalAmount');
                    if (!countSpanDe) {
                        countSpanDe = document.createElement('span');
                        countSpanDe.id = 'commentsTotalAmount';
                        countEl.parentNode.insertBefore(countSpanDe, countEl.nextSibling);
                    }
                    countSpanDe.textContent = ' \u2022 0';
                    container.innerHTML = '<div class="no-comments">Keine Kommentare für dieses Video vorhanden.</div>';
                } else {
                    countEl.textContent = 'Comments';
                    countEl.style.marginRight = '4px';
                    let countSpanEn = document.getElementById('commentsTotalAmount');
                    if (!countSpanEn) {
                        countSpanEn = document.createElement('span');
                        countSpanEn.id = 'commentsTotalAmount';
                        countEl.parentNode.insertBefore(countSpanEn, countEl.nextSibling);
                    }
                    countSpanEn.textContent = ' \u2022 0';
                    container.innerHTML = '<div class="no-comments">No comments available for this video.</div>';
                }
                createCommentSortButton();
                return;
            }

            let idCounter = 0;
            const topLevel = [];
            let currentParent = null;

            comments.forEach(c => {
                // Assign a reliable internal ID to every comment
                c._internalId = 'cid_' + (idCounter++);

                if (!c.is_reply) {
                    // This is a top-level comment
                    c.replies = [];
                    topLevel.push(c);
                    currentParent = c; // Set it as the active parent for upcoming replies
                } else if (currentParent) {
                    // This is a reply; attach it to the last top-level comment we saw
                    currentParent.replies.push(c);
                }
            });

            // Default sort is by likes (Top comments), pinned first
            topLevel.sort((a, b) => {
                if (a.is_pinned && !b.is_pinned) return -1;
                if (!a.is_pinned && b.is_pinned) return 1;
                return (b.likes || 0) - (a.likes || 0);
            });

            _lazyCommentsState.userCommentLikes = userCommentLikes;
            _lazyCommentsState.allTopLevel = topLevel;
            _lazyCommentsState.allReplies = []; // No longer needed globally
            _lazyCommentsState.channelPicUrl = channelPicUrl;
            _lazyCommentsState.renderedCount = 0;
            _lazyCommentsState.loading = false;

            createCommentSortButton();

            renderCommentsBatch();
        }

        async function loadComments(videoSrc, channelPicUrl) {
            try {
                // Fetch comments and user's liked comments in parallel
                const [commentsRes, likesRes] = await Promise.all([
                    fetch('/api/comments?video=' + encodeURIComponent(videoSrc)),
                    fetch('/user-comment-likes')
                ]);
        
                if (!commentsRes.ok) return renderComments([], channelPicUrl);
                const comments = await commentsRes.json();
        
                // Mark uploaders by handle if they match the video's channel
                const channel = videoSrc.split('/')[0];
                comments.forEach(comment => {
                    if (!comment.is_uploader && comment.author && comment.author.startsWith('@') && comment.author.substring(1) === channel) {
                        comment.is_uploader = true;
                    }
                });
        
                // Parse user likes (returns {} if not logged in or error)
                let userCommentLikes = {};
                if (likesRes.ok) {
                    userCommentLikes = await likesRes.json();
                }
        
                renderComments(comments, channelPicUrl, userCommentLikes);
            } catch (e) {
                console.error('Error loading comments:', e);
                renderComments([], channelPicUrl);
            }
        }

                    event.preventDefault();
                    const channel = channelNameElement.textContent;
                    window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');

            });

            // Right click
            channelNameElement.addEventListener('contextmenu', (event) => {
                event.preventDefault();
                const channel = channelNameElement.textContent;
                window.open(`channel.html?channel=${encodeURIComponent(channel)}`, '_blank');
            });
        }

        // ============================================================
        // CHAPTER MANAGER LOGIC
        // ============================================================

        let _chapterManagerChapters = [];
        let _chapterManagerVisible = false;
        let _chapterManagerPlayer = null;

        /**
         * Toggle the chapter manager visibility.
         * @param {Array} chapters - Array of { time, title } objects.
         * @param {number} currentTime - Current video time in seconds.
         * @param {object} player - Reference to the LYT player instance.
         */
        function toggleChapterManager(chapters, currentTime, player) {
            _chapterManagerChapters = chapters || [];
            _chapterManagerPlayer = player;

            const manager = document.getElementById('chapterManager');
            const list = document.getElementById('chapterList');

            if (!manager || !list) return;

            // If no chapters, hide and return
            if (!_chapterManagerChapters || _chapterManagerChapters.length === 0) {
                manager.classList.remove('lyt_chapter_visible');
                _chapterManagerVisible = false;
                return;
            }

            // Toggle visibility
            _chapterManagerVisible = !_chapterManagerVisible;

            if (_chapterManagerVisible) {
                _lastCurrentChapterIndex = -1;
                // Render chapters
                renderChapterList(currentTime);
                manager.classList.add('lyt_chapter_visible');
                // Ensure the suggestions container shows the manager
                const suggestions = document.getElementById('videoSuggestions');
                if (suggestions) {
                    // If suggestions is hidden (e.g., chat is showing), we need to show it
                    // but we don't want to force it if chat is active.
                    // We'll just let the manager appear within the normal flow.
                }
            } else {
                manager.classList.remove('lyt_chapter_visible');
            }
        }

        /**
         * Render the chapter list in the manager.
         */
        function renderChapterList(currentTime) {
            const list = document.getElementById('chapterList');
            if (!list) return;

            if (!_chapterManagerChapters || _chapterManagerChapters.length === 0) {
                list.innerHTML = '<div style="padding:12px 20px;color:#888;font-size:13px;">No chapters available.</div>';
                return;
            }

            let html = '';
            _chapterManagerChapters.forEach((chapter, index) => {
                const isCurrent = currentTime !== undefined && chapter.time <= currentTime &&
                    (index === _chapterManagerChapters.length - 1 || _chapterManagerChapters[index + 1].time >
                        currentTime);
                const timeStr = formatTimeShort(chapter.time);
                const activeClass = isCurrent ? ' current' : '';
                html += `
                            <div class="chapter-item${activeClass}" data-index="${index}" data-time="${chapter.time}">
                                <span class="chapter-time">${timeStr}</span>
                                <span class="chapter-title">${escapeHtml(chapter.title)}</span>
                            </div>
                        `;
            });

            list.innerHTML = html;

            // Scroll to current chapter
            const currentItem = list.querySelector('.chapter-item.current');
            if (currentItem) {
                setTimeout(() => {
                    currentItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }, 50);
                _lastCurrentChapterIndex = parseInt(currentItem.dataset.index);
            } else {
                _lastCurrentChapterIndex = -1;
            }

            // Bind click events
            list.querySelectorAll('.chapter-item').forEach(item => {
                item.addEventListener('click', function() {
                    const time = parseFloat(this.dataset.time);
                    if (!isNaN(time) && _chapterManagerPlayer) {
                        // Seek to chapter time
                        _chapterManagerPlayer.skipTo(time);
                        // Update highlight
                        renderChapterList(time);
                        // Close the manager after seeking (optional - we keep it open)
                        // To close after click, uncomment:
                        // closeChapterManager();
                    } else if (!isNaN(time)) {
                        // Fallback: use the global video player
                        const video = document.getElementById('videoPlayer');
                        if (video) {
                            video.currentTime = time;
                            renderChapterList(time);
                        }
                    }
                });
            });
        }

        /**
         * Format time in seconds to MM:SS or HH:MM:SS.
         */
        function formatTimeShort(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${padZero(m)}:${padZero(s)}`;
            }
            return `${m}:${padZero(s)}`;
        }

        function padZero(num) {
            return ('0' + num).slice(-2);
        }

        /**
         * Close the chapter manager.
         */
        function closeChapterManager() {
            const manager = document.getElementById('chapterManager');
            if (manager) {
                manager.classList.remove('lyt_chapter_visible');
                _chapterManagerVisible = false;
                _lastCurrentChapterIndex = -1;
            }
        }

        /**
         * Update the chapter manager's current highlight based on video time.
         */
        function updateChapterManagerHighlight(currentTime) {
            if (!_chapterManagerVisible) return;
            if (!_chapterManagerChapters || _chapterManagerChapters.length === 0) return;
        
            const list = document.getElementById('chapterList');
            if (!list) return;
        
            const items = list.querySelectorAll('.chapter-item');
            let currentIndex = -1;
        
            // Update classes and find the new current chapter index
            items.forEach((item, index) => {
                const time = parseFloat(item.dataset.time);
                if (isNaN(time)) return;
                const isCurrent = time <= currentTime &&
                    (index === items.length - 1 || _chapterManagerChapters[index + 1].time > currentTime);
                item.classList.toggle('current', isCurrent);
                if (isCurrent) currentIndex = index;
            });
        
            // Only scroll if the current chapter actually changed
            if (currentIndex !== -1 && currentIndex !== _lastCurrentChapterIndex) {
                const currentItem = list.querySelector('.chapter-item.current');
                if (currentItem) {
                    currentItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    _lastCurrentChapterIndex = currentIndex;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {

            const playlistName = urlParams.get('playlist'); // Get playlist name

            const timestamp = urlParams.get('t');
            const videoPlayer = document.getElementById('videoPlayer');

            const channelPic = document.getElementById('channelPic');

                // Function to load subtitle tracks (called after currentChannel is set)

                Promise.all([

            // 1. Load Playlist Videos if playlist parameter exists

                        `;

            // 1. Helper to clean the filename (remove special chars) to match Python output
            function getCleanVideoName(src) {
                let name = src.split('/').pop();
                name = stripExtension(name);
                // 1. Remove special characters ()![]#

            // Check player preference setting

            } else if (typeof fluidPlayer === 'function') {

                                sprite: `/thumbnails/${encodeURIComponent(currentChannel)}/${encodeURIComponent(getCleanVideoName(videoSrc))}SpriteImg.jpg`,

                        "vastOptions": {

                );
                // Fluid Player doesn't have the chapter click event, but we can still use the chapter manager
                // via other means (e.g., clicking on chapter markers in the progress bar)
                // For Fluid Player, we'll still listen for the event if it's dispatched.
                const wrapper = document.querySelector('.fluid_video_wrapper');
                if (wrapper) {
                    wrapper.addEventListener('lyt-chapter-title-click', (e) => {

            // ===== AUTOPLAY / SKIP LOGIC =====
            // Define the handler function OUTSIDE the event listener to avoid nesting errors
            async function handleAutoPlayOrSkip(isManualSkip = false) {
                try {
                    const autoplaySettings = JSON.parse(localStorage.getItem('autoplaySettings') || '{}');

                    if (autoplaySettings.enabled && !autoplaySettings.nonPlaylistMode && !playlistName && !
                        userPlaylistName) {
                        autoplaySettings.nonPlaylistMode = 'first-recommended';
                    }

                    if (!autoplaySettings.enabled && !isManualSkip) {
                        // Autoplay is OFF — the player will show the end screen grid if allowed.
                        // We do NOT call myFP.showEndScreen() here because the player handles it.
                        return;
                    }

                    if (autoplaySettings.enabled || isManualSkip) {
                        // Resolve the next video
                        let nextVideoData = null;

                        if (userPlaylistName && (autoplaySettings.playlistNext !== false || isManualSkip)) {
                            nextVideoData = await getNextInUserPlaylist();
                        } else if (playlistName && (autoplaySettings.playlistNext !== false || isManualSkip)) {
                            nextVideoData = await getNextInPlaylist();
                        } else if (!playlistName && !userPlaylistName) {
                            switch (autoplaySettings.nonPlaylistMode || 'first-recommended') {
                                case 'first-recommended':
                                    nextVideoData = await getNextFirstRecommended();
                                    break;
                                case 'random-recommended':
                                    nextVideoData = await getNextRandomRecommended();
                                    break;
                                case 'random-database':
                                    nextVideoData = await getNextRandomDatabase();
                                    break;
                                default:
                                    nextVideoData = await getNextFirstRecommended();
                            }
                        }

                        if (isManualSkip || !autoplaySettings.enabled) {
                            // Immediate navigation for manual skip
                            if (nextVideoData) {
                                window.location.href = nextVideoData.url;
                            }
                        } else if (nextVideoData) {
                            // Show Up Next countdown overlay
                            showUpNextOverlay(nextVideoData);
                        }
                    }
                } catch (e) {
                    console.error('Autoplay/Skip error:', e);
                }
            }

            // ===== UP NEXT OVERLAY LOGIC =====
            let _upnextTimer = null;
            let _upnextCountdown = 5;

            function showUpNextOverlay(nextVideoData) {
                const overlay = document.getElementById('upnextOverlay');
                if (!overlay) return;

                // Set background thumbnail
                const bg = overlay.querySelector('.lyt_upnext_bg');
                if (bg && nextVideoData.thumbnail) {
                    bg.style.backgroundImage = `url(${nextVideoData.thumbnail})`;
                }

                // Set title
                const titleEl = overlay.querySelector('.lyt_upnext_title');
                if (titleEl) {
                    titleEl.textContent = nextVideoData.title || 'Next video';
                }

                // Reset countdown
                _upnextCountdown = 5;
                const numEl = overlay.querySelector('.lyt_upnext_countdown_num');
                const circleEl = overlay.querySelector('.lyt_upnext_countdown circle');

                if (numEl) numEl.textContent = _upnextCountdown;
                if (circleEl) {
                    // Reset animation
                    circleEl.style.transition = 'none';
                    circleEl.style.strokeDashoffset = '0';
                    void circleEl.offsetWidth; // Force reflow
                    circleEl.style.transition = 'stroke-dashoffset 1s linear';
                }

                // Show overlay
                overlay.classList.add('lyt_upnext_show');

                // Start countdown
                clearInterval(_upnextTimer);
                let elapsed = 0;

                _upnextTimer = setInterval(() => {
                    elapsed++;
                    _upnextCountdown = Math.max(0, 5 - elapsed);

                    if (numEl) numEl.textContent = _upnextCountdown;
                    if (circleEl) circleEl.style.strokeDashoffset = (elapsed / 5) * 182.2;

                    if (elapsed >= 5) {
                        clearInterval(_upnextTimer);
                        _upnextTimer = null;
                        window.location.href = nextVideoData.url;
                    }
                }, 1000);

                // Cancel button
                const cancelBtn = overlay.querySelector('.lyt_upnext_cancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        clearInterval(_upnextTimer);
                        _upnextTimer = null;
                        overlay.classList.remove('lyt_upnext_show');
                    };
                }
            }

            // ===== END UP NEXT OVERLAY LOGIC =====

            videoPlayer.addEventListener('ended', () => handleAutoPlayOrSkip(false));
